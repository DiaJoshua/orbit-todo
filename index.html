/* ---------------- phones: drag the sheet down to dismiss ---------------- */
(function peekSheetGesture(){
  let startY = null, dy = 0, live = false;
  const pk = ()=>$("#peek");
  document.addEventListener("touchstart", e=>{
    if(!document.body.classList.contains("peek-open") || !isMobile()) return;
    const p = pk(); if(!p) return;
    const t = e.touches[0]; if(!t) return;
    const top = e.target.closest && e.target.closest(".peek-top");
    const body = e.target.closest && e.target.closest(".peek-body");
    if(!top && !(body && body.scrollTop <= 0)) return;
    startY = t.clientY; dy = 0; live = true;
  }, {passive:true});
  document.addEventListener("touchmove", e=>{
    if(!live) return;
    const t = e.touches[0]; if(!t) return;
    dy = t.clientY - startY;
    if(dy <= 0){ dy = 0; return; }
    const p = pk(); if(!p) return;
    p.style.transition = "none";
    p.style.transform = "translateY("+dy+"px)";
  }, {passive:true});
  const end = ()=>{
    if(!live) return;
    live = false;
    const p = pk(); if(!p) return;
    p.style.transition = "";
    p.style.transform = "";
    if(dy > 110){ try{ hapt(10); }catch(_){} closePeek(); }
    dy = 0;
  };
  document.addEventListener("touchend", end);
  document.addEventListener("touchcancel", end);
})();

/* ================================================================================
   Part 5 — "not done first, done at the bottom", everywhere.

   One rule, applied to every surface that can show a finished thing:
   open work stays on top, anything ticked sinks, crossed out and quiet.
   ================================================================================ */

function sinkDone(){ try{ return featOn("sinkDone"); }catch(e){ return true; } }

/* the universal comparator: done always sorts last, then the old rules apply */
function sortTasks(a, b){
  if(sinkDone() && !!a.done !== !!b.done) return a.done ? 1 : -1;
  if(a.done && b.done){
    const ca = a.completedAt || "", cb = b.completedAt || "";
    if(ca !== cb) return ca < cb ? 1 : -1;          /* most recently finished on top */
  }
  if(a.order!=null && b.order!=null && a.order!==b.order) return a.order-b.order;
  if(!!a.due!==!!b.due) return a.due?-1:1;
  if(a.due&&b.due&&a.due!==b.due) return a.due<b.due?-1:1;
  if(a.priority!==b.priority) return b.priority-a.priority;
  return a.createdAt-b.createdAt;
}

/* ---------------- sub-tasks: ticked ones drop to the bottom ---------------- */
function docChecklist(o){
  const cl = (o.checklist || []).slice();
  const total = cl.length;
  const done = cl.filter(c=>c.done).length;
  if(sinkDone()){
    cl.sort((a,b)=>(a.done===b.done) ? 0 : (a.done ? 1 : -1));
  }
  const pct = total ? Math.round(done/total*100) : 0;
  let firstDone = true;
  const rows = cl.map(c=>{
    const sep = (sinkDone() && c.done && firstDone && done < total) ? '<div class="cl-split"></div>' : '';
    if(c.done) firstDone = false;
    return sep+
      '<div class="rel-row cl-item'+(c.done?" is-done":"")+'" data-cid="'+c.id+'" style="cursor:default">'+
        '<button class="ed-cb'+(c.done?" on":"")+'" data-act="dc-tog" data-cid="'+c.id+'" title="'+(c.done?"Mark not done":"Mark done")+'">'+(c.done?"✓":"")+'</button>'+
        '<span class="cl-text" data-act="dc-edit" data-cid="'+c.id+'" title="Click to edit">'+esc(c.text||"")+'</span>'+
        '<button class="dbtn danger cl-x" data-act="dc-del" data-cid="'+c.id+'" title="Remove">✕</button>'+
      '</div>';
  }).join("");
  return '<div class="doc-rel doc-cl" style="margin:18px 0 4px">'+
    '<div class="rl">Sub-tasks'+
      (total ? '<span class="cl-meter"><i style="width:'+pct+'%"></i></span><span class="cl-num">'+done+'/'+total+'</span>' : '')+
      (done ? '<button class="cl-clear" data-act="dc-clear" title="Remove every ticked sub-task">Clear done</button>' : '')+
    '</div>'+
    rows+
    '<button class="rel-row cl-add" data-act="dc-add"><span class="ri">＋</span>Add a sub-task</button>'+
  '</div>';
}

/* ---------------- the editor: tidy ticked to-dos down, on request ---------------- */
function edTidyTicked(){
  if(!edActive) return;
  const blocks = edActive.blocks;
  let moved = 0, i = 0;
  while(i < blocks.length){
    if(blocks[i].type !== "todo"){ i++; continue; }
    let j = i;
    while(j < blocks.length && blocks[j].type === "todo") j++;
    const run = blocks.slice(i, j);
    const open = run.filter(b=>!b.checked), tick = run.filter(b=>b.checked);
    if(tick.length && open.length){
      const before = run.map(b=>b.id).join(",");
      const after  = open.concat(tick);
      if(after.map(b=>b.id).join(",") !== before){ blocks.splice(i, run.length, ...after); moved += tick.length; }
    }
    i = j;
  }
  if(moved){
    edRenderAll(); edCommit(true);
    try{ playSound("move"); hapt(8); }catch(_){}
    showToast("Moved "+moved+" ticked item"+(moved>1?"s":"")+" down");
  } else {
    showToast("Nothing to tidy — ticked items are already at the bottom");
  }
}

/* ---------------- 1 · the All tasks page ---------------- */
const ALL_GROUPS = [["due","📅","When"],["space","🗂","Space"],["priority","⚑","Priority"],["none","☰","Flat"]];
const ALL_SHOW   = [["open","To do"],["all","Everything"],["done","Done"]];

function allPrefs(){
  state.prefs = state.prefs || {};
  if(!state.prefs.all) state.prefs.all = {group:"due", show:"open", tight:false, space:""};
  return state.prefs.all;
}

function allBucket(t){
  if(!t.due) return {k:"nd", label:"No date", color:"var(--muted)", rank:6};
  const d = dayDiff(t.due);
  if(d < 0)  return {k:"od", label:"Overdue",        color:"var(--rose)",  rank:0};
  if(d === 0)return {k:"dt", label:"Today",          color:"var(--amber)", rank:1};
  if(d === 1)return {k:"tm", label:"Tomorrow",       color:"var(--cyan)",  rank:2};
  if(d <= 7) return {k:"wk", label:"This week",      color:"var(--cyan)",  rank:3};
  if(d <= 31)return {k:"mo", label:"This month",     color:"var(--accent)",rank:4};
  return          {k:"lt", label:"Later",            color:"var(--faint)", rank:5};
}

function renderAll(){
  const P = allPrefs();
  const every = state.tasks.filter(t=>matches(t));
  const scoped = P.space ? every.filter(t=>t.spaceId===P.space) : every;
  const list = scoped.filter(t=> P.show==="open" ? !t.done : P.show==="done" ? t.done : true);
  const openN = scoped.filter(t=>!t.done).length;
  const doneN = scoped.length - openN;
  const overdueN = scoped.filter(t=>!t.done && t.due && dayDiff(t.due)<0).length;

  /* ---- toolbar ---- */
  const seg = (act, opts, cur)=>'<div class="seg2">'+opts.map(o=>
      '<button class="'+(String(cur)===String(o[0])?"on":"")+'" data-act="'+act+'" data-v="'+o[0]+'">'+
      (o[1]?o[1]+" ":"")+(o[2]||"")+'</button>').join("")+'</div>';

  let h = '<div class="view-inner all-view">'+
    '<div class="greet" style="margin-bottom:10px"><h1>☰ All <span class="grad">tasks</span></h1>'+
      '<div class="sub">'+openN+' to do'+(overdueN?' · <b style="color:var(--rose)">'+overdueN+' overdue</b>':'')+' · '+doneN+' done · '+state.spaces.length+' spaces</div></div>'+

    '<form class="quickadd" data-form="quickadd-today" style="margin-bottom:14px">'+
      '<span class="plus">＋</span>'+
      '<input name="qa" placeholder=\'Add anything…  "'+pick(QA_HINTS)+'"\' autocomplete="off">'+
      micHtml()+'<button type="submit">Add</button>'+
    '</form>'+
    '<div class="qa-prev" id="qa-prev" style="display:none"></div>'+

    '<div class="allbar">'+
      '<span class="ab-l">Group</span>'+ seg("all-group", ALL_GROUPS.map(g=>[g[0],g[1],g[2]]), P.group)+
      '<span class="ab-l">Show</span>'+ seg("all-show", ALL_SHOW.map(g=>[g[0],"",g[1]]), P.show)+
      '<span class="grow"></span>'+
      '<button class="ab-btn'+(P.tight?" on":"")+'" data-act="all-tight" title="One line per task — fit far more on screen">'+(P.tight?"▤ Roomy":"▥ Dense")+'</button>'+
      '<button class="ab-btn" data-act="all-width" title="How wide the lists run">'+
        (listWidth()==="narrow"?"◫ Narrow":listWidth()==="wide"?"◨ Wide":"▣ Full")+'</button>'+
    '</div>'+
    '<div class="sp-filter">'+
      '<button class="spf'+(P.space?"":" on")+'" data-act="all-space" data-v="">All spaces <span class="n">'+every.length+'</span></button>'+
      state.spaces.map(s=>{
        const n = every.filter(t=>t.spaceId===s.id && !t.done).length;
        return '<button class="spf'+(P.space===s.id?" on":"")+'" style="--c:'+s.color+'" data-act="all-space" data-v="'+s.id+'">'+
          '<span class="d"></span>'+esc(s.icon+" "+s.name)+' <span class="n">'+n+'</span></button>';
      }).join("")+
    '</div>';

  /* ---- rows ---- */
  if(!list.length){
    h += '<div class="empty"><span class="art">'+(P.show==="done"?"✅":"🪐")+'</span><h3>'+
      (ui.search ? "Nothing matches" : P.show==="done" ? "Nothing finished yet" : "Nothing to do")+'</h3>'+
      '<p>'+(ui.search?"Try a different search.":P.show==="done"?"Tick something off and it will land here.":"Every list is clear. Enjoy it.")+'</p></div>';
  } else {
    const wrap = inner=>'<div class="all-rows'+(P.tight?" rows-tight":"")+'">'+inner+'</div>';
    if(P.group==="none"){
      h += wrap(list.slice().sort(sortTasks).map((t,i)=>taskRow(t, true, i)).join(""));
    }
    else if(P.group==="space"){
      state.spaces.forEach(s=>{
        const ts = list.filter(t=>t.spaceId===s.id).sort(sortTasks);
        if(!ts.length) return;
        h += groupSection("all:sp:"+s.id, esc(s.icon+" "+s.name), s.color, ts, false) ;
      });
      h = h.replace(/<div class="group-body/g, '<div class="group-body');
      h = h.split('<div class="gb-in">').join('<div class="gb-in'+(P.tight?" rows-tight":"")+'">');
    }
    else if(P.group==="priority"){
      [[3,"High","var(--rose)"],[2,"Medium","var(--amber)"],[1,"Low","var(--cyan)"],[0,"No priority","var(--muted)"]].forEach(p=>{
        const ts = list.filter(t=>(t.priority||0)===p[0]).sort(sortTasks);
        if(ts.length) h += groupSection("all:pri:"+p[0], p[1], p[2], ts, true);
      });
      h = h.split('<div class="gb-in">').join('<div class="gb-in'+(P.tight?" rows-tight":"")+'">');
    }
    else {
      const buckets = {};
      list.forEach(t=>{
        const b = t.done ? {k:"dn", label:"Done", color:"var(--green)", rank:9} : allBucket(t);
        (buckets[b.k] = buckets[b.k] || {b:b, ts:[]}).ts.push(t);
      });
      Object.values(buckets).sort((x,y)=>x.b.rank-y.b.rank).forEach(g=>{
        h += groupSection("all:due:"+g.b.k, g.b.label, g.b.color, g.ts.sort(sortTasks), true);
      });
      h = h.split('<div class="gb-in">').join('<div class="gb-in'+(P.tight?" rows-tight":"")+'">');
    }
  }

  h += uiTip("list")+'</div>';
  $("#view").innerHTML = h;
  bindQuickAdd();
}

  if(!id) return;
  ui._draftId = null;
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  const empty = !(t.title||"").trim() && !(t.desc||"").trim() && !(t.checklist||[]).length && !t.done;
  if(empty){ state.tasks = state.tasks.filter(x=>x.id!==id); save(); }
}
addEventListener("pagehide", cleanupDraft);

/* the first title you give a draft still understands "tomorrow" and "!high" */
function draftParseTitle(t){
  if(!t || ui._draftId !== t.id) return;
  const raw = (t.title||"").trim();
  if(!raw) return;
  const p = parseQuick(raw);
  if(!p.title || (!p.due && !p.priority && !p.repeat)) return;
  t.title = p.title;
  if(p.due && !t.due) t.due = p.due;
  if(p.priority && !t.priority) t.priority = p.priority;
  if(p.repeat && !t.repeat) t.repeat = p.repeat;
  if(t.repeat && !t.due) t.due = todayStr();
  const bits = [];
  if(p.due) bits.push("📅 "+fmtDue(t.due));
  if(p.priority) bits.push("⚑ "+PRI_NAMES[t.priority]);
  if(p.repeat) bits.push("↻ "+(REPEAT_NAMES[t.repeat]||""));
  save();
  docRefreshProps();
  renderSidebar(); renderTopbar();
  if(bits.length) showToast("Picked up "+bits.join(" · ")+" from the title");
}

/* update a document's chrome without touching the editor or the caret */
function docRefreshProps(){
  [["#view", ui.doc], ["#peek", ui.peek]].forEach(([sel, d])=>{
    if(!d) return;
    const host = document.querySelector(sel+" .doc");
    const o = host && docFind(d);
    if(!host || !o) return;
    const props = host.querySelector(".doc-props");
    if(props){
      const tmp = document.createElement("div");
      tmp.innerHTML = docProps(d, o);
      props.replaceWith(tmp.firstElementChild);
    }
    const ttl = host.querySelector(".doc-title");
    if(ttl && document.activeElement !== ttl && ttl.textContent !== (o.title||"")) ttl.textContent = o.title||"";
  });
}

/* ---------------- routing ---------------- */
function renderView(){
  if(ui.view==="space" && !getSpace(ui.spaceId)){ ui.view="today"; ui.spaceId=null; }
  if(ui.view==="doc" && !docFind(ui.doc)){ ui.view = (ui.docBack&&ui.docBack.view) || "today"; ui.doc = null; }
  const ac = currentAccent() || ((state.prefs && state.prefs.accent) || "");
  if(ac) document.documentElement.style.setProperty("--accent", ac);
  else document.documentElement.style.removeProperty("--accent");
  applyListWidth();
  const key = ui.view+"|"+ui.spaceId+"|"+ui.tab+"|"+((ui.doc&&ui.doc.id)||"");
  const viewChanged = key !== renderView._last;
  renderView._last = key;
  const viewEl = $("#view");
  const keepScroll = viewChanged ? 0 : viewEl.scrollTop;
  viewEl.classList.toggle("anim-in", viewChanged);
  viewEl.classList.toggle("doc-view", ui.view==="doc");

  if(ui.view!=="doc" && ui._draftId) cleanupDraft();

  if(ui.view==="doc"){ renderDoc(); }
  else{
    if(edActive && !($("#peek") && $("#peek").contains(edActive.root))){ edFlush(); edActive = null; }
    renderDoc._sig = null;
    if(ui.view==="today"){ renderToday(); }
    else if(ui.view==="all"){ renderAll(); }
    else if(ui.view==="pad"){ renderPad(); }
    else if(ui.view==="week"){ renderWeek(); }
    else if(ui.view==="habits"){ renderHabits(); }
    else if(ui.view==="work"){ renderWork(); }
    else if(ui.view==="ext"){ viewEl.innerHTML = ""; }
    else {
      const s = getSpace(ui.spaceId);
      if(ui.tab==="board"){ renderBoardView(s); bindBoardDnD(); }
      else if(ui.tab==="notes"){ renderNotesView(s); }
      else { renderListView(s); }
    }
  }
  if(viewChanged){
    const vi = viewEl.firstElementChild;
    if(vi) vi.classList.add("view-anim");
    viewEl.style.scrollBehavior = "auto";
    viewEl.scrollTop = 0;
    viewEl.style.scrollBehavior = "";
  } else {
    viewEl.style.scrollBehavior = "auto";
    viewEl.scrollTop = keepScroll;
    viewEl.style.scrollBehavior = "";
  }
  ui._justAdded = ui._justToggled = ui._justMoved = null;
  try{ if(["today","work","week","habits","pad","all"].indexOf(ui.view) > -1) localStorage.setItem("orbit-last", ui.view); }catch(e){}
  bindSwipes(viewEl);
  selPaint();
  if(document.body.classList.contains("peek-open")) renderPeek(false);
}

document.addEventListener("click", e=>{
  const el = e.target.closest && e.target.closest("[data-act]");
  if(!el) return;
  const P = allPrefs();
  switch(el.dataset.act){
    case "nav-all": ui.view="all"; ui.spaceId=null; ui.doc=null; ui.search=""; closeSb(); render(); break;
    case "all-group": P.group = el.dataset.v; save(); renderView(); break;
    case "all-show":  P.show  = el.dataset.v; save(); renderView(); break;
    case "all-space": P.space = el.dataset.v; save(); renderView(); break;
    case "all-tight": P.tight = !P.tight; save(); renderView(); break;
    case "all-width": {
      const order = ["narrow","wide","full"];
      state.prefs.listW = order[(order.indexOf(listWidth())+1) % order.length];
      save(); applyListWidth(); renderView();
      showToast("Lists: "+({narrow:"narrow",wide:"wide",full:"full width"})[listWidth()]);
      break;
    }
  }
});

document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select" || e.target.isContentEditable) return;
  if($("#modal-root .overlay")) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key.toLowerCase()==="g"){ e.preventDefault(); ui.view="all"; ui.spaceId=null; ui.doc=null; render(); }
}, true);

</script>
