<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit: Tasks & Notes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("orbit-theme")==="dark"?"dark":"light"}catch(e){}</script>
<script src="https://js.puter.com/v2/" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ theme tokens ============ */
/* Light (default): warm off white, muted ink, quiet violet accent */
:root{
  --bg:#f7f7f5; --bg2:#ffffff;
  --panel:#ffffff; --panel2:rgba(28,28,32,.05);
  --border:rgba(28,28,32,.09); --border2:rgba(28,28,32,.16);
  --text:#1d1d20; --muted:#63636c; --faint:#a3a3ab;
  --accent:#6e56cf;
  --rose:#e5484d; --amber:#c98a10; --cyan:#2f7fe0; --green:#1f9d55;
  --on-accent:#ffffff;
  --chip-bg:rgba(28,28,32,.055);
  --track:rgba(28,28,32,.08);
  --col-bg:rgba(255,255,255,.6);
  --sb-bg:rgba(250,250,248,.82);
  --tb-bg:rgba(247,247,245,.8);
  --modal-bg:#ffffff;
  --toast-bg:#ffffff;
  --overlay-bg:rgba(28,28,34,.3);
  --note-base:#ffffff;
  --tint-mix:#26262c;
  --card-shadow:0 1px 2px rgba(24,24,30,.04), 0 3px 10px rgba(24,24,30,.04);
  --pop-shadow:0 18px 55px rgba(24,24,30,.18);
  --hover-shadow:0 10px 26px rgba(24,24,30,.10);
  --scroll:rgba(28,28,32,.18);
  --glow-op:.10;
  --radius:14px;
  color-scheme:light;
}
/* Dark: neutral charcoal, gentle contrast, no blue cast */
html[data-theme="dark"]{
  --bg:#151517; --bg2:#1c1c1f;
  --panel:#1b1b1e; --panel2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.15);
  --text:#ececef; --muted:#a2a2ab; --faint:#66666e;
  --accent:#8f7be8;
  --rose:#f2555a; --amber:#f0b429; --cyan:#62a8ff; --green:#3dd68c;
  --on-accent:#141416;
  --chip-bg:rgba(255,255,255,.07);
  --track:rgba(255,255,255,.08);
  --col-bg:rgba(255,255,255,.025);
  --sb-bg:rgba(23,23,26,.85);
  --tb-bg:rgba(21,21,23,.7);
  --modal-bg:#202023;
  --toast-bg:#232326;
  --overlay-bg:rgba(0,0,0,.55);
  --note-base:rgba(255,255,255,.03);
  --tint-mix:#ffffff;
  --card-shadow:0 1px 2px rgba(0,0,0,.2);
  --pop-shadow:0 22px 70px rgba(0,0,0,.55);
  --hover-shadow:0 10px 26px rgba(0,0,0,.3);
  --scroll:rgba(255,255,255,.13);
  --glow-op:.06;
  color-scheme:dark;
}

/* ============ reset & base ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
  font-size:14.5px; line-height:1.5; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.pad-title{letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:2px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* smooth crossfade when switching themes */
html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after{
  transition:background-color .45s ease, color .45s ease, border-color .45s ease, box-shadow .45s ease !important;
}

/* ============ ambient glow ============ */
#bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bg-glow::before,#bg-glow::after{
  content:"";position:absolute;width:52vw;height:52vw;border-radius:50%;
  filter:blur(150px);opacity:var(--glow-op);
}
#bg-glow::before{background:#6e56cf;top:-24vw;left:-16vw}
#bg-glow::after{background:#2f7fe0;bottom:-28vw;right:-16vw}

/* ============ layout ============ */
#app{position:relative;z-index:1;display:flex;height:100vh}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#view{flex:1;overflow-y:auto;padding:26px 30px 60px;scroll-behavior:smooth}
.view-inner{max-width:860px;margin:0 auto}
.view-inner.wide{max-width:1400px}

/* ============ sidebar ============ */
#sidebar{
  width:268px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--sb-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:1px solid var(--border);padding:22px 14px 14px;
  transition:transform .28s cubic-bezier(.4,0,.2,1), margin-left .28s cubic-bezier(.4,0,.2,1);
}
@media(min-width:881px){
  body.sb-collapsed #sidebar{margin-left:-268px}
}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 20px;user-select:none}
.logo svg{flex-shrink:0}
.logo .word{font-size:19px;font-weight:700;letter-spacing:-.01em;background:linear-gradient(90deg,#6e56cf,#2f7fe0);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .tag{font-size:10.5px;color:var(--faint);letter-spacing:.6px;margin-top:1px}
.sb-scroll{flex:1;overflow-y:auto;padding:2px 2px 10px}
.sb-label{font-size:10.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);padding:16px 12px 7px;display:flex;align-items:center;justify-content:space-between}
.sb-label button{color:var(--faint);font-size:15px;line-height:1;padding:2px 6px;border-radius:8px;transition:.15s}
.sb-label button:hover{color:var(--text);background:var(--panel2)}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;border-radius:12px;color:var(--muted);font-weight:500;
  margin-bottom:2px;position:relative;transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--panel2);color:var(--text);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--ac,var(--accent))}
.nav-item .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:color-mix(in srgb,var(--ac,var(--accent)) 15%,transparent);flex-shrink:0;transition:transform .18s ease}
.nav-item:hover .ico{transform:scale(1.1) rotate(-5deg)}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel2);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.nav-item.active .cnt{background:color-mix(in srgb,var(--ac,var(--accent)) 25%,transparent);color:var(--text)}
.nav-item .bar{position:absolute;left:51px;right:14px;bottom:5px;height:2px;border-radius:2px;background:var(--track);overflow:hidden}
.nav-item .bar i{display:block;height:100%;border-radius:2px;background:var(--ac,var(--accent));transition:width .4s ease}
.sb-foot{border-top:1px solid var(--border);padding:12px 6px 2px;display:flex;flex-direction:column;gap:8px}
.sb-foot .row{display:flex;gap:8px}
.sb-foot .mini{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 4px;transition:.15s}
.sb-foot .mini:hover{color:var(--text);border-color:var(--border2);background:var(--panel2)}
.sb-foot .mini.on{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,transparent);background:color-mix(in srgb,var(--green) 8%,transparent)}
.sb-foot .hint{font-size:10.5px;color:var(--faint);text-align:center}
#sb-backdrop{display:none}

/* ============ topbar ============ */
#topbar{
  display:flex;align-items:center;gap:12px;padding:14px 24px;
  border-bottom:1px solid var(--border);
  background:var(--tb-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  position:relative;z-index:5;flex-wrap:wrap;
}
.tb-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;min-width:0}
.tb-title .emoji{font-size:19px}
.tb-spacer{flex:1}
.searchwrap{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:7px 12px;width:230px;transition:border-color .15s}
.searchwrap:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.searchwrap svg{flex-shrink:0;opacity:.5}
.searchwrap input{background:none;border:none;outline:none;width:100%;font-size:13.5px}
.searchwrap input::placeholder{color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:12px;padding:8px 15px;font-size:13.5px;font-weight:600;transition:.15s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:var(--panel);border-color:var(--border);color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--border2)}
.btn.danger{background:color-mix(in srgb,var(--rose) 12%,transparent);color:var(--rose);border-color:color-mix(in srgb,var(--rose) 30%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--rose) 22%,transparent)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;color:var(--muted);transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.icon-btn:active{transform:scale(.9)}
#theme-btn.spin svg{animation:spinIn .5s cubic-bezier(.3,1.4,.4,1)}
@keyframes spinIn{from{transform:rotate(-150deg) scale(.5);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}

/* ============ tabs row ============ */
.tabsrow{padding:12px 30px 0}
.tabsrow .inner{max-width:860px;margin:0 auto;width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tabsrow.wide .inner{max-width:1400px}
.tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:4px}
.tabs button{padding:6px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--text)}
.tabs button.active{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--text)}
.prog-wrap{display:flex;align-items:center;gap:10px;margin-left:auto;color:var(--muted);font-size:12.5px}
.prog-track{width:110px;height:5px;border-radius:5px;background:var(--track);overflow:hidden}
.prog-track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));transition:width .5s ease}

/* ============ today / greeting ============ */
.greet h1{font-size:28px;font-weight:800;letter-spacing:-.3px}
.greet h1 .uname{cursor:pointer;border-bottom:2px dotted var(--faint)}
.greet h1 .uname:hover{color:var(--accent)}
.greet h1 .grad{background:linear-gradient(90deg,var(--accent),#2f7fe0);-webkit-background-clip:text;background-clip:text;color:transparent}
.greet .sub{color:var(--muted);margin-top:3px;font-size:14px}
.greet .quote{margin-top:7px;font-size:13px;color:var(--faint);font-style:italic}
.streak{display:inline-flex;align-items:center;gap:5px;margin-left:12px;font-size:12.5px;font-weight:700;color:var(--amber);background:color-mix(in srgb,var(--amber) 11%,transparent);padding:3px 12px;border-radius:999px;vertical-align:middle;animation:pop .4s ease}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin:22px 0 8px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;transition:.18s;position:relative;overflow:hidden;box-shadow:var(--card-shadow);animation:fadeUp .25s ease both}
.stats .stat:nth-child(2){animation-delay:40ms}
.stats .stat:nth-child(3){animation-delay:80ms}
.stats .stat:nth-child(4){animation-delay:120ms}
.stat:hover{transform:translateY(-2px);border-color:var(--border2)}
.stat .num{font-size:26px;font-weight:800;line-height:1.1;color:var(--sc,var(--text))}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:3px}

/* ============ groups & task rows ============ */
.group-head{
  display:flex;align-items:center;gap:8px;margin:22px 0 9px;
  font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);
  cursor:pointer;user-select:none;
}
.group-head .chev{transition:transform .2s;font-size:10px;color:var(--faint)}
.group-head.collapsed .chev{transform:rotate(-90deg)}
.group-head .gcnt{color:var(--faint);font-weight:600}
.group-head .dot{width:7px;height:7px;border-radius:50%;background:var(--gc,var(--faint))}
.group-head .clear-done{margin-left:auto;font-size:11px;letter-spacing:.4px;color:var(--faint);text-transform:none;padding:3px 9px;border-radius:8px}
.group-head .clear-done:hover{color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}

.task{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--card-shadow);
  transition:transform .13s,border-color .13s,background .13s,opacity .25s;
  animation:fadeUp .22s ease both;
}
.task:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:var(--bg2)}
.task.done{opacity:.55}
.task.done .t-title{text-decoration:line-through;text-decoration-color:var(--muted)}
.check{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0;margin-top:2px;
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--on-accent);
  transition:.18s;background:transparent;
}
.check:hover{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
.check:active{transform:scale(.82)}
.task.done .check,.card.done .check{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff));border-color:transparent;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.t-main{flex:1;min-width:0}
.t-title{font-weight:600;font-size:14.5px;word-break:break-word}
.t-desc{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.t-chips:empty{display:none}
.chip{font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:999px;background:var(--chip-bg);color:var(--muted);display:inline-flex;align-items:center;gap:5px;line-height:1.5}
.chip.due.today{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber)}
.chip.due.overdue{background:color-mix(in srgb,var(--rose) 13%,transparent);color:var(--rose)}
.chip.pri.p3{background:color-mix(in srgb,var(--rose) 12%,transparent);color:var(--rose)}
.chip.pri.p2{background:color-mix(in srgb,var(--amber) 13%,transparent);color:var(--amber)}
.chip.pri.p1{background:color-mix(in srgb,var(--cyan) 13%,transparent);color:var(--cyan)}
.chip.stage{background:color-mix(in srgb,var(--accent) 13%,transparent);color:color-mix(in srgb,var(--accent) 70%,var(--tint-mix))}
.chip.rep{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
.chip.space-chip{background:color-mix(in srgb,var(--c) 13%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--tint-mix))}
.task .del{opacity:0;width:30px;height:30px;font-size:14px}
.task:hover .del{opacity:.55}
.task .del:hover{opacity:1;color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ quick add ============ */
.quickadd{
  display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--border);border-radius:14px;padding:5px 6px 5px 16px;margin-bottom:6px;
  transition:border-color .15s;box-shadow:var(--card-shadow);
}
.quickadd:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 10%,transparent)}
.quickadd .plus{color:var(--accent);font-size:19px;font-weight:600}
.quickadd input{flex:1;background:none;border:none;outline:none;padding:9px 0;font-size:14px}
.quickadd input::placeholder{color:var(--faint)}
.quickadd button{background:color-mix(in srgb,var(--accent) 16%,transparent);color:color-mix(in srgb,var(--accent) 75%,var(--tint-mix));font-weight:700;font-size:13px;border-radius:10px;padding:8px 15px;transition:.15s}
.quickadd button:hover{background:color-mix(in srgb,var(--accent) 28%,transparent)}

/* ============ board ============ */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:20px;min-height:60vh}
.col{flex:0 0 268px;background:var(--col-bg);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100vh - 235px);box-shadow:var(--card-shadow)}
.col-head{display:flex;align-items:center;gap:8px;padding:13px 15px 9px;font-weight:700;font-size:13.5px}
.col-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.col-head .count{margin-left:auto;font-size:11.5px;color:var(--muted);background:var(--panel2);padding:1px 8px;border-radius:999px}
.col-body{flex:1;overflow-y:auto;padding:4px 9px;display:flex;flex-direction:column;gap:8px;min-height:70px;border-radius:12px;transition:background .15s}
.col-body.drop-hint{background:color-mix(in srgb,var(--accent) 8%,transparent);outline:2px dashed color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:-4px}
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;
  cursor:grab;transition:transform .13s,border-color .13s;animation:fadeUp .22s ease both;box-shadow:var(--card-shadow);
}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));transform:translateY(-1px)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.35;transform:rotate(2deg) scale(.98)}
.card.done{opacity:.5}
.card.done .c-title{text-decoration:line-through}
.card-top{display:flex;align-items:flex-start;gap:9px}
.card .check{width:18px;height:18px;font-size:10px;margin-top:1px}
.c-title{font-weight:600;font-size:13.5px;flex:1;word-break:break-word}
.card .t-chips{margin-top:8px}
.col-add{margin:6px 9px 10px;padding:8px;border-radius:10px;border:1px dashed var(--border2);color:var(--faint);font-size:12.5px;font-weight:600;transition:.15s}
.col-add:hover{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.col.ghost-col{background:none;border:1px dashed var(--border);justify-content:center;min-height:120px;box-shadow:none}
.col.ghost-col button{padding:20px;color:var(--faint);font-weight:600;font-size:13px;width:100%;height:100%}
.col.ghost-col button:hover{color:var(--text)}

/* ============ notes ============ */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.notes-grid.dash{margin-bottom:10px}
.note{
  --nc:#8b7cff;position:relative;border-radius:16px;padding:15px 16px;min-height:150px;cursor:pointer;
  background:color-mix(in srgb,var(--nc) 10%,var(--note-base));
  border:1px solid color-mix(in srgb,var(--nc) 30%,transparent);
  display:flex;flex-direction:column;gap:7px;transition:transform .18s,box-shadow .18s;
  animation:noteIn .25s ease backwards;box-shadow:var(--card-shadow);
}
.note:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:var(--hover-shadow)}
.notes-grid .note:nth-child(odd):not(.add-note){transform:rotate(-.8deg)}
.notes-grid .note:nth-child(3n):not(.add-note){transform:rotate(.7deg)}
.notes-grid .note:hover{transform:translateY(-3px) rotate(0);box-shadow:var(--hover-shadow)}
@keyframes noteIn{from{opacity:0}}

<script>
"use strict";
/* ================================================================
   Orbit: a personal command center for tasks & notes
   Light mode default, dark mode toggle, dashboard sticky notes,
   repeating tasks, zero setup cloud sync across devices.
   ================================================================ */

/* ---------------- helpers ---------------- */
const $  = (s, el=document)=>el.querySelector(s);
const $$ = (s, el=document)=>Array.from(el.querySelectorAll(s));
const uid = ()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dly = i=>Math.min((i||0)*25,200)+"ms";
const pad = n=>String(n).padStart(2,"0");
const dstr = d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr = ()=>dstr(new Date());
const addDays = n=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d);};
const parseDay = s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const dayDiff = due=>Math.round((parseDay(due)-parseDay(todayStr()))/864e5);

function fmtDue(due){
  if(!due) return "";
  const diff = dayDiff(due);
  if(diff===0) return "Today";
  if(diff===1) return "Tomorrow";
  if(diff===-1) return "Yesterday";
  if(diff<0) return (-diff)+"d overdue";
  const d = parseDay(due);
  const opts = {weekday:"short", month:"short", day:"numeric"};
  if(d.getFullYear()!==new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
}
const dueClass = t=>(!t.due||t.done) ? "" : (dayDiff(t.due)<0 ? "overdue" : dayDiff(t.due)===0 ? "today" : "");

const PRI_NAMES  = ["None","Low","Medium","High"];
const REPEAT_NAMES = {daily:"Daily", weekdays:"Weekdays", weekly:"Weekly"};
const SPACE_COLORS = ["#7c66dc","#3e8ef7","#30a46c","#d6a327","#e5484d","#d6409f","#7ba318","#e17435"];

function streakDays(){
  const days = new Set(state.tasks.filter(t=>t.completedAt).map(t=>t.completedAt));
  let n = 0; const d = new Date();
  if(!days.has(dstr(d))) d.setDate(d.getDate()-1);
  while(days.has(dstr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function nextOccurrence(rep){
  if(rep==="daily") return addDays(1);
  if(rep==="weekdays"){ const d=new Date(); do{ d.setDate(d.getDate()+1); }while(d.getDay()===0||d.getDay()===6); return dstr(d); }
  if(rep==="weekly") return addDays(7);
  return null;
}

/* ---------------- storage ---------------- */
const STORE_KEY = "orbit-v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.spaces) || !Array.isArray(d.tasks)) return null;
    return d;
  }catch(e){ return null; }
}
function save(){
  state.updatedAt = Date.now();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  pushCloud();
}

let state = loadState() || seed();
try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}

/* ---------------- one-time starter content (Joshua's list) ---------------- */
(function seedStarter(){

    mk("Certifications to get", "CompTIA Security+\nCCNA\nMicrosoft Azure\nCEH\nCISSP\nTrendAI certifications", "#8b7cff"),

    mk("NEP rules", "1. Be on time, advise if late or absent\n2. Always take down notes\n3. Always participate (no raising hands / no grades)\n4. Be respectful\n5. Have fun!\n\nWe are Cybersec Engineers 🛡", "#94a3b8"),
    mk("Who is Trend Micro", "3CIT: Customer, Change, Collaboration, Innovation, Trustworthiness\nFAIL: First Attempt In Learning\nDPE: 2 teams, Consumer (home users, small biz) & Corporate (businesses)\nDPE profile: Customer success is my success, AI adoption, growth mindset, continuous self-led learning\nCombined Technical Support Expert + DevOps Engineer\nNEP: New Engineer Training Program (soft skills + technical)\nTFD: combined soft skills & technical training", "#8b7cff"),
    mk("Typing test (Typing Cat)", "July 7, 2026\n38 wpm · 86% acc\n39 wpm · 99% acc\n41 wpm · 99% acc", "#fbbf24"),
    mk("My account", "Email: joshua_dia@trendmicro.com\nPassword: not stored here on purpose because this file lives in a public GitHub repo. Keep passwords in a password manager.", "#94a3b8")

/* ================================================================
   CLOUD SYNC (zero setup, powered by Puter.js)
   Nothing to configure. Click the sidebar sync button, sign in once
   per device, and your data saves to your own free private cloud
   storage and follows you everywhere. Data merges on first sign in
   so nothing you typed on any device gets lost.
   ================================================================ */
const KV_KEY = "orbit-state-v1";

let cloud = {on:false, user:null};
let syncStatus = "loading";  /* loading | signedout | on | off */
let pushTimer = null, pollTimer = null;

function waitForPuter(ms){
  return new Promise(res=>{
    const t0 = Date.now();
    (function chk(){
      if(window.puter && window.puter.auth && window.puter.kv) return res(true);
      if(Date.now()-t0 > ms) return res(false);
      setTimeout(chk, 300);
    })();
  });
}

async function initCloud(){
  const ok = await waitForPuter(9000);
  if(!ok){ syncStatus = "off"; renderSidebar(); return; }
  try{
    if(puter.auth.isSignedIn()){ await cloudSignedIn(); }
    else { syncStatus = "signedout"; }
  }catch(e){ syncStatus = "signedout"; }
  renderSidebar();
}

async function cloudSignedIn(){
  try{ cloud.user = await puter.auth.getUser(); }catch(e){ cloud.user = null; }
  cloud.on = true; syncStatus = "on";
  await pullCloud(true);
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>pullCloud(false), 20000);
  renderSidebar();
}

/* combine two copies of the data without losing anything */
function mergeStates(a, b){
  const newer = (a.updatedAt||0) >= (b.updatedAt||0) ? a : b;
  const older = newer===a ? b : a;
  const m = JSON.parse(JSON.stringify(newer));
  if(!Array.isArray(m.spaces)) m.spaces = [];
  if(!Array.isArray(m.tasks)) m.tasks = [];
  const sIds = new Set(m.spaces.map(s=>s.id));
  (older.spaces||[]).forEach(s=>{ if(!sIds.has(s.id)) m.spaces.push(s); });
  (older.spaces||[]).forEach(os=>{
    const ms = m.spaces.find(x=>x.id===os.id);
    if(ms){
      if(!Array.isArray(ms.notes)) ms.notes = [];
      const nIds = new Set(ms.notes.map(n=>n.id));
      (os.notes||[]).forEach(n=>{ if(!nIds.has(n.id)) ms.notes.push(n); });
    }
  });
  const tIds = new Set(m.tasks.map(t=>t.id));
  (older.tasks||[]).forEach(t=>{
    if(!tIds.has(t.id) && m.spaces.some(s=>s.id===t.spaceId)) m.tasks.push(t);
  });
  return m;
}

async function pullCloud(first){
  if(!cloud.on || !window.puter) return;
  try{
    const raw = await puter.kv.get(KV_KEY);
    if(!raw){ pushCloud(true); return; }
    const remote = (typeof raw === "string") ? JSON.parse(raw) : raw;
    if(!remote || !Array.isArray(remote.spaces) || !Array.isArray(remote.tasks)){ pushCloud(true); return; }
    if(first){
      state = mergeStates(state, remote);
      state.updatedAt = Date.now();
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
      pushCloud(true);
      render();
    } else if((remote.updatedAt||0) > (state.updatedAt||0)){
      state = remote;
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
      const ae = document.activeElement;
      if(ae && (ae.id==="scratch-pad" || ae.tagName==="TEXTAREA" || ae.tagName==="INPUT")) ui._pendingRender = true;
      else render();
    }
  }catch(e){}
}

function pushCloud(now){
  if(!cloud.on || !window.puter) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{
    try{ puter.kv.set(KV_KEY, JSON.stringify(state)); }catch(e){}
  }, now ? 50 : 600);
}

async function handleSyncClick(){
  if(syncStatus==="off"){
    showToast("Sync service is unreachable right now. Check your internet and reload.");
    return;
  }
  if(syncStatus==="loading"){ showToast("Still connecting, one moment…"); return; }
  if(syncStatus==="on"){
    if(confirm("Sign out of sync on this device? Your data stays here and in the cloud.")){
      try{ puter.auth.signOut(); }catch(e){}
      cloud.on = false; cloud.user = null; syncStatus = "signedout";
      if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
      renderSidebar();
    }
    return;
  }
  try{
    await puter.auth.signIn();
    await cloudSignedIn();
    showToast("✓ Sync is on. Sign in on your other devices and everything follows you.");
  }catch(e){ showToast("Sign in was closed or failed. Try again."); }
}

  if(syncStatus==="signedout") return "☁ Sign in to sync devices";

}

function taskRow(t, withSpace, idx){
  return '<div class="task '+(t.done?"done":"")+'" style="animation-delay:'+dly(idx)+'" data-act="open-task" data-id="'+t.id+'">'+
    '<button class="check" data-act="toggle" data-id="'+t.id+'" title="'+(t.repeat?"Done for today":"Mark done")+'">'+(t.done?"✓":"")+'</button>'+

    '<button class="icon-btn del" data-act="del-task" data-id="'+t.id+'" title="Delete">✕</button>'+
  '</div>';

function sortTasks(a,b){
  if(!!a.due!==!!b.due) return a.due?-1:1;
  if(a.due&&b.due&&a.due!==b.due) return a.due<b.due?-1:1;
  if(a.priority!==b.priority) return b.priority-a.priority;
  return a.createdAt-b.createdAt;
}

function isCollapsed(key, def){ return key in ui.collapsed ? ui.collapsed[key] : def; }

function groupSection(key, label, dotColor, tasks, withSpace, extras){
  if(!tasks.length) return "";
  const col = isCollapsed(key, key.endsWith(":done"));
  return '<div class="group-head '+(col?"collapsed":"")+'" data-act="collapse" data-key="'+key+'">'+
      '<span class="chev">▼</span><span class="dot" style="--gc:'+dotColor+'"></span>'+label+
      ' <span class="gcnt">'+tasks.length+'</span>'+(extras||"")+
    '</div>'+
    (col ? "" : tasks.map((t,i)=>taskRow(t, withSpace, i)).join(""));
}

/* ---------------- quick add parsing ---------------- */
function parseQuick(text){
  let due = null, pri = 0, rep = null, s = text;
  s = s.replace(/\s*!(high|hi|med|medium|low)\b/ig, (m,p)=>{ pri = {high:3,hi:3,med:2,medium:2,low:1}[p.toLowerCase()]||0; return ""; });
  s = s.replace(/\s*\b(every ?day|daily)\b/ig, ()=>{ rep = "daily"; return ""; });
  s = s.replace(/\s*\bweekdays\b/ig, ()=>{ rep = "weekdays"; return ""; });
  s = s.replace(/\s*\b(every ?week|weekly)\b/ig, ()=>{ rep = "weekly"; return ""; });
  s = s.replace(/\s*\b(today|tonight)\b/ig, ()=>{ due = todayStr(); return ""; });
  s = s.replace(/\s*\b(tomorrow|tmr)\b/ig, ()=>{ due = addDays(1); return ""; });
  s = s.replace(/\s*\bnext week\b/ig, ()=>{ due = addDays(7); return ""; });
  if(rep && !due) due = todayStr();
  return { title: s.replace(/\s+/g," ").trim(), due, priority: pri, repeat: rep };
}

/* ---------------- mutations ---------------- */
function toggleTask(id, el){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  if(t.repeat && !t.done){
    t.completedAt = todayStr();
    t.due = nextOccurrence(t.repeat);
    save();
    if(el){
      const r = el.getBoundingClientRect();
      confettiBurst(r.left + r.width/2, r.top + r.height/2, spaceOf(t).color);
    }
    render();
    showToast("✓ "+t.title+" done for today ↻ next: "+fmtDue(t.due));
    return;
  }
  t.done = !t.done;
  t.completedAt = t.done ? todayStr() : null;
  save();
  if(t.done && el){
    const r = el.getBoundingClientRect();
    confettiBurst(r.left + r.width/2, r.top + r.height/2, spaceOf(t).color);
  }
  render();
}

function deleteTasks(ids, msg){
  const removed = state.tasks.filter(t=>ids.includes(t.id));
  if(!removed.length) return;
  state.tasks = state.tasks.filter(t=>!ids.includes(t.id));
  undoBuf = {tasks:removed};
  save(); render();
  showToast(msg || (removed.length===1 ? "Task deleted" : removed.length+" tasks deleted"), true);
}

function applyUndo(){
  if(!undoBuf) return;
  state.tasks.push(...undoBuf.tasks);
  undoBuf = null;
  save(); render(); hideToast();
}

/* ---------------- form submits ---------------- */
function submitTask(f){
  const title = f.elements["title"].value.trim(); if(!title) return;
  const id = f.dataset.id;
  const spaceId = f.elements["space"].value;
  let stage = f.elements["stage"].value;
  const nsp = getSpace(spaceId) || state.spaces[0];
  if(!nsp.stages.some(s=>s.id===stage)) stage = nsp.stages[0].id;
  const repeat = f.elements["repeat"].value || null;
  let due = f.elements["due"].value || null;
  if(repeat && !due) due = todayStr();
  const vals = { title, desc:f.elements["desc"].value.trim(), due,
                 priority:+f.elements["priority"].value||0, spaceId:nsp.id, stage, repeat };
  if(id){ const t = state.tasks.find(x=>x.id===id); if(t) Object.assign(t, vals); }
  else state.tasks.push(Object.assign({id:uid(), done:false, createdAt:Date.now(), completedAt:null}, vals));
  save(); closeModal(); render();
}

function submitSpace(f){
  const name = f.elements["name"].value.trim(); if(!name) return;
  const id = f.dataset.id;
  const icon = f.elements["icon"].value.trim() || "📁";
  const color = f.elements["color"].value;
  let stages = $$("#stage-list .stage-row").map(r=>({ id:r.dataset.sid, name:r.querySelector("input").value.trim() })).filter(x=>x.name);
  if(!stages.length) stages = [{id:"new", name:"To do"}];
  stages = stages.map(x=>({ id: x.id==="new" ? uid() : x.id, name: x.name }));
  if(id){
    const s = getSpace(id); if(!s) return;
    s.name=name; s.icon=icon; s.color=color; s.stages=stages;
    state.tasks.forEach(t=>{ if(t.spaceId===id && !stages.some(st=>st.id===t.stage)) t.stage = stages[0].id; });
  } else {
    const s = {id:uid(), name, icon, color, stages, notes:[]};
    state.spaces.push(s);
    ui.view="space"; ui.spaceId=s.id; ui.tab="tasks";
  }
  save(); closeModal(); render();
}

function submitNote(f){
  const nspSel = f.elements["nspace"];
  const sp = getSpace((nspSel && nspSel.value) || f.dataset.space); if(!sp) return;
  if(!sp.notes) sp.notes = [];
  const title = f.elements["title"].value.trim();
  const body  = f.elements["body"].value.trim();
  if(!title && !body){ closeModal(); return; }
  const color = f.elements["color"].value;
  const pinned = f.elements["pinned"].checked;
  const id = f.dataset.id;
  if(id){ const n = sp.notes.find(x=>x.id===id); if(n) Object.assign(n,{title,body,color,pinned}); }
  else sp.notes.push({id:uid(), title, body, color, pinned, createdAt:Date.now()});
  save(); closeModal(); render();
}

/* ---------------- export / import ---------------- */
function doExport(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "orbit-backup-"+todayStr()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  showToast("Backup downloaded 📦");
}

$("#import-file").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const d = JSON.parse(rd.result);
      if(!d || !Array.isArray(d.spaces) || !Array.isArray(d.tasks)) throw new Error("bad");
      state = d; save();
      ui = {view:"today", spaceId:null, tab:"tasks", search:"", collapsed:{}, dragTask:null};
      render(); showToast("Data imported ✓");
    }catch(err){ showToast("Import failed. Not a valid Orbit backup."); }
  };
  rd.readAsText(file);
  e.target.value = "";
});

/* ---------------- confetti ---------------- */
const cvs = $("#confetti-canvas"), ctx = cvs.getContext("2d");
let parts = [], rafId = null;
function sizeCanvas(){ cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener("resize", sizeCanvas); sizeCanvas();
function confettiBurst(x, y, color){
  const colors = [color||"#8b7cff", "#38d6f5", "#fbbf24", "#fb7185", "#34d399", "#ffffff"];
  for(let i=0;i<26;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*4.5;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2.5, g:.12+Math.random()*.06,
      life:46+Math.random()*22, size:3+Math.random()*4, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
      c:colors[i%colors.length]});
  }
  if(!rafId && ctx) rafId = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.rot+=p.vr; p.life--;
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life/22);
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*.62);
    ctx.restore();
  }
  if(parts.length) rafId = requestAnimationFrame(tick);
  else { rafId = null; ctx.clearRect(0,0,cvs.width,cvs.height); }
}

/* ---------------- event delegation ---------------- */
document.addEventListener("click", e=>{
  if(e.target.classList && e.target.classList.contains("overlay")){ closeModal(); return; }
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  switch(act){
    case "nav-today": ui.view="today"; ui.spaceId=null; ui.search=""; closeSb(); render(); break;
    case "nav-pad": ui.view="pad"; ui.spaceId=null; ui.search=""; closeSb(); render(); break;
    case "nav-space": ui.view="space"; ui.spaceId=el.dataset.id; ui.tab="tasks"; ui.search=""; closeSb(); render(); break;
    case "tab": ui.tab = el.dataset.tab; renderTabs(); renderView(); break;
    case "toggle": toggleTask(el.dataset.id, el); break;
    case "open-task": if(ui._justDragged) break; openTaskModal(el.dataset.id); break;
    case "del-task": deleteTasks([el.dataset.id]); break;
    case "modal-del-task": closeModal(); deleteTasks([el.dataset.id]); break;
    case "new-task": openTaskModal(null); break;
    case "col-add": openTaskModal(null, ui.spaceId, el.dataset.stage); break;
    case "new-space": openSpaceModal(null); break;
    case "edit-space": openSpaceModal(ui.spaceId); break;
    case "del-space": {
      const s = getSpace(el.dataset.id); if(!s) break;
      const n = state.tasks.filter(t=>t.spaceId===s.id).length;
      if(confirm('Delete "'+s.name+'" with '+n+' task(s) and '+(s.notes||[]).length+' note(s)? This cannot be undone.')){
        state.spaces = state.spaces.filter(x=>x.id!==s.id);
        state.tasks = state.tasks.filter(t=>t.spaceId!==s.id);
        if(ui.spaceId===s.id){ ui.view="today"; ui.spaceId=null; }
        save(); closeModal(); render();
      }
      break;
    }
    case "new-note": openNoteModal(ui.spaceId, null); break;
    case "new-dash-note": openNoteModal(defaultNotesSpaceId(), null, true); break;
    case "open-note": openNoteModal(el.dataset.space || ui.spaceId, el.dataset.id); break;
    case "del-note": {
      const sp = getSpace(el.dataset.space);
      if(sp && sp.notes) sp.notes = sp.notes.filter(n=>n.id!==el.dataset.id);
      save(); closeModal(); render(); showToast("Note deleted");
      break;
    }
    case "close-modal": closeModal(); break;
    case "collapse": {
      const key = el.dataset.key;
      ui.collapsed[key] = !isCollapsed(key, key.endsWith(":done"));
      renderView();
      break;
    }
    case "clear-done": {
      const ids = state.tasks.filter(t=>t.spaceId===el.dataset.id && t.done).map(t=>t.id);
      deleteTasks(ids, "Completed tasks cleared");
      break;
    }
    case "seg-pri": {
      $$("button", el.parentElement).forEach(b=>b.classList.toggle("active", b===el));
      const form = el.closest("form");
      if(form) form.elements["priority"].value = el.dataset.v;
      break;
    }
    case "swatch": {
      $$(".swatch", el.parentElement).forEach(b=>b.classList.toggle("active", b===el));
      const form = el.closest("form");
      if(form) form.elements["color"].value = el.dataset.c;
      break;
    }
    case "stage-add": {
      const list = $("#stage-list");
      if(list){
        list.insertAdjacentHTML("beforeend", stageRowHtml("new",""));
        const inp = list.lastElementChild.querySelector("input");
        if(inp) inp.focus();
      }
      break;
    }
    case "stage-del": { const row = el.closest(".stage-row"); if(row) row.remove(); break; }
    case "cmdk": openCmd(); break;
    case "cmd-run": {
      const q = ($("#cmd-in")||{}).value || "";
      const a = cmdFiltered(q)[+el.dataset.ci];
      closeModal(); if(a) a.run();
      break;
    }
    case "due-quick": {
      const form = el.closest("form");
      if(form) form.elements["due"].value = addDays(+el.dataset.d);
      break;
    }
    case "export": doExport(); break;
    case "import": $("#import-file").click(); break;
    case "undo": applyUndo(); break;
    case "sync": handleSyncClick(); break;
    case "toggle-theme": toggleTheme(); break;
    case "toggle-sb": toggleSidebar(); break;
    case "rename-user": {
      const v = prompt("What should Orbit call you?", state.userName);
      if(v && v.trim()){ state.userName = v.trim().slice(0,24); save(); render(); }
      break;
    }
  }
});

document.addEventListener("submit", e=>{
  const f = e.target, kind = f.dataset.form;
  if(!kind) return;
  e.preventDefault();
  if(kind==="quickadd"){
    const v = f.elements["qa"].value.trim(); if(!v) return;
    const p = parseQuick(v); if(!p.title) return;
    const sp = getSpace(f.dataset.space); if(!sp) return;
    state.tasks.push({id:uid(), spaceId:sp.id, title:p.title, desc:"", due:p.due, priority:p.priority,
      repeat:p.repeat, stage:sp.stages[0].id, done:false, createdAt:Date.now(), completedAt:null});
    save(); ui._focusQA = true; render();
  }
  else if(kind==="task") submitTask(f);
  else if(kind==="space") submitSpace(f);
  else if(kind==="note") submitNote(f);
});

let searchT = null;
document.addEventListener("input", e=>{
  if(e.target && e.target.id==="search"){
    const v = e.target.value;
    clearTimeout(searchT);
    searchT = setTimeout(()=>{ ui.search = v; renderView(); }, 120);
  }
});

document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openCmd(); return; }
  if(e.key==="Escape"){ closeModal(); return; }
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select" || e.target.isContentEditable) return;
  if(e.key==="/"){ e.preventDefault(); const s=$("#search"); if(s) s.focus(); }
  else if(e.key.toLowerCase()==="n" && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); openTaskModal(null); }
});

/* ---------------- init ---------------- */
$("#sb-backdrop").addEventListener("click", closeSb);
setInterval(updateClock, 30000);
addEventListener("focus", ()=>pullCloud(false));
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) pullCloud(false); });

/* swipe gestures on phones: swipe in from the left edge to open, swipe left to close */
let touchX = null, touchY = null, edgeSwipe = false;
document.addEventListener("touchstart", e=>{
  const t = e.touches && e.touches[0]; if(!t) return;
  touchX = t.clientX; touchY = t.clientY;
  edgeSwipe = t.clientX < 28 && !document.body.classList.contains("sb-open");
}, {passive:true});
document.addEventListener("touchend", e=>{
  if(touchX===null) return;
  const t = e.changedTouches && e.changedTouches[0];
  if(t && isMobile() && Math.abs(t.clientY - touchY) < 80){
    const dx = t.clientX - touchX;
    if(edgeSwipe && dx > 55){ document.body.classList.add("sb-open"); updateFab(); }
    else if(document.body.classList.contains("sb-open") && dx < -55){ closeSb(); }
  }
  touchX = null; edgeSwipe = false;
}, {passive:true});
addEventListener("resize", ()=>{ if(!isMobile()) closeSb(); });

/* flush unsaved notepad text if the tab closes mid-typing */
addEventListener("beforeunload", ()=>{
  const ta = $("#scratch-pad");
  if(ta && ta.value !== (state.scratch||"")){
    state.scratch = ta.value;
    state.updatedAt = Date.now();
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }
});

updateFab();
render();
initCloud();
</script>
