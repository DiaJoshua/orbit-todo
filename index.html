<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit: Tasks & Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236e56cf'/%3E%3Cstop offset='1' stop-color='%232f7fe0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23g)'/%3E%3Ccircle cx='256' cy='256' r='102' fill='%23fff' opacity='.96'/%3E%3Cellipse cx='256' cy='256' rx='194' ry='70' fill='none' stroke='%23fff' stroke-width='26' opacity='.85' transform='rotate(-18 256 256)'/%3E%3Ccircle cx='414' cy='182' r='21' fill='%23fff'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbit">

<script src="https://js.puter.com/v2/" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ theme tokens ============ */
/* Light (default): warm off white, muted ink, quiet violet accent */
:root{
  --bg:#f7f7f5; --bg2:#ffffff;
  --panel:#ffffff; --panel2:rgba(28,28,32,.05);
  --border:rgba(28,28,32,.09); --border2:rgba(28,28,32,.16);
  --text:#1d1d20; --muted:#63636c; --faint:#a3a3ab;
  --accent:#6e56cf;
  --rose:#e5484d; --amber:#c98a10; --cyan:#2f7fe0; --green:#1f9d55;
  --on-accent:#ffffff;
  --chip-bg:rgba(28,28,32,.055);
  --track:rgba(28,28,32,.08);
  --col-bg:rgba(255,255,255,.6);
  --sb-bg:rgba(250,250,248,.82);
  --tb-bg:rgba(247,247,245,.8);
  --modal-bg:#ffffff;
  --toast-bg:#ffffff;
  --overlay-bg:rgba(28,28,34,.3);
  --note-base:#ffffff;
  --tint-mix:#26262c;
  --card-shadow:0 1px 2px rgba(24,24,30,.04), 0 3px 10px rgba(24,24,30,.04);
  --pop-shadow:0 18px 55px rgba(24,24,30,.18);
  --hover-shadow:0 10px 26px rgba(24,24,30,.10);
  --scroll:rgba(28,28,32,.18);
  --glow-op:.10;
  --radius:14px;
  color-scheme:light;
}
/* Dark: neutral charcoal, gentle contrast, no blue cast */
html[data-theme="dark"]{
  --bg:#151517; --bg2:#1c1c1f;
  --panel:#1b1b1e; --panel2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.15);
  --text:#ececef; --muted:#a2a2ab; --faint:#66666e;
  --accent:#8f7be8;
  --rose:#f2555a; --amber:#f0b429; --cyan:#62a8ff; --green:#3dd68c;
  --on-accent:#141416;
  --chip-bg:rgba(255,255,255,.07);
  --track:rgba(255,255,255,.08);
  --col-bg:rgba(255,255,255,.025);
  --sb-bg:rgba(23,23,26,.85);
  --tb-bg:rgba(21,21,23,.7);
  --modal-bg:#202023;
  --toast-bg:#232326;
  --overlay-bg:rgba(0,0,0,.55);
  --note-base:rgba(255,255,255,.03);
  --tint-mix:#ffffff;
  --card-shadow:0 1px 2px rgba(0,0,0,.2);
  --pop-shadow:0 22px 70px rgba(0,0,0,.55);
  --hover-shadow:0 10px 26px rgba(0,0,0,.3);
  --scroll:rgba(255,255,255,.13);
  --glow-op:.06;
  color-scheme:dark;
}

/* ============ reset & base ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
  font-size:14.5px; line-height:1.5; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.pad-title{letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:2px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* smooth crossfade when switching themes */
html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after{
  transition:background-color .45s ease, color .45s ease, border-color .45s ease, box-shadow .45s ease !important;
}

/* ============ ambient glow ============ */
#bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bg-glow::before,#bg-glow::after{
  content:"";position:absolute;width:52vw;height:52vw;border-radius:50%;
  filter:blur(150px);opacity:var(--glow-op);
  animation:drift 45s ease-in-out infinite alternate;
}
#bg-glow::before{background:#6e56cf;top:-24vw;left:-16vw}
#bg-glow::after{background:#2f7fe0;bottom:-28vw;right:-16vw;animation-delay:-22s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(3vw,3vh) scale(1.06)}}

/* ============ layout ============ */
#app{position:relative;z-index:1;display:flex;height:100vh}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#view{flex:1;overflow-y:auto;padding:26px 30px 130px;scroll-behavior:smooth}
.view-inner{max-width:860px;margin:0 auto}
.view-inner.wide{max-width:1400px}

/* ============ sidebar ============ */
#sidebar{
  width:268px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--sb-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:1px solid var(--border);padding:22px 14px 14px;
  transition:transform .28s cubic-bezier(.4,0,.2,1), margin-left .28s cubic-bezier(.4,0,.2,1);
}
@media(min-width:881px){
  body.sb-collapsed #sidebar{margin-left:-268px}
}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:0 2px 14px;user-select:none;cursor:pointer;border-radius:10px;transition:background .15s}
.logo:hover{background:var(--panel2)}
.logo-tile{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(135deg,#6e56cf,#2f7fe0);box-shadow:0 3px 10px color-mix(in srgb,#6e56cf 35%,transparent);transition:transform .45s cubic-bezier(.3,1.4,.4,1)}
.logo:hover .logo-tile{transform:rotate(12deg) scale(1.05)}
.word2{font-size:14.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.logo .rn{width:26px;height:26px;border-radius:8px;font-size:12px;flex-shrink:0;opacity:0;transition:.15s;display:grid;place-items:center}
.logo:hover .rn{opacity:.6}
.logo .rn:hover{opacity:1;background:var(--panel2)}
@media(max-width:880px){.logo .rn{opacity:.5}}
.sb-scroll{flex:1;overflow-y:auto;padding:2px 2px 10px;touch-action:pan-y}
.drag-src{opacity:.4}
.lifting{transform:scale(1.03) !important;box-shadow:0 10px 26px rgba(0,0,0,.28) !important;background:var(--bg2);position:relative;z-index:5;opacity:.95}
.sb-label{font-size:10.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);padding:16px 12px 7px;display:flex;align-items:center;justify-content:space-between}
.sb-label button{color:var(--faint);font-size:15px;line-height:1;padding:2px 6px;border-radius:8px;transition:.15s}
.sb-label button:hover{color:var(--text);background:var(--panel2)}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;border-radius:12px;color:var(--muted);font-weight:500;
  margin-bottom:2px;position:relative;transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--panel2);color:var(--text);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--ac,var(--accent))}
.nav-item .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:color-mix(in srgb,var(--ac,var(--accent)) 15%,transparent);flex-shrink:0;transition:transform .18s ease}
.nav-item:hover .ico{transform:scale(1.1) rotate(-5deg)}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel2);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.nav-item.active .cnt{background:color-mix(in srgb,var(--ac,var(--accent)) 25%,transparent);color:var(--text)}
.nav-item .bar{position:absolute;left:51px;right:14px;bottom:5px;height:2px;border-radius:2px;background:var(--track);overflow:hidden}
.nav-item .bar i{display:block;height:100%;border-radius:2px;background:var(--ac,var(--accent));transition:width .4s ease}
.sb-foot{border-top:1px solid var(--border);padding:12px 6px 2px;display:flex;flex-direction:column;gap:8px}
.sb-foot .row{display:flex;gap:8px}
.sb-foot .mini{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 4px;transition:.15s}
.sb-foot .mini:hover{color:var(--text);border-color:var(--border2);background:var(--panel2)}
.sb-foot .mini.on{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,transparent);background:color-mix(in srgb,var(--green) 8%,transparent)}
.sb-foot .hint{font-size:10.5px;color:var(--faint);text-align:center}
#sb-backdrop{display:none}

/* ============ topbar ============ */
#topbar{
  display:flex;align-items:center;gap:12px;padding:14px 24px;
  border-bottom:1px solid var(--border);
  background:var(--tb-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  position:relative;z-index:5;flex-wrap:wrap;
}
.tb-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;min-width:0}
.tb-title .emoji{font-size:19px;flex-shrink:0}
.tb-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tb-spacer{flex:1}
.searchwrap{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:7px 12px;width:230px;transition:border-color .15s}
.searchwrap:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.searchwrap svg{flex-shrink:0;opacity:.5}
.searchwrap input{background:none;border:none;outline:none;width:100%;font-size:13.5px}
.searchwrap input::placeholder{color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:12px;padding:8px 15px;font-size:13.5px;font-weight:600;transition:.15s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:var(--panel);border-color:var(--border);color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--border2)}
.btn.danger{background:color-mix(in srgb,var(--rose) 12%,transparent);color:var(--rose);border-color:color-mix(in srgb,var(--rose) 30%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--rose) 22%,transparent)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;color:var(--muted);transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.icon-btn:active{transform:scale(.9)}
#theme-btn.spin svg{animation:spinIn .5s cubic-bezier(.3,1.4,.4,1)}
@keyframes spinIn{from{transform:rotate(-150deg) scale(.5);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}

/* ============ tabs row ============ */
.tabsrow{padding:12px 30px 0}
.tabsrow .inner{max-width:860px;margin:0 auto;width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tabsrow.wide .inner{max-width:1400px}
.tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:4px}
.tabs button{padding:6px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--text)}
.tabs button.active{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--text)}
.prog-wrap{display:flex;align-items:center;gap:10px;margin-left:auto;color:var(--muted);font-size:12.5px}
.prog-track{width:110px;height:5px;border-radius:5px;background:var(--track);overflow:hidden}
.prog-track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));transition:width .5s ease}

/* ============ today / greeting ============ */
.greet h1{font-size:28px;font-weight:800;letter-spacing:-.3px}
.greet h1 .uname{cursor:pointer;border-bottom:2px dotted var(--faint)}
.greet h1 .uname:hover{color:var(--accent)}
.greet h1 .grad{background:linear-gradient(90deg,var(--accent),#2f7fe0);-webkit-background-clip:text;background-clip:text;color:transparent}
.greet .sub{color:var(--muted);margin-top:3px;font-size:14px}
.greet .quote{margin-top:7px;font-size:13px;color:var(--faint);font-style:italic}
.streak{display:inline-flex;align-items:center;gap:5px;margin-left:12px;font-size:12.5px;font-weight:700;color:var(--amber);background:color-mix(in srgb,var(--amber) 11%,transparent);padding:3px 12px;border-radius:999px;vertical-align:middle;animation:pop .4s ease}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin:22px 0 8px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 56px 15px 17px;transition:.18s;position:relative;overflow:hidden;box-shadow:var(--card-shadow);animation:fadeUp .25s ease both}
.stat .s-ico{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--sc,var(--accent)) 11%,transparent);transition:transform .18s}
.stat:hover .s-ico{transform:scale(1.12) rotate(-6deg)}
.stats .stat:nth-child(2){animation-delay:40ms}
.stats .stat:nth-child(3){animation-delay:80ms}
.stats .stat:nth-child(4){animation-delay:120ms}
.stat:hover{transform:translateY(-2px);border-color:var(--border2)}
.stat .num{font-size:26px;font-weight:800;line-height:1.1;color:var(--sc,var(--text))}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:3px}

.day-prog{display:flex;align-items:center;gap:11px;margin:2px 2px 8px;font-size:12px;color:var(--muted);animation:fadeUp .3s ease both}
.day-prog .prog-track{flex:1;width:auto;height:6px}
.day-prog b{color:var(--text);font-weight:700}
.ui-tip{margin-top:26px;text-align:center;font-size:12px;color:var(--faint);animation:fadeIn .3s ease}

/* view switch transition */
.view-anim{animation:viewIn .22s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ============ groups & task rows ============ */
.group-head{
  display:flex;align-items:center;gap:8px;margin:22px 0 9px;
  font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);
  cursor:pointer;user-select:none;
}
.group-head .chev{transition:transform .2s;font-size:10px;color:var(--faint)}
.group-head.collapsed .chev{transform:rotate(-90deg)}
.group-head .gcnt{color:var(--faint);font-weight:600}
.group-head .dot{width:7px;height:7px;border-radius:50%;background:var(--gc,var(--faint))}
.group-head .clear-done{margin-left:auto;font-size:11px;letter-spacing:.4px;color:var(--faint);text-transform:none;padding:3px 9px;border-radius:8px}
.group-head .clear-done:hover{color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}

.task{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--card-shadow);
  transition:transform .13s,border-color .13s,background .13s,opacity .25s;
  animation:fadeUp .22s ease both;
}
.task:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:var(--bg2)}
.task.done{opacity:.55}
.task.done .t-title{text-decoration:line-through;text-decoration-color:var(--muted)}
.check{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0;margin-top:2px;
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--on-accent);
  transition:.18s;background:transparent;
}
.check:hover{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
.check:active{transform:scale(.82)}
.task.done .check,.card.done .check{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff));border-color:transparent;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.t-main{flex:1;min-width:0}
.t-title{font-weight:600;font-size:14.5px;word-break:break-word}
.t-desc{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.t-chips:empty{display:none}
.chip{font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:999px;background:var(--chip-bg);color:var(--muted);display:inline-flex;align-items:center;gap:5px;line-height:1.5}
.chip.due.today{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber)}
.chip.due.overdue{background:color-mix(in srgb,var(--rose) 13%,transparent);color:var(--rose)}
.chip.pri.p3{background:color-mix(in srgb,var(--rose) 12%,transparent);color:var(--rose)}
.chip.pri.p2{background:color-mix(in srgb,var(--amber) 13%,transparent);color:var(--amber)}
.chip.pri.p1{background:color-mix(in srgb,var(--cyan) 13%,transparent);color:var(--cyan)}
.chip.stage{background:color-mix(in srgb,var(--accent) 13%,transparent);color:color-mix(in srgb,var(--accent) 70%,var(--tint-mix))}
.chip.rep{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
.chip.space-chip{background:color-mix(in srgb,var(--c) 13%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--tint-mix))}
.task .del{opacity:0;width:30px;height:30px;font-size:14px}
.task:hover .del{opacity:.55}
.task .del:hover{opacity:1;color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ quick add ============ */
.quickadd{
  display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--border);border-radius:14px;padding:5px 6px 5px 16px;margin-bottom:6px;
  transition:border-color .15s;box-shadow:var(--card-shadow);
}
.quickadd:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 10%,transparent)}
.quickadd .plus{color:var(--accent);font-size:19px;font-weight:600}
.quickadd input{flex:1;background:none;border:none;outline:none;padding:9px 0;font-size:14px}
.quickadd input::placeholder{color:var(--faint)}
.quickadd button{background:color-mix(in srgb,var(--accent) 16%,transparent);color:color-mix(in srgb,var(--accent) 75%,var(--tint-mix));font-weight:700;font-size:13px;border-radius:10px;padding:8px 15px;transition:.15s}
.quickadd button:hover{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.qa-prev{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 6px 12px;padding:0 12px;font-size:12px;color:var(--muted);animation:fadeIn .15s ease}
.qa-prev b{font-weight:600;color:var(--text)}
.qa-prev .qa-lbl{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}

/* ============ board ============ */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:20px;min-height:60vh}
.col{flex:0 0 268px;background:var(--col-bg);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100vh - 235px);box-shadow:var(--card-shadow)}
.col-head{display:flex;align-items:center;gap:8px;padding:13px 15px 9px;font-weight:700;font-size:13.5px}
.col-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.col-head .count{margin-left:auto;font-size:11.5px;color:var(--muted);background:var(--panel2);padding:1px 8px;border-radius:999px}
.col-body{flex:1;overflow-y:auto;padding:4px 9px;display:flex;flex-direction:column;gap:8px;min-height:70px;border-radius:12px;transition:background .15s}
.col-body.drop-hint{background:color-mix(in srgb,var(--accent) 8%,transparent);outline:2px dashed color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:-4px}
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;
  cursor:grab;transition:transform .13s,border-color .13s;animation:fadeUp .22s ease both;box-shadow:var(--card-shadow);
}
.card{position:relative}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));transform:translateY(-1px)}
.c-next{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:7px;color:var(--faint);font-size:15px;font-weight:700;opacity:0;transition:.12s;line-height:1}
.card:hover .c-next{opacity:.7}
.c-next:hover{background:var(--panel2);color:var(--accent);opacity:1}
@media(max-width:880px){.c-next{opacity:.55}}
.card:active{cursor:grabbing}
.card.dragging{opacity:.35;transform:rotate(2deg) scale(.98)}
.card.done{opacity:.5}
.card.done .c-title{text-decoration:line-through}
.card-top{display:flex;align-items:flex-start;gap:9px}
.card .check{width:18px;height:18px;font-size:10px;margin-top:1px}
.c-title{font-weight:600;font-size:13.5px;flex:1;word-break:break-word}
.card .t-chips{margin-top:8px}
.col-add{margin:6px 9px 10px;padding:8px;border-radius:10px;border:1px dashed var(--border2);color:var(--faint);font-size:12.5px;font-weight:600;transition:.15s}
.col-add:hover{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.col.ghost-col{background:none;border:1px dashed var(--border);justify-content:center;min-height:120px;box-shadow:none}
.col.ghost-col button{padding:20px;color:var(--faint);font-weight:600;font-size:13px;width:100%;height:100%}
.col.ghost-col button:hover{color:var(--text)}

/* ============ notes ============ */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.notes-grid.dash{margin-bottom:10px}
.note{
  --nc:#8b7cff;position:relative;border-radius:16px;padding:15px 16px;min-height:150px;cursor:pointer;
  background:color-mix(in srgb,var(--nc) 10%,var(--note-base));
  border:1px solid color-mix(in srgb,var(--nc) 30%,transparent);
  display:flex;flex-direction:column;gap:7px;transition:transform .18s,box-shadow .18s;
  animation:noteIn .25s ease backwards;box-shadow:var(--card-shadow);
}
.note:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:var(--hover-shadow)}
.notes-grid .note:nth-child(odd):not(.add-note){transform:rotate(-.8deg)}
.notes-grid .note:nth-child(3n):not(.add-note){transform:rotate(.7deg)}
.notes-grid .note:hover{transform:translateY(-3px) rotate(0);box-shadow:var(--hover-shadow)}
@keyframes noteIn{from{opacity:0}}
.note .pin{position:absolute;top:10px;right:12px;font-size:13px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));transition:transform .18s}
.note:hover .pin{transform:rotate(18deg) scale(1.15)}
.n-title{font-weight:700;font-size:14.5px;color:color-mix(in srgb,var(--nc) 60%,var(--tint-mix));padding-right:18px;word-break:break-word}
.n-body{font-size:12.8px;color:var(--muted);white-space:pre-wrap;flex:1;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.n-date{font-size:10.5px;color:var(--faint)}
.note.add-note{border-style:dashed;background:none;align-items:center;justify-content:center;color:var(--faint);font-weight:600;font-size:13.5px;gap:4px;box-shadow:none}
.note.add-note:hover{color:var(--text);border-color:var(--accent);transform:none}
.note.add-note .big{font-size:26px;color:var(--accent)}

/* ============ notepad ============ */
.pages-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.page-chip{padding:6px 13px;border-radius:10px;background:var(--panel);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--muted);transition:.13s;box-shadow:var(--card-shadow)}
.page-chip:hover{color:var(--text);border-color:var(--border2);transform:translateY(-1px)}
.page-chip.active{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--text);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.page-chip.new{border-style:dashed;background:none;box-shadow:none}
.pad-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pad-title{font-size:22px;font-weight:800;cursor:pointer;border-radius:8px;padding:0 6px;margin-left:-6px}
.pad-title:hover{background:var(--panel2)}
.pad-meta{font-size:12px;color:var(--faint);margin-left:auto}
#scratch-pad{
  width:100%;min-height:62vh;resize:vertical;display:block;
  background:var(--bg2);border:1px solid var(--border);border-radius:18px;
  padding:26px 28px;font-size:15.5px;line-height:1.75;outline:none;color:var(--text);
  box-shadow:var(--card-shadow);font-family:inherit;transition:border-color .15s;
}
#scratch-pad:focus{border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 8%,transparent)}
#scratch-pad::placeholder{color:var(--faint)}
.note-row{
  background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--nc,#8b7cff);
  border-radius:14px;padding:14px 17px;margin-bottom:10px;cursor:pointer;
  box-shadow:var(--card-shadow);transition:transform .15s,background .15s;animation:fadeUp .3s ease both;
}
.note-row:hover{transform:translateY(-1px);background:var(--bg2)}
.nr-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.nr-title{font-weight:700;font-size:15px;flex:1;min-width:120px}
.nr-body{margin-top:8px;font-size:13.5px;color:var(--muted);white-space:pre-wrap;line-height:1.65;word-break:break-word}
.head-link{margin-left:auto;font-size:11px;letter-spacing:.4px;color:var(--faint);text-transform:none;padding:3px 9px;border-radius:8px}
.head-link:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

/* ============ empty state ============ */
.empty{text-align:center;padding:56px 20px;color:var(--muted);animation:fadeUp .3s ease both}
.empty .art{font-size:42px;margin-bottom:12px;display:block;filter:saturate(.85);animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.empty h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.empty p{font-size:13px;color:var(--faint)}

/* ============ modal ============ */
#modal-root .overlay{
  position:fixed;inset:0;z-index:50;background:var(--overlay-bg);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  display:grid;place-items:center;padding:18px;animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0}}
.modal{
  width:min(540px,94vw);max-height:88vh;overflow-y:auto;
}
.modal.wide{width:min(760px,96vw)}
.modal{
  background:var(--modal-bg);border:1px solid var(--border2);border-radius:20px;padding:24px;
  box-shadow:var(--pop-shadow);animation:zoomIn .18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes zoomIn{from{opacity:0;transform:scale(.94) translateY(8px)}}
.modal h2{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.modal .info{font-size:13.5px;color:var(--muted);line-height:1.65;margin-top:4px}
.modal .info b{color:var(--text)}
.modal .info ol{margin:8px 0 8px 20px}
.modal .info li{margin-bottom:5px}
.f-title{width:100%;background:none;border:none;outline:none;font-size:19px;font-weight:700;padding:4px 0 10px;border-bottom:1px solid var(--border)}
.f-title::placeholder{color:var(--faint)}
.modal textarea{
  width:100%;min-height:92px;resize:vertical;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:11px 13px;font-size:13.5px;outline:none;margin-top:14px;line-height:1.5;font-family:inherit;
}
.modal textarea:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:15px}
.f-field{display:flex;flex-direction:column;gap:6px}
.f-field>span{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.4px}
.f-field input,.f-field select{
  background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:8.5px 11px;
  font-size:13.5px;outline:none;width:100%;
}
.f-field input:focus,.f-field select:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.f-field select option{background:var(--modal-bg)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:7.5px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);transition:.13s}
.seg button:hover{color:var(--text)}
.seg button.active{border-color:transparent}
.seg button[data-v="0"].active{background:var(--panel2);color:var(--text)}
.seg button[data-v="1"].active{background:color-mix(in srgb,var(--cyan) 18%,transparent);color:var(--cyan)}
.seg button[data-v="2"].active{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.seg button[data-v="3"].active{background:color-mix(in srgb,var(--rose) 18%,transparent);color:var(--rose)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;transition:.13s}
.swatch:hover{transform:scale(1.12)}
.swatch.active{border-color:var(--bg2);box-shadow:0 0 0 3px color-mix(in srgb,var(--swc) 55%,transparent)}
.cl-row{display:flex;gap:9px;align-items:center;margin-bottom:6px}
.cl-row input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:13px;outline:none}
.cl-row input:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.cl-row .check{margin-top:0;width:19px;height:19px;font-size:10px}
.cl-row .check.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff));border-color:transparent;color:var(--on-accent)}
.cl-row .rm{width:28px;height:28px;border-radius:8px;color:var(--faint);font-size:14px;flex-shrink:0}
.cl-row .rm:hover{color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
.stage-list{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.stage-row{display:flex;gap:7px;align-items:center}
.stage-row input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7.5px 11px;font-size:13px;outline:none}
.stage-row input:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.stage-row .rm{width:30px;height:30px;border-radius:9px;color:var(--faint);font-size:15px;flex-shrink:0}
.stage-row .rm:hover{color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
.add-stage{align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:9px;margin-top:2px}
.add-stage:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.m-foot{display:flex;align-items:center;gap:10px;margin-top:20px}
.m-foot .grow{flex:1}
.pin-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.pin-toggle input{accent-color:var(--accent);width:15px;height:15px}

/* ============ command palette ============ */
#modal-root .overlay.top{place-items:start center;padding-top:12vh}
.cmd{width:min(560px,94vw);background:var(--modal-bg);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--pop-shadow);overflow:hidden;animation:zoomIn .14s ease}
.cmd input{width:100%;padding:15px 18px;background:none;border:none;outline:none;font-size:15px;border-bottom:1px solid var(--border);color:var(--text)}
.cmd input::placeholder{color:var(--faint)}
#cmd-list{max-height:330px;overflow-y:auto;padding:6px}
.cmd-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--muted);transition:background .1s}
.cmd-row .ci{width:24px;text-align:center;flex-shrink:0}
.cmd-row.sel,.cmd-row:hover{background:var(--panel2);color:var(--text)}
.cmd-empty{padding:18px;text-align:center;color:var(--faint);font-size:13px}
.kbd-hint{font-size:11px;font-weight:600;color:var(--faint);border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--panel);transition:.15s;letter-spacing:.3px}
.kbd-hint:hover{color:var(--text);border-color:var(--border2)}
.quick-dates{display:flex;gap:5px;margin-top:6px}
.quick-dates button{font-size:11px;font-weight:600;color:var(--muted);background:var(--chip-bg);border-radius:999px;padding:3.5px 10px;transition:.12s}
.quick-dates button:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* ============ context menu popover ============ */
#popover{
  position:fixed;z-index:60;display:none;min-width:178px;
  background:var(--modal-bg);border:1px solid var(--border2);border-radius:12px;
  box-shadow:var(--pop-shadow);padding:5px;animation:zoomIn .12s ease;
}
#popover button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;padding:8px 11px;border-radius:8px;font-size:13px;color:var(--muted);transition:background .1s}
#popover button:hover{background:var(--panel2);color:var(--text)}
#popover button.danger:hover{background:color-mix(in srgb,var(--rose) 12%,transparent);color:var(--rose)}
#popover .sep{height:1px;background:var(--border);margin:4px 6px}

/* ============ toast ============ */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:80;
  background:var(--toast-bg);border:1px solid var(--border2);border-radius:13px;padding:10px 16px;
  font-size:13.5px;display:flex;align-items:center;gap:12px;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--pop-shadow);
}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--accent);font-weight:700;font-size:13px}
#toast button:hover{text-decoration:underline}

#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:90}

/* ============ Orbie the mascot ============ */
#mascot{position:fixed;right:22px;bottom:16px;z-index:2;cursor:pointer;user-select:none;transition:transform .18s;opacity:.95}
#mascot:hover{opacity:1}
#mascot:hover{transform:scale(1.06)}
#mascot:active{transform:scale(.93)}
#mascot svg{display:block;animation:mascotBob 4.5s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(20,20,40,.18))}
#mascot.happy svg{animation:mascotJump .55s cubic-bezier(.3,1.5,.4,1)}
@keyframes mascotBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mascotJump{0%{transform:translateY(0)}30%{transform:translateY(-16px) rotate(-7deg)}60%{transform:translateY(1px) rotate(4deg)}100%{transform:translateY(0) rotate(0)}}
.m-pupil{transition:transform .09s linear}
#m-eyes.blink circle{transform:scaleY(.1);transform-box:fill-box;transform-origin:center}
#mascot.sleep #m-eyes circle{transform:scaleY(.12);transform-box:fill-box;transform-origin:center}
#mascot.sleep svg{animation-duration:6.5s}
#mascot-zzz{position:absolute;top:-6px;right:-2px;font-size:15px;display:none;animation:mascotBob 2.2s ease-in-out infinite}
.m-moon{transform-box:view-box;transform-origin:center;animation:orbitSpin 16s linear infinite}
#mascot.sleep .m-moon{animation-duration:34s}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
#mascot-bubble{
  position:absolute;bottom:96px;right:2px;min-width:150px;max-width:230px;
  background:var(--modal-bg);border:1px solid var(--border2);border-radius:12px;padding:9px 12px;
  font-size:12.5px;line-height:1.45;color:var(--text);box-shadow:var(--pop-shadow);
  opacity:0;transform:translateY(6px);transition:.22s;pointer-events:none;
}
#mascot-bubble.show{opacity:1;transform:none}
#mascot-bubble.chat{pointer-events:auto;max-width:250px;min-width:220px;cursor:default}
.mb-line{margin-bottom:2px}
.mb-line b{color:var(--text)}
#orbie-form{display:flex;gap:6px;margin-top:8px}
#orbie-form input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:12.5px;outline:none;color:var(--text)}
#orbie-form input:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
#orbie-form button{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:0 12px;font-size:12px;font-weight:700}
#mascot-bubble::after{content:"";position:absolute;bottom:-6px;right:28px;width:10px;height:10px;background:var(--modal-bg);border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);transform:rotate(45deg)}
@media(max-width:880px){
  #mascot{right:16px;bottom:86px}
  #mascot svg{width:56px;height:56px}
  #mascot-bubble{bottom:64px}
}

/* ============ floating menu button (mobile) ============ */
#fab{
  position:fixed;right:18px;bottom:20px;z-index:45;
  width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);
  display:none;place-items:center;font-size:21px;font-weight:700;
  box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 45%,transparent);
  transition:transform .2s, filter .2s;
}
#fab:hover{filter:brightness(1.08)}
#fab:active{transform:scale(.88)}
#fab{animation:pop .35s ease}

/* ============ responsive ============ */
@media(max-width:880px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;width:min(280px,84vw);margin-left:0;transform:translateX(-105%);box-shadow:20px 0 60px rgba(0,0,0,.35)}
  body.sb-open #sidebar{transform:none}
  #sb-backdrop{display:none;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45)}
  body.sb-open #sb-backdrop{display:block}
  #fab{display:grid}
  #view{padding:20px 16px 150px}
  .tabsrow{padding:12px 16px 0}
  /* mobile topbar: row 1 = menu, title, theme, add · row 2 = full width search */
  #topbar{gap:8px;padding:10px 12px 12px;flex-wrap:wrap}
  .tb-title{flex:1;min-width:0;font-size:15px}
  .tb-spacer{display:none}
  .searchwrap{order:10;flex:1 0 100%;width:auto;max-width:none}
  .btn.primary{padding:8px 12px;flex-shrink:0}
  .btn.primary .bt-txt{display:none}
  #menu-btn,#theme-btn{flex-shrink:0}
  .kbd-hint{display:none}
  .f-grid{grid-template-columns:1fr}
}

/* ============ reduced motion ============ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div id="bg-glow"></div>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="sb-backdrop"></div>
  <main id="main">
    <header id="topbar"></header>
    <div id="tabsrow-slot"></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="popover"></div>
<div id="toast"></div>
<button id="fab" data-act="toggle-sb" aria-label="Open menu">☰</button>
<div id="mascot" data-act="mascot" title="Orbie" role="button" aria-label="Orbie the mascot">
  <div id="mascot-bubble"></div>
  <span id="mascot-zzz">💤</span>
  <svg viewBox="0 0 120 120" width="84" height="84" aria-hidden="true">
    <defs>
      <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b87f5"/><stop offset="1" stop-color="#4f8ef7"/></linearGradient>
      <radialGradient id="mh" cx=".35" cy=".28" r=".95"><stop offset="0" stop-color="#ffffff" stop-opacity=".38"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    </defs>
    <ellipse cx="60" cy="64" rx="55" ry="17" fill="none" stroke="#e0a83c" stroke-width="7" opacity=".95" transform="rotate(-14 60 64)"/>
    <circle cx="60" cy="60" r="35" fill="url(#mg)"/>

function fmtDue(due){
  if(!due) return "";

  if(diff===-1) return "Yesterday";
  if(diff<0) return (-diff)+"d overdue";
  const d = parseDay(due);
  const opts = {weekday:"short", month:"short", day:"numeric"};
  if(d.getFullYear()!==new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
}

function streakDays(){

  while(days.has(dstr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function nextOccurrence(rep){
  if(rep==="daily") return addDays(1);
  if(rep==="weekdays"){ const d=new Date(); do{ d.setDate(d.getDate()+1); }while(d.getDay()===0||d.getDay()===6); return dstr(d); }

  return null;
}

/* ================================================================
   CLOUD SYNC (zero setup, powered by Puter.js)
   Nothing to configure. Click the sidebar sync button, sign in once
   per device, and your data saves to your own free private cloud
   storage and follows you everywhere. Data merges on first sign in
   so nothing you typed on any device gets lost.
   ================================================================ */
const KV_KEY = "orbit-state-v1";

let cloud = {on:false, user:null};
let syncStatus = "loading";  /* loading | signedout | on | off */
let pushTimer = null, pollTimer = null;

function waitForPuter(ms){
  return new Promise(res=>{
    const t0 = Date.now();
    (function chk(){
      if(window.puter && window.puter.auth && window.puter.kv) return res(true);
      if(Date.now()-t0 > ms) return res(false);
      setTimeout(chk, 300);
    })();
  });
}

async function initCloud(){
  const ok = await waitForPuter(9000);
  if(!ok){ syncStatus = "off"; renderSidebar(); return; }
  try{
    if(puter.auth.isSignedIn()){ await cloudSignedIn(); }
    else { syncStatus = "signedout"; }
  }catch(e){ syncStatus = "signedout"; }
  renderSidebar();
}

async function cloudSignedIn(){
  try{ cloud.user = await puter.auth.getUser(); }catch(e){ cloud.user = null; }
  cloud.on = true; syncStatus = "on";
  await pullCloud(true);
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>pullCloud(false), 20000);
  renderSidebar();
}

/* combine two copies of the data without losing anything and without duplicates */
function mergeStates(a, b){
  const newer = (a.updatedAt||0) >= (b.updatedAt||0) ? a : b;
  const older = newer===a ? b : a;
  const m = JSON.parse(JSON.stringify(newer));
  m.spaces = Array.isArray(m.spaces) ? m.spaces : [];
  m.tasks  = Array.isArray(m.tasks)  ? m.tasks  : [];
  m.pages  = Array.isArray(m.pages)  ? m.pages  : [];
  const spKey = s=>(s.name||"").toLowerCase().trim();
  const nSig = n=>((n.title||"")+"|"+(n.body||"")).trim().toLowerCase();
  const map = {};
  (older.spaces||[]).forEach(os=>{
    let ms = m.spaces.find(x=>x.id===os.id) || m.spaces.find(x=>spKey(x)===spKey(os));
    if(!ms){ m.spaces.push(JSON.parse(JSON.stringify(os))); map[os.id] = os.id; return; }
    map[os.id] = ms.id;
    ms.notes = Array.isArray(ms.notes) ? ms.notes : [];
    const have = new Set(ms.notes.map(nSig));
    (os.notes||[]).forEach(n=>{ if(!have.has(nSig(n))){ ms.notes.push(n); have.add(nSig(n)); } });
  });
  const sigIn = (t, spaces)=>{
    const sp = (spaces||[]).find(s=>s.id===t.spaceId);
    return (t.title||"").toLowerCase().trim()+"|"+(sp ? spKey(sp) : t.spaceId);
  };
  const haveT = new Set(m.tasks.map(t=>sigIn(t, m.spaces)));
  const idsT = new Set(m.tasks.map(t=>t.id));
  (older.tasks||[]).forEach(t=>{
    if(idsT.has(t.id)) return;
    if(haveT.has(sigIn(t, older.spaces))) return;
    const target = map[t.spaceId] || (m.spaces.some(s=>s.id===t.spaceId) ? t.spaceId : (m.spaces[0] && m.spaces[0].id));
    if(!target) return;
    const c = JSON.parse(JSON.stringify(t));
    c.spaceId = target;
    const tsp = m.spaces.find(s=>s.id===target);
    if(tsp && !tsp.stages.some(st=>st.id===c.stage)) c.stage = tsp.stages[0].id;
    m.tasks.push(c);
    haveT.add(sigIn(c, m.spaces));
  });
  const pSig = p=>((p.title||"")+"|"+(p.body||"")).trim().toLowerCase();
  const haveP = new Set(m.pages.map(pSig));
  (older.pages||[]).forEach(p=>{ if(!haveP.has(pSig(p))){ m.pages.push(p); haveP.add(pSig(p)); } });
  return m;
}

/* first sign in on an untouched device simply loads the cloud copy */
function applyRemote(remote, first){
  if(first){
    let dirty = false;
    try{ dirty = localStorage.getItem("orbit-dirty")==="1"; }catch(e){}
    if(!dirty){
      state = remote;
      showToast("Cloud data loaded ✓");
    } else {
      state = mergeStates(state, remote);
      showToast("Devices merged, no duplicates ✓");
    }
    state.updatedAt = Date.now();
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); localStorage.setItem("orbit-dirty","1"); }catch(e){}
    pushCloud(true);
    render();
    updateBadge();
    return;
  }
  if((remote.updatedAt||0) > (state.updatedAt||0)){
    state = remote;
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    const ae = document.activeElement;
    if(ae && (ae.id==="scratch-pad" || ae.tagName==="TEXTAREA" || ae.tagName==="INPUT")) ui._pendingRender = true;
    else render();
    updateBadge();
  }
}

async function pullCloud(first){
  if(!cloud.on || !window.puter) return;
  try{
    const raw = await puter.kv.get(KV_KEY);
    if(!raw){ pushCloud(true); return; }
    const remote = (typeof raw === "string") ? JSON.parse(raw) : raw;
    if(!remote || !Array.isArray(remote.spaces) || !Array.isArray(remote.tasks)){ pushCloud(true); return; }
    applyRemote(remote, first);
  }catch(e){}
}

function pushCloud(now){
  if(!cloud.on || !window.puter) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{
    try{ puter.kv.set(KV_KEY, JSON.stringify(state)); }catch(e){}
  }, now ? 50 : 600);
}

async function handleSyncClick(){

    return;
  }
  if(syncStatus==="loading"){ showToast("Still connecting, one moment…"); return; }
  if(syncStatus==="on"){
    if(confirm("Sign out of sync on this device? Your data stays here and in the cloud.")){
      try{ puter.auth.signOut(); }catch(e){}
      cloud.on = false; cloud.user = null; syncStatus = "signedout";
      if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
      renderSidebar();
    }
    return;
  }
  try{
    await puter.auth.signIn();
    await cloudSignedIn();
    showToast("✓ Sync is on. Sign in on your other devices and everything follows you.");
  }catch(e){ showToast("Sign in was closed or failed. Try again."); }
}

/* ---------------- generic drag to reorder (mouse + touch) ---------------- */
function makeSortable(list, sel, commit, grid, sameGroupOnly){
  const items = $$(sel, list);
  let dragEl = null;
  const groupOf = el=>{
    let p = el.previousElementSibling;
    while(p && !p.classList.contains("group-head")) p = p.previousElementSibling;
    return p;
  };
  const canPair = (a,b)=> !sameGroupOnly || groupOf(a)===groupOf(b);
  const placeAt = (el, t, x, y)=>{
    const r = t.getBoundingClientRect();
    let before;
    if(grid) before = (y < r.top) || (y <= r.bottom && x < r.left + r.width/2);
    else before = y < r.top + r.height/2;
    if(before) list.insertBefore(el, t);
    else list.insertBefore(el, t.nextSibling);
  };
  items.forEach(it=>{
    it.setAttribute("draggable","true");
    it.addEventListener("dragstart", e=>{
      dragEl = it; it.classList.add("drag-src");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", it.dataset.id||""); }catch(_){}
    });
    it.addEventListener("dragend", ()=>{
      if(!dragEl) return;
      dragEl.classList.remove("drag-src"); dragEl = null;
      ui._justDragged = true; setTimeout(()=>{ ui._justDragged = false; }, 150);
      commit();
    });
    it.addEventListener("dragover", e=>{
      if(!dragEl || dragEl===it || !canPair(dragEl, it)) return;
      e.preventDefault();
      placeAt(dragEl, it, e.clientX, e.clientY);
    });
    let pressT=null, lifted=false, sy=0, sx=0;
    it.addEventListener("touchstart", e=>{
      const t = e.touches[0]; if(!t) return;
      lifted = false; sy = t.clientY; sx = t.clientX;
      pressT = setTimeout(()=>{
        lifted = true; ui._lifting = true;
        it.classList.add("lifting");
        try{ if(navigator.vibrate) navigator.vibrate(12); }catch(_){}
      }, 280);
    }, {passive:true});
    it.addEventListener("touchmove", e=>{
      const t = e.touches[0]; if(!t) return;
      if(!lifted){
        if(Math.abs(t.clientY-sy)>10 || Math.abs(t.clientX-sx)>10) clearTimeout(pressT);
        return;
      }
      e.preventDefault();
      const others = $$(sel, list).filter(x=>x!==it && canPair(it,x));
      for(const o of others){
        const r = o.getBoundingClientRect();
        if(t.clientY > r.top && t.clientY < r.bottom && (!grid || (t.clientX > r.left-10 && t.clientX < r.right+10))){
          placeAt(it, o, t.clientX, t.clientY); break;
        }
      }
    }, {passive:false});
    const endT = ()=>{
      clearTimeout(pressT);
      if(lifted){
        it.classList.remove("lifting");
        ui._lifting = false;
        ui._justDragged = true; setTimeout(()=>{ ui._justDragged = false; }, 200);
        commit();
      }
      lifted = false;
    };
    it.addEventListener("touchend", endT);
    it.addEventListener("touchcancel", endT);
  });
  list.addEventListener("dragover", e=>{ if(dragEl) e.preventDefault(); });
}

function commitTaskOrderFromDom(container){
  let counter = 0, changed = false;
  Array.from(container.children).forEach(ch=>{
    if(ch.classList.contains("group-head")){ counter = 0; return; }
    if(ch.classList.contains("task") && ch.dataset.id){
      const t = state.tasks.find(x=>x.id===ch.dataset.id);
      if(t && t.order !== counter){ t.order = counter; changed = true; }
      else if(t) t.order = counter;
      counter++;
    }
  });
  if(changed){ save(); showToast("Reordered"); }
  render();
}
function commitNoteOrderFromDom(gridEl){
  let i = 0, changed = false;
  $$(".note[data-id]", gridEl).forEach(el=>{
    for(const sp of state.spaces){
      const n = (sp.notes||[]).find(x=>x.id===el.dataset.id);
      if(n){ if(n.order !== i) changed = true; n.order = i; break; }
    }
    i++;
  });
  if(changed){ save(); showToast("Reordered"); }
  render();
}

  state.spaces.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
  if(state.spaces.map(s=>s.id).join(",") !== before){ save(); showToast("Spaces reordered"); }
  render();

function bindSpaceDnD(){
  const list = $("#sidebar .sb-scroll"); if(!list) return;
  const items = $$(".nav-item[data-id]", list);
  let draggedEl = null;

  const placeAt = (el, target, clientY)=>{
    const r = target.getBoundingClientRect();
    const before = (clientY - r.top) < r.height/2;
    if(before) list.insertBefore(el, target);
    else list.insertBefore(el, target.nextSibling);
  };

  items.forEach(it=>{
    /* desktop: native drag */
    it.addEventListener("dragstart", e=>{
      draggedEl = it;
      it.classList.add("drag-src");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", it.dataset.id); }catch(_){}
    });
    it.addEventListener("dragend", ()=>{
      if(!draggedEl) return;
      draggedEl.classList.remove("drag-src");
      draggedEl = null;
      ui._justDragged = true; setTimeout(()=>{ ui._justDragged = false; }, 150);
      commitSpaceOrder();
    });
    it.addEventListener("dragover", e=>{
      if(!draggedEl || draggedEl===it) return;
      e.preventDefault();
      placeAt(draggedEl, it, e.clientY);
    });

    /* mobile: long press to lift, slide to reorder */
    let pressT = null, lifted = false, sy = 0, sx = 0;
    it.addEventListener("touchstart", e=>{
      const t = e.touches[0]; if(!t) return;
      lifted = false; sy = t.clientY; sx = t.clientX;
      pressT = setTimeout(()=>{
        lifted = true;
        ui._spaceLift = true;
        it.classList.add("lifting");
        try{ if(navigator.vibrate) navigator.vibrate(12); }catch(_){}
      }, 260);
    }, {passive:true});
    it.addEventListener("touchmove", e=>{
      const t = e.touches[0]; if(!t) return;
      if(!lifted){
        if(Math.abs(t.clientY-sy)>10 || Math.abs(t.clientX-sx)>10) clearTimeout(pressT);
        return;
      }
      e.preventDefault();
      const others = $$(".nav-item[data-id]", list).filter(x=>x!==it);
      for(const o of others){
        const r = o.getBoundingClientRect();
        if(t.clientY > r.top && t.clientY < r.bottom){ placeAt(it, o, t.clientY); break; }
      }
    }, {passive:false});
    const endTouch = ()=>{
      clearTimeout(pressT);
      if(lifted){
        it.classList.remove("lifting");
        ui._spaceLift = false;
        ui._justDragged = true; setTimeout(()=>{ ui._justDragged = false; }, 180);
        commitSpaceOrder();
      }
      lifted = false;
    };
    it.addEventListener("touchend", endTouch);
    it.addEventListener("touchcancel", endTouch);
  });
  list.addEventListener("dragover", e=>{ if(draggedEl) e.preventDefault(); });
}

function chipsHtml(t, withSpace){

function taskRow(t, withSpace, idx){
  return '<div class="task '+(t.done?"done":"")+'" style="animation-delay:'+dly(idx)+'" data-act="open-task" data-id="'+t.id+'">'+
    '<button class="check" data-act="toggle" data-id="'+t.id+'" title="'+(t.repeat?"Done for today":"Mark done")+'">'+(t.done?"✓":"")+'</button>'+
    '<div class="t-main">'+

    '</div>'+
    '<button class="icon-btn del" data-act="task-menu" data-id="'+t.id+'" title="More actions">⋯</button>'+
  '</div>';
}

function sortTasks(a,b){
  if(a.order!=null && b.order!=null && a.order!==b.order) return a.order-b.order;
  if(!!a.due!==!!b.due) return a.due?-1:1;
  if(a.due&&b.due&&a.due!==b.due) return a.due<b.due?-1:1;
  if(a.priority!==b.priority) return b.priority-a.priority;
  return a.createdAt-b.createdAt;
}
function noteSort(a,b){
  const pin = (b.pinned?1:0)-(a.pinned?1:0);
  if(pin) return pin;
  if(a.order!=null && b.order!=null && a.order!==b.order) return a.order-b.order;
  return b.createdAt-a.createdAt;
}

function isCollapsed(key, def){ return key in ui.collapsed ? ui.collapsed[key] : def; }

function groupSection(key, label, dotColor, tasks, withSpace, extras){
  if(!tasks.length) return "";
  const col = isCollapsed(key, key.endsWith(":done"));
  return '<div class="group-head '+(col?"collapsed":"")+'" data-act="collapse" data-key="'+key+'">'+
      '<span class="chev">▼</span><span class="dot" style="--gc:'+dotColor+'"></span>'+label+
      ' <span class="gcnt">'+tasks.length+'</span>'+(extras||"")+
    '</div>'+
    (col ? "" : tasks.map((t,i)=>taskRow(t, withSpace, i)).join(""));
}

      stat(dueToday.length,"Due today","var(--amber)","📆")+
      stat(overdue.length,"Overdue","var(--rose)","⏳")+
      stat(doneToday,"Done today","var(--green)","✅")+
      stat(open.length,"Open tasks","var(--cyan)","🗂")+
    '</div>';

  const dayTotal = doneToday + dueToday.length + overdue.length;
  if(dayTotal > 0){
    const pct = Math.round(doneToday / dayTotal * 100);
    h += '<div class="day-prog"><span>Today: <b>'+pct+'%</b> done</span><span class="prog-track"><i style="width:'+pct+'%"></i></span></div>';
  }

  h += '<form class="quickadd" data-form="quickadd-today" style="margin-top:10px">'+

  pinned.sort((a,b)=>noteSort(a.n, b.n));
  const notesCol = isCollapsed("today:notes", false);
  h += '<div class="group-head '+(notesCol?"collapsed":"")+'" data-act="collapse" data-key="today:notes">'+
       '<span class="chev">▼</span><span class="dot" style="--gc:var(--accent)"></span>Pinned notes <span class="gcnt">'+pinned.length+'</span>'+
       '<button class="head-link" data-act="nav-pad">Open notepad →</button></div>';
  if(!notesCol){
    h += '<div class="notes-grid dash">'+
      '<div class="note add-note" data-act="new-dash-note" role="button" tabindex="0"><span class="big">＋</span>New note</div>'+
      pinned.map((p,i)=>'<div class="note" style="--nc:'+esc(p.n.color||"#8b7cff")+';animation-delay:'+dly(i+1)+'" data-act="open-note" data-id="'+p.n.id+'" data-space="'+p.s.id+'">'+
        '<span class="pin">📌</span>'+
        '<div class="n-title">'+esc(p.n.title||"Untitled")+'</div>'+
        '<div class="n-body">'+esc(p.n.body||"")+'</div>'+
        '<div class="n-date">'+esc(p.s.icon+" "+p.s.name)+'</div>'+
      '</div>').join("")+

  }

  if(!overdue.length && !dueToday.length && !week.length){
    h += '<div class="empty"><span class="art">🪐</span><h3>'+(ui.search?"No matches":"All clear")+'</h3><p>'+

    h += groupSection("today:od","Overdue","var(--rose)",overdue,true,
      '<button class="head-link" data-act="overdue-today">Move all to today</button>');
    h += groupSection("today:dt","Due today","var(--amber)",dueToday,true);
    h += groupSection("today:wk","Next 7 days","var(--cyan)",week,true);

  h += '</div>';

  bindQuickAdd();

    const dashGrid = $("#view .notes-grid.dash");
    if(dashGrid) makeSortable(dashGrid, ".note[data-id]", ()=>commitNoteOrderFromDom(dashGrid), true, false);
  }

const REDUCE_MOTION = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)").matches : false;
function animateNums(){
  $$(".stat .num").forEach(el=>{
    const n = +el.dataset.n || 0;
    if(REDUCE_MOTION || n <= 0){ el.textContent = n; return; }
    const t0 = performance.now(), dur = 420;
    el.textContent = "0";
    (function f(t){
      const k = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3)));
      if(k < 1) requestAnimationFrame(f);
    })(t0);
  });
}

function bindScratch(){

/* ---------------- insert menu (slash commands) ---------------- */
const SNIPPETS = {
  h1: ()=>"# ",
  h2: ()=>"## ",
  bullet: ()=>"• ",
  todo: ()=>"[ ] ",
  divider: ()=>"\n──────────\n",
  date: ()=>new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+": ",
  meeting: ()=>"# Meeting notes ("+new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"})+")\nWith: \nAgenda:\n• \nDecisions:\n• \nAction items:\n[ ] \n",
  daily: ()=>"# Plan for "+new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})+"\nTop 3:\n1. \n2. \n3. \nLater:\n• \n",
  jobapp: ()=>"# Company: \nRole: \nLink: \nContact: \nStatus: Applied\nNotes:\n• \n"
};
function openInsertMenu(fromSlash){
  const ta = $("#scratch-pad"); if(!ta) return;
  const p = $("#popover");
  const item = (k,ic,lb)=>'<button data-act="pad-insert" data-k="'+k+'" data-slash="'+(fromSlash?1:0)+'"><span>'+ic+'</span>'+lb+'</button>';
  p.innerHTML =
    item("h1","#","Heading")+
    item("h2","##","Subheading")+
    item("bullet","•","Bullet")+
    item("todo","☑","Checklist line")+
    item("divider","─","Divider")+
    item("date","📆","Date stamp")+
    '<div class="sep"></div>'+
    item("meeting","🗣","Template: meeting notes")+
    item("daily","🌅","Template: daily plan")+
    item("jobapp","💼","Template: job application");
  p.style.display = "block";
  const r = ta.getBoundingClientRect();
  const pr = p.getBoundingClientRect();
  p.style.left = Math.max(8, Math.min(r.left + 26, innerWidth - pr.width - 10))+"px";
  p.style.top  = Math.max(8, Math.min(r.top + 48, innerHeight - pr.height - 10))+"px";
}
function padInsert(key, replaceSlash){
  const ta = $("#scratch-pad"); if(!ta || !SNIPPETS[key]) return;
  const snippet = SNIPPETS[key]();
  let s = ta.selectionStart || 0;
  let v = ta.value;
  if(replaceSlash && s>0 && v[s-1]==="/"){ v = v.slice(0,s-1)+v.slice(s); s -= 1; }
  ta.value = v.slice(0,s)+snippet+v.slice(s);
  ta.selectionStart = ta.selectionEnd = s + snippet.length;
  ta.focus();
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}

/* ---------------- quick add parsing ---------------- */
function parseQuick(text){
  let due = null, pri = 0, rep = null, s = text;
  s = s.replace(/\s*!(high|hi|med|medium|low)\b/ig, (m,p)=>{ pri = {high:3,hi:3,med:2,medium:2,low:1}[p.toLowerCase()]||0; return ""; });
  s = s.replace(/\s*\b(every ?day|daily)\b/ig, ()=>{ rep = "daily"; return ""; });
  s = s.replace(/\s*\bweekdays\b/ig, ()=>{ rep = "weekdays"; return ""; });
  s = s.replace(/\s*\b(every ?week|weekly)\b/ig, ()=>{ rep = "weekly"; return ""; });
  s = s.replace(/\s*\b(today|tonight)\b/ig, ()=>{ due = todayStr(); return ""; });
  s = s.replace(/\s*\b(tomorrow|tmr)\b/ig, ()=>{ due = addDays(1); return ""; });
  s = s.replace(/\s*\bnext week\b/ig, ()=>{ due = addDays(7); return ""; });
  const WD = {sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
  s = s.replace(/\s*\b(next\s+)?(sunday|saturday|thursday|wednesday|tuesday|monday|friday|thurs|tues|thur|sun|sat|thu|wed|tue|mon|fri)\b/ig, (m,nx,w)=>{
    const d = new Date();
    let delta = (WD[w.toLowerCase()] - d.getDay() + 7) % 7;
    if(delta===0) delta = 7;
    if(nx) delta += 7;
    due = addDays(delta); return "";
  });
  s = s.replace(/\s*\bin\s+(\d{1,2})\s+days?\b/ig, (m,n)=>{ due = addDays(+n); return ""; });
  const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  s = s.replace(/\s*\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/ig, (m,mo,dd)=>{
    const y = new Date().getFullYear();
    let dt = new Date(y, MO[mo.toLowerCase()], +dd);
    if(dstr(dt) < todayStr()) dt = new Date(y+1, MO[mo.toLowerCase()], +dd);
    due = dstr(dt); return "";
  });
  if(rep && !due) due = todayStr();
  return { title: s.replace(/\s+/g," ").trim(), due, priority: pri, repeat: rep };
}

function cmdFiltered(q){
  q = (q||"").toLowerCase().trim();

  return q ? a.filter(x=>x.label.toLowerCase().includes(q)) : a;
}
function renderCmdList(q){
  const rows = cmdFiltered(q);
  if(cmdSel > rows.length-1) cmdSel = Math.max(0, rows.length-1);
  $("#cmd-list").innerHTML = rows.length
    ? rows.map((a,i)=>'<button class="cmd-row'+(i===cmdSel?" sel":"")+'" data-act="cmd-run" data-ci="'+i+'"><span class="ci">'+a.icon+'</span>'+esc(a.label)+'</button>').join("")
    : '<div class="cmd-empty">No matches</div>';

function openCmd(){
  $("#modal-root").innerHTML = '<div class="overlay top"><div class="cmd">'+
    '<input id="cmd-in" placeholder="Jump to a space, create, switch theme…" autocomplete="off">'+
    '<div id="cmd-list"></div></div></div>';
  cmdSel = 0;
  renderCmdList("");
  const inp = $("#cmd-in");
  inp.focus();
  inp.addEventListener("input", ()=>{ cmdSel = 0; renderCmdList(inp.value); });
  inp.addEventListener("keydown", e=>{
    const rows = cmdFiltered(inp.value);
    if(e.key==="ArrowDown"){ e.preventDefault(); cmdSel = Math.min(cmdSel+1, rows.length-1); renderCmdList(inp.value); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); cmdSel = Math.max(cmdSel-1, 0); renderCmdList(inp.value); }
    else if(e.key==="Enter"){ e.preventDefault(); const a = rows[cmdSel]; closeModal(); if(a) a.run(); }
  });
}

function toggleTask(id, el){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  if(t.repeat && !t.done){
    const wasDue = t.due && dayDiff(t.due) <= 0;
    t.completedAt = todayStr();
    t.due = nextOccurrence(t.repeat);
    save();
    if(el){
      const r = el.getBoundingClientRect();
      confettiBurst(r.left + r.width/2, r.top + r.height/2, spaceOf(t).color);
    }
    mascotHappy();
    bumpDoneCount();
    render();
    showToast("✓ "+t.title+" done for today ↻ next: "+fmtDue(t.due));
    maybeCelebrateClear(wasDue);
    return;
  }
  t.done = !t.done;
  t.completedAt = t.done ? todayStr() : null;
  save();
  if(t.done && el){
    hapt();
    const r = el.getBoundingClientRect();
    confettiBurst(r.left + r.width/2, r.top + r.height/2, spaceOf(t).color);
    mascotHappy();
    bumpDoneCount();
    if(Math.random() < .35) mascotSay(pick(["Nice one! 🎉","Done and dusted ✨","+1 for future you","That's the stuff 💪"]), 2000);
  }
  render();
  if(t.done) maybeCelebrateClear(t.due && dayDiff(t.due) <= 0);
}

function deleteTasks(ids, msg){
  const removed = state.tasks.filter(t=>ids.includes(t.id));
  if(!removed.length) return;
  state.tasks = state.tasks.filter(t=>!ids.includes(t.id));
  undoBuf = {tasks:removed};
  save(); render();
  showToast(msg || (removed.length===1 ? "Task deleted" : removed.length+" tasks deleted"), true);
}

function applyUndo(){
  if(!undoBuf) return;
  state.tasks.push(...undoBuf.tasks);
  undoBuf = null;
  save(); render(); hideToast();
}

function submitTask(f){
  let title = f.elements["title"].value.trim(); if(!title) return;
  const id = f.dataset.id;
  const spaceId = f.elements["space"].value;
  let stage = f.elements["stage"].value;
  const nsp = getSpace(spaceId) || state.spaces[0];
  if(!nsp.stages.some(s=>s.id===stage)) stage = nsp.stages[0].id;
  let repeat = f.elements["repeat"].value || null;
  let due = f.elements["due"].value || null;
  let pri = +f.elements["priority"].value || 0;
  if(!id){
    /* natural language in the title fills anything you left empty */
    const p = parseQuick(title);
    if(p.title){
      if(!due && p.due) due = p.due;
      if(!pri && p.priority) pri = p.priority;
      if(!repeat && p.repeat) repeat = p.repeat;
      title = p.title;
    }
  }
  if(repeat && !due) due = todayStr();
  const checklist = $$("#cl-list .cl-row").map(r=>({
    id: r.dataset.cid==="new" ? uid() : r.dataset.cid,
    text: r.querySelector("input").value.trim(),
    done: r.querySelector(".check").classList.contains("on")
  })).filter(x=>x.text);
  const vals = { title, desc:f.elements["desc"].value.trim(), due,
                 priority:pri, spaceId:nsp.id, stage, repeat, checklist };
  if(id){ const t = state.tasks.find(x=>x.id===id); if(t) Object.assign(t, vals); }
  else state.tasks.push(Object.assign({id:uid(), done:false, createdAt:Date.now(), completedAt:null}, vals));
  save(); closeModal(); render();
}

/* ---------------- confetti ---------------- */
const cvs = $("#confetti-canvas"), ctx = cvs.getContext("2d");
let parts = [], rafId = null;
function sizeCanvas(){ cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener("resize", sizeCanvas); sizeCanvas();
function confettiBurst(x, y, color){
  const colors = [color||"#8b7cff", "#38d6f5", "#fbbf24", "#fb7185", "#34d399", "#ffffff"];
  for(let i=0;i<26;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*4.5;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2.5, g:.12+Math.random()*.06,
      life:46+Math.random()*22, size:3+Math.random()*4, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
      c:colors[i%colors.length]});
  }
  if(!rafId && ctx) rafId = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.rot+=p.vr; p.life--;
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life/22);
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*.62);
    ctx.restore();
  }
  if(parts.length) rafId = requestAnimationFrame(tick);
  else { rafId = null; ctx.clearRect(0,0,cvs.width,cvs.height); }
}

/* find a task by loose title match */
function findTask(q, includeDone){
  q = q.toLowerCase().trim();
  const pool = state.tasks.filter(t=>includeDone || !t.done);
  return pool.find(t=>t.title.toLowerCase()===q)
      || pool.find(t=>t.title.toLowerCase().startsWith(q))
      || pool.find(t=>t.title.toLowerCase().includes(q))
      || null;
}

/* Orbie's brain: commands first, otherwise add a task */
function orbieHandle(raw){
  const low = raw.toLowerCase().trim();
  let m;
  if((m = low.match(/^(done|complete|finish|check(?: off)?)\s+(.+)/))){
    const t = findTask(m[2]);
    if(!t) return 'I could not find an open task like "'+esc(m[2])+'" 🤔';
    toggleTask(t.id, $("#mascot"));
    return 'Checked off <b>'+esc(t.title)+'</b> ✓';
  }
  if((m = low.match(/^(delete|remove)\s+(.+)/))){
    const t = findTask(m[2], true);
    if(!t) return 'No task like "'+esc(m[2])+'" found';
    deleteTasks([t.id]);
    return 'Deleted <b>'+esc(t.title)+'</b>. Undo is in the toast.';
  }
  if((m = low.match(/^(find|search)\s+(.+)/))){
    ui.search = m[2];
    renderTopbar(); renderView();
    const n = state.tasks.filter(t=>matches(t)).length;
    return 'Filtering for <b>'+esc(m[2])+'</b>: '+n+' task'+(n===1?"":"s")+' match';
  }
  if((m = raw.match(/^note[:\s]\s*(.+)/i))){
    const sp = getSpace(defaultNotesSpaceId());
    if(!sp.notes) sp.notes = [];
    const body = m[1].trim();
    sp.notes.push({id:uid(), title: body.slice(0,34)+(body.length>34?"…":""), body: body, color: pick(NOTE_COLORS), pinned: true, createdAt: Date.now()});
    save(); render();
    return 'Pinned a note to your dashboard 📌';
  }
  if((m = low.match(/^(?:go to|open|show)\s+(.+)/))){
    const q = m[1];
    if(/notepad|pad|notes page/.test(q)){ ui.view="pad"; ui.spaceId=null; render(); return 'Notepad open 🗒'; }
    if(/today|home|dash/.test(q)){ ui.view="today"; ui.spaceId=null; render(); return 'Home sweet dashboard 🪐'; }
    const sp = state.spaces.find(s=>s.name.toLowerCase().includes(q.trim()));
    if(sp){ ui.view="space"; ui.spaceId=sp.id; ui.tab="tasks"; render(); return 'Opened '+esc(sp.icon+" "+sp.name); }
    return 'I do not know "'+esc(q)+'" yet. Try a space name, notepad, or today.';
  }
  if(/^(clear|move) overdue/.test(low)){
    const n = moveOverdueToToday(null);
    return n ? 'Moved '+n+' overdue to today ✅' : 'No overdue tasks 🎉';
  }
  if(/^(help|what can you do|\?)$/.test(low)){
    return 'I understand things like:<br>• <b>gym tomorrow !med in Personal</b><br>• <b>done clinic</b> · <b>delete old task</b><br>• <b>note: brilliant idea</b><br>• <b>find resume</b> · <b>go to work</b><br>• <b>clear overdue</b>';
  }
  const out = orbieAddTask(raw);
  if(!out) return 'Tell me a bit more 🙂 (or type <b>help</b>)';
  const bits = [];
  if(out.p.due) bits.push(fmtDue(out.p.due));
  if(out.p.repeat) bits.push(REPEAT_NAMES[out.p.repeat]);
  if(out.p.priority) bits.push(PRI_NAMES[out.p.priority]);
  return 'Added <b>'+esc(out.p.title)+'</b>'+(bits.length? " · "+bits.join(" · "):"")+' → '+esc(out.sp.icon+" "+out.sp.name)+' ✓';
}

function orbieAddTask(raw){
  let text = raw, target = null;
  for(const s of state.spaces){
    const re = new RegExp("\\s*\\b(?:in|to|@)\\s+"+reEsc(s.name)+"\\b","i");
    if(re.test(text)){ target = s; text = text.replace(re,""); break; }
  }
  const p = parseQuick(text);
  if(!p.title) return null;
  const sp = target || (ui.view==="space" && getSpace(ui.spaceId)) || getSpace(defaultNotesSpaceId()) || state.spaces[0];
  state.tasks.push({id:uid(), spaceId:sp.id, title:p.title, desc:"", due:p.due, priority:p.priority,
    repeat:p.repeat, stage:sp.stages[0].id, done:false, createdAt:Date.now(), completedAt:null, checklist:[]});
  save(); render();
  return {p:p, sp:sp};
}

function initMascot(){
  applyMascot();
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!reduce){
    let eyeRaf = null;
    document.addEventListener("mousemove", e=>{
      if(!mascotOn || eyeRaf) return;
      eyeRaf = requestAnimationFrame(()=>{
        eyeRaf = null;
        const m = $("#mascot"); if(!m || m.style.display==="none") return;
        const r = m.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const a = Math.atan2(e.clientY - cy, e.clientX - cx);
        const d = Math.min(3.4, Math.hypot(e.clientX - cx, e.clientY - cy) / 40);
        const tr = "translate("+(Math.cos(a)*d).toFixed(1)+"px,"+(Math.sin(a)*d).toFixed(1)+"px)";
        $$(".m-pupil").forEach(p=>p.style.transform = tr);
      });
    }, {passive:true});
    /* on phones the eyes follow your taps */
    document.addEventListener("touchstart", e=>{
      if(!mascotOn) return;
      const t = e.touches && e.touches[0]; if(!t) return;
      const m = $("#mascot"); if(!m || m.style.display==="none") return;
      const r = m.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const a = Math.atan2(t.clientY - cy, t.clientX - cx);
      const d = Math.min(3.4, Math.hypot(t.clientX - cx, t.clientY - cy) / 40);
      const tr = "translate("+(Math.cos(a)*d).toFixed(1)+"px,"+(Math.sin(a)*d).toFixed(1)+"px)";
      $$(".m-pupil").forEach(p=>p.style.transform = tr);
    }, {passive:true});
  }
  (function blinkLoop(){
    setTimeout(()=>{
      const eyes = $("#m-eyes");
      if(eyes && mascotOn){ eyes.classList.add("blink"); setTimeout(()=>eyes.classList.remove("blink"), 160); }
      blinkLoop();
    }, 2200 + Math.random()*3800);
  })();
  document.addEventListener("mousemove", mascotIdleReset, {passive:true});
  document.addEventListener("keydown", mascotIdleReset);
  document.addEventListener("touchstart", mascotIdleReset, {passive:true});
  mascotIdleReset();
  try{
    if(!sessionStorage.getItem("orbit-hi")){
      sessionStorage.setItem("orbit-hi","1");
      setTimeout(()=>mascotSay("Hi "+state.userName+"! Click me and tell me a task 🪐", 3400), 1200);
    }
  }catch(e){}
}

/* ---------------- daily reminder notifications ---------------- */
const NOTIF_KEY = "orbit-notif";
async function toggleNotif(){
  try{
    if(typeof Notification === "undefined"){ showToast("Notifications are not supported here"); return; }
    if(localStorage.getItem(NOTIF_KEY)==="on"){ localStorage.setItem(NOTIF_KEY,"off"); showToast("Daily reminders off"); return; }
    const p = await Notification.requestPermission();
    if(p==="granted"){ localStorage.setItem(NOTIF_KEY,"on"); showToast("Daily reminders on ✓"); maybeNotify(true); }
    else showToast("Permission was not granted");
  }catch(e){}
}
function maybeNotify(force){
  try{
    if(typeof Notification === "undefined") return;
    if(localStorage.getItem(NOTIF_KEY)!=="on" || Notification.permission!=="granted") return;
    if(!force && localStorage.getItem("orbit-notif-day")===todayStr()) return;
    const open = state.tasks.filter(t=>!t.done);
    const due = open.filter(t=>t.due && dayDiff(t.due)===0).length;
    const od  = open.filter(t=>t.due && dayDiff(t.due)<0).length;
    if(due || od){
      new Notification("Orbit", {body: due+" due today"+(od ? ", "+od+" overdue" : "")+". You got this 💪", icon:"icon.svg"});
      localStorage.setItem("orbit-notif-day", todayStr());
    }
  }catch(e){}
}

    if(raw && raw.trim()){
      const out = orbieAddTask(raw.trim());
      if(out){ showToast("✓ Added from link: "+out.p.title); mascotHappy(); }
      history.replaceState(null, "", location.pathname);
    }
  }catch(e){}
})();

/* gentle one time install tip on phones */
(function installNudge(){
  try{
    if(!isMobile()) return;
    if(window.matchMedia && matchMedia("(display-mode: standalone)").matches) return;
    if(localStorage.getItem("orbit-nudged")) return;
    const v = (+localStorage.getItem("orbit-visits")||0)+1;
    localStorage.setItem("orbit-visits", String(v));
    if(v >= 2){
      localStorage.setItem("orbit-nudged","1");
      setTimeout(()=>showToast(IS_APPLE ? "Tip: Share → Add to Home Screen installs Orbit as an app" : "Tip: browser menu → Install app puts Orbit on your home screen"), 2500);
    }
  }catch(e){}
})();
</script>
