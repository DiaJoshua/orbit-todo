/* ================================================================
   FOCUS TIMER · 25 minute sessions on any task.
   The pill floats above everything, survives reloads, and completed
   minutes are written into state.focus so they sync to your cloud
   and show up on every device's dashboard.
   ================================================================ */
const FOCUS_LEN = 25*60000;
const FOCUS_SS = "orbit-focus-session";
let fsess = null;
try{ fsess = JSON.parse(localStorage.getItem(FOCUS_SS)||"null"); }catch(e){}
function fsSave(){ try{ fsess ? localStorage.setItem(FOCUS_SS, JSON.stringify(fsess)) : localStorage.removeItem(FOCUS_SS); }catch(e){} }
const fsRemain = ()=> fsess ? (fsess.remain!=null ? fsess.remain : Math.max(0, fsess.end - Date.now())) : 0;
const fmtMin = m=> m>=60 ? Math.floor(m/60)+"h"+(m%60 ? " "+(m%60)+"m" : "") : m+"m";
function focusToday(){ return Math.round(+((state.focus||{})[todayStr()])||0); }

function startFocus(taskId){
  const t = taskId ? state.tasks.find(x=>x.id===taskId) : null;
  const flen = ((state.prefs && +state.prefs.focusLen) || 25) * 60000;
  fsess = { taskId: t?t.id:null, title: t?t.title:"Deep focus", end: Date.now()+flen, remain:null, total:flen };
  fsSave(); renderFocusPill();
  document.body.classList.add("focus-on");
  hapt();
  playSound("focus-start");
  mascotSay("Focus time. I'll keep quiet 🤫", 2200);
}
function pauseFocus(){
  if(!fsess) return;
  if(fsess.remain!=null){ fsess.end = Date.now()+fsess.remain; fsess.remain = null; }
  else fsess.remain = Math.max(0, fsess.end - Date.now());
  fsSave(); renderFocusPill();
  playSound(fsess.remain!=null ? "pause" : "resume");
}
function logFocus(mins){
  if(mins<1) return;
  if(!state.focus || typeof state.focus !== "object") state.focus = {};
  state.focus[todayStr()] = (+state.focus[todayStr()]||0) + mins;
  save();
}
function stopFocus(finished){
  if(!fsess) return;
  const total = fsess.total;
  const spent = Math.round((total - fsRemain())/60000);
  fsess = null; fsSave();
  document.body.classList.remove("focus-on");
  document.title = "Orbit: Tasks & Notes";
  if(finished){
    logFocus(Math.round(total/60000));
    playSound("focus");
    confettiBurst(innerWidth/2, innerHeight-110, "#8f7be8");
    mascotHappy();
    showToast("🎯 25 focused minutes done · "+fmtMin(focusToday())+" today");
    render();
  } else if(spent>=1){
    playSound("close");
    logFocus(spent);
    showToast("Focus ended · "+spent+" min counted");
    render();
  }
}
function renderFocusPill(){
  const el = $("#focus-pill"); if(!el) return;
  if(!fsess){ el.innerHTML = ""; return; }
  const paused = fsess.remain!=null;
  el.classList.toggle("paused", paused);
  const C = (2*Math.PI*13).toFixed(1);
  el.innerHTML =
    '<svg class="fring" viewBox="0 0 30 30" aria-hidden="true"><circle class="bgc" cx="15" cy="15" r="13"/>'+
    '<circle class="fgc" id="f-ring" cx="15" cy="15" r="13" stroke-dasharray="'+C+'" stroke-dashoffset="0"/></svg>'+
    '<div><div class="ft" id="f-time">25:00</div><div class="fl">'+esc(fsess.title)+'</div></div>'+
    '<button class="icon-btn" data-act="focus-pause" title="'+(paused?"Resume":"Pause")+'">'+(paused?"▶":"⏸")+'</button>'+
    '<button class="icon-btn" data-act="focus-stop" title="End focus">✕</button>';
  updateFocusPill();
}
function updateFocusPill(){
  if(!fsess) return;
  const rem = fsRemain();
  const sec = Math.ceil(rem/1000);
  const clock = Math.floor(sec/60)+":"+pad(sec%60);
  const tEl = $("#f-time"), rEl = $("#f-ring");
  if(tEl) tEl.textContent = clock;
  if(rEl) rEl.style.strokeDashoffset = (2*Math.PI*13 * (rem/fsess.total)).toFixed(1);
  /* live countdown in the tab title, like a Live Activity */
  document.title = "("+clock+") Orbit";
}
setInterval(()=>{
  if(!fsess) return;
  if(fsess.remain==null && fsRemain()<=0){ stopFocus(true); return; }
  updateFocusPill();
}, 1000);

/* ---------------- event delegation ---------------- */
document.addEventListener("click", e=>{
  if(e.target && e.target.closest && e.target.closest("a[href]")) return; /* links just open */
  if(e.target && e.target.id==="brief"){ closeBriefing(); return; }
  if(orbieChatOpen && !e.target.closest("#mascot") && !e.target.closest("#orbie-panel")) closeOrbieChat();
  if(!e.target.closest("#popover") && !e.target.closest('[data-act="task-menu"]')) closePopover();
  if(e.target.classList && e.target.classList.contains("overlay")){ closeModal(); return; }
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const fromPopover = !!el.closest("#popover");
  const act = el.dataset.act;
  if(fromPopover) closePopover();
  /* interaction sounds, centralized: navigation ticks + control clicks */
  if(act.indexOf("nav-")===0 || act==="tab" || act==="stat-go") playSound("nav");
  else if(["collapse","ftog","ttog","den-tog","motion-tog","glass-mode","app-accent","app-theme","set-start","set-flen","set-goal","set-svol","set-style","app-mascot","seg-pri","pick-space","pick-stage","pick-rep","pick-emoji","swatch","due-quick","cl-toggle","stage-color","space-tpl","app-pin","work-setup","work-pick","work-pick-go","open-page-go","work-notes","work-board","work-space"].indexOf(act) > -1) playSound("switch");
  switch(act){
    case "nav-today": ui.view="today"; ui.spaceId=null; ui.search=""; closeSb(); render(); break;
    case "nav-pad": ui.view="pad"; ui.spaceId=null; ui.search=""; closeSb(); render(); break;
    case "nav-space": if(ui._justDragged) break; ui.view="space"; ui.spaceId=el.dataset.id; ui.tab="tasks"; ui.search=""; closeSb(); render(); break;
    case "tab": ui.tab = el.dataset.tab; renderTabs(); renderView(); break;
    case "toggle": toggleTask(el.dataset.id, el); break;
    case "open-task": if(ui._justDragged) break; openTaskModal(el.dataset.id); break;
    case "del-task": deleteTasks([el.dataset.id]); break;
    case "modal-del-task": closeModal(); deleteTasks([el.dataset.id]); break;
    case "new-task": openTaskModal(null); break;
    case "col-add": openTaskModal(null, ui.spaceId, el.dataset.stage); break;
    case "new-space": openSpaceModal(null); break;
    case "edit-space": openSpaceModal(ui.spaceId); break;
    case "del-space": {
      const s = getSpace(el.dataset.id); if(!s) break;
      const n = state.tasks.filter(t=>t.spaceId===s.id).length;
      if(confirm('Delete "'+s.name+'" with '+n+' task(s) and '+(s.notes||[]).length+' note(s)? You can undo from the toast for a few seconds.')){
        const removedTasks = state.tasks.filter(t=>t.spaceId===s.id);
        state.spaces = state.spaces.filter(x=>x.id!==s.id);
        state.tasks = state.tasks.filter(t=>t.spaceId!==s.id);
        if(ui.spaceId===s.id){ ui.view="today"; ui.spaceId=null; }
        undoBuf = {type:"space", space:s, tasks:removedTasks};
        playSound("delete");
        save(); closeModal(); render(); showToast("Space deleted", true);
      }
      break;
    }
    case "new-note": openNoteModal(ui.spaceId, null); break;
    case "new-dash-note": openNoteModal(defaultNotesSpaceId(), null, true); break;
    case "open-note": if(ui._justDragged) break; openNoteModal(el.dataset.space || ui.spaceId, el.dataset.id); break;
    case "del-note": {
      const sp = getSpace(el.dataset.space);
      const note = sp && sp.notes ? sp.notes.find(n=>n.id===el.dataset.id) : null;
      if(sp && sp.notes) sp.notes = sp.notes.filter(n=>n.id!==el.dataset.id);
      if(note) undoBuf = {type:"note", spaceId:sp.id, note:note};
      playSound("delete");
      save(); closeModal(); render(); showToast("Note deleted", !!note);
      break;
    }
    case "close-modal": closeModal(); break;
    case "collapse": {
      const key = el.dataset.key;
      const closed = !isCollapsed(key, key.endsWith(":done"));
      ui.collapsed[key] = closed;
      el.classList.toggle("collapsed", closed);
      const body = el.nextElementSibling;
      if(body && body.classList.contains("group-body")) body.classList.toggle("closed", closed);
      else renderView();
      break;
    }
    case "clear-done": {
      const ids = state.tasks.filter(t=>t.spaceId===el.dataset.id && t.done).map(t=>t.id);
      deleteTasks(ids, "Completed tasks cleared");
      break;
    }
    case "seg-pri": {
      $$("button", el.parentElement).forEach(b=>b.classList.toggle("active", b===el));
      const form = el.closest("form");
      if(form) form.elements["priority"].value = el.dataset.v;
      break;
    }
    case "swatch": {
      $$(".swatch", el.parentElement).forEach(b=>b.classList.toggle("active", b===el));
      const form = el.closest("form");
      if(form){
        form.elements["color"].value = el.dataset.c;
        if(form.dataset.form==="space") updateSpacePreview(form);
      }
      break;
    }
    case "stage-add": {
      const list = $("#stage-list");
      if(list){
        list.insertAdjacentHTML("beforeend", stageRowHtml("new","",""));
        bindStageDnD();
        const inp = list.lastElementChild.querySelector("input");
        if(inp) inp.focus();
      }
      break;
    }
    case "stage-del": { const row = el.closest(".stage-row"); if(row) row.remove(); break; }
    case "cmdk": openCmd(); break;
    case "cmd-run": {
      const q = ($("#cmd-in")||{}).value || "";
      const a = cmdFiltered(q)[+el.dataset.ci];
      closeModal(); if(a) a.run();
      break;
    }
    case "due-quick": {
      const form = el.closest("form"); if(!form) break;
      const d = el.dataset.d;
      if(d==="clear") form.elements["due"].value = "";
      else if(d==="wknd"){
        let delta = (6 - new Date().getDay() + 7) % 7;
        if(delta===0) delta = 7;
        form.elements["due"].value = addDays(delta);
      }
      else form.elements["due"].value = addDays(+d);
      break;
    }
    case "cl-add": {
      const list = $("#cl-list");
      if(list){
        list.insertAdjacentHTML("beforeend",
          '<div class="cl-row" data-cid="new"><button type="button" class="check" data-act="cl-toggle"></button>'+
          '<input value="" placeholder="Checklist item"><button type="button" class="rm" data-act="cl-del" title="Remove">✕</button></div>');
        const inp = list.lastElementChild.querySelector("input");
        if(inp) inp.focus();
        updateClCount();
      }
      break;
    }
    case "cl-del": { const row = el.closest(".cl-row"); if(row) row.remove(); updateClCount(); break; }
    case "cl-toggle": {
      el.classList.toggle("on");
      el.textContent = el.classList.contains("on") ? "✓" : "";
      updateClCount();
      break;
    }
    case "dup-task": {
      const t = state.tasks.find(x=>x.id===el.dataset.id); if(!t) break;
      const c = JSON.parse(JSON.stringify(t));
      c.id = uid(); c.title = t.title+" (copy)"; c.done = false; c.completedAt = null; c.createdAt = Date.now();
      if(c.checklist) c.checklist = c.checklist.map(i=>({id:uid(), text:i.text, done:false}));
      state.tasks.push(c);
      ui._justAdded = c.id;
      save(); closeModal(); render(); showToast("Task duplicated");
      break;
    }
    case "overdue-today": moveOverdueToToday(el.dataset.id || null); break;
    case "stage-next": {
      const t = state.tasks.find(x=>x.id===el.dataset.id); if(!t) break;
      const sp = spaceOf(t);
      const idx = sp.stages.findIndex(s=>s.id===t.stage);
      if(idx > -1 && idx < sp.stages.length-1){
        t.stage = sp.stages[idx+1].id;
        ui._justMoved = t.id;
        playSound("move");
        save(); render(); showToast("Moved to "+sp.stages[idx+1].name);
      }
      break;
    }
    case "pad-download": padDownload(); break;
    case "insert-menu": openInsertMenu(false); break;
    case "pad-insert": padInsert(el.dataset.k, el.dataset.slash==="1"); break;
    case "open-page": ui.pageId = el.dataset.id; renderView(); break;
    case "new-page": {
      const nm = prompt("Name the new page:", "Untitled");
      if(nm===null) break;
      const icons = "📝 📒 📌 🧠 💡 🗺 📚 🧾 ✍️".split(" ");
      const p = {id:uid(), title:(nm.trim()||"Untitled").slice(0,40), icon:pick(icons), body:"", createdAt:Date.now(), updatedAt:Date.now()};
      state.pages.push(p);
      ui.pageId = p.id;
      save(); renderView();
      break;
    }
    case "rename-page": {
      const pg = activePage();
      const nm = prompt("Rename this page:", pg.title);
      if(nm && nm.trim()){ pg.title = nm.trim().slice(0,40); save(); renderView(); }
      break;
    }
    case "del-page": {
      if(state.pages.length<=1) break;
      const pg = activePage();
      if(confirm('Delete page "'+pg.title+'" and its contents?')){
        state.pages = state.pages.filter(p=>p.id!==pg.id);
        ui.pageId = state.pages[0].id;
        save(); renderView(); showToast("Page deleted");
      }
      break;
    }
    case "sel-task": {
      const ta = $("#scratch-pad");
      const sel = ta ? ta.value.substring(ta.selectionStart, ta.selectionEnd).trim() : "";
      if(!sel){ showToast("Highlight some text in the pad first"); break; }
      const out = orbieAddTask(sel.split("\n")[0].slice(0,120));
      if(out){ mascotHappy(); showToast('✓ Task added: '+out.p.title); }
      break;
    }
    case "task-menu": {
      const r = el.getBoundingClientRect();
      openTaskMenu(el.dataset.id, r.right - 185, r.bottom + 6);
      break;
    }
    case "menu-due": {
      const t = state.tasks.find(x=>x.id===el.dataset.id); if(!t) break;
      t.due = addDays(+el.dataset.d);
      hapt();
      save(); render(); showToast("Due "+fmtDue(t.due));
      break;
    }
    case "share-task": {
      const t = state.tasks.find(x=>x.id===el.dataset.id); if(!t) break;
      shareText(t.title+(t.due?" (due "+fmtDue(t.due)+")":"")+(t.desc?"\n"+t.desc:""));
      break;
    }
    case "cal-task": {
      const t = state.tasks.find(x=>x.id===el.dataset.id); if(!t) break;
      try{
        const blob = new Blob([taskICS(t)], {type:"text/calendar"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = t.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40)+".ics";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
        showToast("Calendar file ready. Open it to add the event 🗓");
      }catch(e){ showToast("Could not create the calendar file"); }
      break;
    }
    case "share-page": {
      const pg = activePage();
      shareText(pg.title+"\n\n"+(pg.body||""));
      break;
    }
    case "export": doExport(); break;
    case "import": $("#import-file").click(); break;
    case "undo": applyUndo(); break;
    case "sync": handleSyncClick(); break;
    case "toggle-sound": toggleSound(); break;
    case "toggle-theme": { const tb = el.getBoundingClientRect(); toggleTheme(tb.left + tb.width/2, tb.top + tb.height/2); break; }
    case "focus-task": startFocus(el.dataset.id); break;
    case "focus-pause": pauseFocus(); break;
    case "focus-stop": stopFocus(false); break;
    case "nav-week": ui.view="week"; ui.spaceId=null; ui.search=""; closeSb(); render(); break;
    case "nav-habits": ui.view="habits"; ui.spaceId=null; ui.search=""; closeSb(); render(); break;
    case "week-add": openTaskModal(null, null, null, el.dataset.day || null); break;
    case "new-habit": openHabitModal(null); break;
    case "open-habit": if(ui._justDragged) break; openHabitModal(el.dataset.id); break;
    case "del-habit": {
      const hb = (state.habits||[]).find(x=>x.id===el.dataset.id); if(!hb) break;
      state.habits = state.habits.filter(x=>x.id!==hb.id);
      undoBuf = {type:"habit", habit:hb};
      playSound("delete");
      save(); closeModal(); render(); showToast("Habit deleted", true);
      break;
    }
    case "habit-day": {
      const hb = (state.habits||[]).find(x=>x.id===el.dataset.id); if(!hb) break;
      const day = el.dataset.day;
      if(!hb.days) hb.days = {};
      if(hb.days[day]){ delete hb.days[day]; playSound("undone"); }
      else {
        hb.days[day] = true;
        hapt();
        playSound("pop");
        const r = el.getBoundingClientRect();
        confettiBurst(r.left + r.width/2, r.top + r.height/2, hb.color||"#30a46c");
        if(day===todayStr() && state.habits.every(x=>x.days && x.days[todayStr()])){
          playSound("allhabits");
          mascotHappy(); mascotSay("All habits done today! 🌟", 3000);
        }
      }
      save(); render();
      break;
    }
    case "voice": startVoice(el); break;
    case "stat-go": {
      const k = el.dataset.k;
      if(k==="dt") scrollGroup("today:dt");
      else if(k==="od") scrollGroup("today:od");
      else if(k==="done") openDoneToday();
      else if(k==="open"){ ui.view = "week"; ui.spaceId = null; ui.search = ""; render(); }
      break;
    }
    case "ea-tomorrow": openTaskModal(null, null, null, addDays(1)); break;
    case "ea-paste": openPasteImport(); break;
    case "ea-orbie": openOrbiePanel(); break;
    case "galaxy-open": openGalaxy(); break;
    case "galaxy-close": closeGalaxy(); break;
    case "galaxy-share": copyOut(galaxyShareText(), "✨ Your week, copied — go show off"); break;
    case "brief-close": closeBriefing(); playSound("close"); break;
    case "brief-first": closeBriefing(); openOrbiePanel(); orbieProcess("what should I do first"); break;
    case "brief-focus": closeBriefing(); if(!fsess) startFocus(null); break;
    case "guide-open": openGuide(); break;
    case "guide-close": closeGuide(); break;
    case "nav-work": ui.view="work"; ui.spaceId=null; ui.search=""; closeSb(); render(); break;
    case "work-setup": closeModal(); buildWorkHQ(); break;
    case "work-pick": openWorkPick(); break;
    case "work-pick-go": {
      state.prefs.workSpace = el.dataset.id;
      save(); closeModal();
      ui.view = "work"; ui.spaceId = null; render();
      showToast("🏢 Work page now points at "+esc((getSpace(el.dataset.id)||{}).name||"that space"));
      break;
    }
    case "open-page-go": ui.view="pad"; ui.pageId=el.dataset.id; ui.spaceId=null; render(); break;
    case "work-notes": { const w5 = getSpace(state.prefs.workSpace); if(w5){ ui.view="space"; ui.spaceId=w5.id; ui.tab="notes"; render(); } break; }
    case "work-board": { const w6 = getSpace(state.prefs.workSpace); if(w6){ ui.view="space"; ui.spaceId=w6.id; ui.tab="board"; render(); } break; }
    case "work-space": { const w7 = getSpace(state.prefs.workSpace); if(w7){ ui.view="space"; ui.spaceId=w7.id; ui.tab="tasks"; render(); } break; }
    case "wk-clock": workClockToggle(); break;
    case "wk-standup": { const w8 = getSpace(state.prefs.workSpace); if(w8) copyOut(standupText(w8), "🗣 Standup copied — paste into chat"); break; }
    case "wk-eod": { const w9 = getSpace(state.prefs.workSpace); if(w9) copyOut(eodText(w9), "🌇 Wrap-up copied"); break; }
    case "wk-sheet": copyOut(timesheetText(), "⏱ Week copied for your timesheet"); break;
    case "wk-meet": {
      const wA = getSpace(state.prefs.workSpace); if(!wA) break;
      wA.notes = wA.notes || [];
      const nn = {id:uid(), title:"Meeting — "+new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}),
        body:"With:\nAgenda:\n• \nDecisions:\n• \nAction items:\n[ ] who — what — by when\n", color:"#3e8ef7", pinned:false, createdAt:Date.now()};
      wA.notes.push(nn);
      ui._justAdded = nn.id;
      playSound("add");
      save(); render();
      openNoteModal(wA.id, nn.id);
      break;
    }
    case "orbie-close": closeOrbieChat(); break;
    case "orbie-clear": {
      orbieLog = []; orbiePending = null; orbieSaveLog();
      orbieLog.push({r:"b", t:"Fresh page 📄 What are we doing?"});
      renderOrbieThread(); renderOrbieChips();
      break;
    }
    case "ob-chip": {
      const v2 = el.dataset.v;
      if(v2==="__add"){
        orbiePending = "add";
        orbieReply("What should I remember? Dates and priorities in plain words work — <b>pay rent fri !high</b> 📝");
        const i2 = document.querySelector('#orbie-panel input[name="oi"]'); if(i2) i2.focus();
      } else orbieProcess(v2);
      break;
    }
    case "ob-due": {
      const t = state.tasks.find(x=>x.id===el.dataset.id);
      stripObActs();
      if(t){
        const dv = el.dataset.d;
        if(dv==="wknd"){ let delta = (6 - new Date().getDay() + 7) % 7; if(delta===0) delta = 7; t.due = addDays(delta); }
        else t.due = addDays(+dv);
        save(); render();
        orbieReply('📅 <b>'+esc(t.title)+'</b> → '+fmtDue(t.due));
      } else renderOrbieThread();
      break;
    }
    case "ob-focus": {
      stripObActs();
      startFocus(el.dataset.id);
      orbieReply("🎯 On it — timer running. I will stay quiet.");
      break;
    }
    case "ob-done": {
      stripObActs();
      toggleTask(el.dataset.id, el);
      orbieReply("✓ Done and dusted!");
      break;
    }
    case "gcal-task": { const t = state.tasks.find(x=>x.id===el.dataset.id); if(t) window.open(gcalUrl(t), "_blank"); break; }
    case "outlook-task": { const t = state.tasks.find(x=>x.id===el.dataset.id); if(t) window.open(outlookUrl(t), "_blank"); break; }
    case "paste-go": {
      const box = $("#paste-box"); if(!box) break;
      const lines = box.value.split("\n").map(x=>x.replace(/^[\s\-•*·]+/,"").replace(/^\[[ xX]?\]\s*/,"").trim()).filter(Boolean).slice(0,100);
      let n = 0;
      lines.forEach(l=>{ if(orbieAddTask(l)) n++; });
      playSound(n ? "add" : "error");
      closeModal();
      showToast(n ? "✓ Added "+n+" task"+(n>1?"s":"") : "Nothing to add");
      break;
    }
    case "nav-app": {
      if(pinnedApp===el.dataset.id){ pinnedApp = null; try{ localStorage.removeItem("orbit-app-pin"); }catch(e){} }
      ui.view = "ext"; ui.appId = el.dataset.id; ui.search = "";
      closeSb(); render();
      break;
    }
    case "new-app": openAppModal(null); break;
    case "app-edit": openAppModal(currentAppId()); break;
    case "app-open": { const a = getApp(currentAppId()); if(a) window.open(a.url, "_blank"); break; }
    case "app-reload": { const f = extFrames[currentAppId()]; if(f){ f.src = f.src; showToast("App reloaded"); } break; }
    case "app-pin": {
      if(pinnedApp){
        ui.appId = pinnedApp; ui.view = "ext";
        pinnedApp = null;
        try{ localStorage.removeItem("orbit-app-pin"); }catch(e){}
      } else {
        if((innerWidth||0) < 1100){ showToast("Pinning needs a wider window — keeping full view"); break; }
        pinnedApp = currentAppId();
        try{ localStorage.setItem("orbit-app-pin", pinnedApp); }catch(e){}
        if(ui.view==="ext") ui.view = "today";
        showToast("◫ Pinned — Orbit and the app, side by side");
      }
      render();
      break;
    }
    case "app-close": {
      if(pinnedApp){ pinnedApp = null; try{ localStorage.removeItem("orbit-app-pin"); }catch(e){} }
      else if(ui.view==="ext"){ ui.view = "today"; }
      render();
      break;
    }
    case "del-app": {
      const a = getApp(el.dataset.id); if(!a) break;
      state.apps = state.apps.filter(x=>x.id!==a.id);
      if(extFrames[a.id]){ try{ extFrames[a.id].remove(); }catch(e){} delete extFrames[a.id]; }
      if(pinnedApp===a.id){ pinnedApp = null; try{ localStorage.removeItem("orbit-app-pin"); }catch(e){} }
      if(ui.view==="ext" && ui.appId===a.id){ ui.view = "today"; ui.appId = null; }
      undoBuf = {type:"app", app:a};
      playSound("delete");
      save(); closeModal(); render(); showToast("App removed", true);
      break;
    }
    case "pick-space": {
      const form = el.closest("form"); if(!form) break;
      const nsp = getSpace(el.dataset.id); if(!nsp) break;
      form.elements["space"].value = nsp.id;
      $$("#space-picks .pick", form).forEach(b=>b.classList.toggle("on", b===el));
      const sPk = $("#stage-picks", form);
      if(sPk){ sPk.innerHTML = taskStagePicks(nsp, nsp.stages[0].id); form.elements["stage"].value = nsp.stages[0].id; }
      break;
    }
    case "pick-stage": {
      const form = el.closest("form"); if(!form) break;
      form.elements["stage"].value = el.dataset.id;
      $$("#stage-picks .pick", form).forEach(b=>b.classList.toggle("on", b===el));
      break;
    }
    case "pick-rep": {
      const form = el.closest("form"); if(!form) break;
      form.elements["repeat"].value = el.dataset.v;
      $$('.pick[data-act="pick-rep"]', form).forEach(b=>b.classList.toggle("on", b===el));
      break;
    }
    case "pick-emoji": {
      const form = el.closest("form"); if(!form) break;
      if(form.elements["icon"]) form.elements["icon"].value = el.dataset.e;
      $$("#emoji-grid button", form).forEach(b=>b.classList.toggle("on", b===el));
      updateSpacePreview(form);
      break;
    }
    case "stage-color": {
      const row = el.closest(".stage-row"); if(!row) break;
      const cur = row.dataset.color || "";
      const nxt = STAGE_DOTS[(STAGE_DOTS.indexOf(cur) + 1) % STAGE_DOTS.length];
      row.dataset.color = nxt;
      if(nxt) el.style.setProperty("--sgc", nxt);
      else el.style.removeProperty("--sgc");
      hapt(4);
      break;
    }
    case "space-tpl": {
      const form = el.closest("form"); if(!form) break;
      const tpl = SPACE_TPLS.find(x=>x.k===el.dataset.k); if(!tpl) break;
      form.elements["icon"].value = tpl.icon;
      form.elements["color"].value = tpl.color;
      if(!form.elements["name"].value.trim()) form.elements["name"].value = tpl.n;
      form.dataset.kit = tpl.k;
      $$(".tpl-row .pick", form).forEach(b=>b.classList.toggle("on", b===el));
      $$(".swatches .swatch", form).forEach(b=>b.classList.toggle("active", b.dataset.c===tpl.color));
      $$("#emoji-grid button", form).forEach(b=>b.classList.toggle("on", b.dataset.e===tpl.icon));
      const sl = $("#stage-list", form);
      if(sl){ sl.innerHTML = tpl.stages.map(nm=>stageRowHtml("new", nm, "")).join(""); bindStageDnD(); }
      updateSpacePreview(form);
      break;
    }
    case "appearance": openAppearance(); break;
    case "app-theme": {
      const v = el.dataset.v;
      $$(".pick", el.parentElement).forEach(b=>b.classList.toggle("on", b===el));
      if(v==="auto"){
        state.prefs.theme = "auto";
        const r = sysDark() ? "dark" : "light";
        if(r!==theme) setThemeResolved(r, true);
        save();
      } else if(v!==theme){
        const tr = el.getBoundingClientRect();
        toggleTheme(tr.left + tr.width/2, tr.top + tr.height/2);
      } else {
        state.prefs.theme = v; save();
      }
      break;
    }
    case "app-accent": {
      state.prefs.accent = el.dataset.c || null;
      $$(".swatch", el.parentElement).forEach(b=>b.classList.toggle("active", b===el));
      applyLook(); save();
      break;
    }
    case "app-glass": {
      state.prefs.glass = state.prefs.glass==="off" ? "on" : "off";
      el.classList.toggle("on", state.prefs.glass!=="off");
      el.setAttribute("aria-checked", state.prefs.glass!=="off");
      applyLook(); save();
      break;
    }
    case "app-mascot": {
      mascotOn = !mascotOn;
      try{ localStorage.setItem(MASCOT_KEY, mascotOn ? "on" : "off"); }catch(e){}
      state.prefs.mascot = mascotOn;
      el.classList.toggle("on", mascotOn);
      el.setAttribute("aria-checked", mascotOn);
      applyMascot(); save();
      if(mascotOn) mascotSay("I'm back! 🪐");
      break;
    }
    case "set-style": {
      state.prefs.style = el.dataset.v;
      applyLook(); save(); render();
      openAppearance();
      break;
    }
    case "glass-mode": {
      state.prefs.glass = el.dataset.v;
      $$(".pick", el.parentElement).forEach(b=>b.classList.toggle("on", b===el));
      applyLook(); save();
      break;
    }
    case "ftog": {
      const k = el.dataset.k;
      const next = !featOn(k);
      state.prefs.features[k] = next;
      el.classList.toggle("on", next);
      el.setAttribute("aria-checked", String(next));
      save();
      if(k==="voice" || k==="quotes" || k==="tips" || k==="streaks") render();
      break;
    }
    case "ttog": {
      const k = el.dataset.k;
      const next = !tileOn(k);
      state.prefs.tiles[k] = next;
      el.classList.toggle("on", next);
      el.setAttribute("aria-checked", String(next));
      save(); render();
      break;
    }
    case "den-tog": {
      state.prefs.density = state.prefs.density==="compact" ? "cozy" : "compact";
      el.classList.toggle("on", state.prefs.density==="compact");
      applyLook(); save();
      break;
    }
    case "motion-tog": {
      state.prefs.reduceMotion = !state.prefs.reduceMotion;
      el.classList.toggle("on", !!state.prefs.reduceMotion);
      applyLook(); save();
      break;
    }
    case "notif-tog": toggleNotif(); break;
    case "set-start": {
      state.prefs.startView = el.dataset.v;
      $$(".pick", el.parentElement).forEach(b=>b.classList.toggle("on", b===el));
      save();
      break;
    }
    case "set-flen": {
      state.prefs.focusLen = +el.dataset.v;
      $$(".pick", el.parentElement).forEach(b=>b.classList.toggle("on", b===el));
      save();
      break;
    }
    case "set-goal": {
      state.prefs.focusGoal = +el.dataset.v;
      $$(".pick", el.parentElement).forEach(b=>b.classList.toggle("on", b===el));
      save(); if(ui.view==="today") render();
      break;
    }
    case "set-svol": {
      state.prefs.soundVol = +el.dataset.v;
      $$(".pick", el.parentElement).forEach(b=>b.classList.toggle("on", b===el));
      save();
      playSound("done"); /* instant preview at the new volume */
      break;
    }
    case "ics-all": exportICS(); break;
    case "erase-all": {
      if(confirm("Erase ALL Orbit data in this browser? Your cloud copy (if signed in) is not touched.") && confirm("Really erase everything here? This cannot be undone locally.")){
        try{ localStorage.clear(); }catch(e){}
        location.reload();
      }
      break;
    }
    case "focus-task-close": { const fid = el.dataset.id; closeModal(); startFocus(fid); break; }
    case "toggle-sb": toggleSidebar(); break;
    case "mascot": if(e.target.closest("#mascot-bubble")) break; mascotClicked(); break;
    case "rename-user": renameUser(); break;
    case "hello-go": finishHello(); break;
  }
});

document.addEventListener("submit", e=>{
  const f = e.target, kind = f.dataset.form;
  if(!kind) return;
  e.preventDefault();
  if(kind==="hello"){ finishHello(); return; }
  if(kind==="quickadd-today"){
    const v = f.elements["qa"].value.trim(); if(!v) return;
    const out = orbieAddTask(v);
    if(out){
      hapt();
      playSound("add");
      showToast("✓ Added to "+out.sp.icon+" "+out.sp.name);
    }
    return;
  }
  if(kind==="quickadd"){
    const v = f.elements["qa"].value.trim(); if(!v) return;
    const p = parseQuick(v); if(!p.title) return;
    const sp = getSpace(f.dataset.space); if(!sp) return;
    const nt = {id:uid(), spaceId:sp.id, title:p.title, desc:"", due:p.due, priority:p.priority,
      repeat:p.repeat, stage:sp.stages[0].id, done:false, createdAt:Date.now(), completedAt:null};
    state.tasks.push(nt);
    ui._justAdded = nt.id;
    playSound("add");
    save(); ui._focusQA = true; render();
  }
  else if(kind==="app"){
    const name = f.elements["name"].value.trim();
    let url = f.elements["url"].value.trim();
    if(!name || !url) return;
    if(!/^https?:\/\//i.test(url)) url = "https://"+url;
    try{ new URL(url); }catch(err){ playSound("error"); showToast("That URL doesn't look right"); return; }
    const id = f.dataset.id;
    const icon = f.elements["icon"].value || "🧩";
    const color = f.elements["color"].value;
    if(id){
      const a = getApp(id);
      if(a){
        const changed = a.url !== url;
        Object.assign(a, {name:name, url:url, icon:icon, color:color});
        if(changed && extFrames[id]) extFrames[id].src = url;
      }
    } else {
      const a = {id:uid(), name:name, url:url, icon:icon, color:color, createdAt:Date.now()};
      state.apps.push(a);
      ui.view = "ext"; ui.appId = a.id;
    }
    save(); closeModal(); render();
  }
  else if(kind==="habit"){
    const name = f.elements["name"].value.trim(); if(!name) return;
    const icon = f.elements["icon"].value || "✅";
    const color = f.elements["color"].value;
    const id = f.dataset.id;
    if(id){ const hb = state.habits.find(x=>x.id===id); if(hb) Object.assign(hb, {name:name, icon:icon, color:color}); }
    else state.habits.push({id:uid(), name:name, icon:icon, color:color, days:{}, createdAt:Date.now()});
    save(); closeModal(); render();
  }
  else if(kind==="task") submitTask(f);
  else if(kind==="space") submitSpace(f);
  else if(kind==="note") submitNote(f);
  else if(kind==="orbie"){
    const v = f.elements["oi"].value.trim(); if(!v) return;
    f.elements["oi"].value = "";
    mascotHappy();
    if(!document.body.classList.contains("orbie-open")) openOrbiePanel();
    orbieProcess(v);
  }
});

document.addEventListener("change", e=>{

let searchT = null;
document.addEventListener("input", e=>{

  if(!t) return;
  if(t.id==="search"){
    const v = t.value;
    clearTimeout(searchT);
    searchT = setTimeout(()=>{ ui.search = v; renderView(); }, 120);
    return;

    const form = t.closest("form");
    if(form){
      form.elements["color"].value = t.value;
      $$(".swatches .swatch", form).forEach(b=>b.classList.toggle("active", b.contains(t)));
      const cw = t.closest(".swatch"); if(cw) cw.style.setProperty("--swc", t.value);
      updateSpacePreview(form);
    }
    return;
  }
  if(t.id==="acc-custom"){
    state.prefs.accent = t.value;
    const wrap = t.closest(".swatches");
    if(wrap) $$(".swatch", wrap).forEach(b=>b.classList.toggle("active", b.contains(t)));
    const cw = t.closest(".swatch"); if(cw) cw.style.setProperty("--swc", t.value);
    applyLook(); save();
    return;
  }
  if(t.id==="paste-box"){
    const n = t.value.split("\n").filter(x=>x.trim()).length;
    const pv = $("#paste-prev");
    if(pv){ pv.style.display = n ? "flex" : "none"; pv.innerHTML = '<span class="qa-lbl">Ready</span><b>'+n+' task'+(n===1?"":"s")+'</b>'; }
    return;
  }
  const spForm = t.closest && t.closest('form[data-form="space"]');
  if(spForm && (t.name==="name" || t.name==="icon")){
    if(t.name==="icon") $$("#emoji-grid button", spForm).forEach(b=>b.classList.toggle("on", b.dataset.e===t.value.trim()));
    updateSpacePreview(spForm);
  }
});

document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openCmd(); return; }
  if(e.key==="Escape"){ closeModal(); closeOrbieChat(); closePopover(); closeGalaxy(); closeBriefing(); closeGuide(); return; }
  if((e.key==="Enter" || e.key===" ") && e.target && e.target.getAttribute && e.target.getAttribute("role")==="button" && e.target.dataset && e.target.dataset.act){
    e.preventDefault(); e.target.click(); return;
  }
  if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){
    const mf = $("#modal-root form");
    if(mf){ e.preventDefault(); if(mf.requestSubmit) mf.requestSubmit(); return; }
  }
  if(e.key==="Enter" && !e.shiftKey && e.target.tagName==="INPUT" && e.target.closest && e.target.closest(".cl-row")){
    e.preventDefault();
    const addBtn = $('#modal-root [data-act="cl-add"]');
    if(addBtn) addBtn.click();
    return;
  }
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select" || e.target.isContentEditable) return;
  if(document.querySelector("#modal-root .overlay")) return;
  if(document.body.classList.contains("orbie-open") && e.key.toLowerCase()!=="o") return;
  if(e.key==="?"){ e.preventDefault(); openShortcuts(); return; }
  if(e.key==="/"){ e.preventDefault(); const s=$("#search"); if(s) s.focus(); }
  else if(!e.ctrlKey && !e.metaKey && !e.altKey){
    const k = e.key.toLowerCase();
    if(k==="n"){ e.preventDefault(); openTaskModal(null); }
    else if(k==="t"){ e.preventDefault(); ui.view="today"; ui.spaceId=null; render(); }
    else if(k==="w"){ e.preventDefault(); ui.view="week"; ui.spaceId=null; render(); }
    else if(k==="h"){ e.preventDefault(); ui.view="habits"; ui.spaceId=null; render(); }
    else if(k==="p"){ e.preventDefault(); ui.view="pad"; ui.spaceId=null; render(); }
    else if(k==="f"){ e.preventDefault(); if(!fsess) startFocus(null); }
    else if(k==="m"){ e.preventDefault(); toggleSound(); }
    else if(k==="o"){ e.preventDefault(); if(orbieChatOpen) closeOrbieChat(); else openOrbiePanel(); }
  }
});

/* ---------------- init ---------------- */
$("#sb-backdrop").addEventListener("click", closeSb);
setInterval(updateClock, 30000);
addEventListener("focus", ()=>pullCloud(false));
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flushPush(); else pullCloud(false); });
addEventListener("pagehide", flushPush);

/* swipe gestures on phones: swipe in from the left edge to open, swipe left to close */
let touchX = null, touchY = null, edgeSwipe = false;
document.addEventListener("touchstart", e=>{
  const t = e.touches && e.touches[0]; if(!t) return;
  touchX = t.clientX; touchY = t.clientY;
  edgeSwipe = t.clientX < 28 && !document.body.classList.contains("sb-open");
}, {passive:true});
document.addEventListener("touchend", e=>{
  if(touchX===null) return;
  if(ui._spaceLift){ touchX = null; edgeSwipe = false; return; }
  const t = e.changedTouches && e.changedTouches[0];
  if(t && isMobile() && Math.abs(t.clientY - touchY) < 80){
    const dx = t.clientX - touchX;
    if(edgeSwipe && dx > 55){ document.body.classList.add("sb-open"); updateFab(); }
    else if(document.body.classList.contains("sb-open") && dx < -55){ closeSb(); }
  }
  touchX = null; edgeSwipe = false;
}, {passive:true});
addEventListener("resize", ()=>{ if(!isMobile()) closeSb(); });

/* drop text from anywhere (another app, an email, a webpage) to create a task */
document.addEventListener("dragover", e=>{
  if(ui.dragTask || ui._intDrag) return;
  const tps = e.dataTransfer && e.dataTransfer.types;
  if(tps && Array.from(tps).indexOf("text/plain") > -1) e.preventDefault();
});
document.addEventListener("drop", e=>{
  if(e.defaultPrevented || ui.dragTask || ui._intDrag || ui._lifting) return;
  let txt = "";
  try{ txt = e.dataTransfer ? e.dataTransfer.getData("text/plain") : ""; }catch(_){}
  if(!txt || !txt.trim()) return;
  e.preventDefault();
  const out = orbieAddTask(txt.trim().split("\n")[0].slice(0,140));
  if(out){ mascotHappy(); playSound("add"); showToast("✓ Dropped in: "+out.p.title); }
});

/* flush unsaved notepad text if the tab closes mid-typing */
addEventListener("beforeunload", ()=>{
  const ta = $("#scratch-pad");
  if(ta){
    const pg = activePage();
    if(ta.value !== (pg.body||"")){
      pg.body = ta.value;
      pg.updatedAt = Date.now();
      state.updatedAt = Date.now();
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}

});

/* deep links & share target — works with iPhone Shortcuts, Siri, PWA app
   shortcuts and the Web Share sheet:
   ?add=Buy milk tomorrow · ?view=week|habits|pad|today · ?quick=1 · ?focus=1
   plus GET share_target params (title/text/url) from manifest.json */
function handleDeepLinks(q){
  let used = false;
  const raw = q.get("add") || q.get("task");
  if(raw && raw.trim()){
    const out = orbieAddTask(raw.trim());
    if(out){ showToast("✓ Added from link: "+out.p.title); mascotHappy(); }
    used = true;
  }
  const shared = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join(" ").trim();
  if(shared){
    const out = orbieAddTask(shared.slice(0,160));
    if(out){ showToast("✓ Saved from share: "+out.p.title); mascotHappy(); }
    used = true;
  }
  const ap = q.get("app");
  if(ap){
    const a = (state.apps||[]).find(x=>x.id===ap || (x.name||"").toLowerCase().indexOf(ap.toLowerCase()) > -1);
    if(a){ ui.view = "ext"; ui.appId = a.id; render(); used = true; }
  }
  const vw = q.get("view");
  if(vw && ["today","work","week","habits","pad"].indexOf(vw) > -1){ ui.view = vw; ui.spaceId = null; render(); used = true; }
  if(q.get("quick")==="1"){ openTaskModal(null); used = true; }
  if(q.get("focus")==="1"){ if(!fsess) startFocus(null); used = true; }
  return used;
}
(function deepLink(){
  try{
    if(handleDeepLinks(new URLSearchParams(location.search))) history.replaceState(null, "", location.pathname);
  }catch(e){}
})();

/* gentle one time install tip on phones */
(function installNudge(){
  try{
    if(!isMobile()) return;
    if(window.matchMedia && matchMedia("(display-mode: standalone)").matches) return;
    if(localStorage.getItem("orbit-nudged")) return;
    const v = (+localStorage.getItem("orbit-visits")||0)+1;
    localStorage.setItem("orbit-visits", String(v));
    if(v >= 2){
      localStorage.setItem("orbit-nudged","1");
      setTimeout(()=>showToast(IS_APPLE ? "Tip: Share → Add to Home Screen installs Orbit as an app" : "Tip: browser menu → Install app puts Orbit on your home screen"), 2500);
    }
  }catch(e){}
})();
