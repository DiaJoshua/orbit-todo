function bindScratch(){
  const ta = $("#scratch-pad"); if(!ta) return;
  const pageId = ui.pageId;
  ta.addEventListener("input", ()=>{
    /* slash command: "/" at the start of a line opens the insert menu */
    const s = ta.selectionStart;
    if(ta.value[s-1]==="/" && (s===1 || ta.value[s-2]==="\n")){ openInsertMenu(true); }
    const m1 = $("#pad-meta"); if(m1) m1.textContent = countWords(ta.value)+" words · saving…";
    const pg = state.pages.find(p=>p.id===pageId);
    if(!pg) return;
    pg.body = ta.value;
    pg.updatedAt = Date.now();
    save();
    const m2 = $("#pad-meta");
    if(m2) m2.textContent = countWords(ta.value)+(cloud.on && navigator.onLine ? " words · saving to cloud…" : " words · not saved — sign in and stay online");
  });
  ta.addEventListener("blur", ()=>{ if(ui._pendingRender){ ui._pendingRender = false; render(); } });
}

/* ---------------- insert menu (slash commands) ---------------- */
const SNIPPETS = {
  h1: ()=>"# ",
  h2: ()=>"## ",
  bullet: ()=>"• ",
  todo: ()=>"[ ] ",
  divider: ()=>"\n──────────\n",
  date: ()=>new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+": ",
  meeting: ()=>"# Meeting notes ("+new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"})+")\nWith: \nAgenda:\n• \nDecisions:\n• \nAction items:\n[ ] \n",
  daily: ()=>"# Plan for "+new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})+"\nTop 3:\n1. \n2. \n3. \nLater:\n• \n",
  jobapp: ()=>"# Company: \nRole: \nLink: \nContact: \nStatus: Applied\nNotes:\n• \n"
};
function openInsertMenu(fromSlash){
  const ta = $("#scratch-pad"); if(!ta) return;
  const p = $("#popover");
  clearTimeout(closePopover._t); p.classList.remove("closing");
  const item = (k,ic,lb)=>'<button data-act="pad-insert" data-k="'+k+'" data-slash="'+(fromSlash?1:0)+'"><span>'+ic+'</span>'+lb+'</button>';
  p.innerHTML =
    item("h1","#","Heading")+
    item("h2","##","Subheading")+
    item("bullet","•","Bullet")+
    item("todo","☑","Checklist line")+
    item("divider","─","Divider")+
    item("date","📆","Date stamp")+
    '<div class="sep"></div>'+
    item("meeting","🗣","Template: meeting notes")+
    item("daily","🌅","Template: daily plan")+
    item("jobapp","💼","Template: job application");
  p.style.display = "block";
  const r = ta.getBoundingClientRect();
  const pr = p.getBoundingClientRect();
  p.style.left = Math.max(8, Math.min(r.left + 26, innerWidth - pr.width - 10))+"px";
  p.style.top  = Math.max(8, Math.min(r.top + 48, innerHeight - pr.height - 10))+"px";
}
function padInsert(key, replaceSlash){
  const ta = $("#scratch-pad"); if(!ta || !SNIPPETS[key]) return;
  const snippet = SNIPPETS[key]();
  let s = ta.selectionStart || 0;
  let v = ta.value;
  if(replaceSlash && s>0 && v[s-1]==="/"){ v = v.slice(0,s-1)+v.slice(s); s -= 1; }
  ta.value = v.slice(0,s)+snippet+v.slice(s);
  ta.selectionStart = ta.selectionEnd = s + snippet.length;
  ta.focus();
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}

/* ---------------- list view ---------------- */
function renderListView(s){
  const ts = state.tasks.filter(t=>t.spaceId===s.id && matches(t));
  const open = ts.filter(t=>!t.done);
  const overdue  = open.filter(t=>t.due && dayDiff(t.due)<0).sort(sortTasks);
  const dueToday = open.filter(t=>t.due && dayDiff(t.due)===0).sort(sortTasks);
  const upcoming = open.filter(t=>t.due && dayDiff(t.due)>0).sort(sortTasks);
  const nodate   = open.filter(t=>!t.due).sort(sortTasks);
  const done     = ts.filter(t=>t.done).sort((a,b)=>(b.completedAt||"").localeCompare(a.completedAt||""));

  let h = '<div class="view-inner">'+
    '<form class="quickadd" data-form="quickadd" data-space="'+s.id+'">'+
      '<span class="plus">＋</span>'+
      '<input name="qa" placeholder=\'Add to '+esc(s.name)+'…\' autocomplete="off">'+
      micHtml()+
      '<button type="submit">Add</button>'+
    '</form>'+
    '<div class="qa-prev" id="qa-prev" style="display:none"></div>';

  if(!ts.length){
    h += '<div class="empty"><span class="art">'+esc(s.icon)+'</span><h3>'+(ui.search?"No matches":"Nothing here yet")+'</h3><p>'+
      (ui.search?"Try a different search.":"Add your first task above. It takes two seconds.")+'</p></div>';
  } else {
    h += groupSection(s.id+":od","Overdue","var(--rose)",overdue,false,
      '<button class="head-link" data-act="overdue-today" data-id="'+s.id+'">Move all to today</button>');
    h += groupSection(s.id+":dt","Today","var(--amber)",dueToday,false);
    h += groupSection(s.id+":up","Upcoming","var(--cyan)",upcoming,false);
    h += groupSection(s.id+":nd","No due date","var(--muted)",nodate,false);
    h += groupSection(s.id+":done","Completed","var(--green)",done,false,
      '<button class="clear-done" data-act="clear-done" data-id="'+s.id+'">Clear completed</button>');
  }
  if(!ui.search){
    h += '<div class="qlinks">'+
      '<button data-act="tab" data-tab="board">▦ Open the Board</button>'+
      '<button data-act="tab" data-tab="notes">🗒 Notes ('+((s.notes||[]).length)+')</button>'+
      '<button data-act="new-note">＋ New note</button>'+
      '<button data-act="ea-tomorrow">🌤 Plan tomorrow</button>'+
    '</div>';
  }
  h += uiTip("list");
  h += '</div>';
  $("#view").innerHTML = h;
  bindQuickAdd();
  if(!ui.search){
    const inner = $("#view .view-inner");
    if(inner) makeSortable(inner, ".task[data-id]", ()=>commitTaskOrderFromDom(inner), false, true);
  }
  const qa=$("#view .quickadd input"); if(qa && ui._focusQA){ qa.focus(); ui._focusQA=false; }
}

/* live "understood as" preview while typing in quick add */
function bindQuickAdd(){
  const form = $("#view .quickadd"); if(!form) return;
  const inp = form.elements["qa"], prev = $("#qa-prev");
  if(!inp || !prev) return;
  inp.addEventListener("input", ()=>{
    const v = inp.value.trim();
    if(!v){ prev.style.display = "none"; prev.innerHTML = ""; return; }
    const p = parseQuick(v);
    let chips = "";
    if(p.due) chips += '<span class="chip due '+(dayDiff(p.due)===0?"today":"")+'">📅 '+fmtDue(p.due)+'</span>';
    if(p.repeat) chips += '<span class="chip rep">↻ '+(REPEAT_NAMES[p.repeat]||"")+'</span>';
    if(p.priority) chips += '<span class="chip pri p'+p.priority+'">⚑ '+PRI_NAMES[p.priority]+'</span>';
    prev.style.display = "flex";
    prev.innerHTML = '<span class="qa-lbl">Creates</span><b>'+esc(p.title||"…")+'</b>'+chips;
  });
}

/* ---------------- board view ---------------- */
function boardChips(t){
  let h = "";
  if(t.due) h += '<span class="chip due '+dueClass(t)+'">📅 '+fmtDue(t.due)+'</span>';
  if(t.repeat) h += '<span class="chip rep">↻ '+(REPEAT_NAMES[t.repeat]||"Repeats")+'</span>';
  if(t.priority) h += '<span class="chip pri p'+t.priority+'">⚑ '+PRI_NAMES[t.priority]+'</span>';
  if(t.checklist && t.checklist.length) h += '<span class="chip">☑ '+t.checklist.filter(c=>c.done).length+'/'+t.checklist.length+'</span>';
  return h;
}

function cardHtml(t, idx){
  const sp = spaceOf(t);
  const isLast = sp.stages.findIndex(s=>s.id===t.stage) >= sp.stages.length-1;
  const flair = (t.id===ui._justAdded || t.id===ui._justMoved ? " just-in" : "") + (t.id===ui._justToggled ? " just-done" : "");
  return '<div class="card '+(t.done?"done":"")+flair+'" style="animation-delay:'+dly(idx)+'" draggable="true" data-act="open-task" data-id="'+t.id+'">'+
    '<div class="card-top">'+
      '<button class="check" data-act="toggle" data-id="'+t.id+'">'+(t.done?"✓":"")+'</button>'+
      '<div class="c-title" style="padding-right:16px">'+esc(t.title)+'</div>'+
    '</div>'+
    (t.due||t.priority||t.repeat||(t.checklist&&t.checklist.length) ? '<div class="t-chips">'+boardChips(t)+'</div>' : '')+
    (isLast ? '' : '<button class="c-next" data-act="stage-next" data-id="'+t.id+'" title="Move to next stage">›</button>')+
  '</div>';
}

function renderBoardView(s){
  const cols = s.stages.map(st=>{
    const cards = state.tasks
      .filter(t=>t.spaceId===s.id && t.stage===st.id && matches(t))
      .sort((a,b)=>(a.done-b.done)||sortTasks(a,b));
    return '<div class="col">'+
      '<div class="col-head"><span class="dot" style="background:'+esc(st.color||s.color)+'"></span>'+esc(st.name)+'<span class="count">'+cards.length+'</span></div>'+
      '<div class="col-body" data-stage="'+st.id+'">'+cards.map((c,i)=>cardHtml(c,i)).join("")+'</div>'+
      '<button class="col-add" data-act="col-add" data-stage="'+st.id+'">＋ Add task</button>'+
    '</div>';
  }).join("");
  $("#view").innerHTML = '<div class="view-inner wide"><div class="board">'+cols+
    '<div class="col ghost-col"><button data-act="edit-space">＋ Add / edit stages</button></div>'+
  '</div>'+uiTip("board")+'</div>';
}

function bindBoardDnD(){
  $$("#view .card").forEach(c=>{
    c.addEventListener("dragstart",e=>{
      ui.dragTask = c.dataset.id;
      c.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", c.dataset.id); }catch(_){}
    });
    c.addEventListener("dragend",()=>{
      ui.dragTask = null; ui._justDragged = true;
      setTimeout(()=>{ ui._justDragged = false; }, 80);
      c.classList.remove("dragging");
      $$("#view .col-body").forEach(b=>b.classList.remove("drop-hint"));
    });
  });
  $$("#view .col-body").forEach(b=>{
    b.addEventListener("dragover",e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; b.classList.add("drop-hint"); });
    b.addEventListener("dragleave",()=>b.classList.remove("drop-hint"));
    b.addEventListener("drop",e=>{
      e.preventDefault(); b.classList.remove("drop-hint");
      let id = ui.dragTask; try{ id = id || e.dataTransfer.getData("text/plain"); }catch(_){}
      const t = state.tasks.find(x=>x.id===id);
      if(t && t.stage!==b.dataset.stage){ t.stage = b.dataset.stage; ui._justMoved = t.id; playSound("move"); save(); render(); }
    });
  });
}

/* ---------------- render root ---------------- */
function renderView(){
  if(ui.view==="space" && !getSpace(ui.spaceId)){ ui.view="today"; ui.spaceId=null; }
  const ac = currentAccent() || ((state.prefs && state.prefs.accent) || "");
  if(ac) document.documentElement.style.setProperty("--accent", ac);
  else document.documentElement.style.removeProperty("--accent");
  const key = ui.view+"|"+ui.spaceId+"|"+ui.tab;
  const viewChanged = key !== renderView._last;
  renderView._last = key;
  const viewEl = $("#view");
  const keepScroll = viewChanged ? 0 : viewEl.scrollTop;
  /* entrance animations only on real view changes → re-renders feel instant */
  viewEl.classList.toggle("anim-in", viewChanged);
  if(ui.view==="today"){ renderToday(); }
  else if(ui.view==="pad"){ renderPad(); }
  else if(ui.view==="week"){ renderWeek(); }
  else if(ui.view==="habits"){ renderHabits(); }
  else if(ui.view==="work"){ renderWork(); }
  else if(ui.view==="ext"){ $("#view").innerHTML = ""; }
  else {
    const s = getSpace(ui.spaceId);
    if(ui.tab==="board"){ renderBoardView(s); bindBoardDnD(); }
    else if(ui.tab==="notes"){ renderNotesView(s); }
    else { renderListView(s); }
  }
  if(viewChanged){
    const vi = viewEl.firstElementChild;
    if(vi) vi.classList.add("view-anim");
  } else {
    /* keep the exact scroll position across re-renders */
    viewEl.style.scrollBehavior = "auto";
    viewEl.scrollTop = keepScroll;
    viewEl.style.scrollBehavior = "";
  }
  ui._justAdded = ui._justToggled = ui._justMoved = null;
  try{ if(["today","work","week","habits","pad"].indexOf(ui.view) > -1) localStorage.setItem("orbit-last", ui.view); }catch(e){}
  bindSwipes(viewEl);
}
/* renders coalesce into one animation frame: many state changes, one paint */
let _renderRaf = null;
function render(){
  if(_renderRaf) return;
  _renderRaf = requestAnimationFrame(()=>{
    _renderRaf = null;
    renderSidebar(); renderTopbar(); renderTabs(); renderView(); renderAppframes();
  });
}

/* ---------------- quick add parsing ---------------- */
function parseQuick(text){
  let due = null, pri = 0, rep = null, s = text;
  s = s.replace(/\s*!(high|hi|med|medium|low)\b/ig, (m,p)=>{ pri = {high:3,hi:3,med:2,medium:2,low:1}[p.toLowerCase()]||0; return ""; });
  s = s.replace(/\s*\b(every ?day|daily)\b/ig, ()=>{ rep = "daily"; return ""; });
  s = s.replace(/\s*\bweekdays\b/ig, ()=>{ rep = "weekdays"; return ""; });
  s = s.replace(/\s*\b(every ?week|weekly)\b/ig, ()=>{ rep = "weekly"; return ""; });
  s = s.replace(/\s*\b(today|tonight)\b/ig, ()=>{ due = todayStr(); return ""; });
  s = s.replace(/\s*\b(tomorrow|tmr)\b/ig, ()=>{ due = addDays(1); return ""; });
  s = s.replace(/\s*\bnext week\b/ig, ()=>{ due = addDays(7); return ""; });
  const WD = {sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
  s = s.replace(/\s*\b(next\s+)?(sunday|saturday|thursday|wednesday|tuesday|monday|friday|thurs|tues|thur|sun|sat|thu|wed|tue|mon|fri)\b/ig, (m,nx,w)=>{
    const d = new Date();
    let delta = (WD[w.toLowerCase()] - d.getDay() + 7) % 7;
    if(delta===0) delta = 7;
    if(nx) delta += 7;
    due = addDays(delta); return "";
  });
  s = s.replace(/\s*\bin\s+(\d{1,2})\s+days?\b/ig, (m,n)=>{ due = addDays(+n); return ""; });
  const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  s = s.replace(/\s*\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/ig, (m,mo,dd)=>{
    const y = new Date().getFullYear();
    let dt = new Date(y, MO[mo.toLowerCase()], +dd);
    if(dstr(dt) < todayStr()) dt = new Date(y+1, MO[mo.toLowerCase()], +dd);
    due = dstr(dt); return "";
  });
  if(rep && !due) due = todayStr();
  return { title: s.replace(/\s+/g," ").trim(), due, priority: pri, repeat: rep };
}

/* ---------------- modals ---------------- */
function modalShell(inner, wide){
  clearTimeout(closeModal._t);
  $("#modal-root").innerHTML = '<div class="overlay"><div class="modal'+(wide?" wide":"")+'">'+inner+'</div></div>';
  playSound("tap");
}
function closeModal(){
  const root = $("#modal-root");
  const ov = root.firstElementChild;
  if(!ov) return;
  playSound("close");
  if(isReduced()){ root.innerHTML = ""; return; }
  if(ov.classList.contains("closing")) return;
  ov.classList.add("closing");
  clearTimeout(closeModal._t);
  closeModal._t = setTimeout(()=>{ if(root.firstElementChild===ov) root.innerHTML = ""; }, 150);
}

/* ---------------- editor helpers ---------------- */
function updateClCount(){
  const el = $("#cl-count"); if(!el) return;
  const rows = $$("#cl-list .cl-row");
  const done = rows.filter(r=>r.querySelector(".check").classList.contains("on")).length;
  el.textContent = rows.length ? done+" / "+rows.length+" done" : "";
}
function updateSpacePreview(form){
  const pv = $("#sp-preview"); if(!pv || !form) return;
  const name = (form.elements["name"] ? form.elements["name"].value : "").trim();
  const icon = (form.elements["icon"] ? form.elements["icon"].value : "").trim() || "📁";
  const color = form.elements["color"] ? form.elements["color"].value : "#8b7cff";
  pv.style.setProperty("--pv", color);
  const i = $("#pv-ico"); if(i) i.textContent = icon;
  const n = $("#pv-name"); if(n) n.textContent = name || "New space";
}
function taskStagePicks(sp, sel){
  return sp.stages.map(st=>'<button type="button" class="pick'+(st.id===sel?" on":"")+'" style="--pc:'+esc(st.color||sp.color)+'" data-act="pick-stage" data-id="'+st.id+'"><span class="pd"></span>'+esc(st.name)+'</button>').join("");
}
/* drag the ≡ handle to reorder pipeline stages (mouse + touch) */
function bindStageDnD(){
  const list = $("#stage-list"); if(!list) return;
  if(!list.dataset.dndList){
    list.dataset.dndList = "1";
    list.addEventListener("dragover", e=>{ if(list._drag) e.preventDefault(); });
  }
  $$(".stage-row", list).forEach(row=>{
    if(row.dataset.dnd) return;
    row.dataset.dnd = "1";
    const h = row.querySelector(".sg-handle"); if(!h) return;
    h.setAttribute("draggable","true");
    h.addEventListener("dragstart", e=>{
      list._drag = row; row.classList.add("drag-src");
      ui._intDrag = true;
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain","stage"); }catch(_){}
    });
    h.addEventListener("dragend", ()=>{ ui._intDrag = false; if(list._drag){ list._drag.classList.remove("drag-src"); list._drag = null; } });
    row.addEventListener("dragover", e=>{
      const d = list._drag; if(!d || d===row) return;
      e.preventDefault();
      const r = row.getBoundingClientRect();
      if(e.clientY < r.top + r.height/2) list.insertBefore(d, row);
      else list.insertBefore(d, row.nextSibling);
    });
    let pt = null, lift = false;
    h.addEventListener("touchstart", ()=>{ lift = false; pt = setTimeout(()=>{ lift = true; row.classList.add("lifting"); hapt(10); }, 240); }, {passive:true});
    h.addEventListener("touchmove", e=>{
      if(!lift){ clearTimeout(pt); return; }
      e.preventDefault();
      const t = e.touches[0]; if(!t) return;
      for(const o of $$(".stage-row", list)){
        if(o===row) continue;
        const r = o.getBoundingClientRect();
        if(t.clientY > r.top && t.clientY < r.bottom){
          if(t.clientY < r.top + r.height/2) list.insertBefore(row, o);
          else list.insertBefore(row, o.nextSibling);
          break;
        }
      }
    }, {passive:false});
    const endT = ()=>{ clearTimeout(pt); if(lift) row.classList.remove("lifting"); lift = false; };
    h.addEventListener("touchend", endT);
    h.addEventListener("touchcancel", endT);
  });
}

function cmdFiltered(q){
  q = (q||"").toLowerCase().trim();
  const a = cmdActions();
  let out = q ? a.filter(x=>x.label.toLowerCase().includes(q)) : a;
  if(q.length >= 2){
    /* Spotlight: tasks and notes surface right in the palette */
    state.tasks.filter(t=>!t.done && t.title.toLowerCase().includes(q)).slice(0,6).forEach(t=>{
      const sp = spaceOf(t);
      out.push({icon:sp.icon, label:"Task: "+t.title+(t.due?" · "+fmtDue(t.due):""), run:()=>openDoc("task", t.id)});
    });
    state.spaces.forEach(sp=>(sp.notes||[]).forEach(nn=>{
      if(((nn.title||"")+" "+(nn.body||"")).toLowerCase().includes(q))
        out.push({icon:"🗒", label:"Note: "+(nn.title||"Untitled"), run:()=>openNoteModal(sp.id, nn.id)});
    }));
    out = out.slice(0, 24);
  }
  return out;
}
function renderCmdList(q){
  const rows = cmdFiltered(q);
  if(cmdSel > rows.length-1) cmdSel = Math.max(0, rows.length-1);
  $("#cmd-list").innerHTML = rows.length
    ? rows.map((a,i)=>'<button class="cmd-row'+(i===cmdSel?" sel":"")+'" data-act="cmd-run" data-ci="'+i+'"><span class="ci">'+a.icon+'</span>'+esc(a.label)+'</button>').join("")
    : '<div class="cmd-empty">No matches</div>';
}
function openCmd(){
  clearTimeout(closeModal._t);
  playSound("tap");
  $("#modal-root").innerHTML = '<div class="overlay top"><div class="cmd">'+
    '<input id="cmd-in" placeholder="Jump to a space, create, switch theme…" autocomplete="off">'+
    '<div id="cmd-list"></div></div></div>';
  cmdSel = 0;
  renderCmdList("");
  const inp = $("#cmd-in");
  inp.focus();
  inp.addEventListener("input", ()=>{ cmdSel = 0; renderCmdList(inp.value); });
  inp.addEventListener("keydown", e=>{
    const rows = cmdFiltered(inp.value);
    if(e.key==="ArrowDown"){ e.preventDefault(); cmdSel = Math.min(cmdSel+1, rows.length-1); renderCmdList(inp.value); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); cmdSel = Math.max(cmdSel-1, 0); renderCmdList(inp.value); }
    else if(e.key==="Enter"){ e.preventDefault(); const a = rows[cmdSel]; closeModal(); if(a) a.run(); }
  });
}

/* Sticky-note edits are committed on every change, so clicking outside the
   sheet cannot discard typing. Puter sync is queued by save(). */
function autoSaveNoteForm(f){
  if(!f) return;
  const title = f.elements["title"].value;
  const body = f.elements["body"].value;
  if(!title.trim() && !body.trim() && !f.dataset.id) return;
  const target = getSpace((f.elements["nspace"] && f.elements["nspace"].value) || f.dataset.space);
  if(!target) return;
  target.notes = target.notes || [];
  let source = null;
  let note = null;
  if(f.dataset.id){
    source = state.spaces.find(s=>(s.notes||[]).some(x=>x.id===f.dataset.id)) || null;
    note = source && source.notes.find(x=>x.id===f.dataset.id);
    if(note && source!==target){
      source.notes = source.notes.filter(x=>x.id!==note.id);
      target.notes.push(note);
      source = target;
    }
  }
  if(!note){
    note = {id:uid(), title:"", body:"", color:f.elements["color"].value, pinned:false, createdAt:Date.now()};
    target.notes.push(note);
    f.dataset.id = note.id;
    f.dataset.space = target.id;
  }
  Object.assign(note, {title, body, color:f.elements["color"].value,
    pinned:f.elements["pinned"].checked, updatedAt:Date.now()});
  save();
  const status = f.querySelector(".note-save-status");
  if(status) status.textContent = cloud.on && navigator.onLine ? "Saving to Puter…" : "Not saved — sign in and stay online";
}

/* ---------------- mutations ---------------- */
function toggleTask(id, el){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  ui._justToggled = id;
  if(t.repeat && !t.done){
    const wasDue = t.due && dayDiff(t.due) <= 0;
    t.completedAt = todayStr();
    t.due = nextOccurrence(t.repeat);
    if(t.checklist && t.checklist.length) t.checklist.forEach(c=>{ c.done = false; }); /* fresh checklist each cycle */
    save();
    if(el){
      const r = el.getBoundingClientRect();
      confettiBurst(r.left + r.width/2, r.top + r.height/2, spaceOf(t).color);
    }
    mascotHappy();
    bumpDoneCount();
    playSound("done");
    render();
    showToast("✓ "+t.title+" done for today ↻ next: "+fmtDue(t.due));
    maybeCelebrateClear(wasDue);
    return;
  }
  t.done = !t.done;
  t.completedAt = t.done ? todayStr() : null;
  if(!t.done) playSound("undone");
  save();
  if(t.done && el){
    hapt();
    playSound("done");
    const r = el.getBoundingClientRect();
    confettiBurst(r.left + r.width/2, r.top + r.height/2, spaceOf(t).color);
    mascotHappy();
    bumpDoneCount();
    if(Math.random() < .35) mascotSay(pick(["Nice one! 🎉","Done and dusted ✨","+1 for future you","That's the stuff 💪"]), 2000);
  }
  render();
  if(t.done) maybeCelebrateClear(t.due && dayDiff(t.due) <= 0);
}

  undoBuf = {tasks:removed};

}

function applyUndo(){
  if(!undoBuf) return;
  const b = undoBuf; undoBuf = null;
  playSound("undo");
  if(b.type==="note"){ const sp = getSpace(b.spaceId) || state.spaces[0]; if(sp){ sp.notes = sp.notes || []; sp.notes.push(b.note); ui._justAdded = b.note.id; } }
  else if(b.type==="habit"){ state.habits = state.habits || []; state.habits.push(b.habit); }
  else if(b.type==="app"){ state.apps = state.apps || []; state.apps.push(b.app); }
  else if(b.type==="space"){ state.spaces.push(b.space); state.tasks.push(...b.tasks); }
  else if(b.tasks){ state.tasks.push(...b.tasks); }
  save(); render(); hideToast();
}

function submitTask(f){
  let title = f.elements["title"].value.trim(); if(!title) return;
  const id = f.dataset.id;
  const spaceId = f.elements["space"].value;
  let stage = f.elements["stage"].value;
  const nsp = getSpace(spaceId) || state.spaces[0];
  if(!nsp.stages.some(s=>s.id===stage)) stage = nsp.stages[0].id;
  let repeat = f.elements["repeat"].value || null;
  let due = f.elements["due"].value || null;
  let pri = +f.elements["priority"].value || 0;
  if(!id){
    /* natural language in the title fills anything you left empty */
    const p = parseQuick(title);
    if(p.title){
      if(!due && p.due) due = p.due;
      if(!pri && p.priority) pri = p.priority;
      if(!repeat && p.repeat) repeat = p.repeat;
      title = p.title;
    }
  }
  if(repeat && !due) due = todayStr();
  const checklist = $$("#cl-list .cl-row").map(r=>({
    id: r.dataset.cid==="new" ? uid() : r.dataset.cid,
    text: r.querySelector("input").value.trim(),
    done: r.querySelector(".check").classList.contains("on")
  })).filter(x=>x.text);

                 priority:pri, spaceId:nsp.id, stage, repeat, checklist };

  else {
    const nt = Object.assign({id:uid(), done:false, createdAt:Date.now(), completedAt:null}, vals);

/* ---------------- confetti ---------------- */
const cvs = $("#confetti-canvas"), ctx = cvs.getContext("2d");
let parts = [], rafId = null;
function sizeCanvas(){ cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener("resize", sizeCanvas); sizeCanvas();
function confettiBurst(x, y, color){
  if(!featOn("confetti")) return;
  const colors = [color||"#8b7cff", "#38d6f5", "#fbbf24", "#fb7185", "#34d399", "#ffffff"];
  for(let i=0;i<26;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*4.5;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2.5, g:.12+Math.random()*.06,
      life:46+Math.random()*22, size:3+Math.random()*4, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
      c:colors[i%colors.length]});
  }
  if(!rafId && ctx) rafId = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.rot+=p.vr; p.life--;
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life/22);
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*.62);
    ctx.restore();
  }
  if(parts.length) rafId = requestAnimationFrame(tick);
  else { rafId = null; ctx.clearRect(0,0,cvs.width,cvs.height); }
}

function findTask(q, includeDone){
  q = q.toLowerCase().trim();
  const pool = state.tasks.filter(t=>includeDone || !t.done);
  return pool.find(t=>t.title.toLowerCase()===q)
      || pool.find(t=>t.title.toLowerCase().startsWith(q))
      || pool.find(t=>t.title.toLowerCase().includes(q))
      || null;
}

/* Orbie's command brain: explicit actions only (chat + tasks route separately) */
function orbieCommand(raw){
  const low = raw.toLowerCase().trim();
  let m;
  if((m = low.match(/^(done|complete|finish|check(?: off)?)\s+(.+)/))){
    const t = findTask(m[2]);
    if(!t) return 'I could not find an open task like "'+esc(m[2])+'" 🤔';
    toggleTask(t.id, $("#mascot"));
    return 'Checked off <b>'+esc(t.title)+'</b> ✓';
  }
  if((m = low.match(/^(delete|remove)\s+(.+)/))){
    const t = findTask(m[2], true);
    if(!t) return 'No task like "'+esc(m[2])+'" found';
    deleteTasks([t.id]);
    return 'Deleted <b>'+esc(t.title)+'</b>. Undo is in the toast.';
  }
  if((m = low.match(/^(find|search)\s+(.+)/))){
    ui.search = m[2];
    renderTopbar(); renderView();
    const n = state.tasks.filter(t=>matches(t)).length;
    return 'Filtering for <b>'+esc(m[2])+'</b>: '+n+' task'+(n===1?"":"s")+' match';
  }
  if((m = raw.match(/^note[:\s]\s*(.+)/i))){
    const sp = getSpace(defaultNotesSpaceId());
    if(!sp.notes) sp.notes = [];
    const body = m[1].trim();
    const nn = {id:uid(), title: body.slice(0,34)+(body.length>34?"…":""), body: body, color: pick(NOTE_COLORS), pinned: true, createdAt: Date.now()};
    sp.notes.push(nn);
    ui._justAdded = nn.id;
    save(); render();
    return 'Pinned a note to your dashboard 📌';
  }
  if((m = low.match(/^(?:go to|open|show)\s+(.+)/))){
    const q = m[1];
    if(/notepad|pad|notes page/.test(q)){ ui.view="pad"; ui.spaceId=null; render(); return 'Notes open 🗒'; }
    if(/today|home|dash/.test(q)){ ui.view="today"; ui.spaceId=null; render(); return 'Home sweet dashboard 🪐'; }
    if(/^work( hq)?( page)?$/.test(q.trim())){ ui.view="work"; ui.spaceId=null; render(); return 'Work mode 🏢'; }
    const sp = state.spaces.find(s=>s.name.toLowerCase().includes(q.trim()));
    if(sp){ ui.view="space"; ui.spaceId=sp.id; ui.tab="tasks"; render(); return 'Opened '+esc(sp.icon+" "+sp.name); }
    return 'I do not know "'+esc(q)+'" yet. Try a space name, notepad, or today.';
  }
  if(/^(clear|move) overdue/.test(low)){
    const n = moveOverdueToToday(null);
    return n ? 'Moved '+n+' overdue to today ✅' : 'No overdue tasks 🎉';
  }
  if(/^(help|what can you do|\?)$/.test(low)){
    return 'I understand things like:<br>• <b>gym tomorrow !med in Personal</b><br>• <b>done clinic</b> · <b>delete old task</b><br>• <b>note: brilliant idea</b><br>• <b>find resume</b> · <b>go to work</b><br>• <b>clear overdue</b> · <b>focus</b><br>• or just talk to me — a simple <b>hi</b> works 👋';
  }
  return null;
}

/* smarter local intents: recommendations, finishing, rescheduling, habits */
function orbieLocal(raw){
  const low = raw.toLowerCase().trim();

  if(/what should i (do|work on)|what.s (first|next)\b|^what (first|next)/.test(low)){
    const open = state.tasks.filter(t=>!t.done);
    if(!open.length) return "Nothing on the list — enjoy the quiet, or hand me something ☀️";
    const scored = open.slice().sort((a,b)=>{
      const av = a.due ? (dayDiff(a.due)<0?0:dayDiff(a.due)===0?1:2) : 3;
      const bv = b.due ? (dayDiff(b.due)<0?0:dayDiff(b.due)===0?1:2) : 3;
      if(av!==bv) return av-bv;
      if(a.priority!==b.priority) return b.priority-a.priority;
      return a.createdAt-b.createdAt;
    });
    const t = scored[0], sp = spaceOf(t);
    return 'I would start with <b>'+esc(t.title)+'</b> ('+esc(sp.name)+(t.due?' · '+fmtDue(t.due):'')+').'+

  }
  if(/how many (tasks|things|todos)/.test(low)){
    return state.tasks.filter(t=>!t.done).length+" open in total — "+orbieStatusLine()+".";
  }
  if(/^(my )?habits$/.test(low) || /habits (left|today)/.test(low)){
    const hs = state.habits || [];
    if(!hs.length) return "No habits yet — say <b>add habit drink water</b> 🌱";
    const left = hs.filter(x=>!(x.days && x.days[todayStr()]));
    return left.length ? "Still open today: "+left.map(x=>esc((x.icon||"")+" "+x.name)).join(", ") : "All habits done today 🌟";
  }
  if((m = low.match(/^add habit\s+(.+)/))){
    const nm = m[1].trim().slice(0,40);
    state.habits.push({id:uid(), name:nm.charAt(0).toUpperCase()+nm.slice(1), icon:"🌱", color:SPACE_COLORS[(state.habits||[]).length % SPACE_COLORS.length], days:{}, createdAt:Date.now()});
    save(); render();
    return 'New habit: <b>'+esc(nm)+'</b> 🌱 Its dots live on the Habits page.';
  }
  if((m = low.match(/^(?:log|i drank|i took)\s+(.+)/))){

    const hb = (state.habits||[]).find(x=>x.name.toLowerCase().includes(q));

}
/* AI can return actions as JSON — Orbie executes them */
function aiDo(cmd){
  try{
    if(cmd.do==="add" && cmd.title){
      const sp = getSpace(defaultNotesSpaceId()) || state.spaces[0];
      let due = null;
      if(cmd.due==="today") due = todayStr();
      else if(cmd.due==="tomorrow") due = addDays(1);
      else if(/^\d{4}-\d{2}-\d{2}$/.test(cmd.due||"")) due = cmd.due;
      const nt = {id:uid(), spaceId:sp.id, title:String(cmd.title).slice(0,140), desc:"", due:due, priority:Math.min(3, Math.max(0, +cmd.priority||0)), repeat:null, stage:sp.stages[0].id, done:false, createdAt:Date.now(), completedAt:null, checklist:[]};
      state.tasks.push(nt); ui._justAdded = nt.id;
      playSound("add"); save(); render();
      return 'Added <b>'+esc(nt.title)+'</b>'+(due?' · '+fmtDue(due):'')+' → '+esc(sp.icon+" "+sp.name)+' ✓';
    }
    if(cmd.do==="done" && cmd.query){
      const t = findTask(String(cmd.query));
      if(t){ toggleTask(t.id, $("#mascot")); return 'Checked off <b>'+esc(t.title)+'</b> ✓'; }
      return "Could not find that task 🤔";
    }
    if(cmd.do==="due" && cmd.query){
      const t = findTask(String(cmd.query));
      if(!t) return "Could not find that task 🤔";
      let due = cmd.due==="today" ? todayStr() : cmd.due==="tomorrow" ? addDays(1) : (/^\d{4}-\d{2}-\d{2}$/.test(cmd.due||"") ? cmd.due : null);
      if(!due) return "When exactly? 📅";
      t.due = due; save(); render();
      return '📅 <b>'+esc(t.title)+'</b> → '+fmtDue(due);
    }
    if(cmd.do==="focus"){ if(!fsess) startFocus(null); return "🎯 Focus started."; }
  }catch(e){}
  return null;
}
/* the router: pending add → smalltalk → smart local → commands → tasks → AI → fallback */
function orbieProcess(v){
  orbieLog.push({r:"u", t:esc(v)});

    orbiePending = null;
    orbieDoAdd(v.replace(/^(add|task|todo)\s*[:\-]?\s*/i,""));

  }
  const small = orbieSmalltalk(v);

  const local = orbieLocal(v);
  if(local){ orbieReply(local); return; }
  const cmd = orbieCommand(v);
  if(cmd){ orbieReply(cmd); return; }
  if(taskish(v)){
    orbieDoAdd(v.replace(/^(add|task|todo)\s*[:\-]?\s*/i,"").replace(/^remind me( to)?\s*/i,"").replace(/^remember to\s*/i,""));

    renderOrbieThread();
    orbieAsk(v).then(r=>{
      ph.typing = false;
      let txt = (aiText(r)||"").trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim();
      if(/^\{/.test(txt)){
        try{
          const done = aiDo(JSON.parse(txt));
          if(done){ ph.t = done; renderOrbieThread(); renderOrbieChips(); orbieSaveLog(); playSound("pop"); return; }
        }catch(e){}
      }
      ph.t = txt ? esc(txt.slice(0, 280)) : "Hmm, my antenna glitched 📡 Try that again?";
      renderOrbieThread(); orbieSaveLog();
      playSound("pop");
    }).catch(()=>{
      ph.typing = false;
      ph.t = "My antenna glitched 📡 — the instant smarts still work though!";
      renderOrbieThread(); orbieSaveLog();
    });
    return;
  }
  orbieReply(pick([
    "Tell me more 🙂 Or hand me a task — <b>call mom fri !high</b>",
    "I chat even better once you sign in to sync ☁ (free AI). Meanwhile <b>help</b> shows my tricks.",
    "Try <b>what first?</b>, <b>my day</b>, or just give me something to remember 📝"
  ]));
}
function orbieStatusLine(){

  const hs = state.habits || [];
  const hLeft = hs.filter(x=>!(x.days && x.days[todayStr()])).length;

function taskish(raw){
  const low = raw.toLowerCase().trim();
  if(/^(add|task|todo|remind me|remember to)\b/.test(low)) return true;
  const p = parseQuick(raw);
  if(p.due || p.priority || p.repeat) return true;
  if(state.spaces.some(s2=>new RegExp("\\b(in|to|@)\\s+"+reEsc(s2.name.toLowerCase())+"\\b").test(low))) return true;
  if(low.split(/\s+/).length <= 7 && /^(buy|call|pay|email|send|book|finish|submit|review|write|clean|fix|check|prep|plan|schedule|update|renew|get|pick)\b/.test(low)) return true;
  return false;
}

      if(Array.isArray(c)) return c.map(x=>x && (x.text||"")).join(" ");

    if(r && typeof r.text === "string") return r.text;
    if(r && typeof r.toString === "function"){ const t2 = r.toString(); if(t2 && t2 !== "[object Object]") return t2; }
  }catch(e){}
  return "";
}

    if(re.test(text)){ target = s; text = text.replace(re,""); break; }
  }
  const p = parseQuick(text);
  if(!p.title) return null;
  const sp = target || (ui.view==="space" && getSpace(ui.spaceId)) || getSpace(defaultNotesSpaceId()) || state.spaces[0];
  const nt = {id:uid(), spaceId:sp.id, title:p.title, desc:"", due:p.due, priority:p.priority,
    repeat:p.repeat, stage:sp.stages[0].id, done:false, createdAt:Date.now(), completedAt:null, checklist:[]};
  state.tasks.push(nt);
  ui._justAdded = nt.id;
  save(); render();
  return {p:p, sp:sp};
}

function initMascot(){
  applyMascot();
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!reduce){
    let eyeRaf = null;
    document.addEventListener("mousemove", e=>{
      if(!mascotOn || eyeRaf) return;
      eyeRaf = requestAnimationFrame(()=>{
        eyeRaf = null;
        const m = $("#mascot"); if(!m || m.style.display==="none") return;
        const r = m.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const a = Math.atan2(e.clientY - cy, e.clientX - cx);
        const d = Math.min(3.4, Math.hypot(e.clientX - cx, e.clientY - cy) / 40);
        const tr = "translate("+(Math.cos(a)*d).toFixed(1)+"px,"+(Math.sin(a)*d).toFixed(1)+"px)";
        $$(".m-pupil").forEach(p=>p.style.transform = tr);
      });
    }, {passive:true});
    /* on phones the eyes follow your taps */
    document.addEventListener("touchstart", e=>{
      if(!mascotOn) return;
      const t = e.touches && e.touches[0]; if(!t) return;
      const m = $("#mascot"); if(!m || m.style.display==="none") return;
      const r = m.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const a = Math.atan2(t.clientY - cy, t.clientX - cx);
      const d = Math.min(3.4, Math.hypot(t.clientX - cx, t.clientY - cy) / 40);
      const tr = "translate("+(Math.cos(a)*d).toFixed(1)+"px,"+(Math.sin(a)*d).toFixed(1)+"px)";
      $$(".m-pupil").forEach(p=>p.style.transform = tr);
    }, {passive:true});
  }
  (function blinkLoop(){
    setTimeout(()=>{
      const eyes = $("#m-eyes");
      if(eyes && mascotOn){ eyes.classList.add("blink"); setTimeout(()=>eyes.classList.remove("blink"), 160); }
      blinkLoop();
    }, 2200 + Math.random()*3800);
  })();
  document.addEventListener("mousemove", mascotIdleReset, {passive:true});
  document.addEventListener("keydown", mascotIdleReset);
  document.addEventListener("touchstart", mascotIdleReset, {passive:true});
  mascotIdleReset();
  /* no unprompted greeting — Orbie speaks when you tap it */
}

/* ================================================================
   HABITS · daily check-ins, streaks with a one-gap ❄ freeze,
   synced through your cloud like everything else.
   ================================================================ */
function habitStreak(h){
  const days = h.days || {};
  let n = 0, used = false;
  const d = new Date();
  if(!days[dstr(d)]) d.setDate(d.getDate()-1);
  while(true){
    if(days[dstr(d)]){ n++; d.setDate(d.getDate()-1); continue; }
    if(!used && n>0){
      d.setDate(d.getDate()-1); /* peek past a single missed day */
      if(days[dstr(d)]){ used = true; continue; }
    }
    break;
  }
  return {n:n, frozen:used};
}

  const today = state.tasks.filter(t=>!t.done && t.spaceId===ws.id && ((t.due && dayDiff(t.due)<=0) || t.priority===3)).sort(sortTasks).slice(0,8);

let activeRec = null;
function startVoice(btn){
  const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SRC) return;
  if(activeRec){ try{ activeRec.stop(); }catch(e){} activeRec = null; $$(".mic.rec").forEach(b=>b.classList.remove("rec")); return; }
  const form = btn.closest("form");
  const inp = form && (form.elements["qa"] || form.elements["oi"]);
  if(!inp) return;
  const r = new SRC();
  activeRec = r;
  r.lang = navigator.language || "en-US";
  r.interimResults = true;
  r.continuous = false;
  const base = inp.value ? inp.value.replace(/\s+$/,"")+" " : "";
  btn.classList.add("rec");
  hapt();
  r.onresult = ev=>{
    let txt = "";
    for(const res of ev.results) txt += res[0].transcript;
    inp.value = base + txt;
    inp.dispatchEvent(new Event("input",{bubbles:true}));
  };
  r.onend = ()=>{ btn.classList.remove("rec"); activeRec = null; inp.focus(); };
  r.onerror = ()=>{ btn.classList.remove("rec"); activeRec = null; playSound("error"); showToast("Voice input is not available here"); };
  try{ r.start(); }catch(e){ btn.classList.remove("rec"); activeRec = null; }
}

function dayPlanText(md){
  const open = state.tasks.filter(t=>!t.done);
  const od = open.filter(t=>t.due && dayDiff(t.due)<0).sort(sortTasks);
  const dt = open.filter(t=>t.due && dayDiff(t.due)===0).sort(sortTasks);
  const dateLine = new Date().toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
  const lines = [(md?"# ":"")+"My day · "+dateLine];
  const item = t=>{ const sp = spaceOf(t); return (md?"- [ ] ":"• ")+t.title+(t.priority?" ("+PRI_NAMES[t.priority]+")":"")+" · "+sp.icon+" "+sp.name; };
  if(dt.length){ lines.push("", md?"## Due today":"DUE TODAY"); dt.forEach(t=>lines.push(item(t))); }
  if(od.length){ lines.push("", md?"## Overdue":"OVERDUE"); od.forEach(t=>lines.push(item(t))); }
  if(!dt.length && !od.length) lines.push("", "All clear ✨");
  const hs = state.habits || [];
  if(hs.length){ lines.push("", md?"## Habits":"HABITS"); hs.forEach(x=>lines.push((md?"- [ ] ":"• ")+(x.icon||"")+" "+x.name)); }

  ts.forEach(t=>{
    const dt = t.due.replace(/-/g,"");

  });

const getApp = id=>(state.apps||[]).find(a=>a.id===id);
const appIconHtml = a=>a && a.iconUrl ? '<img class="favi" src="'+esc(a.iconUrl)+'" alt="">' : esc((a && a.icon) || "🧩");

function mountApp(app){
  const wrap = $("#af-frames"); if(!wrap) return;
  let f = extFrames[app.id];
  if(!f){
    f = document.createElement("iframe");
    f.src = app.url;
    f.setAttribute("sandbox","allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals");
    f.setAttribute("allow","clipboard-write; fullscreen; geolocation");
    f.setAttribute("title", app.name);
    f.dataset.app = app.id;
    extFrames[app.id] = f;
    wrap.appendChild(f);
  }
  Object.keys(extFrames).forEach(k=>extFrames[k].classList.toggle("on", k===app.id));
  applyAppZoom(app);
}
function applyAppZoom(app){
  const f = extFrames[app.id]; if(!f) return;
  const z = Math.min(1.6, Math.max(0.5, +app.zoom || 1));
  f.style.transform = z===1 ? "" : "scale("+z+")";
  f.style.width = z===1 ? "" : (100/z).toFixed(4)+"%";
  f.style.height = z===1 ? "" : (100/z).toFixed(4)+"%";
  const lb = document.getElementById("af-zoom");
  if(lb && currentAppId()===app.id) lb.textContent = Math.round(z*100)+"%";
}
function bumpAppZoom(delta){
  const a = getApp(currentAppId()); if(!a) return;
  const cur = +a.zoom || 1;

      drag = t; ui._intDrag = true;
      t.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", t.dataset.id); }catch(_){}
    });
    t.addEventListener("dragend", ()=>{
      ui._intDrag = false;
      if(!drag) return;
      drag.classList.remove("dragging"); drag = null;
      const ids = $$(".lp-tile[data-id]", grid).map(x=>x.dataset.id);
      const before = (state.apps||[]).map(a=>a.id).join(",");
      state.apps.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
      if(state.apps.map(a=>a.id).join(",") !== before){
        playSound("move");
        save(); renderSidebar();
        showToast("Apps rearranged");
      }
    });
    t.addEventListener("dragover", e=>{
      if(!drag || drag===t) return;
      e.preventDefault();
      const r = t.getBoundingClientRect();
      grid.insertBefore(drag, (e.clientX - r.left) < r.width/2 ? t : t.nextSibling);
    });
  });
}

/* ---------------- swipe actions (mobile): right = done, left = delete ---------------- */
function bindSwipes(container){
  if(!featOn("swipes") || !isMobile()) return;
  $$(".task", container).forEach(row=>{
    if(row.dataset.sw) return;
    row.dataset.sw = "1";
    let sx = 0, sy = 0, dx = 0, active = false, canceled = false;
    row.addEventListener("touchstart", e=>{
      const t = e.touches[0]; if(!t) return;
      sx = t.clientX; sy = t.clientY; dx = 0; active = true; canceled = false;
    }, {passive:true});
    row.addEventListener("touchmove", e=>{
      if(!active || canceled) return;
      const t = e.touches[0]; if(!t) return;
      dx = t.clientX - sx;
      if(Math.abs(t.clientY - sy) > 30 || ui._lifting){
        canceled = true;
        row.style.transform = "";
        row.classList.remove("swipe-r","swipe-l");
        return;
      }
      if(Math.abs(dx) > 12){
        row.style.transform = "translateX("+(dx*.85).toFixed(0)+"px)";
        row.classList.toggle("swipe-r", dx > 55);
        row.classList.toggle("swipe-l", dx < -55);
      }
    }, {passive:true});
    const endS = ()=>{
      if(!active) return;
      active = false;
      row.style.transition = "transform .25s cubic-bezier(.25,.8,.3,1)";
      row.style.transform = "";
      setTimeout(()=>{ row.style.transition = ""; }, 260);
      const id = row.dataset.id;
      if(!canceled && id){
        if(dx > 75) toggleTask(id, row);
        else if(dx < -75) deleteTasks([id]);
      }
      row.classList.remove("swipe-r","swipe-l");
      dx = 0;
    };
    row.addEventListener("touchend", endS);
    row.addEventListener("touchcancel", endS);
  });
}

let gxRaf = null, gxStars = [], gxRot = 0, gxPar = {x:0, y:0}, gxSel = -1;
function gxHash(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0)/4294967295; }
function buildGxStars(){
  const done = state.tasks.filter(t=>t.completedAt).sort((a,b)=>String(a.completedAt).localeCompare(String(b.completedAt)) || a.createdAt-b.createdAt);
  gxStars = done.map((t,i)=>{
    const sp = spaceOf(t);
    const jr = gxHash(t.id), ja = gxHash(t.id+"x");
    const th = i * 2.399963 + ja*.55;
    const r = 12 + 13*Math.sqrt(i) + jr*9;
    return { x:Math.cos(th)*r, y:Math.sin(th)*r*.62, s:(t.priority>=3?2.7:t.priority===2?2.1:1.6)+jr*.9,
             c:(sp && sp.color)||"#8f7be8", ph:ja*6.283, title:t.title, when:t.completedAt };
  });
}
function galaxyWeek(){
  const since = dAgo(6);
  const doneW = state.tasks.filter(t=>t.completedAt && t.completedAt >= since).length;
  let focusW = 0, habitW = 0, workW = 0;
  for(let i=0;i<7;i++){
    const day = dAgo(i);
    focusW += +((state.focus||{})[day])||0;
    workW  += +(((state.work||{}).log||{})[day])||0;
    (state.habits||[]).forEach(hb=>{ if(hb.days && hb.days[day]) habitW++; });
  }
  return {done:doneW, focus:focusW, habit:habitW, work:workW};
}
function galaxyShareText(){
  const wkk = galaxyWeek();
  const total = Math.max(gxStars.length, (function(){ try{ return +localStorage.getItem(DONE_KEY)||0; }catch(e){ return 0; } })());
  return "🪐 My Orbit galaxy: "+total+" stars (every one a finished task)\n"+
    "This week: "+wkk.done+" done · "+fmtMin(wkk.focus)+" focused · "+wkk.habit+" habit checks"+(wkk.work?" · "+fmtHM(wkk.work*60000)+" worked":"")+"\n"+
    "Small steps every day ✨";
}
function openGalaxy(){
  buildGxStars();
  document.body.classList.add("galaxy-open");
  playSound("sparkle");
  gxSel = -1; gxRot = 0;
  const total = Math.max(gxStars.length, (function(){ try{ return +localStorage.getItem(DONE_KEY)||0; }catch(e){ return 0; } })());
  const sub = $("#gx-sub");
  if(sub) sub.textContent = gxStars.length
    ? total+" stars — every single one is something you finished. Click one to remember."
    : "Empty space, endless potential — finish your first task and a star is born.";
  const wkk = galaxyWeek();
  const foot = $("#gx-foot");
  if(foot) foot.innerHTML =
    '<span class="gx-stat">This week <b>'+wkk.done+'</b> done</span>'+
    '<span class="gx-stat">🎯 <b>'+fmtMin(wkk.focus)+'</b> focused</span>'+
    '<span class="gx-stat">🌱 <b>'+wkk.habit+'</b> habit checks</span>'+
    (wkk.work ? '<span class="gx-stat">🏢 <b>'+fmtHM(wkk.work*60000)+'</b> worked</span>' : '')+
    '<button class="gx-share" data-act="galaxy-share">✨ Copy my week</button>';
  const tip = $("#gx-tip"); if(tip) tip.classList.remove("on");
  const yr = $("#gx-year");
  if(yr){
    const counts = {};
    state.tasks.forEach(t=>{ if(t.completedAt) counts[t.completedAt] = (counts[t.completedAt]||0) + 1; });
    (state.habits||[]).forEach(hb=>Object.keys(hb.days||{}).forEach(dk=>{ if(hb.days[dk]) counts[dk] = (counts[dk]||0) + .5; }));
    const days = 182;
    let cells = "";
    const startPad = (parseDay(dAgo(days-1)).getDay()+6)%7;
    for(let p2=0;p2<startPad;p2++) cells += '<i style="visibility:hidden"></i>';
    for(let i=days-1;i>=0;i--){
      const day = dAgo(i);
      const v = counts[day]||0;
      const lv = v>=7?4 : v>=4?3 : v>=2?2 : v>=1?1 : 0;
      cells += '<i class="'+(lv?("l"+lv):"")+'" title="'+parseDay(day).toLocaleDateString(undefined,{month:"short",day:"numeric"})+' · '+Math.round(v)+'"></i>';
    }
    yr.innerHTML = cells;
  }
  gxLoop();
}
function closeGalaxy(){
  document.body.classList.remove("galaxy-open");
  if(gxRaf){ cancelAnimationFrame(gxRaf); gxRaf = null; }
}
function gxLoop(){
  const cvs2 = document.getElementById("gx-canvas");
  if(!cvs2 || !document.body.classList.contains("galaxy-open")) return;
  const ctx2 = cvs2.getContext ? cvs2.getContext("2d") : null;
  if(!ctx2) return; /* headless / very old browsers: header + stats still work */
  const draw = (now)=>{
    if(!document.body.classList.contains("galaxy-open")){ gxRaf = null; return; }
    const W = cvs2.clientWidth || innerWidth, H = cvs2.clientHeight || innerHeight;
    if(cvs2.width !== W) cvs2.width = W;
    if(cvs2.height !== H) cvs2.height = H;
    ctx2.clearRect(0, 0, W, H);
    for(let i=0;i<130;i++){
      const bx = gxHash("bg"+i)*W, by = gxHash("gb"+i)*H;
      const tw2 = isReduced() ? .5 : .3 + .45*Math.abs(Math.sin(now/900 + i));
      ctx2.globalAlpha = tw2*.5;
      ctx2.fillStyle = "#cfd2ff";
      ctx2.fillRect(bx, by, 1.2, 1.2);
    }
    const cx = W/2 + gxPar.x, cy = H/2 + 26 + gxPar.y;
    if(!isReduced()) gxRot += .00045;
    const cos = Math.cos(gxRot), sin = Math.sin(gxRot);
    const maxR = Math.max(40, 13*Math.sqrt(Math.max(1, gxStars.length))+30);
    const scale = Math.min(1, (Math.min(W, H*1.5)/2 - 60)/maxR);
    gxStars.forEach((st2, i)=>{
      const rx = (st2.x*cos - st2.y*sin)*scale + cx;
      const ry = (st2.x*sin + st2.y*cos)*scale*.9 + cy;
      st2._sx = rx; st2._sy = ry;
      const tw = isReduced() ? .85 : .55 + .45*Math.sin(now/650 + st2.ph);
      ctx2.globalAlpha = Math.min(1, tw + (i===gxSel ? .4 : 0));
      ctx2.fillStyle = st2.c;
      ctx2.shadowColor = st2.c;
      ctx2.shadowBlur = i===gxSel ? 18 : 7;
      ctx2.beginPath();
      ctx2.arc(rx, ry, st2.s*(i===gxSel?1.7:1), 0, 6.283);
      ctx2.fill();
    });
    ctx2.shadowBlur = 0;
    ctx2.globalAlpha = 1;
    gxRaf = isReduced() ? null : requestAnimationFrame(draw);
  };
  gxRaf = requestAnimationFrame(draw);
}
document.addEventListener("mousemove", e=>{
  if(!document.body.classList.contains("galaxy-open")) return;
  gxPar.x = (e.clientX/innerWidth - .5)*16;
  gxPar.y = (e.clientY/innerHeight - .5)*10;
}, {passive:true});
document.addEventListener("click", e=>{
  if(!document.body.classList.contains("galaxy-open")) return;
  if(e.target && e.target.id !== "gx-canvas") return;
  let best = -1, bd = 16;
  gxStars.forEach((st2, i)=>{
    const dx = (st2._sx||0) - e.clientX, dy = (st2._sy||0) - e.clientY;
    const dd = Math.hypot(dx, dy);
    if(dd < bd){ bd = dd; best = i; }
  });
  const tip = $("#gx-tip");
  if(best > -1 && tip){
    gxSel = best;
    const st2 = gxStars[best];
    tip.innerHTML = "★ "+esc(st2.title)+'<div class="d">finished '+esc(fmtDue(st2.when))+"</div>";
    tip.style.left = Math.min(innerWidth-260, Math.max(8, e.clientX+14))+"px";
    tip.style.top = Math.max(8, e.clientY-14)+"px";
    tip.classList.add("on");
    playSound("pop");
    if(isReduced()) gxLoop();
  } else if(tip){ tip.classList.remove("on"); gxSel = -1; }
});

function buildBriefing(){
  if(document.getElementById("brief")) return;
  const b2 = document.createElement("div");
  b2.id = "brief";
  b2.setAttribute("role","dialog");
  b2.setAttribute("aria-label","Daily briefing");

  document.body.appendChild(b2);

function showBriefing(){
  buildBriefing();
  const open = state.tasks.filter(t=>!t.done);
  const dt = open.filter(t=>t.due && dayDiff(t.due)===0).sort(sortTasks);
  const od = open.filter(t=>t.due && dayDiff(t.due)<0).length;
  const hs = state.habits || [];
  const hLeft = hs.filter(x=>!(x.days && x.days[todayStr()])).length;
  const yD = state.tasks.filter(t=>t.completedAt===dAgo(1)).length;
  const ws = getSpace(state.prefs && state.prefs.workSpace);
  const wDue = ws ? open.filter(t=>t.spaceId===ws.id && t.due && dayDiff(t.due)<=0).length : 0;
  const hr = new Date().getHours();
  const greet = hr<12 ? "Good morning" : hr<18 ? "Good afternoon" : "Good evening";
  const row2 = (i2,txt)=>'<div class="bf-row"><span class="bf-i">'+i2+'</span><span>'+txt+'</span></div>';
  let inner = '<div class="bf-kicker">'+new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+'</div>'+
    '<div class="bf-title">'+greet+', '+esc(state.userName)+' ☀️</div>';
  inner += dt.length
    ? row2("📆","<b>"+dt.length+" due today</b> — "+esc(dt.slice(0,3).map(t=>t.title).join(", "))+(dt.length>3?"…":""))
    : row2("📆","Nothing due today — a free orbit");
  if(od) inner += row2("⏳","<b>"+od+" overdue</b> waiting for a rescue");
  if(hs.length) inner += row2("🌱", hLeft ? "<b>"+hLeft+" habit"+(hLeft>1?"s":"")+"</b> to keep alive today" : "All habits already done ✨");
  if(ws && wDue) inner += row2("🏢","<b>"+wDue+"</b> need attention at work");
  if(yD) inner += row2("⭐","Yesterday you finished <b>"+yD+"</b> — "+(yD>2?"strong":"steady")+" pace");
  inner += '<div class="bf-actions">'+
    '<button type="button" class="btn primary" data-act="brief-close">Start the day</button>'+
    '<button type="button" class="btn ghost" data-act="brief-first">🧭 What first?</button>'+
    '<button type="button" class="btn ghost" data-act="brief-focus">🎯 Focus</button>'+

  const card = document.getElementById("brief-card");
  if(card) card.innerHTML = inner;
  document.body.classList.add("brief-open");
  try{ localStorage.setItem("orbit-brief", todayStr()); }catch(e){}
  playSound("sparkle");
}

  return '<div class="stat tile2" style="--sc:var(--green)">'+
    '<div style="min-width:64px;flex-shrink:0"><div class="num">'+done+'<span style="font-size:13px;color:var(--faint);font-weight:700"> / '+hs.length+'</span></div><div class="lbl">Habits today</div></div>'+
    '<span class="hb-chips">'+chips+'</span>'+
    '<button class="icon-btn" data-act="nav-habits" title="All habits">→</button>'+
  '</div>';
}

/* ================================================================
   FOCUS TIMER · 25 minute sessions on any task.
   The pill floats above everything, survives reloads, and completed
   minutes are written into state.focus so they sync to your cloud
   and show up on every device's dashboard.
   ================================================================ */
const FOCUS_LEN = 25*60000;
const FOCUS_SS = "orbit-focus-session";
let fsess = null;
try{ fsess = JSON.parse(localStorage.getItem(FOCUS_SS)||"null"); }catch(e){}
function fsSave(){ try{ fsess ? localStorage.setItem(FOCUS_SS, JSON.stringify(fsess)) : localStorage.removeItem(FOCUS_SS); }catch(e){} }
const fsRemain = ()=> fsess ? (fsess.remain!=null ? fsess.remain : Math.max(0, fsess.end - Date.now())) : 0;
const fmtMin = m=> m>=60 ? Math.floor(m/60)+"h"+(m%60 ? " "+(m%60)+"m" : "") : m+"m";
function focusToday(){ return Math.round(+((state.focus||{})[todayStr()])||0); }

function startFocus(taskId){
  const t = taskId ? state.tasks.find(x=>x.id===taskId) : null;
  const flen = ((state.prefs && +state.prefs.focusLen) || 25) * 60000;
  fsess = { taskId: t?t.id:null, title: t?t.title:"Deep focus", end: Date.now()+flen, remain:null, total:flen };
  fsSave(); renderFocusPill();
  document.body.classList.add("focus-on");
  hapt();
  playSound("focus-start");
  mascotSay("Focus time. I'll keep quiet 🤫", 2200);
}
function pauseFocus(){
  if(!fsess) return;
  if(fsess.remain!=null){ fsess.end = Date.now()+fsess.remain; fsess.remain = null; }
  else fsess.remain = Math.max(0, fsess.end - Date.now());
  fsSave(); renderFocusPill();
  playSound(fsess.remain!=null ? "pause" : "resume");
}
function logFocus(mins){
  if(mins<1) return;
  if(!state.focus || typeof state.focus !== "object") state.focus = {};
  state.focus[todayStr()] = (+state.focus[todayStr()]||0) + mins;
  save();
}
function stopFocus(finished){
  if(!fsess) return;
  const total = fsess.total;
  const spent = Math.round((total - fsRemain())/60000);
  fsess = null; fsSave();
  document.body.classList.remove("focus-on");
  document.title = "Orbit: Tasks & Notes";
  if(finished){
    logFocus(Math.round(total/60000));
    playSound("focus");
    confettiBurst(innerWidth/2, innerHeight-110, "#8f7be8");
    mascotHappy();
    showToast("🎯 25 focused minutes done · "+fmtMin(focusToday())+" today");
    render();
  } else if(spent>=1){
    playSound("close");
    logFocus(spent);
    showToast("Focus ended · "+spent+" min counted");
    render();
  }
}
function renderFocusPill(){
  const el = $("#focus-pill"); if(!el) return;
  if(!fsess){ el.innerHTML = ""; return; }
  const paused = fsess.remain!=null;
  el.classList.toggle("paused", paused);
  const C = (2*Math.PI*13).toFixed(1);
  el.innerHTML =
    '<svg class="fring" viewBox="0 0 30 30" aria-hidden="true"><circle class="bgc" cx="15" cy="15" r="13"/>'+
    '<circle class="fgc" id="f-ring" cx="15" cy="15" r="13" stroke-dasharray="'+C+'" stroke-dashoffset="0"/></svg>'+
    '<div><div class="ft" id="f-time">25:00</div><div class="fl">'+esc(fsess.title)+'</div></div>'+
    '<button class="icon-btn" data-act="focus-pause" title="'+(paused?"Resume":"Pause")+'">'+(paused?"▶":"⏸")+'</button>'+
    '<button class="icon-btn" data-act="focus-stop" title="End focus">✕</button>';
  updateFocusPill();
}
function updateFocusPill(){
  if(!fsess) return;
  const rem = fsRemain();
  const sec = Math.ceil(rem/1000);
  const clock = Math.floor(sec/60)+":"+pad(sec%60);
  const tEl = $("#f-time"), rEl = $("#f-ring");
  if(tEl) tEl.textContent = clock;
  if(rEl) rEl.style.strokeDashoffset = (2*Math.PI*13 * (rem/fsess.total)).toFixed(1);
  const pl = $("#focus-pill");
  if(pl) pl.classList.toggle("ending", fsess.remain==null && sec <= 60);
  /* live countdown in the tab title, like a Live Activity */
  document.title = "("+clock+") Orbit";
}
setInterval(()=>{
  if(!fsess) return;
  if(fsess.remain==null && fsRemain()<=0){ stopFocus(true); return; }
  updateFocusPill();
}, 1000);

document.addEventListener("submit", e=>{
  const f = e.target, kind = f.dataset.form;
  if(!kind) return;
  e.preventDefault();
  if(kind==="hello"){ finishHello(); return; }
  if(kind==="quickadd-today"){
    const v = f.elements["qa"].value.trim(); if(!v) return;
    const out = orbieAddTask(v);
    if(out){
      hapt();
      playSound("add");
      showToast("✓ Added to "+out.sp.icon+" "+out.sp.name);
    }
    return;
  }
  if(kind==="quickadd"){
    const v = f.elements["qa"].value.trim(); if(!v) return;
    const p = parseQuick(v); if(!p.title) return;
    const sp = getSpace(f.dataset.space); if(!sp) return;
    const nt = {id:uid(), spaceId:sp.id, title:p.title, desc:"", due:p.due, priority:p.priority,
      repeat:p.repeat, stage:sp.stages[0].id, done:false, createdAt:Date.now(), completedAt:null};
    state.tasks.push(nt);
    ui._justAdded = nt.id;
    playSound("add");
    save(); ui._focusQA = true; render();
  }
  else if(kind==="pin-set"){
    const p1 = f.elements["p1"].value.trim(), p2 = f.elements["p2"].value.trim();
    if(!/^\d{4,8}$/.test(p1)){ playSound("error"); showToast("PIN must be 4–8 digits"); return; }
    if(p1 !== p2){ playSound("error"); showToast("PINs do not match"); return; }
    hashPin(p1).then(h=>{ state.prefs.lockHash = h; save(); closeModal(); playSound("done"); showToast("🔒 App lock is on — L locks instantly"); });
  }
  else if(kind==="pin-change"){
    const p0 = f.elements["p0"].value.trim(), p1 = f.elements["p1"].value.trim(), p2 = f.elements["p2"].value.trim();
    if(!/^\d{4,8}$/.test(p1)){ playSound("error"); showToast("New PIN must be 4–8 digits"); return; }
    if(p1 !== p2){ playSound("error"); showToast("New PINs do not match"); return; }
    hashPin(p0).then(h=>{
      if(h !== state.prefs.lockHash){ playSound("error"); showToast("Current PIN is wrong"); return; }
      const wasTrusted = deviceTrusted();
      hashPin(p1).then(h2=>{
        state.prefs.lockHash = h2;
        try{ if(wasTrusted) localStorage.setItem("orbit-trusted", h2); }catch(e){}
        save(); closeModal(); playSound("done");
        showToast("🔒 PIN updated everywhere — other devices will need it once");
      });
    });
  }
  else if(kind==="pin-off"){
    hashPin(f.elements["p1"].value.trim()).then(h=>{
      if(h === state.prefs.lockHash){ state.prefs.lockHash = null; try{ localStorage.removeItem("orbit-trusted"); }catch(e){} save(); closeModal(); showToast("App lock is off"); }
      else { playSound("error"); showToast("Wrong PIN"); }
    });
  }
  else if(kind==="app"){
    const name = f.elements["name"].value.trim();
    let url = f.elements["url"].value.trim();
    if(!name || !url) return;
    if(!/^https?:\/\//i.test(url)) url = "https://"+url;
    try{ new URL(url); }catch(err){ playSound("error"); showToast("That URL doesn't look right"); return; }
    const id = f.dataset.id;
    const icon = f.elements["icon"].value || "🧩";
    const color = f.elements["color"].value;
    const iconUrl = (f.elements["iconurl"] && f.elements["iconurl"].value.trim()) || null;
    if(id){
      const a = getApp(id);
      if(a){
        const changed = a.url !== url;
        Object.assign(a, {name:name, url:url, icon:icon, color:color, iconUrl:iconUrl});
        if(changed && extFrames[id]) extFrames[id].src = url;
      }
    } else {
      const a = {id:uid(), name:name, url:url, icon:icon, color:color, iconUrl:iconUrl, createdAt:Date.now()};
      state.apps.push(a);
      ui.view = "ext"; ui.appId = a.id;
    }
    save(); closeModal(); render();
  }
  else if(kind==="habit"){
    const name = f.elements["name"].value.trim(); if(!name) return;
    const icon = f.elements["icon"].value || "✅";
    const color = f.elements["color"].value;
    const id = f.dataset.id;
    if(id){ const hb = state.habits.find(x=>x.id===id); if(hb) Object.assign(hb, {name:name, icon:icon, color:color}); }
    else state.habits.push({id:uid(), name:name, icon:icon, color:color, days:{}, createdAt:Date.now()});
    save(); closeModal(); render();
  }
  else if(kind==="task") submitTask(f);
  else if(kind==="space") submitSpace(f);
  else if(kind==="note") submitNote(f);
  else if(kind==="orbie"){
    const v = f.elements["oi"].value.trim(); if(!v) return;
    f.elements["oi"].value = "";
    mascotHappy();
    if(!document.body.classList.contains("orbie-open")) openOrbiePanel();
    orbieProcess(v);
  }
});

document.addEventListener("keydown", e=>{
  if(document.body.classList.contains("locked")){
    if(e.key==="Enter"){ e.preventDefault(); unlockTry(); }
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openCmd(); return; }
  if(e.key==="Escape"){ closeModal(); closeOrbieChat(); closePopover(); closeGalaxy(); closeBriefing(); closeGuide(); closeLaunchpad(); return; }
  if((e.key==="Enter" || e.key===" ") && e.target && e.target.getAttribute && e.target.getAttribute("role")==="button" && e.target.dataset && e.target.dataset.act){
    e.preventDefault(); e.target.click(); return;
  }
  if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){
    const mf = $("#modal-root form");
    if(mf){ e.preventDefault(); if(mf.requestSubmit) mf.requestSubmit(); return; }
  }
  if(e.key==="Enter" && !e.shiftKey && e.target.tagName==="INPUT" && e.target.closest && e.target.closest(".cl-row")){
    e.preventDefault();
    const addBtn = $('#modal-root [data-act="cl-add"]');
    if(addBtn) addBtn.click();
    return;
  }
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select" || e.target.isContentEditable) return;
  if(document.querySelector("#modal-root .overlay")) return;
  if(document.body.classList.contains("lpad-open") && e.key.toLowerCase()!=="a") return;
  if(document.body.classList.contains("orbie-open") && e.key.toLowerCase()!=="o") return;
  if(e.key==="?"){ e.preventDefault(); openShortcuts(); return; }
  if(e.key==="/"){ e.preventDefault(); const s=$("#search"); if(s) s.focus(); }
  else if(!e.ctrlKey && !e.metaKey && !e.altKey){
    const k = e.key.toLowerCase();
    if(k==="n"){ e.preventDefault(); openTaskModal(null); }
    else if(k==="t"){ e.preventDefault(); ui.view="today"; ui.spaceId=null; render(); }
    else if(k==="w"){ e.preventDefault(); ui.view="week"; ui.spaceId=null; render(); }
    else if(k==="h"){ e.preventDefault(); ui.view="habits"; ui.spaceId=null; render(); }
    else if(k==="p"){ e.preventDefault(); ui.view="pad"; ui.spaceId=null; render(); }
    else if(k==="f"){ e.preventDefault(); if(!fsess) startFocus(null); }
    else if(k==="m"){ e.preventDefault(); toggleSound(); }
    else if(k==="o"){ e.preventDefault(); if(orbieChatOpen) closeOrbieChat(); else openOrbiePanel(); }
    else if(k==="a"){ e.preventDefault(); document.body.classList.contains("lpad-open") ? closeLaunchpad() : openLaunchpad(); }
    else if(k==="l"){ if(state.prefs && state.prefs.lockHash){ e.preventDefault(); lockNow(); } }
    else if(ui.view==="ext" && (e.key==="+" || e.key==="=")){ e.preventDefault(); bumpAppZoom(0.1); }
    else if(ui.view==="ext" && e.key==="-"){ e.preventDefault(); bumpAppZoom(-0.1); }
    else if(ui.view==="ext" && e.key==="0"){ e.preventDefault(); bumpAppZoom(0); }
  }
