const KV_KEY = "orbit-state-v1";

let cloud = {on:false, user:null};
let syncStatus = "loading";  /* loading | signedout | on | off */
let pushTimer = null, pollTimer = null;

function waitForPuter(ms){
  return new Promise(res=>{
    const t0 = Date.now();
    (function chk(){
      if(window.puter && window.puter.auth && window.puter.kv) return res(true);
      if(Date.now()-t0 > ms) return res(false);
      setTimeout(chk, 300);
    })();
  });
}

async function initCloud(){
  const ok = await waitForPuter(9000);
  if(!ok){ syncStatus = "off"; renderSidebar(); return; }
  try{
    if(puter.auth.isSignedIn()){ await cloudSignedIn(); }
    else { syncStatus = "signedout"; }
  }catch(e){ syncStatus = "signedout"; }
  renderSidebar();
}

async function cloudSignedIn(){
  try{ cloud.user = await puter.auth.getUser(); }catch(e){ cloud.user = null; }
  cloud.on = true; syncStatus = "on";
  await pullCloud(true);
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>pullCloud(false), 20000);
  renderSidebar();
}

/* combine two copies of the data without losing anything and without duplicates */
function mergeStates(a, b){
  const newer = (a.updatedAt||0) >= (b.updatedAt||0) ? a : b;
  const older = newer===a ? b : a;
  const m = JSON.parse(JSON.stringify(newer));
  m.spaces = Array.isArray(m.spaces) ? m.spaces : [];
  m.tasks  = Array.isArray(m.tasks)  ? m.tasks  : [];
  m.pages  = Array.isArray(m.pages)  ? m.pages  : [];
  const spKey = s=>(s.name||"").toLowerCase().trim();
  const nSig = n=>((n.title||"")+"|"+(n.body||"")).trim().toLowerCase();
  const map = {};
  (older.spaces||[]).forEach(os=>{
    let ms = m.spaces.find(x=>x.id===os.id) || m.spaces.find(x=>spKey(x)===spKey(os));
    if(!ms){ m.spaces.push(JSON.parse(JSON.stringify(os))); map[os.id] = os.id; return; }
    map[os.id] = ms.id;
    ms.notes = Array.isArray(ms.notes) ? ms.notes : [];
    const haveIds = new Set(ms.notes.map(x=>x.id));
    const have = new Set(ms.notes.map(nSig));
    (os.notes||[]).forEach(n=>{
      if(haveIds.has(n.id)) return;   /* same note, older edit — the newer copy already won */
      if(have.has(nSig(n))) return;   /* identical content under a different id */
      ms.notes.push(n); haveIds.add(n.id); have.add(nSig(n));
    });
  });
  const sigIn = (t, spaces)=>{
    const sp = (spaces||[]).find(s=>s.id===t.spaceId);
    return (t.title||"").toLowerCase().trim()+"|"+(sp ? spKey(sp) : t.spaceId);
  };
  const haveT = new Set(m.tasks.map(t=>sigIn(t, m.spaces)));
  const idsT = new Set(m.tasks.map(t=>t.id));
  (older.tasks||[]).forEach(t=>{
    if(idsT.has(t.id)) return;
    if(haveT.has(sigIn(t, older.spaces))) return;
    const target = map[t.spaceId] || (m.spaces.some(s=>s.id===t.spaceId) ? t.spaceId : (m.spaces[0] && m.spaces[0].id));
    if(!target) return;
    const c = JSON.parse(JSON.stringify(t));
    c.spaceId = target;
    const tsp = m.spaces.find(s=>s.id===target);
    if(tsp && !tsp.stages.some(st=>st.id===c.stage)) c.stage = tsp.stages[0].id;
    m.tasks.push(c);
    haveT.add(sigIn(c, m.spaces));
  });
  const pSig = p=>((p.title||"")+"|"+(p.body||"")).trim().toLowerCase();
  const havePIds = new Set(m.pages.map(x=>x.id));
  const haveP = new Set(m.pages.map(pSig));
  (older.pages||[]).forEach(p=>{
    if(havePIds.has(p.id)) return;
    if(haveP.has(pSig(p))) return;
    m.pages.push(p); havePIds.add(p.id); haveP.add(pSig(p));
  });
  m.habits = Array.isArray(m.habits) ? m.habits : [];
  (Array.isArray(older.habits) ? older.habits : []).forEach(oh=>{
    const mh = m.habits.find(x=>x.id===oh.id);
    if(!mh){ m.habits.push(JSON.parse(JSON.stringify(oh))); return; }
    mh.days = mh.days || {};
    Object.keys(oh.days||{}).forEach(k=>{ if(oh.days[k]) mh.days[k] = true; });
  });
  m.apps = Array.isArray(m.apps) ? m.apps : [];
  (Array.isArray(older.apps) ? older.apps : []).forEach(oa=>{
    if(m.apps.some(x=>x.id===oa.id || (x.url||"").toLowerCase()===(oa.url||"").toLowerCase())) return;
    m.apps.push(JSON.parse(JSON.stringify(oa)));
  });
  m.work = (m.work && typeof m.work === "object") ? m.work : {log:{}, inAt:null};
  m.work.log = m.work.log || {};
  const oWk = (older.work && older.work.log) || {};
  Object.keys(oWk).forEach(k=>{ m.work.log[k] = Math.max(+m.work.log[k]||0, +oWk[k]||0); });
  if(m.work.inAt==null && older.work && older.work.inAt) m.work.inAt = older.work.inAt;
  m.prefs = Object.assign({}, older.prefs||{}, m.prefs||{});
  if(!m.focus || typeof m.focus !== "object") m.focus = {};
  const oldF = (older.focus && typeof older.focus === "object") ? older.focus : {};
  Object.keys(oldF).forEach(k=>{ m.focus[k] = Math.max(+m.focus[k]||0, +oldF[k]||0); });
  return m;
}

function applyRemote(remote, first){
  if(first){
    let dirty = false;

    if(!dirty){
      state = remote;

    state.updatedAt = Date.now();

    pushCloud(true);

  }
  if((remote.updatedAt||0) > (state.updatedAt||0)){
    state = remote;

    ensureExtras();
    syncThemeFromState(true);

/* self-healing dedupe: repairs duplicates created by the old merge.
   Same id → keep the copy with the longer body (the fuller edit).
   Identical title+body under different ids → collapse to one. */
let _lastDedupe = 0;
function dedupeData(){
  let fixed = 0;
  const sigOf = o=>((o.title||"")+"|"+(o.body||"")).trim().toLowerCase();
  const cleanList = list=>{
    const byId = {}, out = [];
    (list||[]).forEach(o=>{
      if(!o || !o.id) return;
      const prev = byId[o.id];
      if(prev){
        fixed++;
        if(String(o.body||"").length > String(prev.body||"").length){
          out[out.indexOf(prev)] = o; byId[o.id] = o;
        }
        return;
      }
      byId[o.id] = o; out.push(o);
    });
    const seen = new Set(), out2 = [];
    out.forEach(o=>{
      const sig = sigOf(o);
      if(sig !== "|" && seen.has(sig)){ fixed++; return; }
      seen.add(sig); out2.push(o);
    });
    return out2;
  };
  state.spaces.forEach(sp=>{ if(Array.isArray(sp.notes)) sp.notes = cleanList(sp.notes); });
  if(Array.isArray(state.pages)) state.pages = cleanList(state.pages);
  const tIds = new Set(), tOut = [];
  (state.tasks||[]).forEach(t=>{ if(!t || !t.id) return; if(tIds.has(t.id)){ fixed++; return; } tIds.add(t.id); tOut.push(t); });
  state.tasks = tOut;
  return fixed;
}

      sparkle:  ()=>{ tone(920,0,.06,{gain:.05}); tone(1320,.05,.06,{gain:.05}); tone(1760,.1,.1,{gain:.05}); },

/* Theme switch design: the new theme reveals as a circle growing out of
   the toggle button (View Transitions API). The old theme is snapshotted
   and stays perfectly still underneath while the new one expands over it
   with a fast-out, gentle-land curve (550ms). Falls back to a soft 450ms
   crossfade, and to an instant switch when reduced motion is preferred. */

/* ---------------- generic drag to reorder (mouse + touch) ---------------- */
function makeSortable(list, sel, commit, grid, sameGroupOnly){
  const items = $$(sel, list);
  let dragEl = null;
  const groupOf = el=>{
    const body = el.closest(".group-body");
    if(body) return body.previousElementSibling;
    let p = el.previousElementSibling;
    while(p && !p.classList.contains("group-head")) p = p.previousElementSibling;
    return p;
  };
  const canPair = (a,b)=> !sameGroupOnly || groupOf(a)===groupOf(b);
  const placeAt = (el, t, x, y)=>{
    const r = t.getBoundingClientRect();
    let before;
    if(grid) before = (y < r.top) || (y <= r.bottom && x < r.left + r.width/2);
    else before = y < r.top + r.height/2;
    if(before) t.parentNode.insertBefore(el, t);
    else t.parentNode.insertBefore(el, t.nextSibling);
  };
  items.forEach(it=>{
    it.setAttribute("draggable","true");
    it.addEventListener("dragstart", e=>{
      dragEl = it; it.classList.add("drag-src");
      ui._intDrag = true;
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", it.dataset.id||""); }catch(_){}
    });
    it.addEventListener("dragend", ()=>{
      ui._intDrag = false;
      if(!dragEl) return;
      dragEl.classList.remove("drag-src"); dragEl = null;
      ui._justDragged = true; setTimeout(()=>{ ui._justDragged = false; }, 150);
      commit();
    });
    it.addEventListener("dragover", e=>{
      if(!dragEl || dragEl===it || !canPair(dragEl, it)) return;
      e.preventDefault();
      placeAt(dragEl, it, e.clientX, e.clientY);
    });
    let pressT=null, lifted=false, sy=0, sx=0;
    it.addEventListener("touchstart", e=>{
      const t = e.touches[0]; if(!t) return;
      lifted = false; sy = t.clientY; sx = t.clientX;
      pressT = setTimeout(()=>{
        lifted = true; ui._lifting = true;
        it.classList.add("lifting");
        try{ if(navigator.vibrate) navigator.vibrate(12); }catch(_){}
      }, 280);
    }, {passive:true});
    it.addEventListener("touchmove", e=>{
      const t = e.touches[0]; if(!t) return;
      if(!lifted){
        if(Math.abs(t.clientY-sy)>10 || Math.abs(t.clientX-sx)>10) clearTimeout(pressT);
        return;
      }
      e.preventDefault();
      const others = $$(sel, list).filter(x=>x!==it && canPair(it,x));
      for(const o of others){
        const r = o.getBoundingClientRect();
        if(t.clientY > r.top && t.clientY < r.bottom && (!grid || (t.clientX > r.left-10 && t.clientX < r.right+10))){
          placeAt(it, o, t.clientX, t.clientY); break;
        }
      }
    }, {passive:false});
    const endT = ()=>{
      clearTimeout(pressT);
      if(lifted){
        it.classList.remove("lifting");
        ui._lifting = false;
        ui._justDragged = true; setTimeout(()=>{ ui._justDragged = false; }, 200);
        commit();
      }
      lifted = false;
    };
    it.addEventListener("touchend", endT);
    it.addEventListener("touchcancel", endT);
  });
  list.addEventListener("dragover", e=>{ if(dragEl) e.preventDefault(); });
}

function commitTaskOrderFromDom(container){
  let counter = 0, changed = false;
  $$(".group-head, .task[data-id]", container).forEach(ch=>{
    if(ch.classList.contains("group-head")){ counter = 0; return; }
    const t = state.tasks.find(x=>x.id===ch.dataset.id);
    if(t){
      if(t.order !== counter) changed = true;
      t.order = counter;
      counter++;
    }
  });
  if(changed){ playSound("move"); save(); showToast("Reordered"); }
  render();
}
function commitNoteOrderFromDom(gridEl){
  let i = 0, changed = false;
  $$(".note[data-id]", gridEl).forEach(el=>{
    for(const sp of state.spaces){
      const n = (sp.notes||[]).find(x=>x.id===el.dataset.id);
      if(n){ if(n.order !== i) changed = true; n.order = i; break; }
    }
    i++;
  });
  if(changed){ playSound("move"); save(); showToast("Reordered"); }
  render();
}

/* ---------------- drag to reorder spaces (mouse + touch) ---------------- */
function commitSpaceOrder(){
  const ids = $$("#sidebar .nav-item[data-id]").map(b=>b.dataset.id);
  const before = state.spaces.map(s=>s.id).join(",");
  state.spaces.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
  if(state.spaces.map(s=>s.id).join(",") !== before){ playSound("move"); save(); showToast("Spaces reordered"); }
  render();
}

function bindSpaceDnD(){
  const list = $("#sidebar .sb-scroll"); if(!list) return;
  const items = $$(".nav-item[data-id]", list);
  let draggedEl = null;

  const placeAt = (el, target, clientY)=>{
    const r = target.getBoundingClientRect();
    const before = (clientY - r.top) < r.height/2;
    if(before) list.insertBefore(el, target);
    else list.insertBefore(el, target.nextSibling);
  };

  items.forEach(it=>{
    /* desktop: native drag */
    it.addEventListener("dragstart", e=>{
      draggedEl = it;
      it.classList.add("drag-src");
      ui._intDrag = true;
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", it.dataset.id); }catch(_){}
    });
    it.addEventListener("dragend", ()=>{
      ui._intDrag = false;
      if(!draggedEl) return;
      draggedEl.classList.remove("drag-src");
      draggedEl = null;
      ui._justDragged = true; setTimeout(()=>{ ui._justDragged = false; }, 150);
      commitSpaceOrder();
    });
    it.addEventListener("dragover", e=>{
      if(!draggedEl || draggedEl===it) return;
      e.preventDefault();
      placeAt(draggedEl, it, e.clientY);
    });

    /* mobile: long press to lift, slide to reorder */
    let pressT = null, lifted = false, sy = 0, sx = 0;
    it.addEventListener("touchstart", e=>{
      const t = e.touches[0]; if(!t) return;
      lifted = false; sy = t.clientY; sx = t.clientX;
      pressT = setTimeout(()=>{
        lifted = true;
        ui._spaceLift = true;
        it.classList.add("lifting");
        try{ if(navigator.vibrate) navigator.vibrate(12); }catch(_){}
      }, 260);
    }, {passive:true});
    it.addEventListener("touchmove", e=>{
      const t = e.touches[0]; if(!t) return;
      if(!lifted){
        if(Math.abs(t.clientY-sy)>10 || Math.abs(t.clientX-sx)>10) clearTimeout(pressT);
        return;
      }
      e.preventDefault();
      const others = $$(".nav-item[data-id]", list).filter(x=>x!==it);
      for(const o of others){
        const r = o.getBoundingClientRect();
        if(t.clientY > r.top && t.clientY < r.bottom){ placeAt(it, o, t.clientY); break; }
      }
    }, {passive:false});
    const endTouch = ()=>{
      clearTimeout(pressT);
      if(lifted){
        it.classList.remove("lifting");
        ui._spaceLift = false;
        ui._justDragged = true; setTimeout(()=>{ ui._justDragged = false; }, 180);
        commitSpaceOrder();
      }
      lifted = false;
    };
    it.addEventListener("touchend", endTouch);
    it.addEventListener("touchcancel", endTouch);
  });
  list.addEventListener("dragover", e=>{ if(draggedEl) e.preventDefault(); });
}

function chipsHtml(t, withSpace){
  const sp = spaceOf(t);

  if(withSpace) h += '<span class="chip space-chip" style="--c:'+sp.color+'">'+esc(sp.icon)+' '+esc(sp.name)+'</span>';

  if(t.repeat) h += '<span class="chip rep">↻ '+(REPEAT_NAMES[t.repeat]||"Repeats")+'</span>';

function taskRow(t, withSpace, idx){
  const flair = (t.id===ui._justAdded ? " just-in" : "") + (t.id===ui._justToggled ? " just-done" : "");
  return '<div class="task '+(t.done?"done":"")+flair+'" style="animation-delay:'+dly(idx)+'" data-act="open-task" data-id="'+t.id+'">'+
    '<button class="check" data-act="toggle" data-id="'+t.id+'" title="'+(t.repeat?"Done for today":"Mark done")+'">'+(t.done?"✓":"")+'</button>'+

    '</div>'+
    '<button class="icon-btn del" data-act="task-menu" data-id="'+t.id+'" title="More actions">⋯</button>'+
  '</div>';

function sortTasks(a,b){
  if(a.order!=null && b.order!=null && a.order!==b.order) return a.order-b.order;
  if(!!a.due!==!!b.due) return a.due?-1:1;
  if(a.due&&b.due&&a.due!==b.due) return a.due<b.due?-1:1;
  if(a.priority!==b.priority) return b.priority-a.priority;
  return a.createdAt-b.createdAt;
}
function noteSort(a,b){
  const pin = (b.pinned?1:0)-(a.pinned?1:0);
  if(pin) return pin;
  if(a.order!=null && b.order!=null && a.order!==b.order) return a.order-b.order;
  return b.createdAt-a.createdAt;
}

function isCollapsed(key, def){ return key in ui.collapsed ? ui.collapsed[key] : def; }

function groupSection(key, label, dotColor, tasks, withSpace, extras){
  if(!tasks.length) return "";
  const col = isCollapsed(key, key.endsWith(":done"));
  return '<div class="group-head '+(col?"collapsed":"")+'" data-act="collapse" data-key="'+key+'">'+
      '<span class="chev">▼</span><span class="dot" style="--gc:'+dotColor+'"></span>'+label+
      ' <span class="gcnt">'+tasks.length+'</span>'+(extras||"")+
    '</div>'+
    '<div class="group-body'+(col?" closed":"")+'"><div class="gb-in">'+tasks.map((t,i)=>taskRow(t, withSpace, i)).join("")+'</div></div>';
}

const REDUCE_MOTION = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)").matches : false;
function animateNums(){
  $$(".stat .num").forEach(el=>{
    if(el.dataset.n==null) return;
    const n = +el.dataset.n || 0;
    if(isReduced() || n <= 0){ el.textContent = n; return; }
    const t0 = performance.now(), dur = 420;
    el.textContent = "0";
    (function f(t){
      const k = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3)));
      if(k < 1) requestAnimationFrame(f);
    })(t0);
  });
}

function updateClock(){
  const el = $("#now");
  if(el) el.textContent = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});

function bindScratch(){
  const ta = $("#scratch-pad"); if(!ta) return;

  ta.addEventListener("input", ()=>{

    const s = ta.selectionStart;

    const m1 = $("#pad-meta"); if(m1) m1.textContent = countWords(ta.value)+" words · saving…";

      const pg = activePage();

      pg.updatedAt = Date.now();

/* ---------------- insert menu (slash commands) ---------------- */
const SNIPPETS = {
  h1: ()=>"# ",
  h2: ()=>"## ",
  bullet: ()=>"• ",
  todo: ()=>"[ ] ",
  divider: ()=>"\n──────────\n",
  date: ()=>new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+": ",
  meeting: ()=>"# Meeting notes ("+new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"})+")\nWith: \nAgenda:\n• \nDecisions:\n• \nAction items:\n[ ] \n",
  daily: ()=>"# Plan for "+new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})+"\nTop 3:\n1. \n2. \n3. \nLater:\n• \n",
  jobapp: ()=>"# Company: \nRole: \nLink: \nContact: \nStatus: Applied\nNotes:\n• \n"
};
function openInsertMenu(fromSlash){
  const ta = $("#scratch-pad"); if(!ta) return;
  const p = $("#popover");
  clearTimeout(closePopover._t); p.classList.remove("closing");
  const item = (k,ic,lb)=>'<button data-act="pad-insert" data-k="'+k+'" data-slash="'+(fromSlash?1:0)+'"><span>'+ic+'</span>'+lb+'</button>';
  p.innerHTML =
    item("h1","#","Heading")+
    item("h2","##","Subheading")+
    item("bullet","•","Bullet")+
    item("todo","☑","Checklist line")+
    item("divider","─","Divider")+
    item("date","📆","Date stamp")+
    '<div class="sep"></div>'+
    item("meeting","🗣","Template: meeting notes")+
    item("daily","🌅","Template: daily plan")+
    item("jobapp","💼","Template: job application");
  p.style.display = "block";
  const r = ta.getBoundingClientRect();
  const pr = p.getBoundingClientRect();
  p.style.left = Math.max(8, Math.min(r.left + 26, innerWidth - pr.width - 10))+"px";
  p.style.top  = Math.max(8, Math.min(r.top + 48, innerHeight - pr.height - 10))+"px";
}
function padInsert(key, replaceSlash){
  const ta = $("#scratch-pad"); if(!ta || !SNIPPETS[key]) return;
  const snippet = SNIPPETS[key]();
  let s = ta.selectionStart || 0;
  let v = ta.value;
  if(replaceSlash && s>0 && v[s-1]==="/"){ v = v.slice(0,s-1)+v.slice(s); s -= 1; }
  ta.value = v.slice(0,s)+snippet+v.slice(s);
  ta.selectionStart = ta.selectionEnd = s + snippet.length;
  ta.focus();
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}

function bindBoardDnD(){
  $$("#view .card").forEach(c=>{

    b.addEventListener("dragover",e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; b.classList.add("drop-hint"); });
    b.addEventListener("dragleave",()=>b.classList.remove("drop-hint"));
    b.addEventListener("drop",e=>{
      e.preventDefault(); b.classList.remove("drop-hint");

    });

/* ---------------- render root ---------------- */
function renderView(){
  if(ui.view==="space" && !getSpace(ui.spaceId)){ ui.view="today"; ui.spaceId=null; }
  const ac = currentAccent() || ((state.prefs && state.prefs.accent) || "");
  if(ac) document.documentElement.style.setProperty("--accent", ac);
  else document.documentElement.style.removeProperty("--accent");
  const key = ui.view+"|"+ui.spaceId+"|"+ui.tab;
  const viewChanged = key !== renderView._last;
  renderView._last = key;
  const viewEl = $("#view");
  const keepScroll = viewChanged ? 0 : viewEl.scrollTop;
  /* entrance animations only on real view changes → re-renders feel instant */
  viewEl.classList.toggle("anim-in", viewChanged);
  if(ui.view==="today"){ renderToday(); }
  else if(ui.view==="pad"){ renderPad(); }
  else if(ui.view==="week"){ renderWeek(); }
  else if(ui.view==="habits"){ renderHabits(); }
  else if(ui.view==="work"){ renderWork(); }
  else if(ui.view==="ext"){ $("#view").innerHTML = ""; }
  else {
    const s = getSpace(ui.spaceId);
    if(ui.tab==="board"){ renderBoardView(s); bindBoardDnD(); }
    else if(ui.tab==="notes"){ renderNotesView(s); }
    else { renderListView(s); }
  }
  if(viewChanged){
    const vi = viewEl.firstElementChild;
    if(vi) vi.classList.add("view-anim");
  } else {
    /* keep the exact scroll position across re-renders */
    viewEl.style.scrollBehavior = "auto";
    viewEl.scrollTop = keepScroll;
    viewEl.style.scrollBehavior = "";
  }
  ui._justAdded = ui._justToggled = ui._justMoved = null;
  try{ if(["today","work","week","habits","pad"].indexOf(ui.view) > -1) localStorage.setItem("orbit-last", ui.view); }catch(e){}
  bindSwipes(viewEl);
}
/* renders coalesce into one animation frame: many state changes, one paint */
let _renderRaf = null;
function render(){
  if(_renderRaf) return;
  _renderRaf = requestAnimationFrame(()=>{
    _renderRaf = null;
    renderSidebar(); renderTopbar(); renderTabs(); renderView(); renderAppframes();
  });
}

/* ---------------- quick add parsing ---------------- */
function parseQuick(text){
  let due = null, pri = 0, rep = null, s = text;
  s = s.replace(/\s*!(high|hi|med|medium|low)\b/ig, (m,p)=>{ pri = {high:3,hi:3,med:2,medium:2,low:1}[p.toLowerCase()]||0; return ""; });
  s = s.replace(/\s*\b(every ?day|daily)\b/ig, ()=>{ rep = "daily"; return ""; });
  s = s.replace(/\s*\bweekdays\b/ig, ()=>{ rep = "weekdays"; return ""; });
  s = s.replace(/\s*\b(every ?week|weekly)\b/ig, ()=>{ rep = "weekly"; return ""; });
  s = s.replace(/\s*\b(today|tonight)\b/ig, ()=>{ due = todayStr(); return ""; });
  s = s.replace(/\s*\b(tomorrow|tmr)\b/ig, ()=>{ due = addDays(1); return ""; });
  s = s.replace(/\s*\bnext week\b/ig, ()=>{ due = addDays(7); return ""; });
  const WD = {sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
  s = s.replace(/\s*\b(next\s+)?(sunday|saturday|thursday|wednesday|tuesday|monday|friday|thurs|tues|thur|sun|sat|thu|wed|tue|mon|fri)\b/ig, (m,nx,w)=>{
    const d = new Date();
    let delta = (WD[w.toLowerCase()] - d.getDay() + 7) % 7;
    if(delta===0) delta = 7;
    if(nx) delta += 7;
    due = addDays(delta); return "";
  });
  s = s.replace(/\s*\bin\s+(\d{1,2})\s+days?\b/ig, (m,n)=>{ due = addDays(+n); return ""; });
  const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  s = s.replace(/\s*\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/ig, (m,mo,dd)=>{
    const y = new Date().getFullYear();
    let dt = new Date(y, MO[mo.toLowerCase()], +dd);
    if(dstr(dt) < todayStr()) dt = new Date(y+1, MO[mo.toLowerCase()], +dd);
    due = dstr(dt); return "";
  });
  if(rep && !due) due = todayStr();
  return { title: s.replace(/\s+/g," ").trim(), due, priority: pri, repeat: rep };
}

/* drag the ≡ handle to reorder pipeline stages (mouse + touch) */
function bindStageDnD(){
  const list = $("#stage-list"); if(!list) return;
  if(!list.dataset.dndList){
    list.dataset.dndList = "1";
    list.addEventListener("dragover", e=>{ if(list._drag) e.preventDefault(); });
  }
  $$(".stage-row", list).forEach(row=>{
    if(row.dataset.dnd) return;
    row.dataset.dnd = "1";
    const h = row.querySelector(".sg-handle"); if(!h) return;
    h.setAttribute("draggable","true");
    h.addEventListener("dragstart", e=>{
      list._drag = row; row.classList.add("drag-src");
      ui._intDrag = true;
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain","stage"); }catch(_){}
    });
    h.addEventListener("dragend", ()=>{ ui._intDrag = false; if(list._drag){ list._drag.classList.remove("drag-src"); list._drag = null; } });
    row.addEventListener("dragover", e=>{
      const d = list._drag; if(!d || d===row) return;
      e.preventDefault();
      const r = row.getBoundingClientRect();
      if(e.clientY < r.top + r.height/2) list.insertBefore(d, row);
      else list.insertBefore(d, row.nextSibling);
    });
    let pt = null, lift = false;
    h.addEventListener("touchstart", ()=>{ lift = false; pt = setTimeout(()=>{ lift = true; row.classList.add("lifting"); hapt(10); }, 240); }, {passive:true});
    h.addEventListener("touchmove", e=>{
      if(!lift){ clearTimeout(pt); return; }
      e.preventDefault();
      const t = e.touches[0]; if(!t) return;
      for(const o of $$(".stage-row", list)){
        if(o===row) continue;
        const r = o.getBoundingClientRect();
        if(t.clientY > r.top && t.clientY < r.bottom){
          if(t.clientY < r.top + r.height/2) list.insertBefore(row, o);
          else list.insertBefore(row, o.nextSibling);
          break;
        }
      }
    }, {passive:false});
    const endT = ()=>{ clearTimeout(pt); if(lift) row.classList.remove("lifting"); lift = false; };
    h.addEventListener("touchend", endT);
    h.addEventListener("touchcancel", endT);
  });
}

  renderCmdList("");
  const inp = $("#cmd-in");
  inp.focus();
  inp.addEventListener("input", ()=>{ cmdSel = 0; renderCmdList(inp.value); });
  inp.addEventListener("keydown", e=>{
    const rows = cmdFiltered(inp.value);

/* ---------------- mutations ---------------- */
function toggleTask(id, el){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  ui._justToggled = id;
  if(t.repeat && !t.done){
    const wasDue = t.due && dayDiff(t.due) <= 0;
    t.completedAt = todayStr();
    t.due = nextOccurrence(t.repeat);
    if(t.checklist && t.checklist.length) t.checklist.forEach(c=>{ c.done = false; }); /* fresh checklist each cycle */
    save();
    if(el){
      const r = el.getBoundingClientRect();
      confettiBurst(r.left + r.width/2, r.top + r.height/2, spaceOf(t).color);
    }
    mascotHappy();
    bumpDoneCount();
    playSound("done");
    render();
    showToast("✓ "+t.title+" done for today ↻ next: "+fmtDue(t.due));
    maybeCelebrateClear(wasDue);
    return;
  }
  t.done = !t.done;
  t.completedAt = t.done ? todayStr() : null;
  if(!t.done) playSound("undone");
  save();
  if(t.done && el){
    hapt();
    playSound("done");
    const r = el.getBoundingClientRect();
    confettiBurst(r.left + r.width/2, r.top + r.height/2, spaceOf(t).color);
    mascotHappy();
    bumpDoneCount();
    if(Math.random() < .35) mascotSay(pick(["Nice one! 🎉","Done and dusted ✨","+1 for future you","That's the stuff 💪"]), 2000);
  }
  render();
  if(t.done) maybeCelebrateClear(t.due && dayDiff(t.due) <= 0);
}

function deleteTasks(ids, msg){
  const removed = state.tasks.filter(t=>ids.includes(t.id));
  if(!removed.length) return;
  state.tasks = state.tasks.filter(t=>!ids.includes(t.id));
  undoBuf = {tasks:removed};
  playSound("delete");
  save(); render();
  showToast(msg || (removed.length===1 ? "Task deleted" : removed.length+" tasks deleted"), true);
}

function applyUndo(){
  if(!undoBuf) return;
  const b = undoBuf; undoBuf = null;
  playSound("undo");
  if(b.type==="note"){ const sp = getSpace(b.spaceId) || state.spaces[0]; if(sp){ sp.notes = sp.notes || []; sp.notes.push(b.note); ui._justAdded = b.note.id; } }
  else if(b.type==="habit"){ state.habits = state.habits || []; state.habits.push(b.habit); }
  else if(b.type==="app"){ state.apps = state.apps || []; state.apps.push(b.app); }
  else if(b.type==="space"){ state.spaces.push(b.space); state.tasks.push(...b.tasks); }
  else if(b.tasks){ state.tasks.push(...b.tasks); }
  save(); render(); hideToast();
}

function submitTask(f){
  let title = f.elements["title"].value.trim(); if(!title) return;
  const id = f.dataset.id;
  const spaceId = f.elements["space"].value;
  let stage = f.elements["stage"].value;
  const nsp = getSpace(spaceId) || state.spaces[0];
  if(!nsp.stages.some(s=>s.id===stage)) stage = nsp.stages[0].id;
  let repeat = f.elements["repeat"].value || null;
  let due = f.elements["due"].value || null;
  let pri = +f.elements["priority"].value || 0;
  if(!id){
    /* natural language in the title fills anything you left empty */
    const p = parseQuick(title);
    if(p.title){
      if(!due && p.due) due = p.due;
      if(!pri && p.priority) pri = p.priority;
      if(!repeat && p.repeat) repeat = p.repeat;
      title = p.title;
    }
  }
  if(repeat && !due) due = todayStr();
  const checklist = $$("#cl-list .cl-row").map(r=>({
    id: r.dataset.cid==="new" ? uid() : r.dataset.cid,
    text: r.querySelector("input").value.trim(),
    done: r.querySelector(".check").classList.contains("on")
  })).filter(x=>x.text);
  const vals = { title, desc:f.elements["desc"].value.trim(), due,
                 priority:pri, spaceId:nsp.id, stage, repeat, checklist };
  if(id){ const t = state.tasks.find(x=>x.id===id); if(t) Object.assign(t, vals); }
  else {
    const nt = Object.assign({id:uid(), done:false, createdAt:Date.now(), completedAt:null}, vals);
    state.tasks.push(nt);
    ui._justAdded = nt.id;
    playSound("add");
  }
  save(); closeModal(); render();
}

/* ---------------- confetti ---------------- */
const cvs = $("#confetti-canvas"), ctx = cvs.getContext("2d");
let parts = [], rafId = null;
function sizeCanvas(){ cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener("resize", sizeCanvas); sizeCanvas();
function confettiBurst(x, y, color){
  if(!featOn("confetti")) return;
  const colors = [color||"#8b7cff", "#38d6f5", "#fbbf24", "#fb7185", "#34d399", "#ffffff"];
  for(let i=0;i<26;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*4.5;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2.5, g:.12+Math.random()*.06,
      life:46+Math.random()*22, size:3+Math.random()*4, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
      c:colors[i%colors.length]});
  }
  if(!rafId && ctx) rafId = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.rot+=p.vr; p.life--;
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life/22);
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*.62);
    ctx.restore();
  }
  if(parts.length) rafId = requestAnimationFrame(tick);
  else { rafId = null; ctx.clearRect(0,0,cvs.width,cvs.height); }
}

function mascotLines(){
  const open = state.tasks.filter(t=>!t.done);
  const today = open.filter(t=>t.due && dayDiff(t.due)===0).length;
  const od = open.filter(t=>t.due && dayDiff(t.due)<0).length;
  const stk = streakDays();
  const L = [
    "Hi "+state.userName+"! 👋",
    "You got this 💪",
    isMobile() ? "Swipe from the left edge for your spaces ✨" : "Press "+(IS_APPLE?"⌘K":"Ctrl K")+" to fly around ✨",
    isMobile() ? "Long press a task for quick actions 📋" : "Right click a task for quick actions 📋",
    "Pin a note and it lands on the dashboard 📌",
    "Type me a task: call mom fri !high",
    "Small steps every day 🌱",
    "I orbit, you organize 🪐"
  ];
  if(today>0) L.push(today+" due today. Let's go!");
  if(od>0) L.push(od+" overdue. Tap Move all to today?");
  if(stk>1) L.push(stk+" day streak 🔥 keep it alive!");
  if(today===0 && od===0) L.push("All clear today. Enjoy it ☀️");
  return L;
}

/* find a task by loose title match */
function findTask(q, includeDone){
  q = q.toLowerCase().trim();
  const pool = state.tasks.filter(t=>includeDone || !t.done);
  return pool.find(t=>t.title.toLowerCase()===q)
      || pool.find(t=>t.title.toLowerCase().startsWith(q))
      || pool.find(t=>t.title.toLowerCase().includes(q))
      || null;
}

/* Orbie's command brain: explicit actions only (chat + tasks route separately) */
function orbieCommand(raw){
  const low = raw.toLowerCase().trim();
  let m;
  if((m = low.match(/^(done|complete|finish|check(?: off)?)\s+(.+)/))){
    const t = findTask(m[2]);
    if(!t) return 'I could not find an open task like "'+esc(m[2])+'" 🤔';
    toggleTask(t.id, $("#mascot"));
    return 'Checked off <b>'+esc(t.title)+'</b> ✓';
  }
  if((m = low.match(/^(delete|remove)\s+(.+)/))){
    const t = findTask(m[2], true);
    if(!t) return 'No task like "'+esc(m[2])+'" found';
    deleteTasks([t.id]);
    return 'Deleted <b>'+esc(t.title)+'</b>. Undo is in the toast.';
  }
  if((m = low.match(/^(find|search)\s+(.+)/))){
    ui.search = m[2];
    renderTopbar(); renderView();
    const n = state.tasks.filter(t=>matches(t)).length;
    return 'Filtering for <b>'+esc(m[2])+'</b>: '+n+' task'+(n===1?"":"s")+' match';
  }
  if((m = raw.match(/^note[:\s]\s*(.+)/i))){
    const sp = getSpace(defaultNotesSpaceId());
    if(!sp.notes) sp.notes = [];
    const body = m[1].trim();
    const nn = {id:uid(), title: body.slice(0,34)+(body.length>34?"…":""), body: body, color: pick(NOTE_COLORS), pinned: true, createdAt: Date.now()};
    sp.notes.push(nn);
    ui._justAdded = nn.id;
    save(); render();
    return 'Pinned a note to your dashboard 📌';
  }
  if((m = low.match(/^(?:go to|open|show)\s+(.+)/))){
    const q = m[1];
    if(/notepad|pad|notes page/.test(q)){ ui.view="pad"; ui.spaceId=null; render(); return 'Notepad open 🗒'; }
    if(/today|home|dash/.test(q)){ ui.view="today"; ui.spaceId=null; render(); return 'Home sweet dashboard 🪐'; }
    if(/^work( hq)?( page)?$/.test(q.trim())){ ui.view="work"; ui.spaceId=null; render(); return 'Work mode 🏢'; }
    const sp = state.spaces.find(s=>s.name.toLowerCase().includes(q.trim()));
    if(sp){ ui.view="space"; ui.spaceId=sp.id; ui.tab="tasks"; render(); return 'Opened '+esc(sp.icon+" "+sp.name); }
    return 'I do not know "'+esc(q)+'" yet. Try a space name, notepad, or today.';
  }
  if(/^(clear|move) overdue/.test(low)){
    const n = moveOverdueToToday(null);
    return n ? 'Moved '+n+' overdue to today ✅' : 'No overdue tasks 🎉';
  }
  if(/^(help|what can you do|\?)$/.test(low)){
    return 'I understand things like:<br>• <b>gym tomorrow !med in Personal</b><br>• <b>done clinic</b> · <b>delete old task</b><br>• <b>note: brilliant idea</b><br>• <b>find resume</b> · <b>go to work</b><br>• <b>clear overdue</b> · <b>focus</b><br>• or just talk to me — a simple <b>hi</b> works 👋';
  }
  return null;
}

/* smarter local intents: recommendations, finishing, rescheduling, habits */
function orbieLocal(raw){
  const low = raw.toLowerCase().trim();
  let m;
  if(/what should i (do|work on)|what.s (first|next)\b|^what (first|next)/.test(low)){
    const open = state.tasks.filter(t=>!t.done);
    if(!open.length) return "Nothing on the list — enjoy the quiet, or hand me something ☀️";
    const scored = open.slice().sort((a,b)=>{
      const av = a.due ? (dayDiff(a.due)<0?0:dayDiff(a.due)===0?1:2) : 3;
      const bv = b.due ? (dayDiff(b.due)<0?0:dayDiff(b.due)===0?1:2) : 3;
      if(av!==bv) return av-bv;
      if(a.priority!==b.priority) return b.priority-a.priority;
      return a.createdAt-b.createdAt;
    });
    const t = scored[0], sp = spaceOf(t);
    return 'I would start with <b>'+esc(t.title)+'</b> ('+esc(sp.name)+(t.due?' · '+fmtDue(t.due):'')+').'+
      '<span class="ob-acts"><button type="button" data-act="ob-focus" data-id="'+t.id+'">🎯 Focus on it</button>'+
      '<button type="button" data-act="ob-done" data-id="'+t.id+'">✓ Done</button></span>';
  }
  if((m = low.match(/^i (?:just )?(?:finished|did|completed)\s+(.+)/))){
    const t = findTask(m[1]);
    if(!t) return 'No open task like "'+esc(m[1])+'" — but look at you go 🎉';
    toggleTask(t.id, $("#mascot"));
    return 'Boom — checked off <b>'+esc(t.title)+'</b> 🎉';
  }
  if((m = raw.match(/^(?:move|reschedule|push)\s+(.+?)\s+to\s+(.+)$/i))){
    const t = findTask(m[1]);
    if(!t) return 'No task like "'+esc(m[1])+'" found 🤔';
    const p = parseQuick("x "+m[2]);
    if(!p.due) return 'When exactly? Try <b>to tomorrow</b> or <b>to fri</b>.';
    t.due = p.due; save(); render();
    return '📅 <b>'+esc(t.title)+'</b> moved to '+fmtDue(t.due)+'.';
  }
  if(/how many (tasks|things|todos)/.test(low)){
    return state.tasks.filter(t=>!t.done).length+" open in total — "+orbieStatusLine()+".";
  }
  if(/^(my )?habits$/.test(low) || /habits (left|today)/.test(low)){
    const hs = state.habits || [];
    if(!hs.length) return "No habits yet — say <b>add habit drink water</b> 🌱";
    const left = hs.filter(x=>!(x.days && x.days[todayStr()]));
    return left.length ? "Still open today: "+left.map(x=>esc((x.icon||"")+" "+x.name)).join(", ") : "All habits done today 🌟";
  }
  if((m = low.match(/^add habit\s+(.+)/))){
    const nm = m[1].trim().slice(0,40);
    state.habits.push({id:uid(), name:nm.charAt(0).toUpperCase()+nm.slice(1), icon:"🌱", color:SPACE_COLORS[(state.habits||[]).length % SPACE_COLORS.length], days:{}, createdAt:Date.now()});
    save(); render();
    return 'New habit: <b>'+esc(nm)+'</b> 🌱 Its dots live on the Habits page.';
  }
  if((m = low.match(/^(?:log|i drank|i took)\s+(.+)/))){
    const q = m[1].trim();
    const hb = (state.habits||[]).find(x=>x.name.toLowerCase().includes(q));
    if(hb){
      hb.days = hb.days || {};
      hb.days[todayStr()] = true;
      save(); render();
      const st2 = habitStreak(hb);
      return esc((hb.icon||"")+" "+hb.name)+' logged — 🔥 '+st2.n+' day'+(st2.n>1?'s':'')+'!';
    }
  }
  return null;
}
/* AI can return actions as JSON — Orbie executes them */
function aiDo(cmd){
  try{
    if(cmd.do==="add" && cmd.title){
      const sp = getSpace(defaultNotesSpaceId()) || state.spaces[0];
      let due = null;
      if(cmd.due==="today") due = todayStr();
      else if(cmd.due==="tomorrow") due = addDays(1);
      else if(/^\d{4}-\d{2}-\d{2}$/.test(cmd.due||"")) due = cmd.due;
      const nt = {id:uid(), spaceId:sp.id, title:String(cmd.title).slice(0,140), desc:"", due:due, priority:Math.min(3, Math.max(0, +cmd.priority||0)), repeat:null, stage:sp.stages[0].id, done:false, createdAt:Date.now(), completedAt:null, checklist:[]};
      state.tasks.push(nt); ui._justAdded = nt.id;
      playSound("add"); save(); render();
      return 'Added <b>'+esc(nt.title)+'</b>'+(due?' · '+fmtDue(due):'')+' → '+esc(sp.icon+" "+sp.name)+' ✓';
    }
    if(cmd.do==="done" && cmd.query){
      const t = findTask(String(cmd.query));
      if(t){ toggleTask(t.id, $("#mascot")); return 'Checked off <b>'+esc(t.title)+'</b> ✓'; }
      return "Could not find that task 🤔";
    }
    if(cmd.do==="due" && cmd.query){
      const t = findTask(String(cmd.query));
      if(!t) return "Could not find that task 🤔";
      let due = cmd.due==="today" ? todayStr() : cmd.due==="tomorrow" ? addDays(1) : (/^\d{4}-\d{2}-\d{2}$/.test(cmd.due||"") ? cmd.due : null);
      if(!due) return "When exactly? 📅";
      t.due = due; save(); render();
      return '📅 <b>'+esc(t.title)+'</b> → '+fmtDue(due);
    }
    if(cmd.do==="focus"){ if(!fsess) startFocus(null); return "🎯 Focus started."; }
  }catch(e){}
  return null;
}
/* the router: pending add → smalltalk → smart local → commands → tasks → AI → fallback */
function orbieProcess(v){
  orbieLog.push({r:"u", t:esc(v)});
  renderOrbieThread(); orbieSaveLog();
  playSound("tap");
  if(orbiePending==="add"){
    orbiePending = null;
    orbieDoAdd(v.replace(/^(add|task|todo)\s*[:\-]?\s*/i,""));
    return;
  }
  const small = orbieSmalltalk(v);
  if(small){ orbieReply(small); return; }
  const local = orbieLocal(v);
  if(local){ orbieReply(local); return; }
  const cmd = orbieCommand(v);
  if(cmd){ orbieReply(cmd); return; }
  if(taskish(v)){
    orbieDoAdd(v.replace(/^(add|task|todo)\s*[:\-]?\s*/i,"").replace(/^remind me( to)?\s*/i,"").replace(/^remember to\s*/i,""));
    return;
  }
  if(orbieAIReady()){
    const ph = {r:"b", t:"", typing:true};
    orbieLog.push(ph);
    renderOrbieThread();
    orbieAsk(v).then(r=>{
      ph.typing = false;
      let txt = (aiText(r)||"").trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim();
      if(/^\{/.test(txt)){
        try{
          const done = aiDo(JSON.parse(txt));
          if(done){ ph.t = done; renderOrbieThread(); renderOrbieChips(); orbieSaveLog(); playSound("pop"); return; }
        }catch(e){}
      }
      ph.t = txt ? esc(txt.slice(0, 280)) : "Hmm, my antenna glitched 📡 Try that again?";
      renderOrbieThread(); orbieSaveLog();
      playSound("pop");
    }).catch(()=>{
      ph.typing = false;
      ph.t = "My antenna glitched 📡 — the instant smarts still work though!";
      renderOrbieThread(); orbieSaveLog();
    });
    return;
  }
  orbieReply(pick([
    "Tell me more 🙂 Or hand me a task — <b>call mom fri !high</b>",
    "I chat even better once you sign in to sync ☁ (free AI). Meanwhile <b>help</b> shows my tricks.",
    "Try <b>what first?</b>, <b>my day</b>, or just give me something to remember 📝"
  ]));
}
function orbieStatusLine(){
  const open = state.tasks.filter(t=>!t.done);
  const dt = open.filter(t=>t.due && dayDiff(t.due)===0).length;
  const od = open.filter(t=>t.due && dayDiff(t.due)<0).length;
  const hs = state.habits || [];
  const hLeft = hs.filter(x=>!(x.days && x.days[todayStr()])).length;
  const fm = focusToday();
  let bits = [];
  bits.push(dt ? dt+" due today" : "nothing due today ☀️");
  if(od) bits.push(od+" overdue");
  if(hs.length) bits.push(hLeft ? hLeft+" habits left" : "all habits done ✅");
  if(fm) bits.push(fm+"m focused");
  return bits.join(" · ");
}

  if(/^(start |begin )?focus( now| session)?\??$/.test(low)){

function taskish(raw){
  const low = raw.toLowerCase().trim();
  if(/^(add|task|todo|remind me|remember to)\b/.test(low)) return true;
  const p = parseQuick(raw);
  if(p.due || p.priority || p.repeat) return true;
  if(state.spaces.some(s2=>new RegExp("\\b(in|to|@)\\s+"+reEsc(s2.name.toLowerCase())+"\\b").test(low))) return true;
  if(low.split(/\s+/).length <= 7 && /^(buy|call|pay|email|send|book|finish|submit|review|write|clean|fix|check|prep|plan|schedule|update|renew|get|pick)\b/.test(low)) return true;
  return false;
}
function orbieAIReady(){ return !!(cloud.on && window.puter && puter.ai && puter.ai.chat); }
function aiText(r){
  try{
    if(typeof r === "string") return r;
    if(r && r.message){
      const c = r.message.content;
      if(typeof c === "string") return c;
      if(Array.isArray(c)) return c.map(x=>x && (x.text||"")).join(" ");
    }
    if(r && typeof r.text === "string") return r.text;
    if(r && typeof r.toString === "function"){ const t2 = r.toString(); if(t2 && t2 !== "[object Object]") return t2; }
  }catch(e){}
  return "";
}
function orbieAsk(raw){

let idleT = null;

  if(m.classList.contains("sleep")){
    m.classList.remove("sleep");

function initMascot(){
  applyMascot();
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!reduce){
    let eyeRaf = null;
    document.addEventListener("mousemove", e=>{
      if(!mascotOn || eyeRaf) return;
      eyeRaf = requestAnimationFrame(()=>{
        eyeRaf = null;
        const m = $("#mascot"); if(!m || m.style.display==="none") return;
        const r = m.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const a = Math.atan2(e.clientY - cy, e.clientX - cx);
        const d = Math.min(3.4, Math.hypot(e.clientX - cx, e.clientY - cy) / 40);
        const tr = "translate("+(Math.cos(a)*d).toFixed(1)+"px,"+(Math.sin(a)*d).toFixed(1)+"px)";
        $$(".m-pupil").forEach(p=>p.style.transform = tr);
      });
    }, {passive:true});
    /* on phones the eyes follow your taps */
    document.addEventListener("touchstart", e=>{
      if(!mascotOn) return;
      const t = e.touches && e.touches[0]; if(!t) return;
      const m = $("#mascot"); if(!m || m.style.display==="none") return;
      const r = m.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const a = Math.atan2(t.clientY - cy, t.clientX - cx);
      const d = Math.min(3.4, Math.hypot(t.clientX - cx, t.clientY - cy) / 40);
      const tr = "translate("+(Math.cos(a)*d).toFixed(1)+"px,"+(Math.sin(a)*d).toFixed(1)+"px)";
      $$(".m-pupil").forEach(p=>p.style.transform = tr);
    }, {passive:true});
  }
  (function blinkLoop(){
    setTimeout(()=>{
      const eyes = $("#m-eyes");
      if(eyes && mascotOn){ eyes.classList.add("blink"); setTimeout(()=>eyes.classList.remove("blink"), 160); }
      blinkLoop();
    }, 2200 + Math.random()*3800);
  })();
  document.addEventListener("mousemove", mascotIdleReset, {passive:true});
  document.addEventListener("keydown", mascotIdleReset);
  document.addEventListener("touchstart", mascotIdleReset, {passive:true});
  mascotIdleReset();
  try{
    if(!sessionStorage.getItem("orbit-hi")){
      sessionStorage.setItem("orbit-hi","1");
      setTimeout(()=>mascotSay("Hi "+state.userName+"! Click me and tell me a task 🪐", 3400), 1200);
    }
  }catch(e){}
}

const NOTIF_KEY = "orbit-notif";
async function toggleNotif(){
  try{
    if(typeof Notification === "undefined"){ showToast("Notifications are not supported here"); return; }
    if(localStorage.getItem(NOTIF_KEY)==="on"){ localStorage.setItem(NOTIF_KEY,"off"); showToast("Daily reminders off"); return; }

/* ================================================================
   HABITS · daily check-ins, streaks with a one-gap ❄ freeze,
   synced through your cloud like everything else.
   ================================================================ */
function habitStreak(h){
  const days = h.days || {};
  let n = 0, used = false;
  const d = new Date();
  if(!days[dstr(d)]) d.setDate(d.getDate()-1);
  while(true){
    if(days[dstr(d)]){ n++; d.setDate(d.getDate()-1); continue; }
    if(!used && n>0){
      d.setDate(d.getDate()-1); /* peek past a single missed day */
      if(days[dstr(d)]){ used = true; continue; }
    }
    break;
  }
  return {n:n, frozen:used};
}
function renderHabits(){
  const hs = state.habits || [];
  const today = todayStr();
  const doneToday = hs.filter(x=>x.days && x.days[today]).length;
  const best = hs.reduce((mx,x)=>Math.max(mx, habitStreak(x).n), 0);
  let h = '<div class="view-inner">';
  h += '<div class="stats bento">'+
    statRawG(hs.length,"Habits","var(--accent)","🔁")+

  if(!hs.length){

  } else {

      const st2 = habitStreak(hb);

      for(let k=6;k>=0;k--){

      }
      h += '<div class="habit-row" style="--hc:'+esc(hb.color||"#30a46c")+';animation-delay:'+dly(i)+'" data-act="open-habit" data-id="'+hb.id+'">'+
        '<span class="h-ico">'+esc(hb.icon||"✅")+'</span>'+
        '<div class="h-main"><div class="h-name">'+esc(hb.name)+'</div>'+
        '<div class="h-streak">'+(st2.n ? ('🔥 '+st2.n+' day'+(st2.n>1?'s':'')+(st2.frozen?' · ❄ freeze used':'')) : 'No streak yet — today is day one')+'</div></div>'+
        '<span class="h-dots">'+dots+'</span>'+
      '</div>';
    });
  }

  $("#view").innerHTML = h;

function fmtHM(ms){
  const m = Math.max(0, Math.round(ms/60000));
  const h = Math.floor(m/60);
  return h ? h+"h "+(m%60)+"m" : m+"m";

let activeRec = null;
function startVoice(btn){
  const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SRC) return;
  if(activeRec){ try{ activeRec.stop(); }catch(e){} activeRec = null; $$(".mic.rec").forEach(b=>b.classList.remove("rec")); return; }
  const form = btn.closest("form");
  const inp = form && (form.elements["qa"] || form.elements["oi"]);
  if(!inp) return;
  const r = new SRC();
  activeRec = r;
  r.lang = navigator.language || "en-US";
  r.interimResults = true;
  r.continuous = false;
  const base = inp.value ? inp.value.replace(/\s+$/,"")+" " : "";
  btn.classList.add("rec");
  hapt();
  r.onresult = ev=>{
    let txt = "";
    for(const res of ev.results) txt += res[0].transcript;
    inp.value = base + txt;
    inp.dispatchEvent(new Event("input",{bubbles:true}));
  };
  r.onend = ()=>{ btn.classList.remove("rec"); activeRec = null; inp.focus(); };
  r.onerror = ()=>{ btn.classList.remove("rec"); activeRec = null; playSound("error"); showToast("Voice input is not available here"); };
  try{ r.start(); }catch(e){ btn.classList.remove("rec"); activeRec = null; }
}

/* ---------------- swipe actions (mobile): right = done, left = delete ---------------- */
function bindSwipes(container){
  if(!featOn("swipes") || !isMobile()) return;
  $$(".task", container).forEach(row=>{
    if(row.dataset.sw) return;
    row.dataset.sw = "1";
    let sx = 0, sy = 0, dx = 0, active = false, canceled = false;
    row.addEventListener("touchstart", e=>{
      const t = e.touches[0]; if(!t) return;
      sx = t.clientX; sy = t.clientY; dx = 0; active = true; canceled = false;
    }, {passive:true});
    row.addEventListener("touchmove", e=>{
      if(!active || canceled) return;
      const t = e.touches[0]; if(!t) return;
      dx = t.clientX - sx;
      if(Math.abs(t.clientY - sy) > 30 || ui._lifting){
        canceled = true;
        row.style.transform = "";
        row.classList.remove("swipe-r","swipe-l");
        return;
      }
      if(Math.abs(dx) > 12){
        row.style.transform = "translateX("+(dx*.85).toFixed(0)+"px)";
        row.classList.toggle("swipe-r", dx > 55);
        row.classList.toggle("swipe-l", dx < -55);
      }
    }, {passive:true});
    const endS = ()=>{
      if(!active) return;
      active = false;
      row.style.transition = "transform .25s cubic-bezier(.25,.8,.3,1)";
      row.style.transform = "";
      setTimeout(()=>{ row.style.transition = ""; }, 260);
      const id = row.dataset.id;
      if(!canceled && id){
        if(dx > 75) toggleTask(id, row);
        else if(dx < -75) deleteTasks([id]);
      }
      row.classList.remove("swipe-r","swipe-l");
      dx = 0;
    };
    row.addEventListener("touchend", endS);
    row.addEventListener("touchcancel", endS);
  });
}

/* ================================================================
   YOUR GALAXY · every task you have ever finished becomes a star,
   placed on a golden-angle spiral that grows from the center as your
   history grows. Colored by its space, sized by its priority,
   clickable to remember what it was. Zero servers, pure you.
   ================================================================ */
let gxRaf = null, gxStars = [], gxRot = 0, gxPar = {x:0, y:0}, gxSel = -1;
function gxHash(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0)/4294967295; }
function buildGxStars(){
  const done = state.tasks.filter(t=>t.completedAt).sort((a,b)=>String(a.completedAt).localeCompare(String(b.completedAt)) || a.createdAt-b.createdAt);
  gxStars = done.map((t,i)=>{
    const sp = spaceOf(t);
    const jr = gxHash(t.id), ja = gxHash(t.id+"x");
    const th = i * 2.399963 + ja*.55;
    const r = 12 + 13*Math.sqrt(i) + jr*9;
    return { x:Math.cos(th)*r, y:Math.sin(th)*r*.62, s:(t.priority>=3?2.7:t.priority===2?2.1:1.6)+jr*.9,
             c:(sp && sp.color)||"#8f7be8", ph:ja*6.283, title:t.title, when:t.completedAt };
  });
}
function galaxyWeek(){
  const since = dAgo(6);
  const doneW = state.tasks.filter(t=>t.completedAt && t.completedAt >= since).length;
  let focusW = 0, habitW = 0, workW = 0;
  for(let i=0;i<7;i++){
    const day = dAgo(i);
    focusW += +((state.focus||{})[day])||0;
    workW  += +(((state.work||{}).log||{})[day])||0;
    (state.habits||[]).forEach(hb=>{ if(hb.days && hb.days[day]) habitW++; });
  }
  return {done:doneW, focus:focusW, habit:habitW, work:workW};
}
function galaxyShareText(){
  const wkk = galaxyWeek();
  const total = Math.max(gxStars.length, (function(){ try{ return +localStorage.getItem(DONE_KEY)||0; }catch(e){ return 0; } })());
  return "🪐 My Orbit galaxy: "+total+" stars (every one a finished task)\n"+
    "This week: "+wkk.done+" done · "+fmtMin(wkk.focus)+" focused · "+wkk.habit+" habit checks"+(wkk.work?" · "+fmtHM(wkk.work*60000)+" worked":"")+"\n"+
    "Small steps every day ✨";
}

  const sub = $("#gx-sub");

  const tip = $("#gx-tip"); if(tip) tip.classList.remove("on");
  const yr = $("#gx-year");
  if(yr){
    const counts = {};
    state.tasks.forEach(t=>{ if(t.completedAt) counts[t.completedAt] = (counts[t.completedAt]||0) + 1; });
    (state.habits||[]).forEach(hb=>Object.keys(hb.days||{}).forEach(dk=>{ if(hb.days[dk]) counts[dk] = (counts[dk]||0) + .5; }));
    const days = 182;
    let cells = "";
    const startPad = (parseDay(dAgo(days-1)).getDay()+6)%7;
    for(let p2=0;p2<startPad;p2++) cells += '<i style="visibility:hidden"></i>';
    for(let i=days-1;i>=0;i--){
      const day = dAgo(i);
      const v = counts[day]||0;
      const lv = v>=7?4 : v>=4?3 : v>=2?2 : v>=1?1 : 0;
      cells += '<i class="'+(lv?("l"+lv):"")+'" title="'+parseDay(day).toLocaleDateString(undefined,{month:"short",day:"numeric"})+' · '+Math.round(v)+'"></i>';
    }
    yr.innerHTML = cells;
  }
  gxLoop();
}
function closeGalaxy(){
  document.body.classList.remove("galaxy-open");
  if(gxRaf){ cancelAnimationFrame(gxRaf); gxRaf = null; }
}
function gxLoop(){
  const cvs2 = document.getElementById("gx-canvas");
  if(!cvs2 || !document.body.classList.contains("galaxy-open")) return;
  const ctx2 = cvs2.getContext ? cvs2.getContext("2d") : null;
  if(!ctx2) return; /* headless / very old browsers: header + stats still work */
  const draw = (now)=>{
    if(!document.body.classList.contains("galaxy-open")){ gxRaf = null; return; }
    const W = cvs2.clientWidth || innerWidth, H = cvs2.clientHeight || innerHeight;
    if(cvs2.width !== W) cvs2.width = W;
    if(cvs2.height !== H) cvs2.height = H;
    ctx2.clearRect(0, 0, W, H);
    for(let i=0;i<130;i++){
      const bx = gxHash("bg"+i)*W, by = gxHash("gb"+i)*H;
      const tw2 = isReduced() ? .5 : .3 + .45*Math.abs(Math.sin(now/900 + i));
      ctx2.globalAlpha = tw2*.5;
      ctx2.fillStyle = "#cfd2ff";
      ctx2.fillRect(bx, by, 1.2, 1.2);
    }
    const cx = W/2 + gxPar.x, cy = H/2 + 26 + gxPar.y;
    if(!isReduced()) gxRot += .00045;
    const cos = Math.cos(gxRot), sin = Math.sin(gxRot);
    const maxR = Math.max(40, 13*Math.sqrt(Math.max(1, gxStars.length))+30);
    const scale = Math.min(1, (Math.min(W, H*1.5)/2 - 60)/maxR);
    gxStars.forEach((st2, i)=>{
      const rx = (st2.x*cos - st2.y*sin)*scale + cx;
      const ry = (st2.x*sin + st2.y*cos)*scale*.9 + cy;
      st2._sx = rx; st2._sy = ry;
      const tw = isReduced() ? .85 : .55 + .45*Math.sin(now/650 + st2.ph);
      ctx2.globalAlpha = Math.min(1, tw + (i===gxSel ? .4 : 0));
      ctx2.fillStyle = st2.c;
      ctx2.shadowColor = st2.c;
      ctx2.shadowBlur = i===gxSel ? 18 : 7;
      ctx2.beginPath();
      ctx2.arc(rx, ry, st2.s*(i===gxSel?1.7:1), 0, 6.283);
      ctx2.fill();
    });
    ctx2.shadowBlur = 0;
    ctx2.globalAlpha = 1;
    gxRaf = isReduced() ? null : requestAnimationFrame(draw);
  };
  gxRaf = requestAnimationFrame(draw);
}
document.addEventListener("mousemove", e=>{
  if(!document.body.classList.contains("galaxy-open")) return;

}, {passive:true});
document.addEventListener("click", e=>{
  if(!document.body.classList.contains("galaxy-open")) return;
  if(e.target && e.target.id !== "gx-canvas") return;
  let best = -1, bd = 16;
  gxStars.forEach((st2, i)=>{
    const dx = (st2._sx||0) - e.clientX, dy = (st2._sy||0) - e.clientY;
    const dd = Math.hypot(dx, dy);
    if(dd < bd){ bd = dd; best = i; }
  });
  const tip = $("#gx-tip");
  if(best > -1 && tip){
    gxSel = best;
    const st2 = gxStars[best];
    tip.innerHTML = "★ "+esc(st2.title)+'<div class="d">finished '+esc(fmtDue(st2.when))+"</div>";
    tip.style.left = Math.min(innerWidth-260, Math.max(8, e.clientX+14))+"px";
    tip.style.top = Math.max(8, e.clientY-14)+"px";
