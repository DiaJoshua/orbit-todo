/* ================================================================================
   ORBIT 9 · "CANVAS" — a document layer for tasks, notes and pages
   --------------------------------------------------------------------------------
   Part 1 — the block editor engine.

   Text is stored as plain markdown-ish text, exactly like before, so nothing about
   sync, export or backup changes. The editor parses that text into blocks, renders
   each block as its own contenteditable line, and serializes back on every edit.
   Inline marks (**bold**, *italic*, `code`, ~~strike~~, ==highlight==, links) are
   rendered live with an exact raw-offset caret map, so the caret never jumps.
   ================================================================================ */

/* ---------------- inline marks: render + serialize + caret mapping ---------------- */
const ED_MARKS = {
  strong:["**","**"], b:["**","**"],
  em:["*","*"], i:["*","*"],
  code:["`","`"],
  s:["~~","~~"], del:["~~","~~"], strike:["~~","~~"],
  mark:["==","=="]
};
const SOFT = "\u2028";           /* soft line break inside one block */
const ED_PH = "\u0000";          /* placeholder sentinel while rendering */

function edInlineHtml(raw){
  const keep = [];
  const stash = html=>{ keep.push(html); return ED_PH+(keep.length-1)+ED_PH; };
  let h = esc(String(raw==null?"":raw));
  /* order matters: protect code + links before the symmetric marks run */
  h = h.replace(/`([^`\n]+)`/g, (m,a)=>stash('<code>'+a+'</code>'));
  h = h.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,
        (m,t,u)=>stash('<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>'));
  h = h.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<)]+[^\s<).,;:!?])/g,
        (m,pre,u)=>pre+stash('<a href="'+(u.indexOf("http")===0?u:"https://"+u)+'" target="_blank" rel="noopener">'+u+'</a>'));
  h = h.replace(/\*\*([^*\n]+)\*\*/g, (m,a)=>'<strong>'+a+'</strong>');
  h = h.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, (m,p,a)=>p+'<em>'+a+'</em>');
  h = h.replace(/~~([^~\n]+)~~/g, (m,a)=>'<s>'+a+'</s>');
  h = h.replace(/==([^=\n]+)==/g, (m,a)=>'<mark>'+a+'</mark>');
  h = h.split(SOFT).join("<br>");
  h = h.replace(new RegExp(ED_PH+"(\\d+)"+ED_PH,"g"), (m,i)=>keep[+i]);
  if(/<br>$/.test(h)) h += '<br data-x="1">';
  return h;
}

/* HTML back to raw text — the exact inverse of the above */
function edSerialize(node){
  let out = "";
  for(const c of node.childNodes){
    if(c.nodeType===3){ out += c.nodeValue; continue; }
    if(c.nodeType!==1) continue;
    const tag = c.nodeName.toLowerCase();
    if(tag==="br"){ if(!c.hasAttribute || !c.hasAttribute("data-x")) out += SOFT; continue; }
    if(tag==="a"){
      const txt = c.textContent, href = c.getAttribute("href")||"";
      if(txt===href || "https://"+txt===href || "http://"+txt===href) out += txt;
      else out += "["+txt+"]("+href+")";
      continue;
    }
    const m = ED_MARKS[tag];
    if(m) out += m[0] + edSerialize(c) + m[1];
    else out += edSerialize(c);
  }
  return out;
}

/* every text node with its exact position in the raw string */
function edRawMap(root){
  const map = []; let pos = 0;
  (function rec(n){
    for(const c of n.childNodes){
      if(c.nodeType===3){ map.push({node:c, start:pos, len:c.nodeValue.length}); pos += c.nodeValue.length; continue; }
      if(c.nodeType!==1) continue;
      const tag = c.nodeName.toLowerCase();
      if(tag==="br"){
        if(c.hasAttribute && c.hasAttribute("data-x")) continue;
        map.push({node:c, start:pos, len:1, atom:true}); pos += 1; continue;
      }
      if(tag==="a"){
        const txt = c.textContent, href = c.getAttribute("href")||"";
        if(txt===href || "https://"+txt===href || "http://"+txt===href){ rec(c); }
        else { pos += 1; rec(c); pos += 2 + href.length + 1; }
        continue;
      }
      const m = ED_MARKS[tag];
      if(m){ pos += m[0].length; rec(c); pos += m[1].length; }
      else rec(c);
    }
  })(root);
  return {map, total:pos};
}

function edCaretRaw(el){
  const s = window.getSelection();
  if(!s || !s.rangeCount) return 0;
  const r = s.getRangeAt(0);
  if(!el.contains(r.endContainer)) return 0;
  const {map, total} = edRawMap(el);
  if(r.endContainer===el){
    /* caret sits between children — count the raw length of everything before it */
    let n = 0, idx = r.endOffset;
    for(let i=0;i<idx && i<el.childNodes.length;i++){
      const probe = document.createElement("div");
      probe.appendChild(el.childNodes[i].cloneNode(true));
      n += edSerialize(probe).length;
    }
    return n;
  }
  for(const e of map){
    if(e.node===r.endContainer) return e.start + Math.min(r.endOffset, e.len);
  }
  return total;
}

function edSetCaret(el, off){
  const {map, total} = edRawMap(el);
  off = Math.max(0, Math.min(off, total));
  const r = document.createRange();
  if(!map.length){ r.selectNodeContents(el); r.collapse(true); }
  else{
    let placed = false;
    /* a real text node that spans the offset always wins */
    for(const e of map){
      if(e.atom) continue;
      if(off >= e.start && off <= e.start + e.len){ r.setStart(e.node, off - e.start); placed = true; break; }
    }
    /* otherwise land relative to the last thing before the offset — which is how
       the caret gets to sit *after* a soft break rather than in front of it */
    if(!placed){
      let last = null;
      for(const e of map){ if(e.start <= off) last = e; }
      if(last){
        if(last.atom) (off >= last.start + last.len) ? r.setStartAfter(last.node) : r.setStartBefore(last.node);
        else r.setStart(last.node, Math.max(0, Math.min(off - last.start, last.len)));
      } else r.selectNodeContents(el);
    }
    r.collapse(true);
  }
  const s = window.getSelection();
  s.removeAllRanges(); s.addRange(r);
}

/* split the block's raw text at the caret, keeping inline marks valid on both sides */
function edSplitRaw(el){
  const s = window.getSelection();
  const full = edSerialize(el);
  if(!s || !s.rangeCount || !el.contains(s.focusNode)) return [full, ""];
  const off = edCaretRaw(el);
  const r = s.getRangeAt(0);
  const a = document.createRange(); a.selectNodeContents(el); a.setEnd(r.endContainer, r.endOffset);
  const b = document.createRange(); b.selectNodeContents(el); b.setStart(r.endContainer, r.endOffset);
  const d1 = document.createElement("div"); d1.appendChild(a.cloneContents());
  const d2 = document.createElement("div"); d2.appendChild(b.cloneContents());
  let left = edSerialize(d1), right = edSerialize(d2);
  /* a clean split of unformatted text is the common case — trust the offset there */
  if(left.length + right.length !== full.length && off <= full.length){
    left = full.slice(0, off); right = full.slice(off);
  }
  return [left, right];
}

/* ---------------- the block model ---------------- */
const ED_TYPES = {
  p:        {ph:"Type something, or press / for blocks"},
  h1:       {ph:"Heading"},
  h2:       {ph:"Subheading"},
  h3:       {ph:"Small heading"},
  bullet:   {ph:"List item"},
  num:      {ph:"List item"},
  todo:     {ph:"To-do"},
  quote:    {ph:"Quote"},
  callout:  {ph:"Callout"},
  code:     {ph:"Code"},
  divider:  {ph:""}
};

function edParse(text){
  const src = String(text==null?"":text);
  const lines = src.split("\n");
  const out = [];
  let inCode = false, codeBuf = [];
  for(let i=0;i<lines.length;i++){
    const ln = lines[i];
    if(/^```/.test(ln.trim())){
      if(inCode){ out.push({id:uid(), type:"code", text:codeBuf.join("\n")}); codeBuf=[]; inCode=false; }
      else inCode = true;
      continue;
    }
    if(inCode){ codeBuf.push(ln); continue; }
    const t = ln;
    let m;
    if(/^\s*(?:---+|—+|─{3,}|\*\*\*+)\s*$/.test(t)){ out.push({id:uid(), type:"divider", text:""}); continue; }
    if((m = t.match(/^###\s+(.*)$/))){ out.push({id:uid(), type:"h3", text:m[1]}); continue; }
    if((m = t.match(/^##\s+(.*)$/)))  { out.push({id:uid(), type:"h2", text:m[1]}); continue; }
    if((m = t.match(/^#\s+(.*)$/)))   { out.push({id:uid(), type:"h1", text:m[1]}); continue; }
    if((m = t.match(/^\s*\[([ xX])\]\s?(.*)$/))){ out.push({id:uid(), type:"todo", checked:m[1].toLowerCase()==="x", text:m[2]}); continue; }
    if((m = t.match(/^\s*[-*•]\s+(.*)$/))){ out.push({id:uid(), type:"bullet", text:m[1]}); continue; }
    if((m = t.match(/^\s*\d+[.)]\s+(.*)$/))){ out.push({id:uid(), type:"num", text:m[1]}); continue; }
    if((m = t.match(/^\s*::\s?(.*)$/))){ out.push({id:uid(), type:"callout", text:m[1]}); continue; }
    if((m = t.match(/^\s*>\s?(.*)$/))){ out.push({id:uid(), type:"quote", text:m[1]}); continue; }
    out.push({id:uid(), type:"p", text:t});
  }
  if(inCode && codeBuf.length) out.push({id:uid(), type:"code", text:codeBuf.join("\n")});
  if(!out.length) out.push({id:uid(), type:"p", text:""});
  return out;
}

function edStringify(blocks){
  const lines = [];
  let n = 0;
  blocks.forEach(b=>{
    switch(b.type){
      case "h1": lines.push("# "+b.text); n=0; break;
      case "h2": lines.push("## "+b.text); n=0; break;
      case "h3": lines.push("### "+b.text); n=0; break;
      case "bullet": lines.push("- "+b.text); n=0; break;
      case "num": n++; lines.push(n+". "+b.text); break;
      case "todo": lines.push("["+(b.checked?"x":" ")+"] "+b.text); n=0; break;
      case "quote": lines.push("> "+b.text); n=0; break;
      case "callout": lines.push(":: "+b.text); n=0; break;
      case "divider": lines.push("---"); n=0; break;
      case "code": lines.push("```"); lines.push(b.text); lines.push("```"); n=0; break;
      default: lines.push(b.text); n=0;
    }
  });
  return lines.join("\n");
}

/* plain-text preview for cards and rows: strips the markup, keeps the words */
function edPlain(text, max){
  let s = String(text==null?"":text);
  s = s.replace(/```[\s\S]*?```/g, " ");
  s = s.split("\n").map(l=>l
        .replace(/^\s*#{1,3}\s+/,"")
        .replace(/^\s*\[[ xX]\]\s?/,"☐ ")
        .replace(/^\s*[-*•]\s+/,"• ")
        .replace(/^\s*::\s?/,"")
        .replace(/^\s*>\s?/,"")
        .replace(/^\s*(?:---+|—+|─{3,})\s*$/,"···")
      ).join("\n");
  s = s.replace(/\*\*([^*]+)\*\*/g,"$1").replace(/(^|[^*])\*([^*]+)\*/g,"$1$2")
       .replace(/~~([^~]+)~~/g,"$1").replace(/==([^=]+)==/g,"$1")
       .replace(/`([^`]+)`/g,"$1").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1")
       .split(SOFT).join(" ");
  s = s.replace(/\n{3,}/g,"\n\n").trim();
  return max && s.length>max ? s.slice(0,max).trim()+"…" : s;
}

/* ---------------- the editor instance ---------------- */
let edActive = null;   /* {root, blocks, save, opts} */
/* Replacing a focused node makes Chrome fire focusout while the old node is still
   reachable. Acting on that stale node overwrote the model, so all editor DOM
   surgery runs inside edDom() and the listeners stand down while it does. */
let edBusy = 0;
function edDom(fn){
  edBusy++;
  try{ return fn(); }
  finally{ edBusy--; }
}
/* mark blocks that are about to be thrown away, so the blur they emit is ignored */
function edKill(scope){
  if(!scope) return;
  if(scope.classList && scope.classList.contains("ed-blk")) scope.dataset.dead = "1";
  if(scope.querySelectorAll) scope.querySelectorAll(".ed-blk").forEach(x=>{ x.dataset.dead = "1"; });
}

function edBlockHtml(b, numIdx){
  const T = ED_TYPES[b.type] || ED_TYPES.p;
  let mark = "";
  if(b.type==="bullet") mark = '<span class="ed-mark">•</span>';
  else if(b.type==="num") mark = '<span class="ed-mark">'+numIdx+'.</span>';
  else if(b.type==="todo") mark = '<span class="ed-mark"><button type="button" class="ed-cb'+(b.checked?" on":"")+'" data-ed="check" tabindex="-1" aria-label="Toggle">'+(b.checked?"✓":"")+'</button></span>';
  else if(b.type==="callout") mark = '<span class="ed-mark">💡</span>';
  return '<div class="ed-blk'+(b.checked&&b.type==="todo"?" checked":"")+'" data-id="'+b.id+'" data-type="'+b.type+'">'+
    '<div class="ed-gutter">'+
      '<button type="button" class="ed-g" data-ed="add" tabindex="-1" title="Add a block below">＋</button>'+
      '<button type="button" class="ed-g grab" data-ed="menu" draggable="true" tabindex="-1" title="Drag to move · click for actions">⠿</button>'+
    '</div>'+
    mark+
    '<div class="ed-c" contenteditable="'+(b.type==="divider"?"false":"true")+'" data-ph="'+esc(T.ph)+'" spellcheck="true">'+
      (b.type==="divider" ? "" : edInlineHtml(b.text))+
    '</div>'+
  '</div>';
}

function edRenderAll(){
  if(!edActive) return;
  let n = 0;
  edKill(edActive.root);
  edDom(()=>{
    edActive.root.innerHTML = edActive.blocks.map(b=>{
      if(b.type==="num") n++; else n = 0;
      return edBlockHtml(b, n);
    }).join("") + '<div class="ed-tail" data-ed="tail"><span>Click here to keep writing…</span></div>';
  });
}

function edBlkEl(id){ return edActive ? edActive.root.querySelector('.ed-blk[data-id="'+id+'"]') : null; }
function edIndex(id){ return edActive ? edActive.blocks.findIndex(b=>b.id===id) : -1; }

function edFocus(id, off){
  const el = edBlkEl(id); if(!el) return;
  const c = el.querySelector(".ed-c"); if(!c) return;
  c.focus();
  try{ edSetCaret(c, off==null ? 1e9 : off); }catch(e){}
  const r = el.getBoundingClientRect();
  const host = edActive.scroller;
  if(host){
    const hr = host.getBoundingClientRect();
    if(r.bottom > hr.bottom - 90) host.scrollTop += (r.bottom - hr.bottom + 120);
    else if(r.top < hr.top + 50) host.scrollTop -= (hr.top - r.top + 60);
  }
}

/* re-render one block in place, keeping the caret exactly where it was */
function edRepaint(id, caret, refocus){
  const i = edIndex(id); if(i<0) return;
  const el = edBlkEl(id); if(!el) return;
  let n = 0;
  if(edActive.blocks[i].type==="num"){
    for(let k=i;k>=0;k--){ if(edActive.blocks[k].type!=="num") break; n++; }
  }
  const tmp = document.createElement("div");
  tmp.innerHTML = edBlockHtml(edActive.blocks[i], n);
  edKill(el);
  edDom(()=>el.replaceWith(tmp.firstElementChild));
  if(refocus!==false) edFocus(id, caret);
}

function edRenumber(){
  if(!edActive) return;
  let n = 0;
  edActive.blocks.forEach(b=>{
    if(b.type==="num"){ n++; const el = edBlkEl(b.id); const m = el && el.querySelector(".ed-mark"); if(m) m.textContent = n+"."; }
    else n = 0;
  });
}

let edSaveT = null;
function edCommit(now){
  if(!edActive) return;
  clearTimeout(edSaveT);
  const go = ()=>{ if(!edActive) return; edActive.save(edStringify(edActive.blocks)); };
  if(now) go(); else edSaveT = setTimeout(go, 260);
}

/* the type conversions you get by typing a prefix, exactly like Notion */
const ED_PREFIX = [
  [/^#\s/,        "h1"], [/^##\s/,  "h2"], [/^###\s/, "h3"],
  [/^[-*]\s/,     "bullet"], [/^\d+[.)]\s/, "num"],
  [/^\[\]\s/,     "todo"], [/^\[ \]\s/,  "todo"], [/^\[x\]\s/i, "todo-done"],
  [/^>\s/,        "quote"], [/^::\s/, "callout"],
  [/^```/,        "code"], [/^---$/, "divider"], [/^\*\*\*$/, "divider"]
];

function edMaybeConvert(b, raw, c){
  for(const [re, kind] of ED_PREFIX){
    const m = raw.match(re);
    if(!m) continue;
    if(kind==="divider"){
      b.type = "divider"; b.text = "";
      edRepaint(b.id, 0, false);
      /* a divider is never focusable — land on the next block, making one if needed */
      const i = edIndex(b.id);
      if(i === edActive.blocks.length-1) edInsertAfter(b.id, {type:"p", text:""});
      else edFocus(edActive.blocks[i+1].id, 0);
      edCommit(); playSound && playSound("tap");
      return true;
    }
    b.type = kind==="todo-done" ? "todo" : kind;
    if(kind==="todo-done") b.checked = true;
    if(kind==="todo" ) b.checked = false;
    b.text = raw.slice(m[0].length);
    edRepaint(b.id, 0);
    edRenumber();
    edCommit();
    try{ hapt(6); }catch(e){}
    return true;
  }
  return false;
}

function edInsertAfter(id, blk, focusOff){
  const i = edIndex(id);
  const nb = Object.assign({id:uid(), type:"p", text:"", checked:false}, blk||{});
  edActive.blocks.splice(i+1, 0, nb);
  const el = edBlkEl(id);
  const tmp = document.createElement("div");
  tmp.innerHTML = edBlockHtml(nb, 1);
  edDom(()=>el.after(tmp.firstElementChild));
  edRenumber();
  edFocus(nb.id, focusOff==null ? 0 : focusOff);
  edCommit();
  return nb;
}

function edRemove(id){
  const i = edIndex(id); if(i<0) return;
  edActive.blocks.splice(i,1);
  const el = edBlkEl(id); if(el){ edKill(el); edDom(()=>el.remove()); }
  if(!edActive.blocks.length){
    const nb = {id:uid(), type:"p", text:"", checked:false};
    edActive.blocks.push(nb);
    const tmp = document.createElement("div"); tmp.innerHTML = edBlockHtml(nb,1);
    edDom(()=>edActive.root.insertBefore(tmp.firstElementChild, edActive.root.firstChild));
    edFocus(nb.id, 0);
  }
  edRenumber();
  edCommit();
}

/* ---------------- mount ---------------- */
function edMount(root, text, onSave, opts){
  root._edSave = onSave;
  edActive = {
    root, blocks: edParse(text), save:onSave, opts:opts||{},
    scroller: root.closest(".peek-body") || $("#view")
  };
  edRenderAll();
  return edActive;
}
function edUnmount(){ clearTimeout(edSaveT); if(edActive){ try{ edActive.save(edStringify(edActive.blocks)); }catch(e){} } edActive = null; }
function edFlush(){ if(edActive) edCommit(true); }
/* adopt an editor that is already on screen (a second surface took focus) —
   the DOM is left untouched, so the caret never moves */
function edAdopt(root){
  if(!root || !root._edSave) return false;
  const els = Array.from(root.querySelectorAll(".ed-blk"));
  if(!els.length) return false;
  edActive = {
    root: root,
    blocks: els.map(el=>{
      const c = el.querySelector(".ed-c");
      return { id: el.dataset.id, type: el.dataset.type,
               text: el.dataset.type==="divider" ? "" : (c ? edSerialize(c) : ""),
               checked: el.classList.contains("checked") };
    }),
    save: root._edSave, opts:{},
    scroller: root.closest(".peek-body") || $("#view")
  };
  return true;
}

/* ---------------- keyboard ---------------- */
function edFirstLine(c){
  const s = window.getSelection(); if(!s.rangeCount) return true;
  const r = s.getRangeAt(0).cloneRange();
  let rect = r.getBoundingClientRect();
  if(!rect || (!rect.top && !rect.height)){ return edCaretRaw(c) === 0; }
  return rect.top - c.getBoundingClientRect().top < 8;
}
function edLastLine(c){
  const s = window.getSelection(); if(!s.rangeCount) return true;
  const r = s.getRangeAt(0).cloneRange();
  let rect = r.getBoundingClientRect();
  const cr = c.getBoundingClientRect();
  if(!rect || (!rect.top && !rect.height)){ return true; }
  return cr.bottom - rect.bottom < 10;
}

document.addEventListener("keydown", e=>{
  if(!edActive) return;
  const c = e.target.closest && e.target.closest(".ed-c");
  if(!c || !edActive.root.contains(c)) return;
  const blkEl = c.closest(".ed-blk");
  const id = blkEl.dataset.id;
  const i = edIndex(id); if(i<0) return;
  const b = edActive.blocks[i];

  if(slashOpen && ["ArrowDown","ArrowUp","Enter","Tab"].indexOf(e.key)>-1){ slashKey(e); return; }
  if(e.key==="Escape"){ if(slashOpen){ slashClose(); e.stopPropagation(); e.preventDefault(); } else c.blur(); return; }

  /* formatting */
  if((e.metaKey||e.ctrlKey) && !e.altKey){
    const k = e.key.toLowerCase();
    if(k==="b"){ e.preventDefault(); edWrap("**"); return; }
    if(k==="i"){ e.preventDefault(); edWrap("*"); return; }
    if(k==="e"){ e.preventDefault(); edWrap("`"); return; }
    if(k==="u"){ e.preventDefault(); edWrap("=="); return; }
    if(k==="enter"||e.key==="Enter"){
      if(b.type==="todo"){ e.preventDefault(); edToggleTodo(id); return; }
    }
  }

  if(e.key==="Enter" && !e.shiftKey){
    if(edComposing || e.isComposing || e.keyCode===229) return;  /* IME is still choosing */
    if(b.type==="code" && !(e.metaKey||e.ctrlKey)){ return; }   /* newline inside code */
    e.preventDefault();
    if(slashOpen) return;
    b.text = edSerialize(c);
    /* Enter on an empty list item leaves the list — Notion's behaviour */
    if(!b.text.trim() && ["bullet","num","todo","quote","callout"].indexOf(b.type)>-1){
      b.type = "p"; b.checked = false;
      edRepaint(id, 0); edRenumber(); edCommit();
      return;
    }
    const [left, right] = edSplitRaw(c);
    b.text = left;
    edRepaint(id, left.length, false);
    const carry = ["bullet","num","todo"].indexOf(b.type)>-1 ? b.type : "p";
    edInsertAfter(id, {type:carry, text:right, checked:false}, 0);
    edCommit();
    playSound && playSound("tap");
    return;
  }
  if(e.key==="Enter" && e.shiftKey){
    if(b.type==="code") return;
    e.preventDefault();
    const [left, right] = edSplitRaw(c);
    b.text = left + SOFT + right;
    edRepaint(id, left.length + 1);
    edCommit();
    return;
  }
  if(e.key==="Backspace"){
    const off = edCaretRaw(c);
    const sel = window.getSelection();
    if(off===0 && sel.isCollapsed){
      e.preventDefault();
      if(b.type!=="p"){ b.type="p"; b.checked=false; edRepaint(id, 0); edRenumber(); edCommit(); return; }
      if(i===0) return;
      const prev = edActive.blocks[i-1];
      if(prev.type==="divider"){ edRemove(prev.id); edFocus(id, 0); return; }
      const at = prev.text.length;
      prev.text = prev.text + b.text;
      edRemove(id);
      edRepaint(prev.id, at);
      edCommit();
      return;
    }
  }
  if(e.key==="Delete"){
    const off = edCaretRaw(c);
    const raw = edSerialize(c);
    if(off===raw.length && window.getSelection().isCollapsed && i < edActive.blocks.length-1){
      e.preventDefault();
      const next = edActive.blocks[i+1];
      if(next.type==="divider"){ edRemove(next.id); return; }
      b.text = raw + next.text;
      edRemove(next.id);
      edRepaint(id, raw.length);
      edCommit();
      return;
    }
  }
  if(e.key==="ArrowUp" && !e.shiftKey){
    if(edFirstLine(c) && i>0){
      e.preventDefault();
      let j = i-1;
      while(j>=0 && edActive.blocks[j].type==="divider") j--;
      if(j>=0) edFocus(edActive.blocks[j].id, 1e9);
    }
    return;
  }
  if(e.key==="ArrowDown" && !e.shiftKey){
    if(edLastLine(c) && i < edActive.blocks.length-1){
      e.preventDefault();
      let j = i+1;
      while(j<edActive.blocks.length && edActive.blocks[j].type==="divider") j++;
      if(j<edActive.blocks.length) edFocus(edActive.blocks[j].id, 0);
    }
    return;
  }
  if(e.key==="Tab"){
    e.preventDefault();
    if(b.type==="p"){ b.type="bullet"; b.text=edSerialize(c); edRepaint(id, 1e9); edCommit(); }
    else if(b.type==="bullet"){ b.type="todo"; b.checked=false; b.text=edSerialize(c); edRepaint(id, 1e9); edCommit(); }
    return;
  }
}, true);

/* wrap the selection (or the word under the caret) in a marker pair */
function edWrap(mark){
  const s = window.getSelection(); if(!s.rangeCount) return;
  const c = s.focusNode && (s.focusNode.nodeType===1 ? s.focusNode : s.focusNode.parentElement);
  const box = c && c.closest(".ed-c"); if(!box) return;
  const blkEl = box.closest(".ed-blk"); const b = edActive.blocks[edIndex(blkEl.dataset.id)]; if(!b) return;
  const raw = edSerialize(box);
  let a = edCaretRaw(box), z = a;
  if(!s.isCollapsed){
    const r = s.getRangeAt(0);
    const pre = document.createRange(); pre.selectNodeContents(box); pre.setEnd(r.startContainer, r.startOffset);
    const d = document.createElement("div"); d.appendChild(pre.cloneContents());
    a = edSerialize(d).length; z = a + r.toString().length;
  } else {
    /* no selection: wrap the word the caret sits in */
    let l = a, r2 = a;
    while(l>0 && /\S/.test(raw[l-1])) l--;
    while(r2<raw.length && /\S/.test(raw[r2])) r2++;
    if(l===r2){ a=z=l; } else { a=l; z=r2; }
  }
  const inner = raw.slice(a,z);
  const already = raw.slice(Math.max(0,a-mark.length), a)===mark && raw.slice(z, z+mark.length)===mark;
  if(already){
    b.text = raw.slice(0, a-mark.length) + inner + raw.slice(z+mark.length);
    edRepaint(b.id, a - mark.length + inner.length);
  } else {
    b.text = raw.slice(0,a) + mark + inner + mark + raw.slice(z);
    edRepaint(b.id, z + mark.length*2);
  }
  edCommit();
  selToolHide();
}

function edToggleTodo(id){
  const i = edIndex(id); if(i<0) return;
  const b = edActive.blocks[i];
  if(b.type!=="todo") return;
  b.checked = !b.checked;
  const el = edBlkEl(id);
  const cb = el.querySelector(".ed-cb");
  if(cb){ cb.classList.toggle("on", b.checked); cb.textContent = b.checked?"✓":""; }
  el.classList.toggle("checked", b.checked);
  edCommit();
  try{ hapt(8); playSound(b.checked?"done":"undone"); }catch(e){}
  if(b.checked) try{ confettiBurst(el.getBoundingClientRect().left+40, el.getBoundingClientRect().top+10, currentAccent()||"#8b7cff"); }catch(e){}
}

/* ---------------- input, paste, focus ---------------- */
let edComposing = false;
document.addEventListener("compositionstart", ()=>{ edComposing = true; });
document.addEventListener("compositionend", e=>{
  edComposing = false;
  const c = e.target && e.target.closest && e.target.closest(".ed-c");
  if(c && edActive && edActive.root.contains(c)) c.dispatchEvent(new Event("input", {bubbles:true}));
});
document.addEventListener("input", e=>{
  if(!edActive || edBusy) return;
  if(edComposing || e.isComposing){
    /* keep the model roughly in step, but leave the DOM alone until it commits */
    const cc = e.target.closest && e.target.closest(".ed-c");
    if(cc && edActive.root.contains(cc)){
      const bb = edActive.blocks[edIndex(cc.closest(".ed-blk").dataset.id)];
      if(bb) bb.text = edSerialize(cc);
    }
    return;
  }
  const c = e.target.closest && e.target.closest(".ed-c");
  if(!c || !edActive.root.contains(c) || !document.contains(c)) return;
  const blkEl = c.closest(".ed-blk");
  if(!blkEl || blkEl.dataset.dead) return;
  const b = edActive.blocks[edIndex(blkEl.dataset.id)];
  if(!b) return;
  const raw = edSerialize(c);
  const caret = edCaretRaw(c);
  b.text = raw;

  if(b.type!=="code" && edMaybeConvert(b, raw, c)) { slashClose(); return; }

  /* slash menu: "/" as the first character of an otherwise plain block */
  if(raw[0]==="/" && b.type!=="code"){ slashOpen ? slashFilter(raw.slice(1)) : slashShow(c, b); }
  else if(slashOpen) slashClose();

  /* live inline rendering, with the caret pinned to its exact raw offset.
     Compare against a DOM-normalized version of `want` (not the raw HTML
     string) so escaping differences the browser doesn't care about --
     apostrophes, quotes, etc. becoming "&#39;"/"&quot;" -- don't look like
     a real change. Without this, typing things like "don't" forced a
     needless innerHTML replace on every keystroke, which destroys the
     live text node the caret is sitting in; the caret then collapses to
     the very start of the block, which is why text kept getting typed
     "backwards" at position 0. */
  if(b.type!=="code"){
    const want = edInlineHtml(raw);
    const probe = document.createElement("div");
    probe.innerHTML = want;
    if(probe.innerHTML !== c.innerHTML && !/[*`~=[]$/.test(raw.slice(caret-1,caret))){
      c.innerHTML = want;
      try{ edSetCaret(c, caret); }catch(err){}
    }
  }
  edCommit();
  docLiveMeta();
}, true);

document.addEventListener("paste", e=>{
  if(!edActive) return;
  const c = e.target.closest && e.target.closest(".ed-c");
  if(!c || !edActive.root.contains(c)) return;
  e.preventDefault();
  const txt = (e.clipboardData || window.clipboardData).getData("text/plain") || "";
  const blkEl = c.closest(".ed-blk");
  const id = blkEl.dataset.id;
  const b = edActive.blocks[edIndex(id)];
  const [left, right] = edSplitRaw(c);
  if(txt.indexOf("\n") === -1){
    b.text = left + txt + right;
    edRepaint(id, left.length + txt.length);
    edCommit();
    return;
  }
  /* multi-line paste becomes real blocks — headings, lists and all */
  const parsed = edParse(txt);
  b.text = left;
  if(!left.trim() && parsed.length){ Object.assign(b, parsed.shift(), {id:b.id}); }
  let anchor = id;
  parsed.forEach(p=>{ anchor = edInsertAfter(anchor, p).id; });
  if(right.trim()) anchor = edInsertAfter(anchor, {type:"p", text:right}).id;
  edRepaint(id, 1e9, false);
  edRenderAll();
  edFocus(anchor, 1e9);
  edCommit(true);
  showToast && showToast("Pasted "+(parsed.length+1)+" blocks");
}, true);

/* ---------------- clicks inside the editor ---------------- */
document.addEventListener("mousedown", e=>{
  const g = e.target.closest && e.target.closest('.ed-g[data-ed="menu"]');
  if(g) e.preventDefault();
}, true);

document.addEventListener("click", e=>{
  if(!edActive) return;
  const t = e.target;
  const cb = t.closest && t.closest('[data-ed="check"]');
  if(cb){ e.preventDefault(); e.stopPropagation(); edToggleTodo(cb.closest(".ed-blk").dataset.id); return; }
  const add = t.closest && t.closest('[data-ed="add"]');
  if(add){ e.preventDefault(); e.stopPropagation(); const id = add.closest(".ed-blk").dataset.id; edInsertAfter(id, {type:"p", text:""}); return; }
  const menu = t.closest && t.closest('[data-ed="menu"]');
  if(menu){ e.preventDefault(); e.stopPropagation(); blockMenu(menu.closest(".ed-blk").dataset.id, menu); return; }
  const tail = t.closest && t.closest('[data-ed="tail"]');
  if(tail && edActive.root.contains(tail)){
    e.stopPropagation();
    const last = edActive.blocks[edActive.blocks.length-1];
    if(last && last.type==="p" && !last.text.trim()) edFocus(last.id, 0);
    else edInsertAfter(last.id, {type:"p", text:""});
    return;
  }
  const dv = t.closest && t.closest('.ed-blk[data-type="divider"]');
  if(dv && edActive.root.contains(dv) && !t.closest(".ed-gutter")){
    e.stopPropagation();
    const i = edIndex(dv.dataset.id);
    if(i < edActive.blocks.length-1) edFocus(edActive.blocks[i+1].id, 0);
    else edInsertAfter(dv.dataset.id, {type:"p", text:""});
  }
}, true);

document.addEventListener("focusin", e=>{
  const c = e.target.closest && e.target.closest(".ed-c");
  if(!c) return;
  ui._editing = true; document.body.classList.add("editing");
  const root = c.closest(".ed");
  if(root && (!edActive || edActive.root !== root)){ edFlush(); edAdopt(root); }
});
document.addEventListener("focusout", e=>{
  if(edBusy) return;
  const c = e.target.closest && e.target.closest(".ed-c");
  if(!c) return;
  ui._editing = false;
  document.body.classList.remove("editing");
  if(!edActive || !document.contains(edActive.root) || !edActive.root.contains(c)) return;
  const blkEl = c.closest(".ed-blk"); if(!blkEl || blkEl.dataset.dead) return;
  /* the node that just blurred may already have been replaced — ignore ghosts */
  if(edActive.root.querySelector('.ed-blk[data-id="'+blkEl.dataset.id+'"]:not([data-dead])') !== blkEl) return;
  const b = edActive.blocks[edIndex(blkEl.dataset.id)]; if(!b) return;
  b.text = edSerialize(c);
  if(b.type!=="code"){
    const want = edInlineHtml(b.text);
    if(want !== c.innerHTML) c.innerHTML = want;
  }
  edCommit(true);
  setTimeout(()=>{ if(!document.querySelector(".ed-c:focus")) slashClose(); }, 120);
});

/* ---------------- drag blocks to reorder ---------------- */
let edDrag = null, edDropLine = null;
document.addEventListener("dragstart", e=>{
  const g = e.target.closest && e.target.closest('.ed-g[data-ed="menu"]');
  if(!g || !edActive) return;
  const blk = g.closest(".ed-blk");
  edDrag = blk.dataset.id;
  blk.classList.add("dragging");
  ui._intDrag = true;
  try{ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain","block"); }catch(_){}
});
document.addEventListener("dragover", e=>{
  if(!edDrag || !edActive) return;
  e.preventDefault();
  const blks = Array.from(edActive.root.querySelectorAll(".ed-blk"));
  let target = null, after = false;
  for(const el of blks){
    const r = el.getBoundingClientRect();
    if(e.clientY >= r.top && e.clientY <= r.bottom){ target = el; after = e.clientY > r.top + r.height/2; break; }
  }
  if(!target){
    const last = blks[blks.length-1];
    if(last && e.clientY > last.getBoundingClientRect().bottom){ target = last; after = true; }
  }
  if(!target) return;
  if(!edDropLine){ edDropLine = document.createElement("div"); edDropLine.className = "ed-drop"; }
  edActive.root.style.position = "relative";
  const r = target.getBoundingClientRect(), rr = edActive.root.getBoundingClientRect();
  edDropLine.style.top = ((after ? r.bottom : r.top) - rr.top - 1)+"px";
  if(edDropLine.parentElement !== edActive.root) edActive.root.appendChild(edDropLine);
  edDropLine._t = target.dataset.id; edDropLine._a = after;
});
document.addEventListener("drop", e=>{
  if(!edDrag || !edActive) return;
  e.preventDefault();
  const from = edIndex(edDrag);
  if(from>-1 && edDropLine && edDropLine._t && edDropLine._t !== edDrag){
    const blk = edActive.blocks.splice(from,1)[0];
    let to = edIndex(edDropLine._t);
    if(edDropLine._a) to++;
    edActive.blocks.splice(to, 0, blk);
    edRenderAll();
    edCommit(true);
    try{ playSound("move"); hapt(10); }catch(_){}
  }
  edDragEnd();
});
document.addEventListener("dragend", edDragEnd);
function edDragEnd(){
  if(edDrag){ const el = edBlkEl(edDrag); if(el) el.classList.remove("dragging"); }
  edDrag = null; ui._intDrag = false;
  if(edDropLine && edDropLine.parentElement) edDropLine.remove();
}

function menuEl(){
  let m = $("#omenu");
  if(!m){ m = document.createElement("div"); m.id = "omenu"; m.className = "omenu"; m.style.display="none"; document.body.appendChild(m); }
  return m;
}
function menuPlace(m, x, y){
  m.style.display = "block";
  m._openedAt = Date.now();
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 10))+"px";
  m.style.top  = (y + r.height > innerHeight - 10) ? Math.max(8, y - r.height - 26)+"px" : y+"px";
}
function slashShow(c, b){
  slashOpen = true; slashBlk = b.id; slashSel = 0;
  slashFilter("");
  const r = c.getBoundingClientRect();
  menuPlace(menuEl(), r.left, r.bottom + 6);
}
function slashFilter(q){
  q = (q||"").toLowerCase().trim();
  slashItems = SLASH_ALL.filter(x=>{
    if(x.k==="sep") return !q;
    if(!q) return true;
    return (x.t+" "+x.kw).toLowerCase().indexOf(q) > -1;
  });
  if(!slashItems.filter(x=>x.k!=="sep").length){ slashClose(); return; }
  if(slashSel >= slashItems.length) slashSel = 0;
  while(slashItems[slashSel] && slashItems[slashSel].k==="sep") slashSel++;
  const m = menuEl();
  m.innerHTML = '<div class="mh">Blocks</div>' + slashItems.map((x,i)=>
    x.k==="sep" ? '<div class="msep"></div>' :
    '<button type="button" data-slash="'+x.k+'" data-i="'+i+'" class="'+(i===slashSel?"sel":"")+'">'+
      '<span class="mi">'+x.i+'</span><span class="mt">'+x.t+'<span class="ms">'+x.s+'</span></span></button>'
  ).join("");
  const sel = m.querySelector("button.sel");
  if(sel) sel.scrollIntoView({block:"nearest"});
}
function slashKey(e){
  const pick = d=>{
    let i = slashSel;
    do{ i += d; if(i<0) i = slashItems.length-1; if(i>=slashItems.length) i = 0; }
    while(slashItems[i] && slashItems[i].k==="sep");
    slashSel = i;
    const m = menuEl();
    $$("button", m).forEach(bt=>bt.classList.toggle("sel", +bt.dataset.i===slashSel));
    const s = m.querySelector("button.sel"); if(s) s.scrollIntoView({block:"nearest"});
  };
  if(e.key==="ArrowDown"){ e.preventDefault(); pick(1); return; }
  if(e.key==="ArrowUp"){ e.preventDefault(); pick(-1); return; }
  if(e.key==="Enter" || e.key==="Tab"){ e.preventDefault(); const it = slashItems[slashSel]; if(it) slashApply(it.k); return; }
}
function slashClose(){
  /* only ever hides the slash menu — a block or document menu opened meanwhile stays put */
  const wasSlash = slashOpen;
  slashOpen = false; slashBlk = null;
  const m = $("#omenu");
  if(wasSlash && m) m.style.display = "none";
}

function slashApply(k){
  const id = slashBlk; slashClose();
  if(!edActive || !id) return;
  const i = edIndex(id); if(i<0) return;
  const b = edActive.blocks[i];
  const rest = b.text.replace(/^\/[^\s]*\s?/, "");
  if(SLASH_TPL[k]){
    const rows = SLASH_TPL[k]().map(r=>Object.assign({id:uid(), checked:false}, r));
    edActive.blocks.splice(i, 1, ...rows);
    if(rest.trim()) edActive.blocks.splice(i+rows.length, 0, {id:uid(), type:"p", text:rest, checked:false});
    edRenderAll(); edCommit(true);
    edFocus(rows[rows.length-1].id, 1e9);
    try{ playSound("add"); }catch(_){}
    return;
  }
  if(k==="date" || k==="time"){
    const now = new Date();
    const s = k==="date" ? now.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})
                         : now.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    b.text = rest + s;
    edRepaint(id, b.text.length); edCommit();
    return;
  }
  if(k==="task"){
    b.text = rest; b.type = "todo"; b.checked = false;
    edRepaint(id, b.text.length); edCommit(true);
    docBlockToTask(rest || "New task");
    return;
  }
  if(k==="divider"){
    b.type = "divider"; b.text = "";
    edRepaint(id, 0, false);
    if(i === edActive.blocks.length-1) edInsertAfter(id, {type:"p", text:rest});
    else edFocus(edActive.blocks[i+1].id, 0);
    edCommit(); return;
  }
  b.type = k; b.text = rest; b.checked = false;
  edRepaint(id, rest.length); edRenumber(); edCommit();
}

document.addEventListener("click", e=>{
  const m = $("#omenu");
  if(!m || m.style.display==="none") return;
  if(m._openedAt && Date.now() - m._openedAt < 80) return;   /* just opened by this very click */
  const btn = e.target.closest && e.target.closest("#omenu button");
  if(!btn){
    if(!e.target.closest || !e.target.closest("#omenu")){
      $$(".ed-blk.menu-open").forEach(x=>x.classList.remove("menu-open"));
      slashClose();
    }
    return;
  }
  e.preventDefault(); e.stopPropagation();
  if(btn.dataset.slash){ slashApply(btn.dataset.slash); return; }
  const id = m.dataset.blk;
  const act = btn.dataset.blk, turn = btn.dataset.turn;
  m.style.display = "none";
  $$(".ed-blk.menu-open").forEach(x=>x.classList.remove("menu-open"));
  if(!edActive || !id) return;
  const i = edIndex(id); if(i<0) return;
  const b = edActive.blocks[i];
  if(turn){
    b.type = turn; if(turn!=="todo") b.checked = false;
    if(turn==="divider") b.text = "";
    edRepaint(id, 1e9); edRenumber(); edCommit(true); return;
  }
  if(act==="dup"){ const nb = Object.assign({}, b, {id:uid()}); edActive.blocks.splice(i+1,0,nb); edRenderAll(); edCommit(true); edFocus(nb.id,1e9); }
  else if(act==="copy"){ try{ navigator.clipboard.writeText(edPlain(b.text)); showToast("Copied"); }catch(_){}; }
  else if(act==="task"){ docBlockToTask(edPlain(b.text) || "New task"); }
  else if(act==="up" && i>0){ edActive.blocks.splice(i-1,0,edActive.blocks.splice(i,1)[0]); edRenderAll(); edCommit(true); edFocus(id,1e9); }
  else if(act==="down" && i<edActive.blocks.length-1){ edActive.blocks.splice(i+1,0,edActive.blocks.splice(i,1)[0]); edRenderAll(); edCommit(true); edFocus(id,1e9); }
  else if(act==="del"){ edRemove(id); edCommit(true); try{ playSound("delete"); }catch(_){} }
}, true);

function selToolHide(){ document.body.classList.remove("seltool-on"); }
document.addEventListener("selectionchange", ()=>{
  if(!edActive){ selToolHide(); return; }
  const s = window.getSelection();
  if(!s || s.isCollapsed || !s.rangeCount){ selToolHide(); return; }
  const node = s.focusNode && (s.focusNode.nodeType===1 ? s.focusNode : s.focusNode.parentElement);
  if(!node || !node.closest || !node.closest(".ed-c") || !edActive.root.contains(node)){ selToolHide(); return; }
  const r = s.getRangeAt(0).getBoundingClientRect();
  if(!r.width && !r.height){ selToolHide(); return; }
  const t = selToolEl();
  document.body.classList.add("seltool-on");
  const tw = t.getBoundingClientRect().width || 250;
  t.style.left = Math.max(8, Math.min(r.left + r.width/2 - tw/2, innerWidth - tw - 10))+"px";
  t.style.top  = Math.max(8, r.top - 44)+"px";
});
document.addEventListener("mousedown", e=>{
  const b = e.target.closest && e.target.closest("#seltool button");
  if(b) e.preventDefault();
}, true);
document.addEventListener("click", e=>{
  const b = e.target.closest && e.target.closest("#seltool button");
  if(!b) return;
  e.preventDefault(); e.stopPropagation();
  const f = b.dataset.fmt;
  if(f==="link"){
    const sel = window.getSelection(); const txt = sel ? sel.toString() : "";
    const url = prompt("Link URL", "https://");
    if(url && /^https?:\/\//i.test(url)) edWrapLink(txt, url);
    return;
  }
  if(f==="task"){
    const sel = window.getSelection(); const txt = (sel ? sel.toString() : "").trim();
    if(txt) docBlockToTask(txt);
    selToolHide();
    return;
  }
  edWrap(f);
}, true);

function edWrapLink(txt, url){
  const s = window.getSelection(); if(!s.rangeCount) return;
  const node = s.focusNode && (s.focusNode.nodeType===1 ? s.focusNode : s.focusNode.parentElement);
  const box = node && node.closest(".ed-c"); if(!box || !edActive) return;
  const b = edActive.blocks[edIndex(box.closest(".ed-blk").dataset.id)]; if(!b) return;
  const raw = edSerialize(box);
  const r = s.getRangeAt(0);
  const pre = document.createRange(); pre.selectNodeContents(box); pre.setEnd(r.startContainer, r.startOffset);
  const d = document.createElement("div"); d.appendChild(pre.cloneContents());
  const a = edSerialize(d).length, z = a + r.toString().length;
  const md = "["+(txt||url)+"]("+url+")";
  b.text = raw.slice(0,a) + md + raw.slice(z);
  edRepaint(b.id, a + md.length);
  edCommit(true);
  selToolHide();
}

const DOC_COVERS = ["#8b7cff","#4f8ef7","#2ab1dd","#30a46c","#d6a327","#e17435","#e5484d","#d6409f","#8b8d98"];
const DOC_ICONS  = "📝 📄 🗒 📔 📓 📚 ✍️ 💡 🎯 🚀 🔥 ⭐️ ✅ 📌 🧠 🗂 📊 📈 💼 🏠 ❤️ 🎨 🎵 🍳 ✈️ 💰 🧩 🌱 ☕ 🌙 🐾 🧭".split(" ");

/* ---------------- doc plumbing ---------------- */
function ensurePages(){
  if(!Array.isArray(state.pages) || !state.pages.length){
    state.pages = [{id:uid(), title:"Notes", icon:"📝", body:"", createdAt:Date.now(), updatedAt:Date.now()}];
  }
  return state.pages;
}
function docFind(d){
  if(!d) return null;
  if(d.kind==="task") return state.tasks.find(t=>t.id===d.id) || null;
  if(d.kind==="note"){
    for(const s of state.spaces){
      const n = (s.notes||[]).find(x=>x.id===d.id);
      if(n){ d.spaceId = s.id; return n; }
    }
    return null;
  }
  if(d.kind==="page"){ ensurePages(); return state.pages.find(p=>p.id===d.id) || null; }
  return null;
}
function docBodyOf(d, o){ return d.kind==="task" ? (o.desc||"") : (o.body||""); }
function docSetBody(d, o, v){ if(d.kind==="task") o.desc = v; else o.body = v; o.updatedAt = Date.now(); }
function docTint(d, o){
  if(d.kind==="note") return o.color || "#8b7cff";
  if(d.kind==="page") return o.cover || "#4f8ef7";
  const sp = d.kind==="task" ? spaceOf(o) : null;
  return o.cover || (sp ? sp.color : "#8b7cff");
}
function docIconOf(d, o){
  if(o.icon) return o.icon;
  if(d.kind==="task") return spaceOf(o).icon || "✓";
  if(d.kind==="note") return "🗒";
  return "📝";
}
function docLabel(d){ return d.kind==="task" ? "Task" : d.kind==="note" ? "Note" : "Page"; }

/* open a doc — full page, or as a side peek */
function openDoc(kind, id, spaceId, opt){
  opt = opt || {};
  const d = {kind:kind, id:id, spaceId:spaceId||null};
  if(!docFind(d)) return;
  if(opt.peek){
    ui.peek = d;
    renderPeek(true);
    document.body.classList.add("peek-open");
    try{ playSound("tap"); }catch(_){}
    return;
  }
  edFlush();
  closePeek(true);
  if(ui.view!=="doc") ui.docBack = {view:ui.view, spaceId:ui.spaceId, tab:ui.tab, pageId:ui.pageId};
  ui.doc = d; ui.view = "doc"; ui.search = "";
  closeSb();
  renderDoc._sig = null;
  render();
  try{ playSound("nav"); }catch(_){}
}
function docBack(){
  edFlush();
  const b = ui.docBack || {view:"today"};
  ui.view = b.view || "today"; ui.spaceId = b.spaceId || null; ui.tab = b.tab || "tasks";
  ui.doc = null; ui.docBack = null;
  edActive = null;
  render();
}
function closePeek(instant){
  const p = $("#peek");
  if(!p || !document.body.classList.contains("peek-open")) return;
  if(edActive && p.contains(edActive.root)) edUnmount();
  ui.peek = null;
  renderPeek._sig = null;
  if(instant || isReduced()){ document.body.classList.remove("peek-open"); p.classList.remove("closing"); p.innerHTML = ""; }
  else{
    p.classList.add("closing");
    setTimeout(()=>{
      p.classList.remove("closing"); document.body.classList.remove("peek-open");
      if(!document.body.classList.contains("peek-open")) p.innerHTML = "";
    }, 220);
  }
  try{ playSound("close"); }catch(_){}
  if(ui.view==="doc"){ renderDoc._sig = null; renderDoc(); }
}

function docRelated(d, o){
  let h = "";
  if(d.kind==="note" || d.kind==="page"){
    const sid = d.kind==="note" ? d.spaceId : null;
    const list = state.tasks.filter(t=>!t.done && (!sid || t.spaceId===sid)).sort(sortTasks).slice(0,4);
    if(list.length){
      h += '<div class="doc-rel"><div class="rl">Open tasks'+(sid?' in this space':'')+'</div>'+
        list.map(t=>'<div class="rel-row" data-act="open-task" data-id="'+t.id+'"><span class="ri">'+(t.done?"✓":"○")+'</span>'+esc(t.title)+
          (t.due?'<span style="margin-left:auto;font-size:11.5px;color:var(--faint)">'+fmtDue(t.due)+'</span>':'')+'</div>').join("")+'</div>';
    }
  }
  if(d.kind==="task"){
    const sp = spaceOf(o);
    const notes = (sp.notes||[]).slice(0,3);
    if(notes.length){
      h += '<div class="doc-rel"><div class="rl">Notes in '+esc(sp.name)+'</div>'+
        notes.map(n=>'<div class="rel-row" data-act="open-note" data-id="'+n.id+'" data-space="'+sp.id+'"><span class="ri">🗒</span>'+esc(n.title||"Untitled")+'</div>').join("")+'</div>';
    }
  }
  return h;
}

function docHtml(d, o, mode){
  const tint = docTint(d, o);
  const tint2 = DOC_COVERS[(DOC_COVERS.indexOf(tint)+3+DOC_COVERS.length)%DOC_COVERS.length] || "#4f8ef7";
  const noCover = o.cover === false;
  const title = d.kind==="task" ? o.title : (o.title||"");
  const wide = !!(state.prefs && state.prefs.docWide) && mode==="page";
  const body = docBodyOf(d, o);
  let h = '<div class="doc'+(wide?" wide":"")+(noCover?" no-cover":"")+'" style="--dc:'+esc(tint)+';--dc2:'+esc(tint2)+'">';
  if(!noCover){
    h += '<div class="doc-cover"><div class="cov-tools">'+
        '<button class="cov-btn" data-act="doc-cover">🎨 Cover</button>'+
        '<button class="cov-btn" data-act="doc-nocover">Remove</button>'+
      '</div></div>';
  }
  h += '<div class="doc-head">'+
      '<div class="doc-icon" data-act="doc-icon" title="Change the icon">'+esc(docIconOf(d,o))+'</div>'+
      '<div class="doc-title'+(d.kind==="task"&&o.done?" done":"")+'" contenteditable="true" spellcheck="true" data-ph="Untitled '+docLabel(d).toLowerCase()+'">'+esc(title)+'</div>'+
      '<div class="doc-bar">'+
        (mode==="page" ? '<button class="dbtn" data-act="doc-back" title="Back (Esc)">‹ Back</button>' : '')+
        (d.kind==="task" ? '<button class="dbtn" data-act="dp-done">'+(o.done?"↺ Reopen":"✓ Mark done")+'</button>' : '')+
        (d.kind==="task" ? '<button class="dbtn" data-act="doc-focus">🎯 Focus</button>' : '')+
        (d.kind!=="task" ? '<button class="dbtn" data-act="doc-share">↗ Share</button>' : '')+
        '<span class="grow"></span>'+
        '<span class="save-dot"><i></i><span>Saved</span></span>'+
        '<button class="dbtn" data-act="doc-menu" title="More">⋯</button>'+
      '</div>'+
      docProps(d, o)+
      (d.kind==="task" ? docChecklist(o) : "")+
      '<div class="doc-sep"></div>'+
    '</div>'+
    '<div class="ed"></div>'+
    '<div class="doc-foot">'+
      '<div class="doc-meta"><span class="wc">'+countWords(edPlain(body))+' words</span>'+
        '<span>·</span><span>'+Math.max(1,Math.round(countWords(edPlain(body))/220))+' min read</span>'+
        '<span>·</span><span>Updated '+new Date(o.updatedAt||o.createdAt||Date.now()).toLocaleDateString(undefined,{month:"short",day:"numeric"})+'</span></div>'+
      docRelated(d, o)+
    '</div>'+
  '</div>';
  return h;
}

/* ---------------- render: full page ---------------- */
function renderDoc(){
  const d = ui.doc, o = docFind(d);
  const view = $("#view");
  if(!o){ docBack(); return; }
  const sig = d.kind+":"+d.id+":"+(state.prefs&&state.prefs.docWide?1:0);
  if(ui._editing && renderDoc._sig === sig) return;   /* never yank the DOM while typing */
  renderDoc._sig = sig;
  edKill(view);
  edDom(()=>{ view.innerHTML = '<div class="doc-scroll">'+docHtml(d, o, "page")+'</div>'; });
  docBind(d, o, view);
}

function renderPeek(fresh){
  const d = ui.peek, o = docFind(d);
  const p = $("#peek"); if(!p) return;
  if(!o){ closePeek(true); return; }
  const sig = d.kind+":"+d.id;
  if(!fresh && ui._editing && renderPeek._sig === sig) return;
  renderPeek._sig = sig;
  const peekHtml =
    '<div class="peek-resize" data-act="peek-resize"></div>'+
    '<div class="peek-top">'+
      '<button class="dbtn" data-act="peek-close" title="Close (Esc)">✕</button>'+
      '<button class="dbtn" data-act="peek-full" title="Open as a full page">⤢ Open full</button>'+
      '<span class="grow"></span>'+
      '<span class="crumb here" style="pointer-events:none">'+docLabel(d)+'</span>'+
    '</div>'+
    '<div class="peek-body">'+docHtml(d, o, "peek")+'</div>';
  edKill(p);
  edDom(()=>{ p.innerHTML = peekHtml; });
  const pb = p.querySelector(".peek-body");
  if(pb && fresh) pb.scrollTop = 0;
  docBind(d, o, p);
}

function docBind(d, o, host){
  const root = host.querySelector(".ed");
  if(!root) return;
  edMount(root, docBodyOf(d, o), txt=>{
    const cur = docFind(d); if(!cur) return;
    docSetBody(d, cur, txt);
    save();
    docLiveMeta();
  }, {});
  const ttl = host.querySelector(".doc-title");
  if(ttl){
    ttl.addEventListener("input", ()=>{
      const cur = docFind(d); if(!cur) return;
      cur.title = ttl.textContent.replace(/\s+$/,"");
      cur.updatedAt = Date.now();
      docSaveSoon();
      docSyncChrome();
    });
    ttl.addEventListener("keydown", ev=>{
      if(ev.key==="Enter"){ ev.preventDefault(); const f = root.querySelector(".ed-c"); if(f){ f.focus(); try{ edSetCaret(f, 0); }catch(_){}} }
      if(ev.key==="ArrowDown" && !ev.shiftKey){ const f = root.querySelector(".ed-c"); if(f){ ev.preventDefault(); f.focus(); } }
    });
    ttl.addEventListener("focus", ()=>{ ui._editing = true; });
    ttl.addEventListener("blur", ()=>{
      ui._editing = false; save(); docSyncChrome();
      if(d.kind==="task"){ const cur = docFind(d); if(cur) draftParseTitle(cur); }
    });
  }
  if(ui._focusTitle && ttl){
    ui._focusTitle = false;
    setTimeout(()=>{ try{ ttl.focus(); }catch(e){} }, 60);
  }
  docLiveMeta();
}

let docSaveT = null;
function docSaveSoon(){ clearTimeout(docSaveT); docSaveT = setTimeout(()=>{ save(); docLiveMeta(); }, 300); }

function docLiveMeta(){
  const host = (edActive && edActive.root.closest(".doc")) || $(".peek-body .doc") || $("#view .doc");
  if(!host) return;
  const dot = host.querySelector(".save-dot");
  if(dot){
    const on = cloud.on && navigator.onLine;
    dot.className = "save-dot"+(on?"":" off");
    dot.lastElementChild.textContent = on ? "Saved to cloud" : "Saved on this device";
  }
  const wc = host.querySelector(".wc");
  if(wc && edActive) wc.textContent = countWords(edPlain(edStringify(edActive.blocks)))+" words";
}
function docSyncChrome(){ renderSidebar(); renderTopbar(); }

/* create a real task out of a line of text — the editor's little superpower */
function docBlockToTask(text){
  const d = ui.peek || ui.doc;
  let sid = null;
  if(d){ sid = d.kind==="task" ? (docFind(d)||{}).spaceId : d.spaceId; }
  const sp = getSpace(sid) || getSpace(ui.spaceId) || getSpace(defaultNotesSpaceId()) || state.spaces[0];
  const p = parseQuick(String(text).trim().slice(0,180));
  const t = {id:uid(), title:p.title||String(text).trim().slice(0,180), desc:"", due:p.due||null,
             priority:p.priority||0, spaceId:sp.id, stage:sp.stages[0].id, repeat:p.repeat||null,
             checklist:[], done:false, createdAt:Date.now(), completedAt:null};
  state.tasks.push(t);
  save(); renderSidebar();
  try{ playSound("add"); hapt(10); }catch(_){}
  showToast("🎯 Task created in "+sp.name);
}

   Menus for the document properties

function openMenu(anchor, html, tag){
  const m = menuEl();
  m.innerHTML = html;
  m.dataset.menu = tag||"";
  delete m.dataset.blk;
  const r = anchor.getBoundingClientRect();
  menuPlace(m, r.left, r.bottom + 6);
}
function closeMenu(){ const m = $("#omenu"); if(m) m.style.display = "none"; }

function menuBtn(act, icon, label, sub, on){
  return '<button type="button" data-mact="'+act+'" class="'+(on?"sel":"")+'"><span class="mi">'+icon+'</span>'+
    '<span class="mt">'+esc(label)+(sub?'<span class="ms">'+esc(sub)+'</span>':'')+'</span></button>';
}

function docTarget(){ return ui.peek || ui.doc; }
/* the ⋯ button of whichever surface is on top — menus anchor to it */
function docMenuAnchor(){
  const host = ui.peek ? $("#peek") : $("#view");
  return (host && host.querySelector('.doc-bar [data-act="doc-menu"]')) ||
         (host && host.querySelector(".doc-bar")) || document.body;
}

document.addEventListener("click", e=>{
  const b = e.target.closest && e.target.closest("#omenu [data-mact]");
  if(!b) return;
  e.preventDefault(); e.stopPropagation();
  const act = b.dataset.mact, v = b.dataset.v || "";
  closeMenu();
  const d = docTarget(); const o = d ? docFind(d) : null;
  const repaint = ()=>{ save(); if(ui.peek) { renderPeek._sig=null; renderPeek(true);} if(ui.view==="doc"){ renderDoc._sig=null; renderDoc(); } renderSidebar(); renderTopbar(); };
  if(!o && act.indexOf("set-")===0) return;
  switch(act){
    case "set-space": { const sp = getSpace(v); if(sp && o){ o.spaceId = sp.id; if(!sp.stages.some(s=>s.id===o.stage)) o.stage = sp.stages[0].id; repaint(); } break; }
    case "set-nspace": {
      const to = getSpace(v);
      if(to && o && d.kind==="note"){
        const from = getSpace(d.spaceId);
        if(from && from!==to){ from.notes = (from.notes||[]).filter(n=>n.id!==o.id); to.notes = to.notes||[]; to.notes.push(o); d.spaceId = to.id; }
        repaint();
      }
      break;
    }
    case "set-due":  { if(!o) break; o.due = v==="clear" ? null : (v==="wknd" ? (()=>{let x=(6-new Date().getDay()+7)%7; if(!x)x=7; return addDays(x);})() : addDays(+v)); repaint(); break; }
    case "set-pri":  { if(o){ o.priority = +v; repaint(); } break; }
    case "set-stage":{ if(o){ o.stage = v; repaint(); } break; }
    case "set-rep":  { if(o){ o.repeat = v||null; if(o.repeat && !o.due) o.due = todayStr(); repaint(); } break; }
    case "set-color":{ if(o){ o.color = v; repaint(); } break; }
    case "set-cover":{ if(o){ o.cover = v==="none" ? false : v; repaint(); } break; }
    case "set-icon": { if(o){ o.icon = v; repaint(); } break; }
    case "set-icon-clear": { if(o){ delete o.icon; repaint(); } break; }
    case "gal-open": openDoc(b.dataset.kind, b.dataset.id, b.dataset.space); break;
    case "gal-peek": openDoc(b.dataset.kind, b.dataset.id, b.dataset.space, {peek:true}); break;
    case "gal-pin":  { const n = noteById(b.dataset.id); if(n){ n.n.pinned = !n.n.pinned; save(); render(); } break; }
    case "gal-dup":  docDuplicate(b.dataset.kind, b.dataset.id, b.dataset.space); break;
    case "gal-del":  docDelete(b.dataset.kind, b.dataset.id, b.dataset.space); break;
    case "sp-edit":  openSpaceModal(b.dataset.id); break;
    case "sp-new-note": { const n = makeNote(b.dataset.id); if(n) openDoc("note", n.id, b.dataset.id); break; }
    case "sp-del":   { const el = document.createElement("button"); el.dataset.act="del-space"; el.dataset.id=b.dataset.id; document.body.appendChild(el); el.click(); el.remove(); break; }
    case "doc-m-wide": { state.prefs = state.prefs||{}; state.prefs.docWide = !state.prefs.docWide; save(); renderDoc._sig=null; if(ui.view==="doc") renderDoc(); break; }
    case "doc-m-icon": setTimeout(()=>openMenu(docMenuAnchor(),
        '<div class="mh">Icon</div><div class="mcolors" style="max-width:264px">'+
        DOC_ICONS.map(i=>'<button data-mact="set-icon" data-v="'+i+'" style="width:30px;height:30px;font-size:17px;background:none">'+i+'</button>').join("")+
        '</div><div class="msep"></div><button data-mact="set-icon-clear"><span class="mi">✕</span><span class="mt">Reset to default</span></button>'), 10); break;
    case "doc-m-cover": setTimeout(()=>openMenu(docMenuAnchor(),
        '<div class="mh">Cover</div><div class="mcolors">'+
        DOC_COVERS.map(c=>'<button data-mact="set-cover" data-v="'+c+'" style="background:'+c+'"></button>').join("")+
        '</div><div class="msep"></div><button data-mact="set-cover" data-v="none"><span class="mi">✕</span><span class="mt">No cover</span></button>'), 10); break;
    case "doc-m-copy": { if(o && d){ const txt = (o.title||"Untitled")+"\n\n"+edPlain(docBodyOf(d,o));
      try{ navigator.clipboard.writeText(txt); showToast("Copied to your clipboard"); }catch(_){ showToast("Copy failed"); } } break; }
    case "doc-m-tidy": edTidyTicked(); break;
    case "doc-m-dup": if(d) docDuplicate(d.kind, d.id, d.spaceId); break;
    case "doc-m-del": if(d) docDelete(d.kind, d.id, d.spaceId); break;
    case "doc-m-txt": { const a3 = document.createElement("button"); a3.dataset.act = "doc-txt"; document.body.appendChild(a3); a3.click(); a3.remove(); break; }
    case "bulk-due": bulkDue(v); break;
    case "bulk-pri": bulkPri(+v); break;
    case "bulk-space": bulkSpace(v); break;
  }
}, true);

function noteById(id){
  for(const s of state.spaces){ const n = (s.notes||[]).find(x=>x.id===id); if(n) return {n:n, s:s}; }
  return null;
}
function makeNote(spaceId, pinned){
  const sp = getSpace(spaceId) || getSpace(defaultNotesSpaceId()) || state.spaces[0];
  if(!sp) return null;
  sp.notes = sp.notes || [];
  const n = {id:uid(), title:"", body:"", color:NOTE_COLORS[Math.floor(Math.random()*NOTE_COLORS.length)],
             pinned:!!pinned, createdAt:Date.now(), updatedAt:Date.now()};
  sp.notes.push(n);
  ui._justAdded = n.id;
  save();
  try{ playSound("add"); }catch(_){}
  return n;
}
function makePage(){
  ensurePages();
  const p = {id:uid(), title:"", icon:DOC_ICONS[Math.floor(Math.random()*10)], body:"", createdAt:Date.now(), updatedAt:Date.now()};
  state.pages.push(p);
  save();
  try{ playSound("add"); }catch(_){}
  return p;
}
function docDuplicate(kind, id, spaceId){
  const d = {kind, id, spaceId}; const o = docFind(d); if(!o) return;
  const copy = JSON.parse(JSON.stringify(o));
  copy.id = uid(); copy.createdAt = Date.now(); copy.updatedAt = Date.now();
  copy.title = (copy.title||"Untitled")+" copy";
  if(kind==="task"){ copy.done=false; copy.completedAt=null; state.tasks.push(copy); }
  else if(kind==="note"){ const sp = getSpace(d.spaceId); if(!sp) return; sp.notes.push(copy); }
  else { state.pages.push(copy); }
  ui._justAdded = copy.id;
  save(); render();
  showToast("Duplicated");
  try{ playSound("add"); }catch(_){}
}
function docDelete(kind, id, spaceId){
  if(kind==="task"){ deleteTasks([id]); if(ui.doc && ui.doc.id===id) docBack(); if(ui.peek && ui.peek.id===id) closePeek(); return; }
  if(kind==="note"){
    const f = noteById(id); if(!f) return;
    f.s.notes = f.s.notes.filter(n=>n.id!==id);
    undoBuf = {type:"note", spaceId:f.s.id, note:f.n};
    try{ playSound("delete"); }catch(_){}
    save();
    if(ui.peek && ui.peek.id===id) closePeek(true);
    if(ui.doc && ui.doc.id===id) docBack(); else render();
    showToast("Note deleted", true);
    return;
  }
  ensurePages();
  if(state.pages.length<=1){ showToast("Keep at least one page"); return; }
  const p = state.pages.find(x=>x.id===id); if(!p) return;
  state.pages = state.pages.filter(x=>x.id!==id);
  undoBuf = {type:"page", page:p};
  try{ playSound("delete"); }catch(_){}
  save();
  if(ui.peek && ui.peek.id===id) closePeek(true);
  if(ui.doc && ui.doc.id===id) docBack(); else render();
  showToast("Page deleted", true);
}

/* undo gains the two new kinds */
function applyUndo(){
  if(!undoBuf) return;
  const b = undoBuf; undoBuf = null;
  try{ playSound("undo"); }catch(_){}
  if(b.type==="note"){ const sp = getSpace(b.spaceId) || state.spaces[0]; if(sp){ sp.notes = sp.notes || []; sp.notes.push(b.note); ui._justAdded = b.note.id; } }
  else if(b.type==="page"){ ensurePages(); state.pages.push(b.page); }
  else if(b.type==="habit"){ state.habits = state.habits || []; state.habits.push(b.habit); }
  else if(b.type==="app"){ state.apps = state.apps || []; state.apps.push(b.app); }
  else if(b.type==="space"){ state.spaces.push(b.space); state.tasks.push(...b.tasks); }
  else if(b.type==="bulk"){ b.prev.forEach(p=>{ const t = state.tasks.find(x=>x.id===p.id); if(t) Object.assign(t, p); }); }
  else if(b.tasks){ state.tasks.push(...b.tasks); }
  save(); render(); hideToast();
}

/* ================================================================================
   Multi-select + the bulk bar
   ================================================================================ */
function selList(){ if(!Array.isArray(ui.sel)) ui.sel = []; return ui.sel; }
function selClear(){ ui.sel = []; selPaint(); }
function selHas(id){ return selList().indexOf(id) > -1; }
function selToggle(id){
  const i = selList().indexOf(id);
  if(i>-1) ui.sel.splice(i,1); else ui.sel.push(id);
  ui._anchor = id;
  selPaint();
}
function selRange(id){
  selList();
  const rows = $$("#view .task[data-id]").map(r=>r.dataset.id);
  const a = rows.indexOf(ui._anchor), b = rows.indexOf(id);
  if(a<0 || b<0){ selToggle(id); return; }
  const [lo,hi] = a<b ? [a,b] : [b,a];
  for(let i=lo;i<=hi;i++) if(!selHas(rows[i])) ui.sel.push(rows[i]);
  selPaint();
}
function selPaint(){
  const on = selList().length > 0;
  document.body.classList.toggle("multi-mode", on);
  document.body.classList.toggle("bulk-on", on);
  $$("#view .task[data-id]").forEach(r=>{
    const s = selHas(r.dataset.id);
    r.classList.toggle("picked", s);
    const p = r.querySelector(".t-pick");
    if(p){ p.classList.toggle("on", s); p.textContent = s ? "✓" : ""; }
  });
  const bar = $("#bulkbar");
  if(bar && on){
    const c = bar.querySelector(".bcount");
    if(c) c.textContent = ui.sel.length+" selected";
  }
}
function bulkSnapshot(ids){
  return ids.map(id=>{ const t = state.tasks.find(x=>x.id===id); return t ? JSON.parse(JSON.stringify(t)) : null; }).filter(Boolean);
}
function bulkDone(){
  const ids = selList().slice(); if(!ids.length) return;
  undoBuf = {type:"bulk", prev:bulkSnapshot(ids)};
  const allDone = ids.every(id=>{ const t = state.tasks.find(x=>x.id===id); return t && t.done; });
  ids.forEach(id=>{ const t = state.tasks.find(x=>x.id===id); if(t){ t.done = !allDone; t.completedAt = t.done ? todayStr() : null; } });
  selClear(); save(); render();
  try{ playSound(allDone?"undone":"done"); hapt(12); }catch(_){}
  showToast(ids.length+(allDone?" reopened":" completed"), true);
}
function bulkDue(v){
  const ids = selList().slice(); if(!ids.length) return;
  undoBuf = {type:"bulk", prev:bulkSnapshot(ids)};
  const due = v==="clear" ? null : (v==="wknd" ? (()=>{let x=(6-new Date().getDay()+7)%7; if(!x)x=7; return addDays(x);})() : addDays(+v));
  ids.forEach(id=>{ const t = state.tasks.find(x=>x.id===id); if(t) t.due = due; });
  selClear(); save(); render();
  showToast(ids.length+" rescheduled", true);
}
function bulkPri(p){
  const ids = selList().slice(); if(!ids.length) return;
  undoBuf = {type:"bulk", prev:bulkSnapshot(ids)};
  ids.forEach(id=>{ const t = state.tasks.find(x=>x.id===id); if(t) t.priority = p; });
  selClear(); save(); render();
  showToast(ids.length+" updated", true);
}
function bulkSpace(sid){
  const ids = selList().slice(); const sp = getSpace(sid); if(!ids.length || !sp) return;
  undoBuf = {type:"bulk", prev:bulkSnapshot(ids)};
  ids.forEach(id=>{ const t = state.tasks.find(x=>x.id===id); if(t){ t.spaceId = sp.id; if(!sp.stages.some(s=>s.id===t.stage)) t.stage = sp.stages[0].id; } });
  selClear(); save(); render();
  showToast(ids.length+" moved to "+sp.name, true);
}
function bulkDelete(){
  const ids = selList().slice(); if(!ids.length) return;
  selClear();
  deleteTasks(ids, ids.length+" tasks deleted");
}
function buildBulkBar(){
  if($("#bulkbar")) return;
  const bar = document.createElement("div");
  bar.id = "bulkbar";
  bar.innerHTML =
    '<span class="bcount">0 selected</span>'+
    '<button data-act="bulk-done">✓ Complete</button>'+
    '<button data-act="bulk-when">📅 When</button>'+
    '<button data-act="bulk-prio">⚑ Priority</button>'+
    '<button data-act="bulk-move">🗂 Move</button>'+
    '<span class="bsep"></span>'+
    '<button class="danger" data-act="bulk-del">🗑 Delete</button>'+
    '<button data-act="bulk-clear">✕</button>';
  document.body.appendChild(bar);
}

/* ================================================================================
   Inline editing: double-click any title and just type
   ================================================================================ */
function inlineEdit(el, get, set, opt){
  if(el.dataset.editing) return;
  opt = opt || {};
  el.dataset.editing = "1";
  const before = get();
  el.classList.add("inline-edit");
  el.setAttribute("contenteditable","true");
  el.textContent = before;
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  let done = false;
  const finish = commit=>{
    if(done) return; done = true;
    const v = el.textContent.trim();
    el.removeAttribute("contenteditable");
    el.classList.remove("inline-edit");
    delete el.dataset.editing;
    if(commit && v !== before){ set(v); try{ playSound("tap"); }catch(_){} }
    else if(!commit) el.textContent = before;
    if(opt.after) opt.after(commit && v!==before);
  };
  el.addEventListener("keydown", ev=>{
    ev.stopPropagation();
    if(ev.key==="Enter"){ ev.preventDefault(); finish(true); }
    else if(ev.key==="Escape"){ ev.preventDefault(); finish(false); }
  });
  el.addEventListener("blur", ()=>finish(true), {once:true});
  el.addEventListener("click", ev=>ev.stopPropagation());
}

document.addEventListener("dblclick", e=>{
  clearTimeout(ui._dblT); ui._dblT = null;
  const tt = e.target.closest && e.target.closest(".task .t-title");
  if(tt){
    e.preventDefault(); e.stopPropagation();
    const id = tt.closest(".task").dataset.id;
    const t = state.tasks.find(x=>x.id===id); if(!t) return;
    inlineEdit(tt, ()=>t.title, v=>{ if(v){ t.title = v; save(); renderSidebar(); } }, {after:()=>{}});
    return;
  }
  const gt = e.target.closest && e.target.closest(".gcard .gt, .gtr .gn");
  if(gt){
    e.preventDefault(); e.stopPropagation();
    const host = gt.closest("[data-id]"); if(!host) return;
    const d = {kind:host.dataset.kind, id:host.dataset.id, spaceId:host.dataset.space};
    const o = docFind(d); if(!o) return;
    inlineEdit(gt, ()=>o.title||"", v=>{ o.title = v; o.updatedAt = Date.now(); save(); });
    return;
  }
  const nm = e.target.closest && e.target.closest('.nav-item[data-act="nav-space"] .nm');
  if(nm){
    e.preventDefault(); e.stopPropagation();
    const s = getSpace(nm.closest(".nav-item").dataset.id); if(!s) return;
    inlineEdit(nm, ()=>s.name, v=>{ if(v){ s.name = v; save(); renderTopbar(); } });
    return;
  }
  const pn = e.target.closest && e.target.closest('.nav-item[data-act="open-page"] .nm');
  if(pn){
    e.preventDefault(); e.stopPropagation();
    ensurePages();
    const p = state.pages.find(x=>x.id===pn.closest(".nav-item").dataset.id); if(!p) return;
    inlineEdit(pn, ()=>p.title||"", v=>{ p.title = v; p.updatedAt = Date.now(); save(); renderTopbar(); });
  }
}, true);

/* ---------------- task rows gain a handle, a picker and a peek button ---------------- */
function taskRow(t, withSpace, idx){

/* the Notes home — every page and every note, in one place */
function renderPad(){
  ensurePages();
  const filter = ui.galFilter || "all";
  const pages = state.pages.filter(p=>!ui.search || ((p.title||"")+" "+(p.body||"")).toLowerCase().includes(ui.search.toLowerCase()));
  const notes = [];
  state.spaces.forEach(s=>(s.notes||[]).forEach(n=>{ if(noteMatches(n)) notes.push({n:n, s:s}); }));
  notes.sort((a,b)=>((b.n.pinned?1:0)-(a.n.pinned?1:0)) || ((b.n.updatedAt||b.n.createdAt)-(a.n.updatedAt||a.n.createdAt)));
  pages.sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt));

  const items = [];
  if(filter!=="notes") pages.forEach(p=>items.push(galMode()==="list"?galRow("page",p,null):galCard("page",p,null)));
  if(filter!=="pages") notes.forEach(x=>items.push(galMode()==="list"?galRow("note",x.n,x.s):galCard("note",x.n,x.s)));

  const newBtn = galMode()==="list" ? "" :
    '<div class="gcard new" data-act="new-page" role="button" tabindex="0"><span class="big">＋</span>New page</div>';

  const seg = (k,l)=>'<button class="'+(filter===k?"on":"")+'" data-act="gal-filter" data-v="'+k+'">'+l+'</button>';

  let h = '<div class="view-inner wide">'+
    '<div class="greet" style="margin-bottom:8px"><h1>🗂 Notes <span class="grad">&amp; pages</span></h1>'+
      '<div class="sub">'+pages.length+' page'+(pages.length===1?"":"s")+' · '+notes.length+' note'+(notes.length===1?"":"s")+' — everything you have written, full size and searchable.</div></div>'+
    '<div class="gal-bar">'+
      '<div class="seg2">'+seg("all","All")+seg("pages","Pages")+seg("notes","Notes")+'</div>'+
      '<span class="grow"></span>'+
      galToggle()+
      '<button class="btn ghost" data-act="new-note">＋ Note</button>'+
      '<button class="btn primary" data-act="new-page">＋ Page</button>'+
    '</div>';

  if(!items.length){
    h += '<div class="empty"><span class="art">🗒</span><h3>'+(ui.search?"Nothing matches":"A blank canvas")+'</h3>'+
         '<p>'+(ui.search?"Try a different search.":"Pages are your long-form canvas. Notes live inside a space. Both open full screen with headings, checklists and everything else.")+'</p>'+
         '<div class="empty-actions" style="display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap">'+
           '<button class="btn primary" data-act="new-page">＋ New page</button>'+
           '<button class="btn ghost" data-act="new-note">＋ New note</button>'+
         '</div></div>';
  } else {
    h += galWrap(items, newBtn);
  }
  h += uiTip("pad")+'</div>';

/* a space's notes tab */
function renderNotesView(s){
  if(!s.notes) s.notes = [];
  const notes = s.notes.filter(noteMatches).sort(noteSort);
  const items = notes.map(n=>galMode()==="list"?galRow("note",n,s):galCard("note",n,s));
  const newBtn = galMode()==="list" ? "" :
    '<div class="gcard new" data-act="new-note" role="button" tabindex="0"><span class="big">＋</span>New note</div>';
  let h = '<div class="view-inner wide">'+
    '<div class="gal-bar"><span style="font-size:13px;color:var(--muted)">'+notes.length+' note'+(notes.length===1?"":"s")+' in '+esc(s.name)+'</span>'+
      '<span class="grow"></span>'+galToggle()+
      '<button class="btn primary" data-act="new-note">＋ New note</button></div>';
  if(!notes.length){
    h += '<div class="empty"><span class="art">🗒</span><h3>'+(ui.search?"No matching notes":"No notes yet")+'</h3>'+

  } else {
    h += galWrap(items, newBtn);
  }
  h += uiTip("notes")+'</div>';

}

/* ---------------- render root (doc-aware) ---------------- */
function renderView(){
  if(ui.view==="space" && !getSpace(ui.spaceId)){ ui.view="today"; ui.spaceId=null; }
  if(ui.view==="doc" && !docFind(ui.doc)){ ui.view = (ui.docBack&&ui.docBack.view) || "today"; ui.doc = null; }
  const ac = currentAccent() || ((state.prefs && state.prefs.accent) || "");
  if(ac) document.documentElement.style.setProperty("--accent", ac);
  else document.documentElement.style.removeProperty("--accent");
  const key = ui.view+"|"+ui.spaceId+"|"+ui.tab+"|"+((ui.doc&&ui.doc.id)||"");
  const viewChanged = key !== renderView._last;
  renderView._last = key;
  const viewEl = $("#view");
  const keepScroll = viewChanged ? 0 : viewEl.scrollTop;
  viewEl.classList.toggle("anim-in", viewChanged);
  viewEl.classList.toggle("doc-view", ui.view==="doc");

  if(ui.view==="doc"){ renderDoc(); }
  else{
    if(edActive && !($("#peek") && $("#peek").contains(edActive.root))){ edFlush(); edActive = null; }
    renderDoc._sig = null;
    if(ui.view==="today"){ renderToday(); }
    else if(ui.view==="pad"){ renderPad(); }
    else if(ui.view==="week"){ renderWeek(); }
    else if(ui.view==="habits"){ renderHabits(); }
    else if(ui.view==="work"){ renderWork(); }
    else if(ui.view==="ext"){ viewEl.innerHTML = ""; }
    else {
      const s = getSpace(ui.spaceId);
      if(ui.tab==="board"){ renderBoardView(s); bindBoardDnD(); }
      else if(ui.tab==="notes"){ renderNotesView(s); }
      else { renderListView(s); }
    }
  }
  if(viewChanged){
    const vi = viewEl.firstElementChild;
    if(vi) vi.classList.add("view-anim");
    /* a new view always starts at the top — never inherit the last one's scroll */
    viewEl.style.scrollBehavior = "auto";
    viewEl.scrollTop = 0;
    viewEl.style.scrollBehavior = "";
  } else {
    viewEl.style.scrollBehavior = "auto";
    viewEl.scrollTop = keepScroll;
    viewEl.style.scrollBehavior = "";
  }
  ui._justAdded = ui._justToggled = ui._justMoved = null;
  try{ if(["today","work","week","habits","pad"].indexOf(ui.view) > -1) localStorage.setItem("orbit-last", ui.view); }catch(e){}
  bindSwipes(viewEl);
  selPaint();
  if(document.body.classList.contains("peek-open")) renderPeek(false);
}

/* ================================================================================
   Routing — intercept the handful of actions the document layer takes over
   ================================================================================ */
const DOC_ACTS = {
  "open-task":1,"open-note":1,"open-page":1,"new-note":1,"new-dash-note":1,"new-page":1
};
document.addEventListener("click", e=>{
  if(e.target.closest && e.target.closest("#omenu, #seltool, .ed")) return;
  const el = e.target.closest && e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;

  /* multi-select takes priority over opening a task */
  if(act==="t-pick"){
    e.preventDefault(); e.stopPropagation();
    selToggle(el.dataset.id);
    return;
  }
  if(act==="open-task" && el.classList.contains("task")){
    if(e.metaKey || e.ctrlKey){ e.preventDefault(); e.stopPropagation(); selToggle(el.dataset.id); return; }
    if(e.shiftKey){
      e.preventDefault(); e.stopPropagation();
      if(selList().length) selRange(el.dataset.id);
      else openDoc("task", el.dataset.id, null, {peek:true});
      return;
    }
    if(selList().length){ e.preventDefault(); e.stopPropagation(); selToggle(el.dataset.id); return; }
    /* a click straight on the title waits ~180ms, so a double-click renames instead */
    if(e.target.closest(".t-title")){
      e.preventDefault(); e.stopPropagation();
      const tid = el.dataset.id;
      clearTimeout(ui._dblT);
      ui._dblT = setTimeout(()=>{ ui._dblT = null; openDoc("task", tid); }, 180);
      return;
    }
  }

  if(!DOC_ACTS[act]) return;
  if(ui._justDragged) { e.preventDefault(); e.stopPropagation(); return; }
  e.preventDefault(); e.stopPropagation();
  closePopover();
  switch(act){

/* ================================================================================
   Resizers
   ================================================================================ */
function bindResize(selector, varName, min, max, cls, store){
  document.addEventListener("pointerdown", e=>{
    const h = e.target.closest && e.target.closest(selector);
    if(!h) return;
    e.preventDefault();
    document.body.classList.add(cls);
    const startX = e.clientX;
    const start = parseInt(getComputedStyle(document.documentElement).getPropertyValue(varName)) || min;
    const dir = selector.indexOf("peek") > -1 ? -1 : 1;
    const move = ev=>{
      const w = Math.max(min, Math.min(max(), start + dir*(ev.clientX - startX)));
      document.documentElement.style.setProperty(varName, w+"px");
    };
    const up = ()=>{
      document.body.classList.remove(cls);
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue(varName));
      state.prefs = state.prefs || {}; state.prefs[store] = w; save();
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });
}

/* ================================================================================
   Keyboard
   ================================================================================ */
document.addEventListener("keydown", e=>{
  /* Escape closes the newest layer first */
  if(e.key==="Escape"){
    const m = $("#omenu");
    if(m && m.style.display!=="none"){ closeMenu(); slashClose(); $$(".ed-blk.menu-open").forEach(x=>x.classList.remove("menu-open")); e.stopPropagation(); return; }
    if(document.body.classList.contains("seltool-on")){ selToolHide(); }
    if(selList().length){ selClear(); e.stopPropagation(); return; }
    if(document.body.classList.contains("peek-open")){ closePeek(); e.stopPropagation(); return; }
    if(ui._editing){ const a = document.activeElement; if(a && a.blur) a.blur(); e.stopPropagation(); return; }
    if(ui.view==="doc" && !$("#modal-root .overlay")){ docBack(); e.stopPropagation(); return; }
    return;
  }
  if((e.metaKey||e.ctrlKey) && e.key==="\\"){ e.preventDefault(); toggleSidebar(); return; }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="a" && selList().length){
    e.preventDefault();
    ui.sel = $$("#view .task[data-id]").map(r=>r.dataset.id);
    selPaint(); return;
  }
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select" || e.target.isContentEditable) return;
  if($("#modal-root .overlay")) return;
  if(!e.ctrlKey && !e.metaKey && !e.altKey){
    const k = e.key.toLowerCase();
    if(k==="e" && ui.view!=="doc"){ e.preventDefault(); const p = makePage(); openDoc("page", p.id); return; }
    if(k==="backspace" && selList().length){ e.preventDefault(); bulkDelete(); return; }
  }
}, true);

   Boot
   ================================================================================ */
(function canvasBoot(){
  /* peek shell */
  if(!$("#peek")){
    const bd = document.createElement("div"); bd.id = "peek-backdrop";
    const pk = document.createElement("div"); pk.id = "peek";
    document.body.appendChild(bd); document.body.appendChild(pk);
    bd.addEventListener("click", ()=>closePeek());
  }
  buildBulkBar();
  selToolEl();
  menuEl();

  /* remembered pane widths */
  const p = state.prefs || {};
  if(p.sbw)  document.documentElement.style.setProperty("--sb-w", Math.max(210, Math.min(460, p.sbw))+"px");
  if(p.peekw)document.documentElement.style.setProperty("--peek-w", Math.max(360, Math.min(900, p.peekw))+"px");

  bindResize(".sb-resize", "--sb-w", 210, ()=>Math.min(460, innerWidth*0.4), "sb-resizing", "sbw");
  bindResize(".peek-resize", "--peek-w", 360, ()=>Math.min(900, innerWidth*0.75), "peek-resizing", "peekw");

  /* clicking empty space in a list clears a selection */
  document.addEventListener("mousedown", e=>{
    if(!selList().length) return;
    if(e.target.closest && (e.target.closest(".task") || e.target.closest("#bulkbar") || e.target.closest("#omenu"))) return;
    selClear();
  });

  ensurePages();
  render();
})();
