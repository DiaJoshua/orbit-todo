<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit: Tasks & Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236e56cf'/%3E%3Cstop offset='1' stop-color='%232f7fe0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23g)'/%3E%3Ccircle cx='256' cy='256' r='102' fill='%23fff' opacity='.96'/%3E%3Cellipse cx='256' cy='256' rx='194' ry='70' fill='none' stroke='%23fff' stroke-width='26' opacity='.85' transform='rotate(-18 256 256)'/%3E%3Ccircle cx='414' cy='182' r='21' fill='%23fff'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f7f7f5" id="meta-theme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbit">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("orbit-theme")==="dark"?"dark":"light"}catch(e){}</script>
<script src="https://js.puter.com/v2/" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ theme tokens ============ */
/* Light (default): warm off white, muted ink, quiet violet accent */
:root{
  --bg:#f7f7f5; --bg2:#ffffff;
  --panel:#ffffff; --panel2:rgba(28,28,32,.05);
  --border:rgba(28,28,32,.09); --border2:rgba(28,28,32,.16);
  --text:#1d1d20; --muted:#63636c; --faint:#a3a3ab;
  --accent:#6e56cf;
  --rose:#e5484d; --amber:#c98a10; --cyan:#2f7fe0; --green:#1f9d55;
  --on-accent:#ffffff;
  --chip-bg:rgba(28,28,32,.055);
  --track:rgba(28,28,32,.08);
  --col-bg:rgba(255,255,255,.6);
  --sb-bg:rgba(250,250,248,.72);
  --tb-bg:rgba(247,247,245,.66);
  --modal-bg:#ffffff;
  --toast-bg:#ffffff;
  --overlay-bg:rgba(28,28,34,.3);
  --note-base:#ffffff;
  --tint-mix:#26262c;
  --card-shadow:0 1px 1px rgba(18,18,23,.03), 0 2px 6px rgba(18,18,23,.04), 0 14px 28px -18px rgba(18,18,23,.1);
  --pop-shadow:0 10px 20px -8px rgba(18,18,23,.12), 0 30px 70px -12px rgba(18,18,23,.24);
  --hover-shadow:0 4px 10px -2px rgba(18,18,23,.08), 0 16px 32px -12px rgba(18,18,23,.14);
  --scroll:rgba(28,28,32,.18);
  --glow-op:.10;
  --radius:14px;
  color-scheme:light;
}
/* Dark: neutral charcoal, gentle contrast, no blue cast */
html[data-theme="dark"]{
  --bg:#151517; --bg2:#1c1c1f;
  --panel:#1b1b1e; --panel2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.15);
  --text:#ececef; --muted:#a2a2ab; --faint:#66666e;
  --accent:#8f7be8;
  --rose:#f2555a; --amber:#f0b429; --cyan:#62a8ff; --green:#3dd68c;
  --on-accent:#141416;
  --chip-bg:rgba(255,255,255,.07);
  --track:rgba(255,255,255,.08);
  --col-bg:rgba(255,255,255,.025);
  --sb-bg:rgba(23,23,26,.7);
  --tb-bg:rgba(21,21,23,.58);
  --modal-bg:#202023;
  --toast-bg:#232326;
  --overlay-bg:rgba(0,0,0,.55);
  --note-base:rgba(255,255,255,.03);
  --tint-mix:#ffffff;
  --card-shadow:0 1px 1px rgba(0,0,0,.24), 0 2px 8px rgba(0,0,0,.2), 0 16px 32px -20px rgba(0,0,0,.5);
  --pop-shadow:0 12px 24px -8px rgba(0,0,0,.5), 0 34px 80px -12px rgba(0,0,0,.6);
  --hover-shadow:0 6px 14px -4px rgba(0,0,0,.38), 0 18px 36px -14px rgba(0,0,0,.44);
  --scroll:rgba(255,255,255,.13);
  --glow-op:.06;
  color-scheme:dark;
}

/* ============ glass materials (Apple-style translucency) ============ */
:root{--glass-bg:rgba(253,253,252,.72);--glass-panel:rgba(255,255,255,.55)}
html[data-theme="dark"]{--glass-bg:rgba(28,28,32,.74);--glass-panel:rgba(255,255,255,.05)}
:root{--panel-g:rgba(255,255,255,.66);--bg2-g:rgba(255,255,255,.55);--edge:rgba(255,255,255,.6)}
html[data-theme="dark"]{--panel-g:rgba(22,22,26,.6);--bg2-g:rgba(27,27,32,.55);--edge:rgba(255,255,255,.08)}
html[data-glass="max"]{--panel-g:rgba(255,255,255,.5);--bg2-g:rgba(255,255,255,.42);--glass-bg:rgba(253,253,252,.62)}
html[data-theme="dark"][data-glass="max"]{--panel-g:rgba(17,17,21,.52);--bg2-g:rgba(22,22,27,.47);--glass-bg:rgba(24,24,28,.6)}
/* Liquid Glass: every surface goes translucent over the ambient glow.
   Cheap by design — per-card blur only in Max mode below. */
html:not([data-glass="off"]) .task,
html:not([data-glass="off"]) .card,
html:not([data-glass="off"]) .stat,
html:not([data-glass="off"]) .note-row,
html:not([data-glass="off"]) .habit-row,
html:not([data-glass="off"]) .quickadd,
html:not([data-glass="off"]) .col,
html:not([data-glass="off"]) .tabs,
html:not([data-glass="off"]) .searchwrap,
html:not([data-glass="off"]) .page-chip,
html:not([data-glass="off"]) .ov-banner,
html:not([data-glass="off"]) .sb-foot .mini{
  background:var(--panel-g);
  box-shadow:inset 0 1px 0 var(--edge), var(--card-shadow);
}
html:not([data-glass="off"]) .card{background:var(--bg2-g)}
html:not([data-glass="off"]) .task:hover{background:var(--bg2-g)}
html:not([data-glass="off"]) #scratch-pad{background:var(--panel-g);box-shadow:inset 0 1px 0 var(--edge), var(--card-shadow)}
@supports ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  html[data-glass="max"] .task,
  html[data-glass="max"] .card,
  html[data-glass="max"] .stat,
  html[data-glass="max"] .note-row,
  html[data-glass="max"] .habit-row,
  html[data-glass="max"] .quickadd,
  html[data-glass="max"] .col,
  html[data-glass="max"] .tabs{
    backdrop-filter:blur(18px) saturate(1.2);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);
  }
}

/* compact density (like iPhone display zoom) */
html[data-density="compact"] body{font-size:13.5px}
html[data-density="compact"] .task{padding:9px 12px;margin-bottom:6px}
html[data-density="compact"] .nav-item{padding:7px 10px}
html[data-density="compact"] .stat{padding:11px 46px 11px 13px}
html[data-density="compact"] .tile2{padding:11px 13px}
html[data-density="compact"] .note-row{padding:10px 13px}
html[data-density="compact"] .habit-row{padding:10px 12px}

/* user-forced reduce motion (mirrors the system media query) */
html[data-motion="reduce"] *,html[data-motion="reduce"] *::before,html[data-motion="reduce"] *::after{animation:none !important;transition:none !important}

/* swipe actions */
.task.swipe-r{background:color-mix(in srgb,var(--green) 16%,var(--panel)) !important;border-color:color-mix(in srgb,var(--green) 45%,var(--border)) !important}
.task.swipe-l{background:color-mix(in srgb,var(--rose) 16%,var(--panel)) !important;border-color:color-mix(in srgb,var(--rose) 45%,var(--border)) !important}


.set-sel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:13px;outline:none;max-width:190px;color:var(--text)}
.set-sel:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}

@supports ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  html:not([data-glass="off"]) .modal,
  html:not([data-glass="off"]) .cmd,
  html:not([data-glass="off"]) #popover,
  html:not([data-glass="off"]) #toast,
  html:not([data-glass="off"]) #focus-pill,
  html:not([data-glass="off"]) #mascot-bubble,
  html:not([data-glass="off"]) #orbie-panel{
    background:var(--glass-bg);
    backdrop-filter:blur(26px) saturate(1.25);
    -webkit-backdrop-filter:blur(26px) saturate(1.25);
  }
  html:not([data-glass="off"]) #sidebar{backdrop-filter:blur(24px) saturate(1.15);-webkit-backdrop-filter:blur(24px) saturate(1.15)}
  html:not([data-glass="off"]) #topbar{backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15)}
}

/* ============ reset & base ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
  font-size:14.5px; line-height:1.55; overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-feature-settings:"cv05","cv11";
}
h1,h2,h3,.pad-title{letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--accent) 35%,var(--scroll));border:2px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* smooth crossfade when switching themes (fallback path) */
html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after{
  transition:background-color .45s ease, color .45s ease, border-color .45s ease, box-shadow .45s ease !important;
}
/* circular reveal theme switch (View Transitions API).
   The old theme is snapshotted and held perfectly still while the new
   theme expands over it as a circle growing from the toggle button.
   The clip-path animation itself is driven from toggleTheme(). */
html.vt-theme::view-transition-old(root),
html.vt-theme::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.vt-theme::view-transition-old(root){z-index:1}
html.vt-theme::view-transition-new(root){z-index:2}

/* ============ ambient atmosphere — the light source behind the glass ============ */
#bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bg-glow::before,#bg-glow::after,#bg-glow i{
  content:"";position:absolute;width:58vw;height:58vw;border-radius:50%;
  filter:blur(150px);opacity:var(--glow-op);display:block;
  animation:drift 45s ease-in-out infinite alternate;
}
#bg-glow::before{background:color-mix(in srgb,var(--blob1) 50%,var(--bg));top:-24vw;left:-16vw}
#bg-glow::after{background:color-mix(in srgb,var(--blob2) 50%,var(--bg));bottom:-28vw;right:-16vw;animation-delay:-22s}
#bg-glow .g3{background:color-mix(in srgb,var(--accent) 32%,var(--bg));top:28%;left:58%;width:46vw;height:46vw;animation-delay:-11s;animation-duration:56s}
#bg-glow .g4{background:color-mix(in srgb,var(--blob4) 45%,var(--bg));bottom:-18vw;left:20%;width:42vw;height:42vw;animation-delay:-33s;animation-duration:62s;opacity:calc(var(--glow-op)*.45)}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(3vw,3vh) scale(1.07)}}
/* the atmosphere turns up with each glass level — this is what makes
   Off, Frosted and Max unmistakably different */
:root{--blob1:#a78bfa;--blob2:#93c5fd;--blob4:#fbd8b0}
html[data-glass="on"]{--glow-op:.26}
html[data-theme="dark"][data-glass="on"]{--glow-op:.13}
html[data-glass="max"]{--glow-op:.38}
html[data-theme="dark"][data-glass="max"]{--glow-op:.2}

/* ============ layout ============ */
#app{position:relative;z-index:1;display:flex;height:100vh}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#view{flex:1;overflow-y:auto;padding:26px 30px 130px;scroll-behavior:smooth}
.view-inner{max-width:860px;margin:0 auto}
.view-inner.wide{max-width:1400px}

/* ============ sidebar ============ */
#sidebar{
  width:268px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--sb-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:1px solid var(--border);padding:22px 14px 14px;
  transition:transform .28s cubic-bezier(.4,0,.2,1), margin-left .28s cubic-bezier(.4,0,.2,1);
}
@media(min-width:881px){
  body.sb-collapsed #sidebar{margin-left:-268px}
}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:0 2px 14px;user-select:none;cursor:pointer;border-radius:10px;transition:background .15s}
.logo:hover{background:var(--panel2)}
.logo-tile{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(135deg,#6e56cf,#2f7fe0);box-shadow:0 3px 10px color-mix(in srgb,#6e56cf 35%,transparent);transition:transform .45s cubic-bezier(.3,1.4,.4,1)}
.logo:hover .logo-tile{transform:rotate(12deg) scale(1.05)}
.word2{font-size:14.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.logo .rn{width:26px;height:26px;border-radius:8px;font-size:12px;flex-shrink:0;opacity:0;transition:.15s;display:grid;place-items:center}
.logo:hover .rn{opacity:.6}
.logo .rn:hover{opacity:1;background:var(--panel2)}
@media(max-width:880px){.logo .rn{opacity:.5}}
.sb-scroll{flex:1;overflow-y:auto;padding:2px 2px 10px;touch-action:pan-y}
.drag-src{opacity:.4}
.lifting{transform:scale(1.03) !important;box-shadow:0 10px 26px rgba(0,0,0,.28) !important;background:var(--bg2);position:relative;z-index:5;opacity:.95}
.sb-label{font-size:10.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);padding:16px 12px 7px;display:flex;align-items:center;justify-content:space-between}
.sb-label button{color:var(--faint);font-size:15px;line-height:1;padding:2px 6px;border-radius:8px;transition:.15s}
.sb-label button:hover{color:var(--text);background:var(--panel2)}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;border-radius:12px;color:var(--muted);font-weight:500;
  margin-bottom:2px;position:relative;transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:color-mix(in srgb,var(--ac,var(--accent)) 10%,transparent);color:var(--text);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--ac,var(--accent))}
.nav-item.just-active::before{animation:barIn .3s cubic-bezier(.3,1.4,.4,1)}
.nav-item.just-active .ico{animation:icoPop .32s cubic-bezier(.3,1.4,.4,1)}
@keyframes barIn{from{transform:scaleY(0)}}
@keyframes icoPop{50%{transform:scale(1.14) rotate(-4deg)}}
.nav-item .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:color-mix(in srgb,var(--ac,var(--accent)) 15%,transparent);flex-shrink:0;transition:transform .18s ease}
.nav-item:hover .ico{transform:scale(1.1) rotate(-5deg)}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel2);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.nav-item.active .cnt{background:color-mix(in srgb,var(--ac,var(--accent)) 25%,transparent);color:var(--text)}
.nav-item .bar{position:absolute;left:40px;right:12px;bottom:3px;height:2px;border-radius:2px;background:transparent;overflow:hidden;opacity:.5;transition:opacity .15s}
.nav-item:hover .bar,.nav-item.active .bar{opacity:.9}
.nav-item .bar i{display:block;height:100%;border-radius:2px;background:var(--ac,var(--accent));transition:width .4s ease}
.sb-foot{border-top:1px solid var(--border);padding:12px 6px 2px;display:flex;flex-direction:column;gap:8px}
.sb-foot .row{display:flex;gap:8px}
.sb-foot .mini{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 4px;transition:.15s}
.sb-foot .mini:hover{color:var(--text);border-color:var(--border2);background:var(--panel2)}
.sb-foot .mini.on{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,transparent);background:color-mix(in srgb,var(--green) 8%,transparent)}
.sb-foot .hint{font-size:10.5px;color:var(--faint);text-align:center}
#sb-backdrop{display:none}

/* ============ topbar ============ */
#topbar{
  display:flex;align-items:center;gap:12px;padding:14px 24px;
  border-bottom:1px solid var(--border);
  background:var(--tb-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  position:relative;z-index:5;flex-wrap:wrap;
}
.tb-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:650;min-width:0;letter-spacing:-.1px}
.tb-title .emoji{font-size:17px;flex-shrink:0}
.tb-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tb-spacer{flex:1}
.searchwrap{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:7px 14px;width:250px;transition:border-color .15s,box-shadow .15s}
.searchwrap:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 10%,transparent)}
.searchwrap:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.searchwrap svg{flex-shrink:0;opacity:.5}
.searchwrap input{background:none;border:none;outline:none;width:100%;font-size:13.5px}
.searchwrap input::placeholder{color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:12px;padding:8px 15px;font-size:13.5px;font-weight:600;transition:.15s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.primary{
  background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 90%,#fff), var(--accent));
  color:var(--on-accent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 1px 2px rgba(18,18,23,.18), 0 8px 22px -6px color-mix(in srgb,var(--accent) 55%,transparent);
}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:var(--panel);border-color:var(--border);color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--border2);background:var(--panel2)}
.btn.danger{background:color-mix(in srgb,var(--rose) 12%,transparent);color:var(--rose);border-color:color-mix(in srgb,var(--rose) 30%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--rose) 22%,transparent)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;color:var(--muted);transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.icon-btn:active{transform:scale(.9)}
#theme-btn.spin svg{animation:spinIn .5s cubic-bezier(.3,1.4,.4,1)}
@keyframes spinIn{from{transform:rotate(-150deg) scale(.5);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}

/* ============ tabs row ============ */
.tabsrow{padding:12px 30px 0}
.tabsrow .inner{max-width:860px;margin:0 auto;width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tabsrow.wide .inner{max-width:1400px}
.tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:4px}
.tabs button{padding:6px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--text)}
.tabs button.active{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--text)}
.tabs button.active.just-active{animation:tabPop .22s cubic-bezier(.3,1.3,.4,1)}
@keyframes tabPop{from{transform:scale(.92)}}
.prog-wrap{display:flex;align-items:center;gap:10px;margin-left:auto;color:var(--muted);font-size:12.5px}
.prog-track{width:110px;height:5px;border-radius:5px;background:var(--track);overflow:hidden}
.prog-track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));transition:width .5s ease}

/* ============ today / greeting ============ */
.greet h1{font-size:30px;font-weight:800;letter-spacing:-.75px}
.greet h1 .uname{cursor:pointer;border-bottom:2px dotted var(--faint)}
.greet h1 .uname:hover{color:var(--accent)}
.greet h1 .grad{background:linear-gradient(90deg,var(--accent),#2f7fe0);-webkit-background-clip:text;background-clip:text;color:transparent}
.greet .sub{color:var(--muted);margin-top:3px;font-size:14px}
.greet .quote{margin-top:7px;font-size:13px;color:var(--faint);font-style:italic}
.streak{display:inline-flex;align-items:center;gap:5px;margin-left:12px;font-size:12.5px;font-weight:700;color:var(--amber);background:color-mix(in srgb,var(--amber) 11%,transparent);padding:3px 12px;border-radius:999px;vertical-align:middle;animation:pop .4s ease}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin:22px 0 8px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 56px 15px 17px;transition:.18s;position:relative;overflow:hidden;box-shadow:var(--card-shadow);animation:var(--enter,none)}
.stat .s-ico{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--sc,var(--accent)) 11%,transparent);transition:transform .18s}
.stat:hover .s-ico{transform:scale(1.12) rotate(-6deg)}
.stats .stat:nth-child(2){animation-delay:40ms}
.stats .stat:nth-child(3){animation-delay:80ms}
.stats .stat:nth-child(4){animation-delay:120ms}
.stat:hover{transform:translateY(-2px);border-color:var(--border2)}
.stat .num{font-size:26px;font-weight:800;line-height:1.1;color:var(--sc,var(--text))}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:3px}

.day-prog{display:flex;align-items:center;gap:11px;margin:2px 2px 8px;font-size:12px;color:var(--muted);animation:var(--enter-slow,none)}
.day-prog .prog-track{flex:1;width:auto;height:6px}
.day-prog b{color:var(--text);font-weight:700}
.ui-tip{margin-top:26px;text-align:center;font-size:12px;color:var(--faint);animation:var(--enter-fade,none)}

/* view switch transition */
.view-anim{animation:viewIn .22s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* entrance animations only play when the view actually changes
   (renderView toggles .anim-in) so re-renders never flicker or replay */
#view.anim-in{--enter:fadeUp .22s ease both;--enter-slow:fadeUp .3s ease both;--enter-note:noteIn .25s ease backwards;--enter-fade:fadeIn .3s ease}
.task.just-in,.card.just-in,.note.just-in{animation:fadeUp .28s cubic-bezier(.2,.8,.3,1) both !important;animation-delay:0s !important}

/* ============ groups & task rows ============ */
.group-head{
  display:flex;align-items:center;gap:8px;margin:22px 0 9px;
  font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);
  cursor:pointer;user-select:none;
}
.group-head .chev{transition:transform .2s;font-size:10px;color:var(--faint)}
.group-head.collapsed .chev{transform:rotate(-90deg)}
.group-head .gcnt{color:var(--faint);font-weight:600}
.group-head .dot{width:7px;height:7px;border-radius:50%;background:var(--gc,var(--faint))}
.group-head .clear-done{margin-left:auto;font-size:11px;letter-spacing:.4px;color:var(--faint);text-transform:none;padding:3px 9px;border-radius:8px}
.group-head .clear-done:hover{color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}

/* groups open and close with a smooth height + fade, no re-render */
.group-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1)}
.group-body.closed{grid-template-rows:0fr}
.gb-in{overflow:hidden;min-height:0;transition:opacity .22s ease}
.group-body.closed .gb-in{opacity:0}

.task{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--card-shadow);
  transition:transform .13s,border-color .13s,background .13s,opacity .25s;
  animation:var(--enter,none);
}
.task:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:var(--bg2)}
.task:active{transform:scale(.995)}
.task.done{opacity:.55}
.task.done .t-title{text-decoration:line-through;text-decoration-color:var(--muted)}
.check{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0;margin-top:2px;
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--on-accent);
  transition:.18s;background:transparent;
}
.check:hover{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
.check:active{transform:scale(.82)}
.task.done .check,.card.done .check{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff));border-color:transparent}
.just-done .check{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.t-main{flex:1;min-width:0}
.t-title{font-weight:600;font-size:14.5px;word-break:break-word}
.t-desc{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.t-chips:empty{display:none}
.chip{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip-bg);color:var(--muted);display:inline-flex;align-items:center;gap:4px;line-height:1.5}
.chip.due.today{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber)}
.chip.due.overdue{background:color-mix(in srgb,var(--rose) 13%,transparent);color:var(--rose)}
.chip.pri.p3{background:color-mix(in srgb,var(--rose) 12%,transparent);color:var(--rose)}
.chip.pri.p2{background:color-mix(in srgb,var(--amber) 13%,transparent);color:var(--amber)}
.chip.pri.p1{background:color-mix(in srgb,var(--cyan) 13%,transparent);color:var(--cyan)}
.chip.stage{background:color-mix(in srgb,var(--accent) 13%,transparent);color:color-mix(in srgb,var(--accent) 70%,var(--tint-mix))}
.chip.rep{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
.chip.space-chip{background:color-mix(in srgb,var(--c) 13%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--tint-mix))}
.task .del{opacity:0;width:30px;height:30px;font-size:14px}
.task:hover .del{opacity:.55}
.task .del:hover{opacity:1;color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ quick add ============ */
.quickadd{
  display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--border);border-radius:14px;padding:5px 6px 5px 16px;margin-bottom:6px;
  transition:border-color .15s;box-shadow:var(--card-shadow);
}
.quickadd:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 10%,transparent)}
.quickadd .plus{color:var(--accent);font-size:19px;font-weight:600}
.quickadd input{flex:1;background:none;border:none;outline:none;padding:9px 0;font-size:14px}
.quickadd input::placeholder{color:var(--faint)}
.quickadd button{background:color-mix(in srgb,var(--accent) 16%,transparent);color:color-mix(in srgb,var(--accent) 75%,var(--tint-mix));font-weight:700;font-size:13px;border-radius:10px;padding:8px 15px;transition:.15s}
.quickadd button:hover{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.qa-prev{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 6px 12px;padding:0 12px;font-size:12px;color:var(--muted);animation:fadeIn .15s ease}
.qa-prev b{font-weight:600;color:var(--text)}
.qa-prev .qa-lbl{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}

/* ============ board ============ */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:20px;min-height:60vh}
.col{flex:0 0 268px;background:var(--col-bg);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100vh - 235px);box-shadow:var(--card-shadow)}
.col-head{display:flex;align-items:center;gap:8px;padding:13px 15px 9px;font-weight:700;font-size:13.5px}
.col-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.col-head .count{margin-left:auto;font-size:11.5px;color:var(--muted);background:var(--panel2);padding:1px 8px;border-radius:999px}
.col-body{flex:1;overflow-y:auto;padding:4px 9px;display:flex;flex-direction:column;gap:8px;min-height:70px;border-radius:12px;transition:background .15s}
.col-body.drop-hint{background:color-mix(in srgb,var(--accent) 8%,transparent);outline:2px dashed color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:-4px}
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;
  cursor:grab;transition:transform .13s,border-color .13s;animation:var(--enter,none);box-shadow:var(--card-shadow);
}
.card{position:relative}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));transform:translateY(-1px)}
.c-next{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:7px;color:var(--faint);font-size:15px;font-weight:700;opacity:0;transition:.12s;line-height:1}
.card:hover .c-next{opacity:.7}
.c-next:hover{background:var(--panel2);color:var(--accent);opacity:1}
@media(max-width:880px){.c-next{opacity:.55}}
.card:active{cursor:grabbing}
.card.dragging{opacity:.35;transform:rotate(2deg) scale(.98)}
.card.done{opacity:.5}
.card.done .c-title{text-decoration:line-through}
.card-top{display:flex;align-items:flex-start;gap:9px}
.card .check{width:18px;height:18px;font-size:10px;margin-top:1px}
.c-title{font-weight:600;font-size:13.5px;flex:1;word-break:break-word}
.card .t-chips{margin-top:8px}
.col-add{margin:6px 9px 10px;padding:8px;border-radius:10px;border:1px dashed var(--border2);color:var(--faint);font-size:12.5px;font-weight:600;transition:.15s}
.col-add:hover{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.col.ghost-col{background:none;border:1px dashed var(--border);justify-content:center;min-height:120px;box-shadow:none}
.col.ghost-col button{padding:20px;color:var(--faint);font-weight:600;font-size:13px;width:100%;height:100%}
.col.ghost-col button:hover{color:var(--text)}

/* ============ notes ============ */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.notes-grid.dash{margin-bottom:10px}
.note{
  --nc:#8b7cff;position:relative;border-radius:16px;padding:15px 16px;min-height:150px;cursor:pointer;
  background:color-mix(in srgb,var(--nc) 10%,var(--note-base));
  border:1px solid color-mix(in srgb,var(--nc) 30%,transparent);
  display:flex;flex-direction:column;gap:7px;transition:transform .18s,box-shadow .18s;
  animation:var(--enter-note,none);box-shadow:var(--card-shadow);
}
.note:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:var(--hover-shadow)}
.notes-grid .note:nth-child(odd):not(.add-note){transform:rotate(-.8deg)}
.notes-grid .note:nth-child(3n):not(.add-note){transform:rotate(.7deg)}
.notes-grid .note:hover{transform:translateY(-3px) rotate(0);box-shadow:var(--hover-shadow)}
@keyframes noteIn{from{opacity:0;transform:scale(.94)}}
.note .pin{position:absolute;top:10px;right:12px;font-size:13px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));transition:transform .18s}
.note:hover .pin{transform:rotate(18deg) scale(1.15)}
.n-title{font-weight:700;font-size:14.5px;color:color-mix(in srgb,var(--nc) 60%,var(--tint-mix));padding-right:18px;word-break:break-word}
.n-body{font-size:12.8px;color:var(--muted);white-space:pre-wrap;flex:1;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.n-date{font-size:10.5px;color:var(--faint)}
.note.add-note{border-style:dashed;background:none;align-items:center;justify-content:center;color:var(--faint);font-weight:600;font-size:13.5px;gap:4px;box-shadow:none}
.note.add-note:hover{color:var(--text);border-color:var(--accent);transform:none}
.note.add-note .big{font-size:26px;color:var(--accent)}

/* ============ notepad ============ */
.pages-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.page-chip{padding:6px 13px;border-radius:10px;background:var(--panel);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--muted);transition:.13s;box-shadow:var(--card-shadow)}
.page-chip:hover{color:var(--text);border-color:var(--border2);transform:translateY(-1px)}
.page-chip.active{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--text);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.page-chip.new{border-style:dashed;background:none;box-shadow:none}
.pad-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pad-title{font-size:22px;font-weight:800;cursor:pointer;border-radius:8px;padding:0 6px;margin-left:-6px}
.pad-title:hover{background:var(--panel2)}
.pad-meta{font-size:12px;color:var(--faint);margin-left:auto}
#scratch-pad{
  width:100%;min-height:62vh;resize:vertical;display:block;
  background:var(--bg2);border:1px solid var(--border);border-radius:18px;
  padding:26px 28px;font-size:15.5px;line-height:1.75;outline:none;color:var(--text);
  box-shadow:var(--card-shadow);font-family:inherit;transition:border-color .15s;
}
#scratch-pad:focus{border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 8%,transparent)}
#scratch-pad::placeholder{color:var(--faint)}
.note-row{
  background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--nc,#8b7cff);
  border-radius:14px;padding:14px 17px;margin-bottom:10px;cursor:pointer;
  box-shadow:var(--card-shadow);transition:transform .15s,background .15s;animation:var(--enter-slow,none);
}
.note-row:hover{transform:translateY(-1px);background:var(--bg2)}
.nr-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.nr-title{font-weight:700;font-size:15px;flex:1;min-width:120px}
.nr-body{margin-top:8px;font-size:13.5px;color:var(--muted);white-space:pre-wrap;line-height:1.65;word-break:break-word}
.head-link{margin-left:auto;font-size:11px;letter-spacing:.4px;color:var(--faint);text-transform:none;padding:3px 9px;border-radius:8px}
.head-link:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

/* ============ empty state ============ */
.empty{text-align:center;padding:56px 20px;color:var(--muted);animation:var(--enter-slow,none)}
.empty .art{font-size:32px;width:72px;height:72px;border-radius:24px;background:var(--panel2);display:grid;place-items:center;margin:0 auto 14px;filter:saturate(.9);animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.empty h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.empty p{font-size:13px;color:var(--faint)}

/* ============ modal ============ */
#modal-root .overlay{
  position:fixed;inset:0;z-index:50;background:var(--overlay-bg);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  display:grid;place-items:center;padding:18px;animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0}}
.modal{
  width:min(540px,94vw);max-height:88vh;overflow-y:auto;
}
.modal.wide{width:min(760px,96vw)}
.modal{
  background:var(--modal-bg);border:1px solid var(--border2);border-radius:22px;padding:26px;
  box-shadow:var(--pop-shadow);animation:zoomIn .18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes zoomIn{from{opacity:0;transform:scale(.94) translateY(8px)}}
#modal-root .overlay.closing{animation:fadeOut .15s ease forwards}
.overlay.closing .modal,.overlay.closing .cmd{animation:zoomOut .15s ease forwards}
@keyframes fadeOut{to{opacity:0}}
@keyframes zoomOut{to{opacity:0;transform:scale(.96) translateY(6px)}}
.modal h2{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.modal .info{font-size:13.5px;color:var(--muted);line-height:1.65;margin-top:4px}
.modal .info b{color:var(--text)}
.modal .info ol{margin:8px 0 8px 20px}
.modal .info li{margin-bottom:5px}
.f-title{width:100%;background:none;border:none;outline:none;font-size:19px;font-weight:700;padding:4px 0 10px;border-bottom:1px solid var(--border)}
.f-title::placeholder{color:var(--faint)}
.modal textarea{
  width:100%;min-height:92px;resize:vertical;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:11px 13px;font-size:13.5px;outline:none;margin-top:14px;line-height:1.5;font-family:inherit;
}
.modal textarea:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:15px}
.f-field{display:flex;flex-direction:column;gap:6px}
.f-field>span{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.4px}
.f-field input,.f-field select{
  background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:8.5px 11px;
  font-size:13.5px;outline:none;width:100%;
}
.f-field input:focus,.f-field select:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.f-field select option{background:var(--modal-bg)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:7.5px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);transition:.13s}
.seg button:hover{color:var(--text)}
.seg button.active{border-color:transparent}
.seg button[data-v="0"].active{background:var(--panel2);color:var(--text)}
.seg button[data-v="1"].active{background:color-mix(in srgb,var(--cyan) 18%,transparent);color:var(--cyan)}
.seg button[data-v="2"].active{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.seg button[data-v="3"].active{background:color-mix(in srgb,var(--rose) 18%,transparent);color:var(--rose)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;transition:.13s}
.swatch:hover{transform:scale(1.12)}
.swatch.active{border-color:var(--bg2);box-shadow:0 0 0 3px color-mix(in srgb,var(--swc) 55%,transparent)}
.cl-row{display:flex;gap:9px;align-items:center;margin-bottom:6px}
.cl-row input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:13px;outline:none}
.cl-row input:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.cl-row .check{margin-top:0;width:19px;height:19px;font-size:10px}
.cl-row .check.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff));border-color:transparent;color:var(--on-accent)}
.cl-row .rm{width:28px;height:28px;border-radius:8px;color:var(--faint);font-size:14px;flex-shrink:0}
.cl-row .rm:hover{color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
.stage-list{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.stage-row{display:flex;gap:7px;align-items:center}
.stage-row input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7.5px 11px;font-size:13px;outline:none}
.stage-row input:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.stage-row .rm{width:30px;height:30px;border-radius:9px;color:var(--faint);font-size:15px;flex-shrink:0}
.stage-row .rm:hover{color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
.add-stage{align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:9px;margin-top:2px}
.add-stage:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.m-foot{display:flex;align-items:center;gap:10px;margin-top:20px}
.m-foot .grow{flex:1}
.pin-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.pin-toggle input{accent-color:var(--accent);width:15px;height:15px}

/* ============ editor sheets (task & space) ============ */
.fsec{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:12px}
html:not([data-glass="off"]) .fsec{background:var(--glass-panel)}
.fsec-t{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.fsec-t .cnt2{margin-left:auto;color:var(--muted);letter-spacing:.2px;text-transform:none;font-size:11px;font-weight:600}
.pick-row{display:flex;gap:7px;flex-wrap:wrap}
.pick{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:11px;border:1px solid var(--border);background:var(--bg2);font-size:12.5px;font-weight:600;color:var(--muted);transition:.14s;cursor:pointer}
.pick:hover{color:var(--text);border-color:var(--border2);transform:translateY(-1px)}
.pick:active{transform:scale(.96)}
.pick.on{background:color-mix(in srgb,var(--pc,var(--accent)) 16%,transparent);border-color:color-mix(in srgb,var(--pc,var(--accent)) 45%,transparent);color:var(--text)}
.pick .pd{width:8px;height:8px;border-radius:50%;background:var(--pc,var(--accent));flex-shrink:0}
.tpl-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.sp-preview{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--border);margin-top:14px;position:relative;overflow:hidden}
.sp-preview::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:3px;background:var(--pv,#8b7cff);transition:background .2s}
.sp-preview .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--pv,#8b7cff) 16%,transparent);transition:transform .3s cubic-bezier(.3,1.4,.4,1),background .2s;flex-shrink:0}
.sp-preview:hover .ico{transform:scale(1.08) rotate(-5deg)}
.sp-preview .nm2{font-weight:700;font-size:14.5px;word-break:break-word}
.sp-preview .sub2{font-size:11px;color:var(--faint);margin-top:1px}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;max-height:118px;overflow-y:auto;padding:2px}
.emoji-grid button{height:32px;border-radius:9px;font-size:17px;display:grid;place-items:center;transition:.12s}
.emoji-grid button:hover{background:var(--panel2);transform:scale(1.15)}
.emoji-grid button.on{background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}
.swatch.custom{background:conic-gradient(#e5484d,#c98a10,#1f9d55,#2f7fe0,#6e56cf,#d6409f,#e5484d);position:relative;overflow:hidden}
.swatch.custom input[type="color"]{position:absolute;inset:0;opacity:0;cursor:pointer}
.stage-row .sg-handle{width:26px;height:32px;display:grid;place-items:center;color:var(--faint);cursor:grab;border-radius:8px;font-size:14px;flex-shrink:0;touch-action:none;user-select:none}
.stage-row .sg-handle:hover{color:var(--text);background:var(--panel2)}
.stage-row .sg-handle:active{cursor:grabbing}
.stage-row.drag-src{opacity:.35}
.stage-row .sg-dot{width:26px;height:32px;display:grid;place-items:center;flex-shrink:0;border-radius:8px}
.stage-row .sg-dot i{width:12px;height:12px;border-radius:50%;background:var(--sgc,var(--track));box-shadow:inset 0 0 0 1px var(--border2);display:block;transition:transform .15s,background .15s}
.stage-row .sg-dot:hover i{transform:scale(1.3)}

/* ============ appearance panel ============ */
.ap-row{display:flex;align-items:center;gap:10px 14px;padding:12px 2px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ap-row.last{border-bottom:none}
.ap-row .ap-l{flex:1 1 175px;min-width:150px}
.ap-row .pick-row{margin-left:auto;justify-content:flex-end}
.ap-row .switch,.ap-row .set-sel,.ap-row .btn{margin-left:auto}
.ap-row .ap-t{font-weight:600;font-size:13.5px}
.ap-row .ap-s{font-size:11.5px;color:var(--faint);margin-top:1px}
.switch{position:relative;width:42px;height:26px;border-radius:999px;background:var(--track);border:1px solid var(--border);transition:background .2s,border-color .2s;flex-shrink:0;cursor:pointer}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.3,1.3,.4,1)}
.switch.on{background:var(--accent);border-color:transparent}
.switch.on i{transform:translateX(16px)}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;margin-top:8px}
@media(max-width:560px){.sc-grid{grid-template-columns:1fr}}
.sc-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:8px 2px;border-bottom:1px solid var(--border)}
.sc-row span{flex:1}
.kbd{font-size:11px;font-weight:700;border:1px solid var(--border2);border-bottom-width:2px;border-radius:6px;padding:2px 8px;background:var(--panel);color:var(--text);min-width:26px;text-align:center;flex-shrink:0}

/* ============ command palette ============ */
#modal-root .overlay.top{place-items:start center;padding-top:12vh}
.cmd{width:min(560px,94vw);background:var(--modal-bg);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--pop-shadow);overflow:hidden;animation:zoomIn .14s ease}
.cmd input{width:100%;padding:15px 18px;background:none;border:none;outline:none;font-size:15px;border-bottom:1px solid var(--border);color:var(--text)}
.cmd input::placeholder{color:var(--faint)}
#cmd-list{max-height:330px;overflow-y:auto;padding:6px}
.cmd-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--muted);transition:background .1s}
.cmd-row .ci{width:24px;text-align:center;flex-shrink:0}
.cmd-row.sel,.cmd-row:hover{background:var(--panel2);color:var(--text)}
.cmd-empty{padding:18px;text-align:center;color:var(--faint);font-size:13px}
.kbd-hint{font-size:11px;font-weight:600;color:var(--faint);border:1px solid var(--border);border-radius:999px;padding:6px 12px;background:var(--panel);transition:.15s;letter-spacing:.3px}
.kbd-hint:hover{color:var(--text);border-color:var(--border2)}
.quick-dates{display:flex;gap:5px;margin-top:6px}
.quick-dates button{font-size:11px;font-weight:600;color:var(--muted);background:var(--chip-bg);border-radius:999px;padding:3.5px 10px;transition:.12s}
.quick-dates button:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* ============ context menu popover ============ */
#popover{
  position:fixed;z-index:60;display:none;min-width:178px;
  background:var(--modal-bg);border:1px solid var(--border2);border-radius:12px;
  box-shadow:var(--pop-shadow);padding:5px;animation:zoomIn .12s ease;
}
#popover button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;padding:8px 11px;border-radius:8px;font-size:13px;color:var(--muted);transition:background .1s}
#popover button:hover{background:var(--panel2);color:var(--text)}
#popover button.danger:hover{background:color-mix(in srgb,var(--rose) 12%,transparent);color:var(--rose)}
#popover .sep{height:1px;background:var(--border);margin:4px 6px}
#popover.closing{animation:zoomOut .12s ease forwards}

/* ============ toast ============ */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px) scale(.97);z-index:80;
  background:var(--toast-bg);border:1px solid var(--border2);border-radius:999px;padding:10px 18px;
  font-size:13.5px;display:flex;align-items:center;gap:12px;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--pop-shadow);
}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#toast button{color:var(--accent);font-weight:700;font-size:13px}
#toast button:hover{text-decoration:underline}

#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:90}

/* ============ Orbie the mascot ============ */
#mascot{position:fixed;right:22px;bottom:16px;z-index:2;cursor:pointer;user-select:none;transition:transform .18s;opacity:.95}
#mascot:hover{opacity:1}
#mascot:hover{transform:scale(1.06)}
#mascot:active{transform:scale(.93)}
#mascot svg{display:block;width:62px;height:62px;animation:mascotBob 4.5s ease-in-out infinite;filter:drop-shadow(0 5px 12px rgba(20,20,40,.18))}
#mascot.happy svg{animation:mascotJump .55s cubic-bezier(.3,1.5,.4,1)}
@keyframes mascotBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mascotJump{0%{transform:translateY(0)}30%{transform:translateY(-16px) rotate(-7deg)}60%{transform:translateY(1px) rotate(4deg)}100%{transform:translateY(0) rotate(0)}}
.m-pupil{transition:transform .09s linear}
#m-eyes.blink circle{transform:scaleY(.1);transform-box:fill-box;transform-origin:center}
#mascot.sleep #m-eyes circle{transform:scaleY(.12);transform-box:fill-box;transform-origin:center}
#mascot.sleep svg{animation-duration:6.5s}
#mascot-zzz{position:absolute;top:-6px;right:-2px;font-size:15px;display:none;animation:mascotBob 2.2s ease-in-out infinite}
.m-moon{transform-box:view-box;transform-origin:center;animation:orbitSpin 16s linear infinite}
#mascot.sleep .m-moon{animation-duration:34s}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
#mascot-bubble{
  position:absolute;bottom:74px;right:2px;min-width:150px;max-width:230px;
  background:var(--modal-bg);border:1px solid var(--border2);border-radius:12px;padding:9px 12px;
  font-size:12.5px;line-height:1.45;color:var(--text);box-shadow:var(--pop-shadow);
  opacity:0;transform:translateY(6px);transition:.22s;pointer-events:none;
}
#mascot-bubble.show{opacity:1;transform:none}
#mascot-bubble.chat{pointer-events:auto;max-width:290px;min-width:252px;cursor:default}
#orbie-thread{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;padding:2px 0 4px}
.ob{max-width:88%;padding:6px 10px;border-radius:12px;font-size:12.5px;line-height:1.45;word-break:break-word}
.ob.bot{background:var(--panel2);color:var(--text);border-bottom-left-radius:4px;align-self:flex-start}
.ob.me{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--text);border-bottom-right-radius:4px;align-self:flex-end}
.ob-typing{display:inline-flex;gap:3px;padding:2px 0}
.ob-typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:obT 1s ease-in-out infinite}
.ob-typing i:nth-child(2){animation-delay:.15s}
.ob-typing i:nth-child(3){animation-delay:.3s}
@keyframes obT{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.mb-line{margin-bottom:2px}
.mb-line b{color:var(--text)}
#orbie-form{display:flex;gap:6px;margin-top:8px}
#orbie-form input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:12.5px;outline:none;color:var(--text)}
#orbie-form input:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
#orbie-form button{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:0 12px;font-size:12px;font-weight:700}
#mascot-bubble::after{content:"";position:absolute;bottom:-6px;right:28px;width:10px;height:10px;background:var(--modal-bg);border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);transform:rotate(45deg)}
@media(max-width:880px){
  #mascot{right:16px;bottom:86px}
  #mascot svg{width:44px;height:44px}
  #mascot-bubble{bottom:52px}
}

/* ============ floating menu button (mobile) ============ */
#fab{
  position:fixed;right:18px;bottom:20px;z-index:45;
  width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);
  display:none;place-items:center;font-size:21px;font-weight:700;
  box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 45%,transparent);
  transition:transform .2s, filter .2s;
}
#fab:hover{filter:brightness(1.08)}
#fab:active{transform:scale(.88)}
#fab{animation:pop .35s ease}

/* ============ bento dashboard ============ */
.stats.bento{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.stats.bento{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.stats.bento{grid-template-columns:1fr}}
.tile2{grid-column:span 2;display:flex;align-items:center;gap:14px;padding:15px 17px}
@media(max-width:540px){.tile2{grid-column:auto}}
.tile-btn{cursor:pointer;text-align:left;width:100%}
.tile-btn:hover{border-color:color-mix(in srgb,var(--sc,var(--accent)) 45%,var(--border))}
.focus-ring{width:52px;height:52px;transform:rotate(-90deg);flex-shrink:0}
.focus-ring .bgc{fill:none;stroke:var(--track);stroke-width:5}
.focus-ring .fgc{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.wk-bars{display:flex;align-items:flex-end;gap:7px;height:46px;flex:1;min-width:0}
.wk-bars .wb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.wk-bars .wb i{width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:color-mix(in srgb,var(--accent) 55%,transparent);display:block}
.wk-bars .wb.z i{background:var(--track)}
.wk-bars .wb b{font-size:9px;color:var(--faint);font-weight:700}
.hb-chips{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.hb-chip{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--hc,#30a46c) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--hc,#30a46c) 30%,transparent);transition:.15s;position:relative}
.hb-chip:hover{transform:scale(1.12)}
.hb-chip:active{transform:scale(.92)}
.hb-chip.done{background:color-mix(in srgb,var(--hc) 70%,var(--bg2));border-color:transparent;box-shadow:0 3px 10px color-mix(in srgb,var(--hc) 35%,transparent)}
.hb-chip.done::after{content:"✓";position:absolute;right:-4px;top:-4px;width:15px;height:15px;border-radius:50%;background:var(--green);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
/* kinetic greeting shimmer, plays once per view entry */
.anim-in .greet .grad{background-size:220% 100%;animation:gradShift 1.5s cubic-bezier(.25,.75,.25,1)}
@keyframes gradShift{from{background-position:130% 0}to{background-position:0% 0}}

/* ============ week planner ============ */
.board.week .col{flex:0 0 232px}
.wk-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wk-bar .gcnt{font-size:11.5px;color:var(--faint);font-weight:600}
.wk-bar .pick{margin-left:auto}
.board.week.mini .col{flex:0 0 150px}
.board.week.mini .col-head{font-size:12px;padding:10px 11px 7px}
.board.week.mini .col-head .sub{display:none}
.board.week.mini .card{padding:7px 9px}
.board.week.mini .card .t-chips{display:none}
.board.week.mini .c-title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:0 !important}
.board.week.mini .card .check{width:15px;height:15px;font-size:9px}
.board.week.mini .col-add{font-size:11px;padding:6px;margin:4px 7px 8px}
/* per-day folding: tap a header, the day slims to a strip (still a drop target) */
.board.week .col{transition:flex-basis .35s cubic-bezier(.25,.8,.3,1)}
.board.week .col-head[data-act="wk-fold"]{cursor:pointer;user-select:none}
.board.week .col-head .chev{font-size:9px;color:var(--faint);transition:transform .2s}
.board.week .col-head:hover .chev{color:var(--text)}
.board.week .col.folded,.board.week.mini .col.folded{flex:0 0 46px;min-width:46px}
.board.week .col.folded .col-body,.board.week .col.folded .col-add{display:none}
.board.week .col.folded .col-head{flex-direction:column;gap:7px;padding:12px 4px;align-items:center}
.board.week .col.folded .col-head .dot,.board.week .col.folded .col-head .sub{display:none}
.board.week .col.folded .wl{writing-mode:vertical-rl;font-size:11px;letter-spacing:.6px;color:var(--muted)}
.board.week .col.folded .count{margin-left:0}
.board.week .col.drop-hint2{outline:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-3px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.col.today-col{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent),var(--card-shadow)}
.col-head .sub{font-size:10.5px;color:var(--faint);font-weight:600;margin-left:1px}
.ov-banner{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--rose) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--rose) 30%,var(--border));border-radius:13px;padding:10px 14px;margin-bottom:13px;font-size:13px;animation:var(--enter,none)}
.ov-banner b{color:var(--rose)}
.ov-banner button{margin-left:auto;color:var(--rose);font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:9px;flex-shrink:0}
.ov-banner button:hover{background:color-mix(in srgb,var(--rose) 14%,transparent)}

/* ============ habits ============ */
.habit-row{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:9px;box-shadow:var(--card-shadow);cursor:pointer;transition:transform .13s,border-color .13s;animation:var(--enter,none)}
.habit-row:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--hc,var(--accent)) 40%,var(--border))}
.habit-row .h-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--hc) 14%,transparent);flex-shrink:0}
.habit-row .h-main{flex:1;min-width:0}
.habit-row .h-name{font-weight:700;font-size:14px;word-break:break-word}
.habit-row .h-streak{font-size:11.5px;color:var(--muted);margin-top:1px}
.h-dots{display:flex;gap:6px;flex-shrink:0;align-items:flex-end}
.h-dot{display:flex;flex-direction:column;align-items:center;gap:3px}
.h-dot b{font-size:8.5px;color:var(--faint);font-weight:700}
.h-dot button{width:22px;height:22px;border-radius:50%;border:1.6px solid color-mix(in srgb,var(--hc) 42%,var(--border2));transition:.15s;font-size:10px;color:transparent;display:grid;place-items:center;background:transparent}
.h-dot button:hover{transform:scale(1.18)}
.h-dot button:active{transform:scale(.9)}
.h-dot button.on{background:var(--hc);border-color:transparent;color:#fff;font-weight:800}
.h-dot.today button{width:26px;height:26px;font-size:11px}
@media(max-width:640px){.h-dot:nth-child(-n+3){display:none}}

/* ============ voice capture ============ */
.mic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex-shrink:0;transition:.15s}
.mic:hover{color:var(--text);background:var(--panel2)}
.mic.rec{color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent);animation:micPulse 1.1s ease-in-out infinite}
@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}

/* ============ apps hub (embedded mini-apps) ============ */
#appframes{display:none;flex:1;min-height:0;flex-direction:column;background:var(--bg)}
body.ext-on #view,body.ext-on #tabsrow-slot{display:none}
body.ext-on #appframes{display:flex}
.af-bar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--tb-bg);flex-wrap:wrap}
.af-bar .ttl{font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;min-width:0}
.af-bar .hint{font-size:11px;color:var(--faint)}
.af-bar .sp{flex:1}
.af-bar .icon-btn.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.af-frames{flex:1;position:relative;min-height:0}
.af-frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
.af-frames iframe.on{display:block}
html[data-theme="dark"] .af-frames iframe{background:#141416}
@media(min-width:1100px){
  body.app-pinned #appframes{display:flex;position:fixed;top:0;right:0;bottom:0;width:min(440px,40vw);z-index:30;border-left:1px solid var(--border);box-shadow:-14px 0 44px rgba(0,0,0,.14);background:var(--bg)}
  body.app-pinned #main{margin-right:min(440px,40vw)}
}
@media(max-width:1099px){#af-pin{display:none}}

/* ============ app lock (privacy screen) ============ */
#lock-scr{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 45%,transparent);backdrop-filter:blur(38px) saturate(1.25);-webkit-backdrop-filter:blur(38px) saturate(1.25)}
body.locked #lock-scr{display:grid}
body.locked #app,body.locked #mascot,body.locked #fab,body.locked #toast,body.locked #focus-pill,body.locked #orbie-panel,body.locked #galaxy,body.locked #guide,body.locked #brief,body.locked #lpad{filter:blur(16px);pointer-events:none;user-select:none}
#lock-card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 42px;border-radius:22px;background:var(--glass-bg);border:1px solid var(--border2);box-shadow:var(--pop-shadow);animation:zoomIn .3s cubic-bezier(.2,.9,.3,1.1)}
html:not([data-style="glass"]) #lock-card,html[data-glass="off"] #lock-card{background:var(--modal-bg)}
#lock-card .logo-tile{width:52px;height:52px;border-radius:15px;cursor:default}
#lock-card .lt{font-weight:800;font-size:16px}
#lock-in{width:180px;text-align:center;font-size:22px;letter-spacing:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;outline:none;color:var(--text)}
#lock-in:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
#lock-card.shake{animation:shake .4s}
.lock-rem{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.lock-rem input{accent-color:var(--accent);width:14px;height:14px}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
body.locked{overflow:hidden}
/* app zoom */
.af-zoom{min-width:46px;height:30px;font-size:11px;font-weight:700;color:var(--muted);border-radius:9px;padding:0 6px}
.af-zoom:hover{background:var(--panel2);color:var(--text)}
.af-frames iframe{transform-origin:0 0}
/* launchpad drag */
.lp-tile.dragging{opacity:.4}

/* ============ apps: site icons + Launchpad ============ */
.favi{width:16px;height:16px;border-radius:4px;vertical-align:-3px}
#lpad{position:fixed;inset:0;z-index:117;display:none}
body.lpad-open #lpad{display:block}
#lpad .lp-back{position:absolute;inset:0;background:var(--overlay-bg);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);animation:fadeIn .25s ease}
.lp-wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px;pointer-events:none}
.lp-title{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,110px));gap:18px;justify-content:center;max-width:640px;width:100%;pointer-events:auto}
.lp-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px;border-radius:18px;transition:.16s;animation:popIn .4s cubic-bezier(.3,1.4,.4,1) both}
.lp-tile:hover{background:var(--panel2);transform:translateY(-3px)}
.lp-tile:active{transform:scale(.94)}
.lp-ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--lc,#2ab1dd) 16%,var(--panel));border:1px solid color-mix(in srgb,var(--lc,#2ab1dd) 30%,transparent);box-shadow:var(--card-shadow)}
.lp-ico .favi{width:30px;height:30px;border-radius:8px}
.lp-name{font-size:12px;font-weight:600;color:var(--text);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-tile .lp-edit{position:absolute;top:6px;right:8px;font-size:11px;color:var(--faint);opacity:0;transition:.15s;padding:3px 6px;border-radius:7px;cursor:pointer}
.lp-tile:hover .lp-edit{opacity:.8}
.lp-tile .lp-edit:hover{opacity:1;background:var(--panel2);color:var(--text)}
.lp-tile.add .lp-ico{background:var(--panel2);border-style:dashed;color:var(--faint);font-size:22px}
#app-favprev .favi{width:22px;height:22px;border-radius:6px;vertical-align:middle}

/* ============ the Orbit guide (slide-up sheet) ============ */
#guide{position:fixed;inset:0;z-index:118;display:none}
body.guide-open #guide{display:block}
#guide .gd-back{position:absolute;inset:0;background:var(--overlay-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fadeIn .25s ease}
.gd-sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,0);width:min(680px,100vw);height:min(86vh,880px);background:var(--glass-bg);border:1px solid var(--border2);border-bottom:none;border-radius:26px 26px 0 0;box-shadow:var(--pop-shadow);display:flex;flex-direction:column;overflow:hidden;animation:gdUp .55s cubic-bezier(.22,1.12,.3,1)}
html[data-glass="off"] .gd-sheet,html:not([data-style="glass"]) .gd-sheet{background:var(--modal-bg)}
@keyframes gdUp{from{transform:translate(-50%,105%)}}
#guide.closing .gd-sheet{animation:gdDown .28s ease forwards}
#guide.closing .gd-back{animation:fadeOut .28s ease forwards}
@keyframes gdDown{to{transform:translate(-50%,105%)}}
.gd-grab{width:40px;height:5px;border-radius:3px;background:var(--border2);margin:10px auto 2px;flex-shrink:0}
.gd-head{display:flex;align-items:center;gap:10px;padding:8px 22px 12px;flex-shrink:0}
.gd-title{font-size:19px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(90deg,var(--accent),#2f7fe0);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% 100%;animation:gradShift 1.6s cubic-bezier(.25,.75,.25,1)}
.gd-close{margin-left:auto}
.gd-body{flex:1;overflow-y:auto;padding:4px 22px 30px;overscroll-behavior:contain}
.gd-sec{display:flex;gap:13px;padding:15px 14px;border:1px solid var(--border);border-radius:16px;background:var(--panel2);margin-bottom:10px;animation:fadeUp .45s cubic-bezier(.2,.8,.3,1) both;transition:transform .15s,border-color .15s}
.gd-sec:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.gd-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--accent) 12%,transparent);flex-shrink:0;transition:transform .3s cubic-bezier(.3,1.4,.4,1)}
.gd-sec:hover .gd-ico{transform:scale(1.12) rotate(-6deg)}
.gd-sec h3{font-size:14px;font-weight:750;margin-bottom:3px}
.gd-sec p{font-size:12.8px;color:var(--muted);line-height:1.65}
.gd-sec p b{color:var(--text)}
.gd-sec .kbd{margin:0 2px;font-size:10px;padding:1px 6px}
.gd-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:color-mix(in srgb,var(--accent) 70%,var(--tint-mix));background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}

/* ============ daily briefing ============ */
#brief{position:fixed;inset:0;z-index:115;display:none;place-items:center;background:var(--overlay-bg);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);padding:18px}
body.brief-open #brief{display:grid;animation:fadeIn .25s ease}
.brief-card{width:min(470px,94vw);max-height:86vh;overflow-y:auto;background:var(--glass-bg);border:1px solid var(--border2);border-radius:24px;padding:26px 26px 22px;box-shadow:var(--pop-shadow);animation:zoomIn .3s cubic-bezier(.2,.9,.3,1.1)}
html[data-glass="off"] .brief-card,html:not([data-style="glass"]) .brief-card{background:var(--modal-bg)}
.bf-kicker{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.bf-title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:4px 0 14px}
.bf-row{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px;color:var(--muted);line-height:1.5}
.bf-row b{color:var(--text)}
.bf-i{font-size:15px;flex-shrink:0}
.bf-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
/* links inside tasks & notes */
.xlink{color:var(--cyan);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.xlink:hover{opacity:.8}

/* ============ YOUR GALAXY — every finished task is a star ============ */
#galaxy{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;background:radial-gradient(1200px 800px at 68% 18%, #1c1543 0%, #0c0a22 45%, #050510 100%);color:#eef;overflow:hidden}
body.galaxy-open #galaxy{display:flex;animation:fadeIn .35s ease}
#gx-canvas{position:absolute;inset:0;width:100%;height:100%}
.gx-head{position:relative;z-index:2;display:flex;align-items:flex-start;gap:12px;padding:18px 22px}
.gx-title{font-size:20px;font-weight:800;letter-spacing:-.3px;color:#fff}
.gx-sub{font-size:12px;color:#9a94c2;margin-top:2px}
.gx-close{margin-left:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:15px;flex-shrink:0}
.gx-close:hover{background:rgba(255,255,255,.16)}
.gx-foot{position:relative;z-index:2;margin-top:auto;display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:16px 22px 20px}
.gx-stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;font-size:12px;color:#cfc9f2}
.gx-stat b{color:#fff;font-size:14px}
.gx-share{margin-left:auto;background:linear-gradient(135deg,#8b5cf6,#4f8ef7);color:#fff;font-weight:700;font-size:12.5px;border-radius:999px;padding:9px 16px;transition:.15s}
.gx-share:hover{filter:brightness(1.12);transform:translateY(-1px)}
#gx-tip{position:absolute;z-index:3;background:rgba(15,12,35,.94);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:7px 11px;font-size:12px;color:#fff;pointer-events:none;opacity:0;transition:opacity .15s;max-width:250px}
#gx-tip.on{opacity:1}
#gx-tip .d{color:#9a94c2;font-size:10.5px;margin-top:1px}
.gx-yearlab{position:relative;z-index:2;padding:10px 22px 4px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#9a94c2;font-weight:700}
#gx-year{position:relative;z-index:2;display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,9px);gap:3px;padding:0 22px 6px;overflow-x:auto}
#gx-year i{width:9px;height:9px;border-radius:3px;background:rgba(160,150,255,.12);flex-shrink:0}
#gx-year i.l1{background:rgba(150,135,255,.32)}
#gx-year i.l2{background:rgba(150,135,255,.55)}
#gx-year i.l3{background:rgba(160,145,255,.78)}
#gx-year i.l4{background:#a78bfa;box-shadow:0 0 6px rgba(167,139,250,.8)}
.gx-chip{display:inline-flex;align-items:center;gap:5px;margin-left:12px;font-size:12.5px;font-weight:700;color:#8f7be8;background:color-mix(in srgb,#8f7be8 12%,transparent);padding:3px 12px;border-radius:999px;vertical-align:middle;cursor:pointer;transition:.15s;user-select:none}
.gx-chip:hover{transform:translateY(-1px);background:color-mix(in srgb,#8f7be8 22%,transparent)}
/* the atmosphere breathes with the real time of day */
html[data-daypart="dawn"] #bg-glow .g4{opacity:calc(var(--glow-op)*1.05)}
html[data-daypart="dusk"] #bg-glow .g4{opacity:calc(var(--glow-op)*1.2)}
html[data-daypart="night"] #bg-glow::before,html[data-daypart="night"] #bg-glow::after,html[data-daypart="night"] #bg-glow i{opacity:calc(var(--glow-op)*.55)}

/* ============ clickable stats + space fillers ============ */
.stat.tile-go{cursor:pointer}
.stat.tile-go:hover{border-color:color-mix(in srgb,var(--sc,var(--accent)) 50%,var(--border));transform:translateY(-2px)}
.group-head.flash{animation:groupFlash 1s ease}
@keyframes groupFlash{0%,60%{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:9px}100%{background:transparent}}
.empty-actions,.qlinks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.empty-actions button,.qlinks button{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;
  border:1px solid var(--border);background:var(--panel);font-size:12.5px;font-weight:600;color:var(--muted);
  transition:.14s;box-shadow:var(--card-shadow);
}
.empty-actions button:hover,.qlinks button:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));transform:translateY(-1px)}
.qlinks{margin-top:26px}
.later-empty{font-size:12px;color:var(--faint);padding:10px 2px 0;text-align:center}
.work-cta{width:100%;margin-top:24px;text-align:left;display:block}
.work-tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:2px 0 14px}
.work-tools .wk-hours{font-size:11.5px;color:var(--muted);margin-left:auto}
.work-tools .wk-hours b{color:var(--text)}
.later-wrap{max-width:860px}
/* mic sits flush with the Add button, same height, quiet until hover */
.quickadd .mic{width:36px;height:36px;border-radius:10px;background:var(--panel2);align-self:center}
.quickadd .mic:hover{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}

/* ============ Orbie chat panel ============ */
#orbie-panel{
  position:fixed;right:18px;bottom:90px;z-index:66;
  width:min(316px,calc(100vw - 24px));height:min(430px,60vh);
  display:none;flex-direction:column;
  background:var(--modal-bg);border:1px solid var(--border2);border-radius:20px;
  box-shadow:var(--pop-shadow);overflow:hidden;
}
body.orbie-open #orbie-panel{display:flex;animation:zoomIn .18s cubic-bezier(.2,.9,.3,1.15)}
body.orbie-open #mascot-bubble{display:none}
.op-head{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--border);flex-shrink:0}
.op-ava{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:linear-gradient(135deg,#9b87f5,#4f8ef7);box-shadow:0 3px 10px color-mix(in srgb,#6e56cf 35%,transparent);flex-shrink:0}
.op-name{font-weight:750;font-size:14px;line-height:1.2}
.op-status{font-size:10.5px;color:var(--faint)}
#orbie-panel #orbie-thread{flex:1;max-height:none;padding:10px 12px;overflow-y:auto}
.op-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 9px;flex-shrink:0}
.op-chips button{font-size:11px;font-weight:650;color:var(--muted);background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:5px 11px;transition:.13s}
.op-chips button:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));transform:translateY(-1px)}
.op-input{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border);flex-shrink:0;align-items:center}
.op-input input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:7px 12px;font-size:12.5px;outline:none;color:var(--text)}
.op-input input:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.op-send{width:31px;height:31px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:15px;flex-shrink:0;transition:.15s}
.op-send:hover{filter:brightness(1.08);transform:scale(1.05)}
.op-send:active{transform:scale(.9)}
.ob-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.ob-acts button{font-size:11px;font-weight:700;color:color-mix(in srgb,var(--accent) 75%,var(--tint-mix));background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:999px;padding:4px 11px;transition:.13s}
.ob-acts button:hover{background:color-mix(in srgb,var(--accent) 26%,transparent);transform:translateY(-1px)}
@media(max-width:880px){
  #orbie-panel{right:8px;left:8px;bottom:8px;width:auto;height:min(470px,64vh);border-radius:16px}
}

/* ============ focus timer pill ============ */
#focus-pill{
  position:fixed;left:50%;bottom:24px;z-index:70;
  transform:translate(-50%,90px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:11px;
  background:var(--modal-bg);border:1px solid var(--border2);border-radius:999px;
  padding:8px 10px 8px 14px;box-shadow:var(--pop-shadow);
  transition:transform .4s cubic-bezier(.3,1.3,.4,1),opacity .3s ease;
}
body.focus-on #focus-pill{transform:translate(-50%,0);opacity:1;pointer-events:auto}
body.focus-on #toast{bottom:92px}
#focus-pill .fring{width:30px;height:30px;transform:rotate(-90deg);flex-shrink:0}
#focus-pill .fring .bgc{fill:none;stroke:var(--track);stroke-width:3.4}
#focus-pill .fring .fgc{fill:none;stroke:var(--accent);stroke-width:3.4;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
#focus-pill .ft{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.3px;line-height:1.2}
#focus-pill .fl{font-size:11.5px;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#focus-pill .icon-btn{width:30px;height:30px;font-size:13px}
#focus-pill.paused .fgc{stroke:var(--amber)}
#focus-pill.paused .ft{color:var(--amber)}
@media(max-width:880px){
  #focus-pill{bottom:88px;max-width:92vw}
  body.focus-on #toast{bottom:150px}
}

/* ============ interface styles — five design languages ============ */
/* anything that isn't Liquid Glass: atmosphere off, surfaces solid */
html:not([data-style="glass"]) #bg-glow{display:none}
html:not([data-style="glass"]) .task,
html:not([data-style="glass"]) .card,
html:not([data-style="glass"]) .stat,
html:not([data-style="glass"]) .note-row,
html:not([data-style="glass"]) .habit-row,
html:not([data-style="glass"]) .quickadd,
html:not([data-style="glass"]) .col,
html:not([data-style="glass"]) .tabs,
html:not([data-style="glass"]) .searchwrap,
html:not([data-style="glass"]) .page-chip,
html:not([data-style="glass"]) .ov-banner,
html:not([data-style="glass"]) .sb-foot .mini,
html:not([data-style="glass"]) #scratch-pad{
  background:var(--panel) !important;
  box-shadow:var(--card-shadow) !important;
  backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
}
html:not([data-style="glass"]) .card{background:var(--bg2) !important}
html:not([data-style="glass"]) .fsec{background:var(--panel2) !important}
html:not([data-style="glass"]) .modal,
html:not([data-style="glass"]) .cmd,
html:not([data-style="glass"]) #popover,
html:not([data-style="glass"]) #toast,
html:not([data-style="glass"]) #focus-pill,
html:not([data-style="glass"]) #mascot-bubble,
html:not([data-style="glass"]) #orbie-panel{background:var(--modal-bg) !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
html:not([data-style="glass"]) #sidebar,
html:not([data-style="glass"]) #topbar{background:var(--bg) !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important}

/* 🍃 Zen — borderless, airy, one calm column (Things-style) */
html[data-style="minimal"]{--card-shadow:0 1px 2px rgba(18,18,23,.05);--hover-shadow:0 6px 18px rgba(18,18,23,.07);--pop-shadow:0 18px 44px rgba(18,18,23,.14);--radius:14px}
html[data-style="minimal"] .task,html[data-style="minimal"] .card,html[data-style="minimal"] .stat,html[data-style="minimal"] .note-row,html[data-style="minimal"] .habit-row,html[data-style="minimal"] .quickadd,html[data-style="minimal"] .col,html[data-style="minimal"] .tabs,html[data-style="minimal"] .searchwrap,html[data-style="minimal"] .ov-banner{border-color:transparent !important}
html[data-style="minimal"] #sidebar{border-right-color:transparent}
html[data-style="minimal"] #topbar{border-bottom-color:transparent}
html[data-style="minimal"] .view-inner{max-width:660px}
html[data-style="minimal"] .task{padding:14px 16px;margin-bottom:10px;border-radius:14px}
html[data-style="minimal"] .btn.primary{background:var(--accent);box-shadow:none}
html[data-style="minimal"] .stat .s-ico{display:none}
html[data-style="minimal"] .stat{padding:15px 17px}
html[data-style="minimal"] .group-head .dot{display:none}
html[data-style="minimal"] .chip{background:transparent !important;padding:2px 1px}
html[data-style="minimal"] #view{padding-top:34px}

/* 📐 Pro — dense, squared, engineered (Linear-style) */
html[data-style="pro"]{--radius:6px;--card-shadow:none;--hover-shadow:none;--pop-shadow:0 16px 40px rgba(0,0,0,.2)}
html[data-style="pro"] body{font-size:13px}
html[data-style="pro"] #view{padding:16px 22px 110px}
html[data-style="pro"] .task,html[data-style="pro"] .card,html[data-style="pro"] .stat,html[data-style="pro"] .note-row,html[data-style="pro"] .habit-row,html[data-style="pro"] .quickadd,html[data-style="pro"] .modal,html[data-style="pro"] .col{border-radius:6px}
